<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>FinTrack Pro · Asistente</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<script src="premium.js"></script>
<style>
  /* Layout propio de esta pantalla — el resto del look viene de premium.js.
     #root queda encerrado entre el header (no-fixed) y el nav (fixed) del
     shell; con su propio alto (100dvh, sensible al teclado de iOS) menos lo
     que miden esos dos, solo #chatBody scrollea y el composer queda como
     último hijo del flex — nunca tapado por el nav ni saltando con sticky. */
  #root{display:flex!important;flex-direction:column;padding:0!important;height:calc(100dvh - var(--ft-hdr-h,64px) - var(--ft-nav-h,78px));overflow:hidden;}
  #chatBody{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px 16px 6px;display:flex;flex-direction:column;gap:12px;}
  .a-msg{max-width:84%;padding:11px 14px;border-radius:16px;font-size:13.5px;line-height:1.55;}
  .a-msg.bot{background:var(--sunk);border-bottom-left-radius:4px;align-self:flex-start;white-space:pre-wrap;}
  .a-msg.user{background:var(--g-main);color:#fff;border-bottom-right-radius:4px;align-self:flex-end;white-space:pre-wrap;}
  .a-img{max-width:60%;align-self:flex-end;border-radius:14px;overflow:hidden;}
  .a-img img{display:block;width:100%;}
  .a-typing{align-self:flex-start;background:var(--sunk);border-radius:16px;border-bottom-left-radius:4px;padding:12px 16px;display:flex;gap:4px;}
  .a-typing span{width:6px;height:6px;border-radius:50%;background:var(--text3);display:block;animation:aBounce 1.2s infinite;}
  .a-typing span:nth-child(2){animation-delay:.15s;}.a-typing span:nth-child(3){animation-delay:.3s;}
  @keyframes aBounce{0%,60%,100%{transform:translateY(0);opacity:.5;}30%{transform:translateY(-4px);opacity:1;}}
  .a-suggest{display:flex;gap:7px;overflow-x:auto;padding:0 16px 10px;flex-shrink:0;}
  .a-suggest button{flex-shrink:0;font-family:var(--ui-font);font-size:11.5px;font-weight:700;color:var(--g-dark);background:var(--g-light);border:none;padding:8px 13px;border-radius:99px;cursor:pointer;white-space:nowrap;}
  .a-err{margin:0 16px 10px;background:var(--red-dim);border:1px solid #F5C6C8;border-radius:12px;padding:10px 12px;font-size:11.5px;color:#9C2F32;display:flex;gap:8px;align-items:flex-start;flex-shrink:0;}
  .a-pending{margin:0 16px 8px;display:flex;align-items:center;gap:8px;flex-shrink:0;}
  .a-pending img{width:44px;height:44px;object-fit:cover;border-radius:10px;}
  .a-pending .x{font-size:12px;font-weight:800;color:var(--text3);cursor:pointer;background:var(--chip);width:20px;height:20px;border-radius:50%;display:grid;place-items:center;}
  .a-composer{border-top:1px solid var(--hair);padding:10px 12px 12px;display:flex;align-items:flex-end;gap:8px;background:var(--white);flex-shrink:0;}
  .a-composer .att{width:38px;height:38px;border-radius:50%;background:var(--sunk);display:grid;place-items:center;font-size:16px;flex-shrink:0;cursor:pointer;border:none;}
  .a-composer textarea{flex:1;background:var(--sunk);border:none;border-radius:20px;padding:10px 14px;font-size:13.5px;font-family:var(--ui-font);resize:none;max-height:90px;outline:none;color:var(--ink);}
  .a-composer .send{width:38px;height:38px;border-radius:50%;background:var(--g-main);color:#fff;display:grid;place-items:center;font-size:15px;flex-shrink:0;border:none;cursor:pointer;}
  .a-composer .send:disabled{opacity:.4;cursor:default;}
  .a-paywall{margin:auto;text-align:center;padding:40px 30px;}
  .a-paywall .ic{font-size:40px;margin-bottom:10px;}
  .a-paywall h3{font-family:var(--round-font);font-size:18px;margin:0 0 6px;}
  .a-paywall p{font-size:12.5px;color:var(--text2);line-height:1.6;margin:0 0 16px;}
  .a-paywall button{font-family:var(--ui-font);font-weight:800;font-size:13px;background:linear-gradient(135deg,var(--g-dark),var(--g-main));color:#fff;border:none;padding:12px 24px;border-radius:12px;cursor:pointer;}
</style>
</head>
<body>
<div class="ft-app"><div class="ft-page" id="root"></div></div>
<input type="file" id="imgInput" accept="image/*" style="display:none">
<script>
function es() { return FT.lang === 'es'; }

var pendingImage = null; // { data, mediaType, thumb }
var sending = false;

function compressImage(file, maxWidth, quality) {
  return new Promise(function (resolve) {
    var reader = new FileReader();
    reader.onload = function (e) {
      var img = new Image();
      img.onload = function () {
        var canvas = document.createElement('canvas'), w = img.width, h = img.height;
        if (w > maxWidth) { h = Math.round(h * maxWidth / w); w = maxWidth; }
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

function scrollToEnd() {
  var b = document.getElementById('chatBody');
  if (b) b.scrollTop = b.scrollHeight;
}

function render() {
  var L = es(), root = document.getElementById('root');

  if (!FT.isPremium()) {
    root.innerHTML = '<div class="a-paywall"><div class="ic">💬🔒</div><h3>' + (L ? 'Asistente IA' : 'AI Assistant') + '</h3>' +
      '<p>' + (L ? 'Pregúntale a tu Asistente sobre tus finanzas, sube una foto de algo que quieras comprar, o pídele ideas para mejorar tu mes. Incluido en FinTrack Pro Premium.' : "Ask your Assistant about your finances, upload a photo of something you're thinking of buying, or ask for ideas to improve your month. Included in FinTrack Pro Premium.") + '</p>' +
      '<button id="btnUpg">🛒 ' + (L ? 'Obtener Premium' : 'Get Premium') + '</button></div>';
    document.getElementById('btnUpg').onclick = FT.showUpgradeModal;
    return;
  }

  var left = FT.creditsLeft();
  var hist = FT.chatHistory();
  var noCredits = left <= 0 && !sending;

  // Solo tapamos toda la pantalla con el paywall si además no hay ninguna
  // conversación previa que mostrar -- si ya había historial (ej. se acaba de
  // gastar el último crédito con esta misma respuesta), se sigue viendo la
  // charla y solo se reemplaza el composer por el aviso.
  if (noCredits && !hist.length) {
    root.innerHTML = '<div class="a-paywall"><div class="ic">✨</div><h3>' + (L ? 'Usaste tus análisis de este mes' : 'You used up this month\'s analyses') + '</h3>' +
      '<p>' + (L ? 'Tu cuota mensual de Asistente + Scanner se agotó. Vuelve el próximo mes o compra créditos extra.' : 'Your monthly Assistant + Scanner quota ran out. Come back next month or buy extra credits.') + '</p>' +
      '<button id="btnUpg">' + (L ? 'Comprar créditos' : 'Buy credits') + '</button></div>';
    document.getElementById('btnUpg').onclick = FT.showUpgradeModal;
    return;
  }
  var body = hist.length
    ? hist.map(msgHTML).join('')
    : '<div class="a-msg bot">' + (L ? '¡Hola! Ya tengo tus números del mes a la mano — pregúntame lo que quieras, o sube la foto de algo que te interese comprar.' : "Hi! I already have your numbers for the month — ask me anything, or upload a photo of something you're thinking of buying.") + '</div>';
  if (sending) body += '<div class="a-typing"><span></span><span></span><span></span></div>';

  root.innerHTML =
    '<div id="chatBody">' + body + '</div>' +
    (hist.length ? '' : '<div class="a-suggest">' +
      '<button data-q="' + (L ? '¿En qué gasté más este mes?' : 'What did I spend the most on this month?') + '">' + (L ? '¿En qué gasté más?' : 'Top spending?') + '</button>' +
      '<button data-q="' + (L ? '¿Cómo voy con mis metas?' : "How am I doing on my goals?") + '">' + (L ? '¿Cómo voy con mis metas?' : 'My goals progress?') + '</button>' +
      '<button data-q="' + (L ? '¿Cómo puedo mejorar mis finanzas?' : 'How can I improve my finances?') + '">' + (L ? 'Ideas para mejorar' : 'Improvement ideas') + '</button>' +
      '</div>') +
    (window._aChatErr ? '<div class="a-err">⚠️ <div>' + window._aChatErr + '</div></div>' : '') +
    (pendingImage ? '<div class="a-pending"><img src="' + pendingImage.thumb + '"><span style="font-size:11.5px;color:var(--text3);flex:1">' + (L ? 'Foto lista para enviar' : 'Photo ready to send') + '</span><span class="x" id="pImgX">✕</span></div>' : '') +
    (noCredits
      ? '<div class="a-composer" style="justify-content:space-between;align-items:center">' +
          '<span style="font-size:11.5px;color:var(--text3);flex:1">✨ ' + (L ? 'Sin análisis este mes' : 'No analyses left this month') + '</span>' +
          '<button class="send tap" id="btnUpg" style="width:auto;border-radius:12px;padding:0 14px;font-size:11.5px;font-weight:800;font-family:var(--ui-font)">' + (L ? 'Obtener más' : 'Get more') + '</button>' +
        '</div>'
      : '<div class="a-composer">' +
          '<button class="att tap" id="btnImg">📷</button>' +
          '<textarea id="txtMsg" rows="1" placeholder="' + (L ? 'Pregúntale algo a tu Asistente…' : 'Ask your Assistant something…') + '"></textarea>' +
          '<button class="send tap" id="btnSend"' + (sending ? ' disabled' : '') + '>➤</button>' +
        '</div>');

  document.querySelectorAll('[data-q]').forEach(function (b) { b.onclick = function () { sendMessage(b.getAttribute('data-q')); }; });
  var pX = document.getElementById('pImgX'); if (pX) pX.onclick = function () { pendingImage = null; render(); };
  if (noCredits) {
    document.getElementById('btnUpg').onclick = FT.showUpgradeModal;
  } else {
    document.getElementById('btnImg').onclick = function () { document.getElementById('imgInput').click(); };
    var ta = document.getElementById('txtMsg');
    ta.addEventListener('keydown', function (e) { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); trySend(); } });
    document.getElementById('btnSend').onclick = trySend;
    function trySend() { var v = ta.value.trim(); if (v || pendingImage) sendMessage(v); }
  }

  scrollToEnd();
}

function msgHTML(m) {
  if (m.role === 'user-img') return '<div class="a-img"><img src="' + m.text + '"></div>';
  return '<div class="a-msg ' + (m.role === 'assistant' ? 'bot' : 'user') + '">' + escapeHTML(m.text) + '</div>';
}
function escapeHTML(s) { return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }

async function sendMessage(text) {
  if (sending) return;
  var img = pendingImage;
  window._aChatErr = null;

  if (img) FT.chatAppend('user-img', img.thumb);
  FT.chatAppend('user', text || '');
  pendingImage = null;
  sending = true;
  render();

  try {
    var histForApi = FT.chatHistory().filter(function (m) { return m.role === 'user' || m.role === 'assistant'; }).slice(-16)
      .map(function (m) { return { role: m.role, content: m.text }; });

    var res = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        context: FT.buildFinanceContext(),
        messages: histForApi,
        image: img ? { data: img.data, mediaType: img.mediaType } : null,
        lang: FT.lang
      })
    });
    var data = await res.json();
    if (!res.ok || !data.success) throw new Error((data && data.error) || 'API error');

    FT.chatAppend('assistant', data.reply || (es() ? 'No pude generar una respuesta, intenta de nuevo.' : "I couldn't generate a reply, try again."));
    FT.useCredit();
  } catch (e) {
    window._aChatErr = es()
      ? 'No pudimos conectar con el Asistente. Revisa tu conexión e intenta de nuevo — no se gastó ningún crédito.'
      : "We couldn't reach the Assistant. Check your connection and try again — no credit was used.";
  }
  sending = false;
  render();
}

document.getElementById('imgInput').addEventListener('change', function () {
  var file = this.files && this.files[0];
  this.value = '';
  if (!file) return;
  // Dos versiones: una grande para que el modelo lea bien precios/etiquetas
  // (se manda a la API pero NUNCA se guarda), y una chica para el historial
  // en localStorage (si guardáramos la grande, unas cuantas fotos llenarían
  // la cuota del navegador).
  Promise.all([compressImage(file, 900, 0.7), compressImage(file, 220, 0.5)]).then(function (r) {
    pendingImage = { data: r[0], mediaType: 'image/jpeg', thumb: r[1] };
    render();
  });
});

document.addEventListener('ft:ready', function () {
  var t = function () { return '💬 ' + (es() ? 'Asistente' : 'Assistant'); };
  var sh = FT.shell({
    active: 'asistente', title: t(),
    kebab: [{ label: '🗑️ ' + (es() ? 'Borrar conversación' : 'Clear conversation'), onClick: function () {
      FT.confirm(es() ? '¿Borrar toda la conversación?' : 'Clear the whole conversation?').then(function (ok) { if (ok) { FT.chatClear(); render(); } });
    } }]
  });
  document.addEventListener('ft:langchange', function () { sh.setTitle(t()); render(); });

  function syncChrome() {
    document.documentElement.style.setProperty('--ft-hdr-h', sh.header.offsetHeight + 'px');
    document.documentElement.style.setProperty('--ft-nav-h', sh.nav.offsetHeight + 'px');
  }
  syncChrome();
  window.addEventListener('resize', syncChrome);

  render();
});
</script>
</body>
</html>
