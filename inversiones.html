<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>FinTrack Pro · Inversiones</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<script src="premium.js"></script>
<style>
  .iv-vt{display:flex;gap:5px;background:var(--sunk);border-radius:11px;padding:4px;margin-bottom:16px;}
  .iv-vt button{flex:1;padding:7px;border-radius:8px;border:none;background:none;font-family:var(--ui-font);font-size:12px;font-weight:800;color:var(--text3);cursor:pointer;}
  .iv-vt button.on{background:#fff;color:var(--ink);box-shadow:0 1px 4px rgba(20,20,30,.1);}
  .iv-sum{background:#fff;border:1px solid var(--hair);border-radius:18px;padding:18px 16px;box-shadow:0 1px 3px rgba(20,20,30,.035);text-align:center;}
  .iv-sum .vl{font-size:10px;font-weight:800;letter-spacing:.5px;margin-bottom:4px;}
  .iv-sum .cap{font-size:10.5px;color:var(--text3);}
  .iv-sum .val{font-family:var(--round-font);font-weight:900;font-size:36px;letter-spacing:-1.4px;color:var(--g-main);margin:3px 0;font-variant-numeric:tabular-nums;}
  .iv-sum .g{font-size:12.5px;font-weight:800;}
  .iv-sum .stats{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:13px;}
  .iv-sum .stats .s{background:var(--sunk);border-radius:10px;padding:9px 4px;}
  .iv-sum .stats .s .n{font-family:var(--round-font);font-weight:900;font-size:14px;}
  .iv-sum .stats .s .k{font-size:9.5px;color:var(--text3);font-weight:700;margin-top:1px;}
  .iv-pos{display:flex;align-items:center;gap:11px;padding:12px 0;border-bottom:1px solid var(--hair);cursor:pointer;}
  .iv-pos:last-child{border-bottom:none;}
  .iv-pos .tk{width:42px;height:42px;border-radius:12px;flex-shrink:0;display:grid;place-items:center;font-size:11px;font-weight:900;background:var(--g-light);color:var(--g-dark);text-align:center;line-height:1.05;word-break:break-all;padding:2px;}
  .iv-pos .m{flex:1;min-width:0;}
  .iv-pos .m .n{font-family:var(--round-font);font-weight:900;font-size:14px;letter-spacing:-.3px;}
  .iv-pos .m .d{font-size:10px;color:var(--text3);font-weight:700;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .iv-pos .r{text-align:right;flex-shrink:0;}
  .iv-pos .r .v{font-family:var(--round-font);font-weight:900;font-size:14px;font-variant-numeric:tabular-nums;}
  .iv-pos .r .g{font-size:10.5px;font-weight:800;}
  .iv-recb{font-size:9px;font-weight:900;color:var(--blue);background:var(--sky-bg);border-radius:6px;padding:1px 5px;margin-left:5px;}
  .iv-hint{font-size:11px;color:var(--text3);padding:8px 0 2px;}
  .iv-empty{text-align:center;color:var(--text3);font-size:12.5px;padding:22px 10px;}
  .iv-seg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px;}
  .iv-seg.three{grid-template-columns:1fr 1fr 1fr;}
  .iv-seg button{padding:9px 6px;border-radius:10px;border:1.5px solid var(--hair);background:var(--sunk);font-family:var(--ui-font);font-size:11.5px;font-weight:800;color:var(--text2);cursor:pointer;line-height:1.35;}
  .iv-seg button.on{border-color:var(--g-main);background:var(--g-light);color:var(--g-dark);}
  .iv-seg button small{font-weight:600;font-size:9.5px;opacity:.8;display:block;}
  .iv-recpanel{background:var(--sky-bg);border-radius:12px;padding:11px;margin-bottom:12px;}
  .iv-recpanel .top{display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:800;color:#2A4CC0;}
</style>
</head>
<body>
<div class="ft-app"><div class="ft-page" id="root"></div></div>
<script>
var VIEW = 'personal';
var addSt = null;

function L() { return FT.lang === 'es'; }
function scopeKey() { return VIEW === 'hogar' ? 'hogar' : ''; }
function money(n, d) { return FT.money(n, { cents: !!d }); }
function posVal(i) { var s = parseFloat(i.shares) || 1, a = parseFloat(i.avgPrice) || parseFloat(i.amount) || 0, c = parseFloat(i.curPrice) || a; return s * c; }
function posCost(i) { var s = parseFloat(i.shares) || 1, a = parseFloat(i.avgPrice) || parseFloat(i.amount) || 0; return s * a; }

var TYPES = [['etf', 'ETF'], ['stock', L() ? 'Acción / Stock' : 'Stock'], ['crypto', L() ? 'Cripto' : 'Crypto'], ['bond', L() ? 'Bono' : 'Bond'], ['ahorro', L() ? 'Ahorro / Fondo' : 'Savings / Fund'], ['other', L() ? 'Otro' : 'Other']];

function render() {
  var es = L(), list = FT.investments(scopeKey());
  var tv = list.reduce(function (a, i) { return a + posVal(i); }, 0);
  var tc = list.reduce(function (a, i) { return a + posCost(i); }, 0);
  var g = tv - tc, gp = tc > 0 ? g / tc * 100 : 0;
  var conn = FT.hogarConnected();

  var vt = conn ? '<div class="iv-vt"><button class="' + (VIEW === 'personal' ? 'on' : '') + '" data-v="personal">👤 ' + (es ? 'Personal' : 'Personal') + '</button><button class="' + (VIEW === 'hogar' ? 'on' : '') + '" data-v="hogar">🏠 ' + (es ? 'Hogar' : 'Household') + '</button></div>' : '';

  var sum = '<div class="iv-sum">' +
    '<div class="vl" style="color:' + (VIEW === 'hogar' ? 'var(--g-main)' : 'var(--blue)') + '">' + (VIEW === 'hogar' ? '🏠 ' + (es ? 'Hogar' : 'Household') : '👤 ' + (es ? 'Personal' : 'Personal')) + '</div>' +
    '<div class="cap">' + (es ? 'Valor total del portafolio' : 'Total portfolio value') + '</div>' +
    '<div class="val">' + money(tv) + '</div>' +
    '<div class="g" style="color:' + (g >= 0 ? 'var(--g-main)' : 'var(--red)') + '">' + (g >= 0 ? '+' : '−') + money(g) + ' (' + (g >= 0 ? '+' : '−') + Math.abs(gp).toFixed(2) + '%)</div>' +
    '<div class="stats"><div class="s"><div class="n">' + money(tc) + '</div><div class="k">' + (es ? 'Invertido' : 'Invested') + '</div></div>' +
    '<div class="s"><div class="n">' + list.length + '</div><div class="k">' + (es ? 'Posiciones' : 'Positions') + '</div></div></div></div>';

  // Recurrentes — siempre visible, filtrado por vista
  var recs = FT.recurList(function (r) { return r.kind === 'inversion' && (!!r.hogar === (VIEW === 'hogar')); });
  var recSec = '<div class="ft-section-head" style="margin-top:22px"><h3>🔄 ' + (es ? 'Recurrentes' : 'Recurring') + (VIEW === 'hogar' ? ' · ' + (es ? 'hogar' : 'household') : '') + '</h3>' +
    '<button class="link" data-go="recurrentes.html">' + (es ? 'Ver todos' : 'See all') + '</button></div>' +
    (recs.length ? recs.map(function (r) {
      var RL = FT.recurLabel(r);
      return '<div class="iv-pos" data-rec="' + r.id + '"><div class="tk" style="background:var(--sky-bg);color:#2A4CC0">🔄</div>' +
        '<div class="m"><div class="n">' + RL.name + '</div><div class="d">' + RL.sub + '</div></div>' +
        '<div class="r"><div class="v">' + money(r.amount) + '</div></div></div>';
    }).join('') : '<div class="iv-hint">' + (es ? 'Sin recurrentes aquí · actívalos al agregar una inversión.' : 'None here · turn one on when adding an investment.') + '</div>');

  var posList = list.length ? list.map(function (i) {
    var v = posVal(i), c = posCost(i), pg = v - c;
    var tk = String(i.ticker || '?').slice(0, 5);
    return '<div class="iv-pos" data-pos="' + i.id + '"><div class="tk">' + tk + '</div>' +
      '<div class="m"><div class="n">' + tk + (i.recId ? '<span class="iv-recb">🔄</span>' : '') + '</div>' +
      '<div class="d">' + (i.platform && i.platform !== 'Importado' ? i.platform + ' · ' : '') + (parseFloat(i.shares) || 1) + ' u · $' + (parseFloat(i.avgPrice) || parseFloat(i.amount) || 0) + ' avg' + ((parseFloat(i.curPrice) && parseFloat(i.curPrice) !== parseFloat(i.avgPrice)) ? ' → $' + i.curPrice : '') + '</div></div>' +
      '<div class="r"><div class="v">' + money(v) + '</div><div class="g" style="color:' + (pg >= 0 ? 'var(--g-main)' : 'var(--red)') + '">' + (pg >= 0 ? '+' : '−') + money(pg) + '</div></div></div>';
  }).join('') : '<div class="iv-empty">' + (es ? 'Sin inversiones aún — toca ＋ para agregar' : 'No investments yet — tap ＋ to add') + '</div>';

  document.getElementById('root').innerHTML = vt + sum + recSec +
    '<div class="ft-section-head" style="margin-top:22px"><h3>' + (es ? 'Posiciones' : 'Positions') + '</h3></div>' + posList;

  document.querySelectorAll('[data-v]').forEach(function (el) { el.onclick = function () { VIEW = el.getAttribute('data-v'); render(); }; });
  document.querySelectorAll('[data-pos]').forEach(function (el) { el.onclick = function () { posDetail(el.getAttribute('data-pos')); }; });
  document.querySelectorAll('[data-rec]').forEach(function (el) { el.onclick = function () { recDetail(el.getAttribute('data-rec')); }; });
  document.querySelectorAll('[data-go]').forEach(function (el) { el.onclick = function () { FT.go(el.getAttribute('data-go')); }; });
}

/* ── AGREGAR ── */
function openAdd() {
  addSt = { modo: 'nueva', scope: VIEW === 'hogar' ? 'hogar' : 'personal', complexity: 'simple', rec: false, freq: 'monthly' };
  var mod = FT.modal({
    title: L() ? 'Nueva inversión' : 'New investment',
    html: addFormHTML(),
    saveLabel: L() ? 'Guardar' : 'Save',
    cancelLabel: L() ? 'Cancelar' : 'Cancel',
    onOpen: wireAddForm,
    onSave: saveAdd
  });
}
function addFormHTML() {
  var s = addSt, es = L();
  var scopeSeg = FT.hogarConnected()
    ? '<div class="ft-field"><label>' + (es ? 'Es para' : 'For') + '</label><div class="iv-seg" data-g="scope">' +
      '<button data-o="personal" class="' + (s.scope === 'personal' ? 'on' : '') + '">👤 ' + (es ? 'Personal' : 'Personal') + '</button>' +
      '<button data-o="hogar" class="' + (s.scope === 'hogar' ? 'on' : '') + '">🏠 ' + (es ? 'Hogar' : 'Household') + '</button></div></div>' : '';
  var recPanel = s.modo === 'nueva'
    ? '<div class="iv-recpanel"><div class="top">🔄 ' + (es ? '¿Es recurrente?' : 'Recurring?') +
      '<label style="display:flex;gap:6px;align-items:center;cursor:pointer"><input type="checkbox" id="ivRec" ' + (s.rec ? 'checked' : '') + ' style="width:17px;height:17px;accent-color:var(--g-main)"><span style="font-size:11px">' + (es ? 'Sí' : 'Yes') + '</span></label></div>' +
      (s.rec ? '<div class="iv-seg three" data-g="freq" style="margin:9px 0 0">' +
        '<button data-o="weekly" class="' + (s.freq === 'weekly' ? 'on' : '') + '">' + (es ? 'Semanal' : 'Weekly') + '</button>' +
        '<button data-o="biweekly" class="' + (s.freq === 'biweekly' ? 'on' : '') + '">' + (es ? 'Quincenal' : 'Biweekly') + '</button>' +
        '<button data-o="monthly" class="' + (s.freq === 'monthly' ? 'on' : '') + '">' + (es ? 'Mensual' : 'Monthly') + '</button></div>' : '') + '</div>'
    : '';
  var typeOpts = TYPES.map(function (t) { return '<option value="' + t[0] + '">' + t[1] + '</option>'; }).join('');
  return '<div class="ft-field"><label>' + (es ? 'Tipo de registro' : 'Entry type') + '</label><div class="iv-seg" data-g="modo">' +
      '<button data-o="nueva" class="' + (s.modo === 'nueva' ? 'on' : '') + '">' + (es ? 'Nueva' : 'New') + '<small>' + (es ? 'sale de tu disponible del mes' : 'from this month') + '</small></button>' +
      '<button data-o="existente" class="' + (s.modo === 'existente' ? 'on' : '') + '">' + (es ? 'Ya la tenía' : 'Already had it') + '<small>' + (es ? 'solo capturar' : 'just capture') + '</small></button></div></div>' +
    scopeSeg +
    '<div class="ft-field"><label>' + (es ? 'Datos' : 'Detail') + '</label><div class="iv-seg" data-g="complexity">' +
      '<button data-o="simple" class="' + (s.complexity === 'simple' ? 'on' : '') + '">' + (es ? 'Simple' : 'Simple') + '<small>' + (es ? 'solo monto' : 'amount only') + '</small></button>' +
      '<button data-o="avanzado" class="' + (s.complexity === 'avanzado' ? 'on' : '') + '">' + (es ? 'Avanzado' : 'Advanced') + '<small>' + (es ? 'acciones + precios' : 'shares + prices') + '</small></button></div></div>' +
    '<div class="ft-field"><label>Ticker / ' + (es ? 'Nombre' : 'Name') + '</label><input id="ivTicker" placeholder="VOO, FXAIX, BTC…"></div>' +
    '<div class="ft-field"><label>' + (es ? 'Tipo' : 'Type') + '</label><select id="ivType">' + typeOpts + '</select></div>' +
    (s.complexity === 'simple'
      ? '<div class="ft-field"><label>' + (es ? 'Monto invertido' : 'Amount invested') + '</label><input id="ivMonto" inputmode="decimal" placeholder="$0"></div>'
      : '<div class="ft-field"><label>' + (es ? 'Acciones / Unidades' : 'Shares / Units') + '</label><input id="ivShares" inputmode="decimal" placeholder="0"></div>' +
        '<div class="ft-field"><label>' + (es ? 'Precio promedio de compra' : 'Avg buy price') + '</label><input id="ivAvg" inputmode="decimal" placeholder="$0"></div>' +
        '<div class="ft-field"><label>' + (es ? 'Precio actual' : 'Current price') + '</label><input id="ivCur" inputmode="decimal" placeholder="$0"></div>') +
    '<div class="ft-field"><label>' + (es ? 'Fecha' : 'Date') + (s.modo === 'nueva' && s.rec ? ' (' + (es ? 'inicio' : 'start') + ')' : '') + '</label><input id="ivDate" type="date" value="' + FT.todayISO() + '"></div>' +
    '<div class="ft-field"><label>' + (es ? 'Plataforma (opcional)' : 'Platform (optional)') + '</label><input id="ivPlatform" placeholder="Fidelity, Robinhood…"></div>' +
    recPanel;
}
function _snap(body) {
  addSt._vals = {};
  body.querySelectorAll('input,select').forEach(function (el) { if (el.id) addSt._vals[el.id] = el.value; });
}
function _restore(body) {
  var v = addSt._vals || {};
  body.querySelectorAll('input,select').forEach(function (el) { if (el.id && v[el.id] != null && v[el.id] !== '') el.value = v[el.id]; });
}
function redrawAddForm(body) { _snap(body); body.innerHTML = addFormHTML(); _restore(body); wireAddForm(body); }
function wireAddForm(body) {
  body.querySelectorAll('[data-g]').forEach(function (grp) {
    grp.querySelectorAll('button').forEach(function (b) {
      b.onclick = function () { addSt[grp.getAttribute('data-g')] = b.getAttribute('data-o'); redrawAddForm(body); };
    });
  });
  var rc = body.querySelector('#ivRec');
  if (rc) rc.onchange = function () { addSt.rec = rc.checked; redrawAddForm(body); };
}
function saveAdd(body) {
  var es = L(), s = addSt;
  var ticker = (body.querySelector('#ivTicker').value || '').trim().toUpperCase();
  if (!ticker) { FT.toast(es ? 'Ingresa el ticker o nombre' : 'Enter ticker or name'); return true; }
  var type = body.querySelector('#ivType').value;
  var platform = (body.querySelector('#ivPlatform').value || '').trim();
  var date = body.querySelector('#ivDate').value || FT.todayISO();
  var shares, avg, cur, amount;
  if (s.complexity === 'avanzado') {
    shares = parseFloat(body.querySelector('#ivShares').value) || 1;
    avg = parseFloat(body.querySelector('#ivAvg').value) || 0;
    cur = parseFloat(body.querySelector('#ivCur').value) || avg;
    amount = shares * avg;
  } else {
    amount = parseFloat(body.querySelector('#ivMonto').value) || 0;
    shares = 1; avg = amount; cur = amount;
    if (amount <= 0) { FT.toast(es ? 'Ingresa el monto invertido' : 'Enter the amount'); return true; }
  }
  var scope = s.scope === 'hogar' ? 'hogar' : '';
  var isHogar = scope === 'hogar';

  // NUEVA + RECURRENTE → solo el recurrente; el motor lo aplica en su fecha (aunque sea futura)
  if (s.modo === 'nueva' && s.rec) {
    var rec = FT.recurring();
    rec.push({ id: 'rec_' + Date.now(), kind: 'inversion', hogar: isHogar, desc: ticker, amount: amount, freq: s.freq, nextDate: date, active: true, createdBy: FT.userName() });
    FT.set(FT.K.recurring, rec);
    if (date <= FT.todayISO()) { try { FT.applyDueRecurring(); } catch (e) {} }
    FT.toast(es ? '🔄 Inversión recurrente activada' : '🔄 Recurring investment on');
    render();
    return;
  }

  var id = Date.now();
  var pos = { id: 'i_' + id, ticker: ticker, type: type, shares: shares, avgPrice: avg, curPrice: cur, amount: amount, platform: platform, modo: s.modo === 'nueva' ? 'nueva' : 'yaLaTenia', fecha: date, addedBy: FT.userName(), addedAt: new Date().toISOString() };
  var list = FT.investments(scope);

  if (s.modo === 'nueva' && date <= FT.todayISO()) {
    // cuenta contra el disponible del mes
    var d = FT.data();
    d.transactions.push({ id: id, type: 'inversion', desc: ticker, amount: amount, date: date, cat: '📈 Inversión', hogar: isHogar, createdBy: FT.userName(), fromInvPage: true });
    FT.set(FT.K.data, d);
    pos.txId = id;
  }
  list.push(pos);
  FT.saveInvestments(list, scope);
  FT.toast(s.modo === 'nueva'
    ? (date > FT.todayISO() ? (es ? 'Registrada · empieza el ' + FT.date(date) : 'Saved · starts ' + FT.date(date)) : (es ? '✅ Inversión registrada' : '✅ Investment recorded'))
    : (es ? '✅ Posición capturada' : '✅ Position captured'));
  render();
}

/* ── DETALLE DE POSICIÓN ── */
function posDetail(id) {
  var es = L(), scope = scopeKey();
  var list = FT.investments(scope);
  var i = list.find(function (x) { return x.id === id; });
  if (!i) return;
  var v = posVal(i), c = posCost(i), g = v - c;
  var rows = [
    [es ? 'Tipo' : 'Type', (TYPES.find(function (t) { return t[0] === i.type; }) || [0, i.type || '—'])[1]],
    [es ? 'Unidades' : 'Units', String(parseFloat(i.shares) || 1)],
    [es ? 'Precio promedio' : 'Avg price', '$' + (parseFloat(i.avgPrice) || parseFloat(i.amount) || 0)],
    [es ? 'Precio actual' : 'Current price', '$' + (parseFloat(i.curPrice) || parseFloat(i.avgPrice) || 0)],
    [es ? 'Plataforma' : 'Platform', i.platform || '—'],
    [es ? 'Fecha' : 'Date', FT.date(i.fecha || (i.addedAt || '').slice(0, 10))]
  ];
  if (i.recId) rows.push(['🔄 ' + (es ? 'Recurrente' : 'Recurring'), es ? 'activo' : 'active']);
  if (i.modo === 'yaLaTenia') rows.push([es ? 'Origen' : 'Source', es ? 'Ya la tenía (no contó al mes)' : 'Pre-owned (not counted)']);
  FT.sheet({
    title: i.ticker,
    html: '<div style="text-align:center;margin-bottom:12px"><div style="font-family:var(--round-font);font-weight:900;font-size:26px">' + money(v) + '</div>' +
      '<div style="font-size:13px;font-weight:800;color:' + (g >= 0 ? 'var(--g-main)' : 'var(--red)') + '">' + (g >= 0 ? '+' : '−') + money(g) + '</div></div>' +
      rows.map(function (r) { return '<div class="ft-row"><span class="k">' + r[0] + '</span><span class="v">' + r[1] + '</span></div>'; }).join(''),
    actions: [
      { label: '✏️ ' + (es ? 'Editar' : 'Edit'), onClick: function () { editPos(id); } },
      { label: '🗑️ ' + (es ? 'Eliminar' : 'Delete'), onClick: function () {
          FT.confirm(es ? '¿Eliminar esta posición? Si contó al mes, también se quita de Historial.' : 'Delete this position? If it counted this month, it is also removed from History.').then(function (ok) {
            if (!ok) return;
            if (i.txId) FT.deleteTx(i.txId);
            else FT.saveInvestments(FT.investments(scope).filter(function (x) { return x.id !== id; }), scope);
            FT.toast(es ? 'Eliminada' : 'Deleted'); render();
          });
        } }
    ]
  });
}
function editPos(id) {
  var es = L(), scope = scopeKey();
  var i = FT.investments(scope).find(function (x) { return x.id === id; });
  if (!i) return;
  var adv = (parseFloat(i.shares) || 1) !== 1;
  FT.modal({
    title: es ? 'Editar posición' : 'Edit position',
    saveLabel: es ? 'Guardar' : 'Save', cancelLabel: es ? 'Cancelar' : 'Cancel',
    html: '<div class="ft-field"><label>Ticker</label><input id="pTicker" value="' + (i.ticker || '') + '"></div>' +
      '<div class="ft-field"><label>' + (es ? 'Plataforma' : 'Platform') + '</label><input id="pPlat" value="' + (i.platform || '') + '"></div>' +
      (adv
        ? '<div class="ft-field"><label>' + (es ? 'Unidades' : 'Units') + '</label><input id="pShares" inputmode="decimal" value="' + (i.shares || 1) + '"></div>' +
          '<div class="ft-field"><label>' + (es ? 'Precio promedio' : 'Avg price') + '</label><input id="pAvg" inputmode="decimal" value="' + (i.avgPrice || '') + '"></div>' +
          '<div class="ft-field"><label>' + (es ? 'Precio actual' : 'Current price') + '</label><input id="pCur" inputmode="decimal" value="' + (i.curPrice || i.avgPrice || '') + '"></div>'
        : '<div class="ft-field"><label>' + (es ? 'Monto' : 'Amount') + '</label><input id="pMonto" inputmode="decimal" value="' + ((parseFloat(i.shares) || 1) * (parseFloat(i.curPrice) || parseFloat(i.avgPrice) || parseFloat(i.amount) || 0)) + '"></div>'),
    onSave: function (body) {
      var list = FT.investments(scope);
      var idx = list.findIndex(function (x) { return x.id === id; });
      if (idx < 0) return;
      list[idx].ticker = (body.querySelector('#pTicker').value || i.ticker).toUpperCase();
      list[idx].platform = body.querySelector('#pPlat').value.trim();
      if (adv) {
        list[idx].shares = parseFloat(body.querySelector('#pShares').value) || 1;
        list[idx].avgPrice = parseFloat(body.querySelector('#pAvg').value) || 0;
        list[idx].curPrice = parseFloat(body.querySelector('#pCur').value) || list[idx].avgPrice;
        list[idx].amount = list[idx].shares * list[idx].avgPrice;
      } else {
        var m = parseFloat(body.querySelector('#pMonto').value) || 0;
        list[idx].shares = 1; list[idx].avgPrice = m; list[idx].curPrice = m; list[idx].amount = m;
      }
      FT.saveInvestments(list, scope);
      FT.toast(es ? 'Actualizada' : 'Updated'); render();
    }
  });
}

/* ── DETALLE DE RECURRENTE ── */
function recDetail(id) {
  var es = L(), r = FT.recurGet(id); if (!r) return;
  var RL = FT.recurLabel(r);
  FT.sheet({
    title: RL.name,
    html: '<div class="ft-row"><span class="k">' + (es ? 'Monto' : 'Amount') + '</span><span class="v">' + money(r.amount) + '</span></div>' +
      '<div class="ft-row"><span class="k">' + (es ? 'Frecuencia' : 'Frequency') + '</span><span class="v">' + RL.sub + '</span></div>',
    actions: [
      { label: '✏️ ' + (es ? 'Editar' : 'Edit'), onClick: function () {
          FT.modal({
            title: es ? 'Editar recurrente' : 'Edit recurring', saveLabel: es ? 'Guardar' : 'Save', cancelLabel: es ? 'Cancelar' : 'Cancel',
            html: '<div class="ft-field"><label>' + (es ? 'Monto' : 'Amount') + '</label><input id="rA" inputmode="decimal" value="' + r.amount + '"></div>' +
              '<div class="ft-field"><label>' + (es ? 'Próxima fecha' : 'Next date') + '</label><input id="rN" type="date" value="' + (r.nextDate || FT.todayISO()) + '"></div>',
            onSave: function (b) { FT.recurUpdate(id, { amount: b.querySelector('#rA').value, nextDate: b.querySelector('#rN').value }); FT.toast(es ? 'Actualizado' : 'Updated'); render(); }
          });
        } },
      { label: r.paused ? '▶️ ' + (es ? 'Reanudar' : 'Resume') : '⏸ ' + (es ? 'Pausar' : 'Pause'), onClick: function () { FT.recurPause(id, !r.paused); FT.toast(r.paused ? (es ? 'Reanudado' : 'Resumed') : (es ? 'Pausado' : 'Paused')); render(); } },
      { label: '🗑️ ' + (es ? 'Eliminar' : 'Delete'), onClick: function () { FT.confirm(es ? '¿Eliminar este recurrente?' : 'Delete this recurring item?').then(function (ok) { if (ok) { FT.recurDelete(id); FT.toast(es ? 'Eliminado' : 'Deleted'); render(); } }); } },
      { label: es ? 'Ver en Recurrentes →' : 'Open in Recurring →', onClick: function () { FT.go('recurrentes.html'); } }
    ]
  });
}

/* ── INIT ── */
document.addEventListener('ft:ready', function () {
  var t = function () { return FT.lang === 'es' ? 'Inversiones' : 'Investments'; };
  var sh = FT.shell({ active: '', title: t(), onPlus: openAdd });
  render();
  document.addEventListener('ft:datachanged', render);
  document.addEventListener('ft:langchange', function () { sh.setTitle(t()); render(); });
});
</script>
