<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>FinTrack Pro · Historial</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<script src="premium.js"></script>
</head>
<body>
<div class="ft-app"><div class="ft-page" id="root"></div></div>
<script>
var selectedMonth = FT.todayISO().slice(0, 7);
var activeFilter = 'all';
// 19-oct-2026, a petición de Ramón: tocar una barra de categoría (Overview u
// Hogar) llega aquí ya filtrado -- ?f=hogar|personal|..., ?m=AAAA-MM, ?cat=...
var catFilter = '', acctFilter = '';
(function () {
  try {
    var q = new URLSearchParams(location.search);
    var f = q.get('f'), m = q.get('m');
    if (['all', 'gasto', 'ingreso', 'inversion', 'hogar', 'personal'].indexOf(f) > -1) activeFilter = f;
    if (/^\d{4}-(0[1-9]|1[0-2])$/.test(m || '')) selectedMonth = m;
    catFilter = q.get('cat') || '';
    acctFilter = q.get('acct') || '';
    if (q.get('tools') === '1') document.addEventListener('ft:ready', function () { setTimeout(function () { if (typeof descargarMovimientos === 'function') descargarMovimientos(); }, 500); });
  } catch (e) {}
})();
function catMatches(t) {
  if (!catFilter) return true;
  var want = FT.catMeta(catFilter).label.toLowerCase();
  if (want === 'ahorro' || want === 'savings') return t.type === 'ahorro';
  if (want === 'inversión' || want === 'inversion' || want === 'investment') return t.type === 'inversion';
  return FT.catMeta(t.cat || '').label.toLowerCase() === want;
}
function clearCat() { catFilter = ''; render(); }
function clearAcct() { acctFilter = ''; render(); }
function acctMatches(t) {
  if (!acctFilter) return true;
  if (String(t.checkingAccountId) === String(acctFilter)) return true;
  return t.type === 'transferencia' && ((t.fromRef && t.fromRef.type === 'account' && String(t.fromRef.id) === String(acctFilter)) || (t.toRef && t.toRef.type === 'account' && String(t.toRef.id) === String(acctFilter)));
}
function escH(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
// Bug real de QA (N3): la sección "Del hogar" alternaba entre dos números
// distintos (ej. "Aportado $120" y luego "Aportado $0 / Gastos $120") sin
// que cambiara ningún dato real -- FT.boot() dispara "ft:ready" (que pinta
// esta pantalla por primera vez) SIN esperar a que termine de sincronizar
// con la pareja; cuando la sincronización sí termina, dispara
// "ft:datachanged" y esta pantalla se vuelve a pintar con los datos ya
// frescos. Mismo dato, dos momentos -- antes de sincronizar y después. En
// vez de mostrar un número que sabemos que puede estar incompleto, se
// muestra "Sincronizando…" hasta el primer repintado real.
var _syncSettled = !FT.hogarConnected();
var _currentList = [];
var shell;

function es() { return FT.lang === 'es'; }
var MONTHS_ES = ['Enero', 'Febrero', 'Marzo', 'Abril', 'Mayo', 'Junio', 'Julio', 'Agosto', 'Septiembre', 'Octubre', 'Noviembre', 'Diciembre'];
var MONTHS_EN = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
function monthLabel() {
  var p = selectedMonth.split('-').map(Number);
  return (es() ? MONTHS_ES : MONTHS_EN)[p[1] - 1] + ' ' + p[0];
}
function changeMonth(dir) {
  var p = selectedMonth.split('-').map(Number);
  var d = new Date(p[0], p[1] - 1 + dir, 1);
  selectedMonth = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
  if (shell) shell.setMonth(monthLabel());
  render();
}
var TYPE_ICO = { gasto: '💸', ingreso: '💰', inversion: '📈', ahorro: '🛡️', suscripcion: '🔄', hipoteca: '🏠', transferencia: '🔁', ajuste: '⚖️' };
var TYPE_PASTEL = { gasto: 'coral', ingreso: 'mint', inversion: 'sky', ahorro: 'peach', suscripcion: 'sky', hipoteca: 'coral', transferencia: 'sky', ajuste: 'peach' };

function render() {
  var L = es();
  if (shell) shell.setMonth(monthLabel());

  var data = FT.data();
  var txs = (data.transactions || []).filter(function (t) { return !FT.isPending(t) && (t.date || '').startsWith(selectedMonth); });
  var pp = FT.partnerProfile();
  var partnerHogarTxs = pp && pp.data && pp.data.transactions
    ? (pp.data.transactions || []).filter(function (t) { return (t.isHogar || t.hogar === true) && (t.date || '').startsWith(selectedMonth); })
    : [];

  // QA 03-oct-2026: "Ingresos" bajo Personal mostraba el monto COMPLETO de
  // cada cheque -- ningún ingreso de tipo 'ingreso' (ni el cheque
  // recibido, ni la cobertura) lleva nunca hogar:true (confirmado en todo
  // el repo), así que el 100% del cheque caía aquí aunque el 60%/lo que
  // sea esté destinado a hogar. Ramón pidió que esto sea solo lo que de
  // verdad es suyo: tu % personal del cheque + todo el ingreso extra (ya
  // 100% tuyo por definición) -- misma fórmula que limits()/
  // FT.personalAvailable() ya usan en el resto de la app.
  // 15-oct-2026 (Ramón, capturas): el Dashboard cuenta tu ahorro personal
  // (reparto a fondos, ahorro automático del cheque -- type:'ahorro' sin
  // hogar) dentro de "Gastado del mes" (totals()'s t.spent ya lo incluye,
  // confirmado desde las partes 19-22), pero aquí nunca se acumulaba a
  // NINGÚN lado cuando no era de hogar -- se perdía del todo, el resumen
  // "Personal" de Historial no tenía forma de mostrarlo. Nueva variable
  // pAhorro + su propia fila, igual que "Aportado" ya existe del lado de
  // Hogar. No se suma a totalExpense (ver abajo) -- "Gastos" se queda
  // significando spending (necesidades/gustos), igual que su etiqueta
  // dice; el ahorro ya tiene su propia fila visible, que es lo que
  // faltaba.
  var pIncomeCheque = 0, pIncomeExtra = 0, pExpense = 0, pInvest = 0, pAhorro = 0, hAportado = 0, hGastado = 0, hIngreso = 0;
  txs.forEach(function (t) {
    var a = parseFloat(t.amount) || 0, esHogarTx = t.isHogar || t.hogar === true;
    if (t.type === 'ingreso') {
      if (esHogarTx) hIngreso += a;
      else if (t.incomeKind === 'venta') { /* venta de inversión: no es dinero nuevo */ }
      else if (t.incomeKind === 'cheque') pIncomeCheque += a;
      else pIncomeExtra += a;
    }
    else if (t.type === 'inversion') { pInvest += a; }
    else if (t.type === 'ahorro') { if (esHogarTx) hAportado += a; else pAhorro += a; }
    else if (t.type === 'gasto' || t.type === 'suscripcion' || t.type === 'hipoteca') { if (esHogarTx) hGastado += a; else pExpense += a; }
  });
  var pIncome = pIncomeCheque * FT.personalPct() / 100 + pIncomeExtra;
  partnerHogarTxs.forEach(function (t) {
    var a = parseFloat(t.amount) || 0;
    if (t.type === 'ingreso') hIngreso += a;
    else if (t.type === 'ahorro') hAportado += a;
    else if (t.type === 'gasto' || t.type === 'suscripcion' || t.type === 'hipoteca') hGastado += a;
  });
  var totalIncome = pIncome + hIngreso, totalExpense = pExpense + hGastado;

  var h = '<div class="ft-card">' +
    '<div style="font-size:11px;font-weight:800;color:var(--text3);text-transform:uppercase;letter-spacing:.4px;margin-bottom:8px">👤 ' + (L ? 'Personal' : 'Personal') + '</div>' +
    '<div class="ft-row"><span class="k">💰 ' + (L ? 'Ingresos' : 'Income') + '</span><span class="v" style="color:var(--g-main)">' + FT.money(pIncome, { cents: true }) + '</span></div>' +
    '<div class="ft-row"><span class="k">💸 ' + (L ? 'Gastos' : 'Expenses') + '</span><span class="v" style="color:var(--red)">' + FT.money(pExpense, { cents: true }) + '</span></div>' +
    '<div class="ft-row"><span class="k">💰 ' + (L ? 'Ahorro' : 'Savings') + '</span><span class="v" style="color:var(--g-main)">' + FT.money(pAhorro, { cents: true }) + '</span></div>' +
    '<div class="ft-row"><span class="k">📈 ' + (L ? 'Inversiones' : 'Investments') + '</span><span class="v" style="color:var(--blue)">' + FT.money(pInvest, { cents: true }) + '</span></div>' +
  '</div>' +
  '<div class="ft-card">' +
    '<div style="font-size:11px;font-weight:800;color:var(--text3);text-transform:uppercase;letter-spacing:.4px;margin-bottom:8px">🏠 ' + (L ? 'Del hogar' : 'Household') + '</div>' +
    (!_syncSettled
      ? '<div style="font-size:11.5px;color:var(--text3);padding:4px 0">🔄 ' + (L ? 'Sincronizando con tu pareja…' : 'Syncing with your partner…') + '</div>'
      : '<div class="ft-row"><span class="k">💰 ' + (L ? 'Aportado' : 'Contributed') + '</span><span class="v" style="color:var(--g-main)">' + FT.money(hAportado, { cents: true }) + '</span></div>' +
        '<div class="ft-row"><span class="k">💸 ' + (L ? 'Gastos' : 'Expenses') + '</span><span class="v" style="color:var(--red)">' + FT.money(hGastado, { cents: true }) + '</span></div>' +
        '<div class="ft-row"><span class="k">📥 ' + (L ? 'Ingreso' : 'Income') + '</span><span class="v" style="color:var(--blue)">' + FT.money(hIngreso, { cents: true }) + '</span></div>') +
  '</div>' +
  '<div style="background:var(--sunk);border-radius:14px;padding:12px 14px;margin-bottom:14px;font-size:11px;color:var(--text3)">' +
    '<div style="margin-bottom:4px">' + (L ? 'Total combinado' : 'Combined total') + '</div>' +
    '<div style="display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--ink)">' +
      '<span>' + (L ? 'Ingresos' : 'Income') + ' <b>' + FT.money(totalIncome, { cents: true }) + '</b></span>' +
      '<span>' + (L ? 'Gastos' : 'Expenses') + ' <b>' + FT.money(totalExpense, { cents: true }) + '</b></span>' +
    '</div></div>';

  if (acctFilter) h = '';   // vista de una cuenta: abarca todos los meses, el resumen del mes no aplica
  h += '<div style="display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;margin-bottom:14px">' +
    [['all', L ? 'Todos' : 'All'], ['gasto', '💸 ' + (L ? 'Gastos' : 'Expenses')], ['ingreso', '💰 ' + (L ? 'Ingresos' : 'Income')], ['inversion', '📈 ' + (L ? 'Inversiones' : 'Investments')], ['personal', '👤 Personal'], ['hogar', '🏠 ' + (L ? 'Hogar' : 'Household')]]
      .map(function (f) { var on = activeFilter === f[0]; return '<button class="tap" data-f="' + f[0] + '" style="flex-shrink:0;background:' + (on ? 'var(--ink)' : 'var(--sunk)') + ';border:1.5px solid ' + (on ? 'var(--ink)' : 'var(--hair)') + ';color:' + (on ? '#fff' : 'var(--text2)') + ';border-radius:99px;padding:6px 14px;font-size:12px;font-weight:700;font-family:inherit;cursor:pointer;white-space:nowrap">' + f[1] + '</button>'; }).join('') +
  '</div>';

  if (acctFilter) {
    var acN = (FT.checking().find(function (a) { return String(a.id) === String(acctFilter); }) || {}).name || (L ? 'Cuenta' : 'Account');
    h += '<div style="display:flex;align-items:center;gap:8px;margin:-4px 0 12px"><span style="font-size:12px;color:var(--text2)">' + (L ? 'Cuenta:' : 'Account:') + ' <b>' + escH(acN) + '</b></span><button class="tap" onclick="clearAcct()" style="background:var(--sunk);border:1px solid var(--hair);border-radius:99px;padding:3px 10px;font-size:11px;font-weight:700;cursor:pointer;font-family:inherit;color:var(--text2)">✕ ' + (L ? 'Quitar' : 'Clear') + '</button></div>';
  }
  if (catFilter) {
    h += '<div style="display:flex;align-items:center;gap:8px;margin:-4px 0 12px"><span style="font-size:12px;color:var(--text2)">' + (L ? 'Categoría:' : 'Category:') + ' <b>' + escH(FT.catMeta(catFilter).label) + '</b></span>' +
      '<button class="tap" onclick="clearCat()" aria-label="' + (L ? 'Quitar filtro de categoría' : 'Clear category filter') + '" style="background:var(--sunk);border:1px solid var(--hair);border-radius:99px;padding:3px 10px;font-size:11px;font-weight:700;cursor:pointer;font-family:inherit;color:var(--text2)">✕ ' + (L ? 'Quitar' : 'Clear') + '</button></div>';
  }
  h += '<div class="ft-card" id="txList" style="padding:2px 16px"></div>';

  h += '<div class="ft-card" style="padding:0">' +
    '<button class="tap" id="toolsToggleBtn" style="width:100%;background:none;border:none;padding:14px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;font-family:inherit">' +
      '<span style="font-size:12.5px;font-weight:700;color:var(--text2)">🛠️ ' + (L ? 'Herramientas' : 'Tools') + '</span><span id="toolsChevron" style="color:var(--text3);transition:transform .2s ease">▾</span></button>' +
    '<div id="toolsPanel" style="display:none;padding:0 14px 14px">' +
      '<button class="tap" style="width:100%;background:#FBF0DD;color:#8A5A00;border:1.5px solid var(--amber);border-radius:12px;padding:11px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;margin-bottom:8px" onclick="buscarDuplicados()">🔍 ' + (L ? 'Buscar posibles duplicados' : 'Find possible duplicates') + '</button>' +
      '<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">' +
        '<button class="tap" style="background:var(--g-light);color:var(--g-main);border:1.5px solid var(--g-main);border-radius:12px;padding:11px;font-size:12.5px;font-weight:700;cursor:pointer;font-family:inherit" onclick="exportarRespaldo()">📤 ' + (L ? 'Descargar respaldo' : 'Download backup') + '</button>' +
        '<button class="tap" style="background:var(--sunk);color:var(--text2);border:1.5px solid var(--hair);border-radius:12px;padding:11px;font-size:12.5px;font-weight:700;cursor:pointer;font-family:inherit" onclick="document.getElementById(\'inputRestaurar\').click()">📥 ' + (L ? 'Restaurar respaldo' : 'Restore backup') + '</button>' +
      '</div>' +
      '<input type="file" id="inputRestaurar" accept=".json" style="display:none" onchange="restaurarRespaldo(this.files[0])">' +
      '<button class="tap" style="width:100%;background:var(--sunk);color:var(--text2);border:1.5px solid var(--hair);border-radius:12px;padding:11px;font-size:12.5px;font-weight:700;cursor:pointer;font-family:inherit;margin-top:8px" onclick="descargarMovimientos()">📊 ' + (L ? 'Descargar movimientos' : 'Download movements') + '</button>' +
      '<button class="tap" style="width:100%;background:var(--sunk);color:var(--text2);border:1.5px solid var(--hair);border-radius:12px;padding:11px;font-size:12.5px;font-weight:700;cursor:pointer;font-family:inherit;margin-top:8px" onclick="document.getElementById(\'inputMovs\').click()">📥 ' + (L ? 'Importar movimientos' : 'Import movements') + '</button>' +
      '<input type="file" id="inputMovs" accept=".json" style="display:none" onchange="FT.openImportMovements(this.files[0]); this.value=\'\'">' +
      '<div id="dupResults" style="margin-top:12px"></div>' +
    '</div></div>';

  document.getElementById('root').innerHTML = h;
  document.getElementById('toolsToggleBtn').onclick = toggleToolsPanel;
  document.querySelectorAll('[data-f]').forEach(function (b) { b.onclick = function () { activeFilter = b.getAttribute('data-f'); renderList(); }; });
  renderList();
}

function toggleToolsPanel() {
  var panel = document.getElementById('toolsPanel'), chev = document.getElementById('toolsChevron');
  var open = panel.style.display !== 'none';
  panel.style.display = open ? 'none' : 'block';
  chev.style.transform = open ? 'rotate(0deg)' : 'rotate(180deg)';
}

function renderList() {
  var L = es(), data = FT.data();
  var txs = (data.transactions || []).filter(function (t) { return acctFilter ? !!t.date : (t.date || '').startsWith(selectedMonth); }); // vista de una cuenta: todos sus meses
  var hogar = FT.hogar(), partnerName = hogar.partnerName || (L ? 'Tu pareja' : 'Your partner');
  var pp = FT.partnerProfile();
  if (pp && pp.data && pp.data.transactions) {
    var partnerTxs = (pp.data.transactions || []).filter(function (t) { return (t.isHogar || t.hogar === true) && (t.date || '').startsWith(selectedMonth); })
      .map(function (t) { return Object.assign({}, t, { _partner: true, createdBy: t.createdBy || partnerName }); });
    txs = txs.concat(partnerTxs);
  }
  if (activeFilter === 'hogar') txs = txs.filter(function (t) { return t.isHogar || t.hogar === true; });
  // Bug real de QA (N1): el filtro "Gastos" mostraba solo type==='gasto' en
  // la lista, pero el resumen de arriba (totalExpense) ya sumaba también
  // suscripcion e hipoteca -- la lista se veía más corta que el total. La
  // lista ahora incluye lo mismo que ya cuenta el resumen.
  else if (activeFilter === 'gasto') txs = txs.filter(function (t) { return t.type === 'gasto' || t.type === 'suscripcion' || t.type === 'hipoteca'; });
  else if (activeFilter === 'personal') txs = txs.filter(function (t) { return !(t.isHogar || t.hogar === true); });
  else if (activeFilter !== 'all') txs = txs.filter(function (t) { return t.type === activeFilter; });
  if (catFilter) txs = txs.filter(catMatches);
  if (acctFilter) txs = txs.filter(acctMatches);
  txs.sort(function (a, b) { return String(b.date || '').localeCompare(String(a.date || '')) || ((parseInt(b.id, 10) || 0) - (parseInt(a.id, 10) || 0)); });

  _currentList = txs;
  var list = document.getElementById('txList');
  list.innerHTML = txs.length ? txs.map(function (t, i) { return FT.txRow(t, i, { partner: true }); }).join('') : '<div class="ft-empty">' + (L ? 'Sin movimientos este mes' : 'No transactions this month') + '</div>';
}

document.getElementById('root').addEventListener('click', function (e) {
  var row = e.target.closest('[data-txid]');
  if (!row) return;
  var t = _currentList.find(function (x) { return String(x.id) === row.getAttribute('data-txid'); });
  if (!t || t._partner) return; // solo lectura para lo de mi pareja, igual que antes
  FT.openTxDetail(t);
});

/* ── RESPALDO / DUPLICADOS ── el export/import completo vive en FT.exportBackup
   / FT.readBackupFile / FT.applyBackup (compartido con config.html). */
function exportarRespaldo() {
  FT.exportBackup();
  FT.toast(es() ? '✅ Respaldo descargado' : '✅ Backup downloaded');
}
/** Descargar / importar solo movimientos, escogiendo qué (el selector vive en premium.js). */
function descargarMovimientos() { FT.openExportMovements(); }
function restaurarRespaldo(file) {
  var L = es();
  FT.readBackupFile(file).then(function (backup) {
    var fecha = backup._meta.exportedAt ? backup._meta.exportedAt.split('T')[0] : '?';
    var ok = confirm(L
      ? 'Este respaldo es del ' + fecha + ' (de ' + (backup._meta.user || '—') + ').\n\n⚠️ Esto REEMPLAZA lo que tienes ahora mismo en este teléfono por lo del respaldo. Si tienes datos nuevos sin respaldar aquí, se perderán.\n\n¿Continuar?'
      : 'This backup is from ' + fecha + ' (by ' + (backup._meta.user || '—') + ').\n\n⚠️ This REPLACES what you currently have on this phone with what\'s in the backup. Any newer data not in this backup will be lost.\n\nContinue?');
    if (!ok) return;
    FT.applyBackup(backup);
    FT.toast(L ? '✅ Respaldo restaurado' : '✅ Backup restored');
    setTimeout(function () { location.reload(); }, 800);
  }).catch(function () {
    alert(L ? '⚠️ Este archivo no es un respaldo válido de FinTrack Pro.' : '⚠️ This file is not a valid FinTrack Pro backup.');
  });
}
function buscarDuplicados() {
  var L = es(), txs = FT.txs();
  var norm = function (s) { return (s || '').toLowerCase().trim().replace(/\s+/g, ' ').replace(/[^\w\sáéíóúñ]/g, ''); };
  var groups = {};
  txs.forEach(function (t) {
    if (t.type === 'ingreso') return; // los ingresos (cheques) legítimamente se repiten monto/desc cada periodo
    var key = (parseFloat(t.amount) || 0).toFixed(2) + '|' + norm(t.desc);
    (groups[key] = groups[key] || []).push(t);
  });
  var sospechosos = Object.keys(groups).map(function (k) { return groups[k]; }).filter(function (g) { return g.length >= 2; });
  var el = document.getElementById('dupResults');
  el.style.display = 'block';
  if (!sospechosos.length) { el.innerHTML = '<div class="ft-empty">✅ ' + (L ? 'No encontré nada que parezca duplicado' : "No duplicates found") + '</div>'; return; }
  el.innerHTML = '<div style="font-size:12px;font-weight:700;color:#8A5A00;margin-bottom:10px">⚠️ ' + (L ? sospechosos.length + ' grupo(s) con posibles duplicados — revisa y borra los que no debieran estar' : sospechosos.length + " group(s) with possible duplicates — review and delete the ones that shouldn't be there") + '</div>' +
    sospechosos.map(function (g) {
      var mismaFecha = new Set(g.map(function (t) { return t.date; })).size === 1;
      return '<div class="ft-card" style="border:1.5px solid ' + (mismaFecha ? 'var(--red)' : 'var(--amber)') + '">' +
        '<div style="font-size:11px;font-weight:700;color:' + (mismaFecha ? 'var(--red)' : '#8A5A00') + ';margin-bottom:8px">' + (mismaFecha ? (L ? '🔴 Misma fecha y monto — muy probable duplicado' : '🔴 Same date and amount — very likely duplicate') : (L ? '🟡 Mismo monto/descripción, fechas distintas' : '🟡 Same amount/description, different dates')) + '</div>' +
        g.map(function (t) { return '<div style="display:flex;align-items:center;gap:8px;padding:6px 0;border-top:1px solid var(--hair)">' +
          '<div style="flex:1;min-width:0"><div style="font-size:12.5px;font-weight:700">' + escH(t.desc || '—') + '</div><div style="font-size:10.5px;color:var(--text3)">' + t.date + ' · ' + FT.money(t.amount, { cents: true }) + ' · ' + t.type + '</div></div>' +
          '<button class="tap" style="background:var(--red-dim);color:var(--red);border:none;border-radius:8px;padding:6px 10px;font-size:11px;font-weight:700;cursor:pointer;font-family:inherit" onclick="borrarTxDuplicada(\'' + t.id + '\')">🗑️ ' + (L ? 'Borrar' : 'Delete') + '</button></div>'; }).join('') +
      '</div>';
    }).join('');
}
function borrarTxDuplicada(txId) {
  var L = es();
  // Bug real de QA (B2): usaba confirm() nativo del navegador -- en
  // navegadores automatizados/de prueba ese diálogo se auto-descarta solo
  // (siempre responde "cancelar"), así que el borrado nunca procedía. Se
  // cambia a FT.confirm() (el propio de la app, un modal real en el DOM),
  // el mismo que ya usa el resto de la app para confirmaciones.
  FT.confirm(L ? '¿Eliminar esta transacción?' : 'Delete this transaction?').then(function (ok) {
    if (!ok) return;
    FT.deleteTx(txId);
    FT.toast(L ? '🗑️ Eliminada' : '🗑️ Deleted');
    buscarDuplicados();
  });
}

document.addEventListener('ft:ready', function () {
  var t = function () { return FT.lang === 'es' ? 'Historial' : 'History'; };
  shell = FT.shell({ active: 'hist', title: t(), month: true, monthLabel: monthLabel(), onMonth: changeMonth });
  document.addEventListener('ft:langchange', function () { shell.setTitle(t()); render(); });
  document.addEventListener('ft:datachanged', function () { _syncSettled = true; render(); });
  // Resguardo: si hogar está conectado pero la sincronización no dispara
  // ningún "ft:datachanged" en este arranque (ej. no había nada que
  // automatizar, o la red falló), "Sincronizando…" no debe quedarse para
  // siempre -- FT.boot() ya le da un máximo de 3s a la sincronización antes
  // de seguir; 3.5s aquí asegura que ya pasó ese margen.
  if (!_syncSettled) setTimeout(function () { if (!_syncSettled) { _syncSettled = true; render(); } }, 3500);

  // Filtro automático vía URL: historial.html?filter=ingreso
  try {
    var urlFilter = new URLSearchParams(window.location.search).get('filter');
    if (urlFilter) activeFilter = urlFilter;
  } catch (e) {}

  render();
});
</script>
