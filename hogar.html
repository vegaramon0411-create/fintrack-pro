<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>FinTrack Pro · Hogar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<script src="premium.js"></script>
<style>
/* Solo lo que balanceScreen/deudas.html no ya cubren en el DS compartido. */
.hg-hero{background:var(--white);border:1px solid var(--hair);border-radius:22px;padding:20px;margin-bottom:14px;border-top:3px solid var(--g-main);box-shadow:0 1px 3px rgba(20,20,30,.035);}
.hg-hero .lbl{font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:.4px;margin-bottom:4px;}
.hg-hero .amt{font-family:var(--round-font);font-weight:900;font-size:32px;letter-spacing:-1px;margin-bottom:14px;color:var(--ink);}
.hg-hero .members{display:flex;gap:10px;margin-bottom:12px;}
.hg-hero .mem{flex:1;background:var(--sunk);border-radius:14px;padding:12px;min-width:0;}
.hg-hero .mem .n{font-size:10px;color:var(--text3);margin-bottom:2px;}
.hg-hero .mem .a{font-size:16px;font-weight:800;}
.hg-hero .mem .p{font-size:10px;color:var(--text3);margin-top:2px;}
.hg-hero .box{background:var(--sunk);border-radius:12px;padding:12px;}
.hg-hero .box .r{display:flex;justify-content:space-between;font-size:11px;color:var(--text2);margin-bottom:6px;}
.hg-quick{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:6px;}
.hg-qi{display:flex;align-items:center;gap:10px;padding:12px;border-radius:16px;background:var(--white);border:1px solid var(--hair);cursor:pointer;}
.hg-qi .t{font-size:12.5px;font-weight:800;}
.hg-qi .s{font-size:10px;color:var(--text3);}
.mode-card{border:2px solid var(--hair);border-radius:16px;padding:16px;cursor:pointer;margin-bottom:10px;position:relative;}
.mode-card.recommended::after{content:'⭐';position:absolute;top:14px;right:14px;font-size:13px;}
.mc-head{display:flex;align-items:center;gap:12px;margin-bottom:10px;}
.mc-ico{font-size:26px;}
.mc-title{font-size:14px;font-weight:800;}
.mc-sub{font-size:11px;color:var(--text3);}
.mc-ex{background:var(--sunk);border-radius:10px;padding:10px 12px;font-size:12px;margin-bottom:8px;}
.mc-ex .r{display:flex;justify-content:space-between;padding:2px 0;}
</style>
</head>
<body>
<div class="ft-app"><div class="ft-page" id="root"></div></div>
<script>
var activeTab = 'resumen';
var _depositosLimit = 5, _gastosHogarLimit = 8;
var _pollTimer = null;

function es() { return FT.lang === 'es'; }
function go(url) { FT.go(url); }

/* ── CÁLCULOS ── */
function getSharedExpenses() {
  var d = FT.data(), thisMonth = FT.todayISO().slice(0, 7);
  return (d.transactions || []).filter(function (t) {
    return t.date && String(t.date).startsWith(thisMonth) &&
      (t.type === 'gasto' || t.type === 'ahorro' || t.type === 'suscripcion' || t.type === 'hipoteca') && t.hogar === true;
  });
}
function getPersonalExpenses() {
  var d = FT.data(), now = new Date(), y = now.getFullYear(), m = now.getMonth();
  return (d.transactions || []).filter(function (t) {
    if (!t.date) return false;
    var p = String(t.date).split(/[-T]/);
    if (parseInt(p[0], 10) !== y || parseInt(p[1], 10) - 1 !== m) return false;
    if (t.hogar === true) return false;
    return t.type === 'gasto' || t.type === 'inversion' || (t.type === 'ahorro' && t.hogar !== true);
  });
}
function partnerSharedTxs() {
  var pp = FT.get('profile_' + (FT.hogar().partnerEmail || '').replace(/[^a-z0-9]/gi, '_'), null) || FT.get(FT.K.profileB, null);
  var now = new Date(), y = now.getFullYear(), m = now.getMonth();
  return pp && pp.data && pp.data.transactions
    ? (pp.data.transactions || []).filter(function (t) {
        if (!t.date || t.hogar !== true) return false;
        if (!(t.type === 'gasto' || t.type === 'ahorro' || t.type === 'suscripcion' || t.type === 'hipoteca')) return false;
        var p = String(t.date).split(/[-T]/);
        return parseInt(p[0], 10) === y && parseInt(p[1], 10) - 1 === m;
      })
    : [];
}
function calcHogar() {
  var pp = FT.partnerProfile();
  var myIncome = FT.user().income || 0, partnerIncome = pp ? (pp.income || 0) : 0;
  var total = myIncome + partnerIncome, mode = FT.hogar().mode;
  var myPct, partnerPct;
  if (mode === 'equal' || mode === 'common') { myPct = 50; partnerPct = 50; }
  else { myPct = total > 0 ? Math.round(myIncome / total * 100) : 50; partnerPct = 100 - myPct; }
  var shared = getSharedExpenses(), pShared = partnerSharedTxs();
  var sharedTotal = shared.reduce(function (a, t) { return a + (t.amount || 0); }, 0) + pShared.reduce(function (a, t) { return a + (t.amount || 0); }, 0);
  var mySharedPart = sharedTotal * myPct / 100, partnerSharedPart = sharedTotal * partnerPct / 100;
  return { myIncome: myIncome, partnerIncome: partnerIncome, total: total, myPct: myPct, partnerPct: partnerPct,
    shared: shared, pShared: pShared, sharedTotal: sharedTotal, mySharedPart: mySharedPart, partnerSharedPart: partnerSharedPart };
}
function incomeReceivedThisMonth() {
  var mesKey = FT.todayISO().slice(0, 7);
  var mine = (FT.data().transactions || []).filter(function (t) { return t.type === 'ingreso' && t.incomeKind !== 'extra' && String(t.date || '').startsWith(mesKey); })
    .reduce(function (a, t) { return a + (parseFloat(t.amount) || 0); }, 0);
  var pp = FT.partnerProfile();
  var partner = pp && pp.data && pp.data.transactions
    ? (pp.data.transactions || []).filter(function (t) { return t.type === 'ingreso' && t.incomeKind !== 'extra' && String(t.date || '').startsWith(mesKey); }).reduce(function (a, t) { return a + (parseFloat(t.amount) || 0); }, 0)
    : 0;
  return mine + partner;
}
function calcAvgAporte(hist) {
  if (!hist || !hist.length) return 0;
  var u = hist.slice(-6);
  return u.reduce(function (a, h) { return a + (h.monto || 0); }, 0) / u.length;
}
function calcProyeccion(actual, meta, fecha, avgAporte) {
  var falta = Math.max(0, (meta || 0) - (actual || 0)), hoy = new Date();
  if (fecha) {
    var fin = new Date(fecha + 'T00:00:00');
    var mesesRestantes = Math.max(0, (fin.getFullYear() - hoy.getFullYear()) * 12 + (fin.getMonth() - hoy.getMonth()));
    var necesitaPorMes = mesesRestantes > 0 ? falta / mesesRestantes : falta;
    var totalAlFin = (actual || 0) + (avgAporte * mesesRestantes);
    return { tipo: 'fecha', mesesRestantes: mesesRestantes, necesitaPorMes: necesitaPorMes, totalAlFin: totalAlFin, falta: falta };
  } else if (meta > 0 && avgAporte > 0) {
    return { tipo: 'meta', mesesParaMeta: Math.ceil(falta / avgAporte), porMes: avgAporte, porAnio: avgAporte * 12, falta: falta };
  } else if (avgAporte > 0) {
    return { tipo: 'libre', porMes: avgAporte, porAnio: avgAporte * 12 };
  }
  return null;
}

/* ── RENDER RAÍZ ── */
function render() {
  var hogar = FT.hogar();
  if (!hogar.connected && !hogar.pendingInvite) { renderNotConnected(); return; }
  if (hogar.pendingInvite) { renderPending(hogar); return; }
  if (!hogar.mode) { renderModeSelector(); return; }
  renderDashboard(hogar);
}

/* ── SIN CONECTAR ── */
function renderNotConnected() {
  var L = es();
  document.getElementById('root').innerHTML =
    '<div style="text-align:center;padding:50px 16px 0">' +
      '<div style="font-size:52px;margin-bottom:16px">👫</div>' +
      '<div style="font-size:19px;font-weight:800;margin-bottom:8px">' + (L ? 'Lleva el control en pareja' : 'Manage finances together') + '</div>' +
      '<div style="font-size:13px;color:var(--text3);margin-bottom:26px;line-height:1.5">' + (L ? 'Combinen sus ingresos, vean sus gastos del hogar y sepan cuánto le queda a cada quien cada mes.' : 'Combine your income, see household expenses and know how much each person has left each month.') + '</div>' +
      '<button class="ft-btn ft-btn-primary tap" style="margin-bottom:10px" onclick="startInvite()">+ ' + (L ? 'Invitar a mi hogar' : 'Invite to my home') + '</button>' +
      '<button class="ft-btn ft-btn-ghost tap" onclick="showAcceptCode()">' + (L ? 'Ya tengo un código' : 'I have a code') + '</button>' +
    '</div>';
}
function startInvite() {
  var code = 'FT-' + Math.random().toString(36).substring(2, 6).toUpperCase();
  FT.saveHogar({ connected: false, pendingInvite: true, inviteCode: code, myEmail: FT.user().email, myName: FT.userName() });
  FT.createInvite(FT.user().email, FT.userName(), code).catch(function () {});
  render();
  startPartnerPolling();
}
function showAcceptCode() {
  var L = es();
  FT.modal({
    title: L ? 'Ingresar código' : 'Enter code',
    html: '<p style="font-size:12px;color:var(--text3);margin:0 0 14px">' + (L ? 'Pide el código a quien te invitó' : 'Ask the person who invited you for their code') + '</p>' +
      '<div class="ft-field"><input id="codeInput" style="text-align:center;font-size:20px;font-weight:800;letter-spacing:3px" placeholder="FT-XXXX" oninput="this.value=this.value.toUpperCase()"></div>',
    saveLabel: L ? 'Unirme al hogar' : 'Join household',
    onSave: function (body) { return acceptCode(body.querySelector('#codeInput').value); }
  });
}
var _acceptingCode = false;
function acceptCode(raw) {
  var L = es(), code = (raw || '').trim().toUpperCase();
  if (!code) { FT.toast(L ? '⚠️ Ingresa el código' : '⚠️ Enter the code'); return true; }
  if (_acceptingCode) return true;
  _acceptingCode = true;
  FT.acceptInvite(code, FT.user().email, FT.userName()).then(function (data) {
    _acceptingCode = false;
    if (data.error) {
      var msgs = { code_not_found: L ? '❌ Código no encontrado. Pide uno nuevo.' : '❌ Code not found. Ask for a new one.', code_already_used: L ? '❌ Código ya usado' : '❌ Code already used' };
      FT.toast(msgs[data.error] || '❌ ' + data.error);
      return;
    }
    var hg = { connected: true, pendingInvite: false, inviteCode: code, myEmail: FT.user().email, myName: FT.userName(),
      partnerName: data.partnerName || (L ? 'Tu pareja' : 'Your partner'), partnerEmail: data.partnerEmail || '', connectedAt: new Date().toISOString() };
    FT.saveHogar(hg);
    FT.toast('🏠 ' + (L ? '¡Conectado! ' : 'Connected! ') + (data.partnerName || ''));
    FT.syncPartner();
    render();
  }).catch(function () { _acceptingCode = false; FT.toast(L ? '❌ Error de conexión — intenta de nuevo' : '❌ Connection error — try again'); });
  return false;
}

/* ── INVITACIÓN PENDIENTE ── */
function renderPending(hogar) {
  var L = es();
  document.getElementById('root').innerHTML =
    '<div class="ft-card">' +
      '<div style="font-size:15px;font-weight:800;margin-bottom:2px">' + (L ? 'Invitación enviada' : 'Invitation sent') + '</div>' +
      '<div style="font-size:12px;color:var(--text3);margin-bottom:14px">' + (L ? 'Comparte este código con tu pareja' : 'Share this code with your partner') + '</div>' +
      '<div style="background:var(--sunk);border:2px dashed var(--hair);border-radius:16px;padding:22px;text-align:center;margin-bottom:12px">' +
        '<div class="ft-num" style="font-size:28px;letter-spacing:3px;color:var(--g-main)">' + (hogar.inviteCode || '—') + '</div></div>' +
      '<div style="text-align:center;font-size:11px;color:var(--text3);margin-bottom:14px">⏳ ' + (L ? 'Esperando que tu pareja ingrese el código...' : 'Waiting for your partner to enter the code...') + '</div>' +
      '<div style="display:flex;gap:8px">' +
        '<button class="ft-btn ft-btn-primary tap" style="flex:1" onclick="copyInviteCode(\'' + (hogar.inviteCode || '') + '\')">📋 ' + (L ? 'Copiar código' : 'Copy code') + '</button>' +
        '<button class="ft-btn tap" style="flex:0 0 110px;background:var(--red-dim);color:var(--red)" onclick="cancelInvite()">' + (L ? 'Cancelar' : 'Cancel') + '</button>' +
      '</div></div>';
}
function copyInviteCode(code) { navigator.clipboard && navigator.clipboard.writeText(code).catch(function () {}); FT.toast(es() ? '📋 Código copiado' : '📋 Code copied'); }
function cancelInvite() { if (_pollTimer) { clearInterval(_pollTimer); _pollTimer = null; } FT.saveHogar({ connected: false, pendingInvite: false, manuallyLeft: false }); render(); }
function startPartnerPolling() {
  if (_pollTimer) clearInterval(_pollTimer);
  _pollTimer = setInterval(function () {
    var hogar = FT.hogar();
    if (!hogar.pendingInvite) { clearInterval(_pollTimer); _pollTimer = null; return; }
    FT.checkPartner(FT.user().email).then(function (data) {
      if (data && data.connected && data.partnerEmail) {
        clearInterval(_pollTimer); _pollTimer = null;
        var h = FT.hogar();
        h.connected = true; h.pendingInvite = false; h.partnerEmail = data.partnerEmail; h.partnerName = data.partnerName || (es() ? 'Tu pareja' : 'Your partner'); h.connectedAt = new Date().toISOString();
        FT.saveHogar(h);
        FT.toast('🏠 ' + (data.partnerName || (es() ? 'Tu pareja' : 'Your partner')) + ' ' + (es() ? 'se unió al hogar' : 'joined the household'));
        FT.syncPartner();
        render();
      }
    }).catch(function () {});
  }, 5000);
}

/* ── SELECTOR DE MODO ── */
function renderModeSelector() {
  var L = es(), pp = FT.partnerProfile();
  var myIncome = FT.user().income || 0, partnerIncome = pp ? (pp.income || 0) : 0, total = myIncome + partnerIncome;
  var myPct = total > 0 ? Math.round(myIncome / total * 100) : 50, partnerPct = 100 - myPct;
  var partnerName = FT.hogar().partnerName || (L ? 'Tu pareja' : 'Your partner');
  var recommended = myIncome !== partnerIncome ? 'proportional' : 'equal';
  function card(key, ico, title, sub, rows, pro, con) {
    return '<div class="mode-card ' + (recommended === key ? 'recommended' : '') + ' tap" onclick="setMode(\'' + key + '\')">' +
      '<div class="mc-head"><div class="mc-ico">' + ico + '</div><div><div class="mc-title">' + title + '</div><div class="mc-sub">' + sub + '</div></div></div>' +
      '<div class="mc-ex">' + rows.map(function (r) { return '<div class="r"><span>' + r[0] + '</span><span style="font-weight:800">' + r[1] + '</span></div>'; }).join('') + '</div>' +
      '<div style="font-size:11px;color:var(--g-main);font-weight:700">✅ ' + pro + '</div><div style="font-size:11px;color:var(--amber);font-weight:700">⚠️ ' + con + '</div></div>';
  }
  document.getElementById('root').innerHTML =
    '<div style="font-size:15px;font-weight:800;margin-bottom:2px">💡 ' + (L ? '¿Cómo quieren manejar sus finanzas?' : 'How do you want to manage your finances?') + '</div>' +
    '<div style="font-size:12px;color:var(--text3);margin-bottom:16px">' + (L ? 'Elige el modo que mejor se adapte a ustedes. Pueden cambiarlo en cualquier momento.' : 'Choose the mode that works best for you. You can change it anytime.') + '</div>' +
    card('equal', '⚖️', L ? '50 / 50 Estricto' : '50 / 50 Equal', L ? 'Cada quien pone exactamente la mitad' : 'Each person contributes exactly half',
      [[(FT.userName() || 'Tú') + (L ? ' aporta:' : ' contributes:'), FT.money(total * 0.5) + '/mes'], [partnerName + (L ? ' aporta:' : ' contributes:'), FT.money(total * 0.5) + '/mes']],
      L ? 'Simple y claro' : 'Simple and clear', L ? 'Ignora diferencia de ingresos' : 'Ignores income difference') +
    card('proportional', '📊', L ? 'Proporcional al ingreso' : 'Proportional to income', L ? 'Cada quien aporta según lo que gana' : 'Each contributes based on income',
      [[(FT.userName() || 'Tú') + ' (' + myPct + '%):', FT.money(myIncome) + '/mes'], [partnerName + ' (' + partnerPct + '%):', FT.money(partnerIncome) + '/mes']],
      L ? 'Más justo' : 'Fairer', L ? 'Más complejo de rastrear' : 'More complex to track') +
    card('common', '🏦', L ? 'Fondo común total' : 'Common fund', L ? 'Todo entra al hogar, se reparte lo que sobre' : 'All income goes to household, split what\'s left',
      [[L ? 'Ingreso total del hogar:' : 'Total household income:', FT.money(total)], [L ? 'Se reparte lo que sobre' : 'Split what\'s left', FT.money(total * 0.4 / 2) + (L ? ' c/u' : ' each')]],
      L ? 'Maximiza ahorro' : 'Maximizes savings', L ? 'Requiere más confianza' : 'Requires more trust');
}
function setMode(mode) {
  var h = FT.hogar(); h.mode = mode; h.modeSetAt = new Date().toISOString(); FT.saveHogar(h);
  FT.toast(es() ? '✅ Modo guardado' : '✅ Mode saved');
  activeTab = 'resumen';
  render();
}
function changeMode() { var h = FT.hogar(); delete h.mode; FT.saveHogar(h); render(); }

/* ── DASHBOARD ── */
function renderDashboard(hogar) {
  var L = es(), calc = calcHogar(), partnerName = hogar.partnerName || (L ? 'Tu pareja' : 'Your partner');
  var modeLabels = { equal: (L ? '⚖️ 50/50 Estricto' : '⚖️ 50/50 Equal'), proportional: (L ? '📊 Proporcional' : '📊 Proportional'), common: (L ? '🏦 Fondo común' : '🏦 Common fund') };

  var myChecking = FT.checking().filter(function (c) { return c.hogar; });
  var pCheckingRaw = FT.get(FT.K.partnerChecking, []); var partnerChecking = (Array.isArray(pCheckingRaw) ? pCheckingRaw : (pCheckingRaw ? [pCheckingRaw] : [])).filter(function (c) { return c.hogar; });
  var myCheckAmt = myChecking.reduce(function (a, c) { return a + (parseFloat(c.amount) || 0); }, 0);
  var partnerCheckAmt = partnerChecking.reduce(function (a, c) { return a + (parseFloat(c.amount) || 0); }, 0);
  var checkTotal = myCheckAmt + partnerCheckAmt;

  var hogarInv = FT.investments('hogar');
  var invTotal = hogarInv.reduce(function (a, i) { return a + (parseFloat(i.amount) || 0); }, 0);
  var fondos = FT.hogarFondos();
  var metasTotal = (fondos.metas || []).reduce(function (a, m) { return a + (parseFloat(m.actual) || 0); }, 0);
  var patrimonioHogar = invTotal + checkTotal + metasTotal;

  var totalIncomeReceived = incomeReceivedThisMonth();
  var incomeReceivedPct = calc.total > 0 ? Math.min(100, Math.round(totalIncomeReceived / calc.total * 100)) : 0;
  var botesReal = Math.max(0, totalIncomeReceived - calc.sharedTotal);

  var servicios = FT.servicios().filter(function (s) { return !s.paused; });
  var servTotal = servicios.reduce(function (a, s) { return a + (parseFloat(s.amount) || 0); }, 0);
  var myDebtsAll = FT.debts();
  var sharedDebtsN = myDebtsAll.filter(function (d) { return d.owner === 'both'; }).length;

  var h =
    '<div class="hg-hero">' +
      '<div class="lbl">' + (L ? 'Ingreso combinado del hogar' : 'Combined household income') + '</div>' +
      '<div class="amt">' + FT.money(calc.total) + '<span style="font-size:14px;color:var(--text3);font-weight:700">/mes</span></div>' +
      '<div class="members">' +
        '<div class="mem"><div class="n">' + (FT.userName() || (L ? 'Tú' : 'You')) + '</div><div class="a">' + FT.money(calc.myIncome) + '</div><div class="p">' + calc.myPct + '% ' + (L ? 'del total' : 'of total') + '</div></div>' +
        '<div class="mem"><div class="n">' + partnerName + '</div><div class="a">' + FT.money(calc.partnerIncome) + '</div><div class="p">' + calc.partnerPct + '% ' + (L ? 'del total' : 'of total') + '</div></div>' +
      '</div>' +
      '<div class="box"><div class="r"><span>💵 ' + (L ? 'Recibido este mes' : 'Received this month') + '</span><span>' + FT.money(totalIncomeReceived) + ' / ' + FT.money(calc.total) + '</span></div>' +
      '<div class="ft-track" style="height:6px"><div class="ft-fill" data-pct="' + incomeReceivedPct + '" style="width:0;background:var(--g-main)"></div></div>' +
      '<div style="font-size:10px;color:var(--text3);margin-top:6px">' + (L ? 'Bote real en cuenta (recibido − gastado hogar)' : 'Real balance (received − household spent)') + ': <b style="color:var(--text2)">' + FT.money(botesReal) + '</b></div></div>' +
      (checkTotal > 0 ? '<div class="box" style="margin-top:10px"><div class="r" style="margin-bottom:0"><span>🏦 ' + (L ? 'Cuentas de cheques conjuntas' : 'Joint checking accounts') + '</span><span style="font-weight:800;color:var(--ink)">' + FT.money(checkTotal) + '</span></div></div>' : '') +
    '</div>' +

    (patrimonioHogar > 0 ? '<div class="ft-card">' +
      '<div style="font-size:14px;font-weight:800">💎 ' + (L ? 'Patrimonio del hogar' : 'Household net worth') + '</div>' +
      '<div style="font-size:11px;color:var(--text3);margin-bottom:10px">' + (L ? 'Solo lo compartido — tu ahorro y emergencia personal no se incluyen aquí' : 'Shared only — your personal savings and emergency fund aren\'t included here') + '</div>' +
      '<div class="ft-num" style="font-size:26px;margin-bottom:10px">' + FT.money(patrimonioHogar) + '</div>' +
      '<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px">' +
        '<div style="background:var(--sunk);border-radius:10px;padding:9px;text-align:center"><div style="font-size:9px;color:var(--text3);font-weight:700">🏦 ' + (L ? 'Cuentas' : 'Accounts') + '</div><div style="font-size:12.5px;font-weight:800;margin-top:2px">' + FT.money(checkTotal) + '</div></div>' +
        '<div style="background:var(--sunk);border-radius:10px;padding:9px;text-align:center"><div style="font-size:9px;color:var(--text3);font-weight:700">📈 ' + (L ? 'Inversión' : 'Investing') + '</div><div style="font-size:12.5px;font-weight:800;margin-top:2px">' + FT.money(invTotal) + '</div></div>' +
        '<div style="background:var(--sunk);border-radius:10px;padding:9px;text-align:center"><div style="font-size:9px;color:var(--text3);font-weight:700">🎯 ' + (L ? 'Metas' : 'Goals') + '</div><div style="font-size:12.5px;font-weight:800;margin-top:2px">' + FT.money(metasTotal) + '</div></div>' +

function progBar(actual, meta) {
  if (!meta || meta <= 0) return '';

  return '<div class="ft-track" style="margin-top:8px"><div class="ft-fill" data-pct="' + pct.toFixed(1) + '" style="width:0;background:' + color + '"></div></div>' +
    '<div style="display:flex;justify-content:space-between;font-size:10px;color:var(--text3);margin-top:4px"><span>' + pct.toFixed(0) + '%</span><span>' + (es() ? 'Meta: ' : 'Goal: ') + FT.money(meta) + '</span></div>';
}
function proyHtml(avg, actual, meta, fecha) {
  var L = es(), p = calcProyeccion(actual, meta, fecha, avg);

    txt = (L ? 'Necesitas ' : 'You need ') + FT.money(p.necesitaPorMes) + (L ? '/mes para llegar al ' : '/mo to reach by ') + fecha;
    if (p.totalAlFin < (meta || 0)) txt += (L ? ' · Faltarían ' : ' · Would be short ') + FT.money((meta || 0) - p.totalAlFin);
  } else if (p.tipo === 'meta') { txt = L ? 'Con este ritmo, meta en ~' + p.mesesParaMeta + ' meses' : 'At this rate, goal in ~' + p.mesesParaMeta + ' months'; }
  else { txt = (L ? 'Ahorrando ' + FT.money(p.porMes) + '/mes · ' + FT.money(p.porAnio) + '/año' : 'Saving ' + FT.money(p.porMes) + '/mo · ' + FT.money(p.porAnio) + '/yr'); }
  return '<div style="background:var(--g-light);border-radius:10px;padding:10px;margin-top:8px;font-size:11px;color:var(--g-dark);font-weight:600">📊 ' + txt + '</div>';

        '<div style="display:flex;gap:6px;flex-shrink:0">' +
        '<button class="tap" style="background:var(--sunk);border:1.5px solid var(--hair);border-radius:10px;padding:6px 9px;font-size:12px;cursor:pointer;font-family:inherit" onclick="configMeta(' + idx + ')">⚙️</button>' +

function abrirAporteModal(tipo, idx, montoSugerido) {
  var L = es(), fondos = FT.hogarFondos();
  var titulo = tipo === 'emerg' ? (L ? 'Depositar al fondo de emergencia' : 'Deposit to emergency fund') : (fondos.metas[idx] ? (L ? 'Depositar a ' : 'Deposit to ') + fondos.metas[idx].nombre : 'Depositar');
  var curMetaId = tipo === 'meta' && fondos.metas[idx] ? fondos.metas[idx].id : null;
  var activos = FT.recurList(function (r) {
    if (!(r.kind === 'meta' && r.metaTipo === tipo)) return false;
    if (tipo === 'emerg') return true;
    return r.metaId != null ? r.metaId === curMetaId : r.metaIdx === idx; // fallback para recurrentes viejos sin metaId
  });
  var origen = 'nuevo'; // 'nuevo' = sale del presupuesto · 'tenia' = ya lo tenía ahorrado

  var warnHtml = activos.length
    ? '<div style="background:#FFF4E5;border:1.5px solid #E8A33D;border-radius:10px;padding:10px 12px;margin-bottom:12px;font-size:12px;color:#8A5A00"><b>⚠️ ' + activos.length + ' ' + (L ? 'aporte(s) recurrente(s) activo(s)' : 'active recurring deposit(s)') + '</b><br>' +
      activos.map(function (r) { return FT.money(r.amount) + ' · ' + (es() ? 'próximo ' : 'next ') + FT.date(r.nextDate); }).join('<br>') + '</div>'
    : '';

  var body = warnHtml +
    '<div class="ft-field"><label>' + (L ? 'Monto' : 'Amount') + ' ($)</label><input id="apMonto" type="number" placeholder="0.00" value="' + (montoSugerido || '') + '"></div>' +
    '<div class="ft-field"><label>' + (L ? 'Tipo de depósito' : 'Deposit type') + '</label>' +
      '<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px" id="apTipo">' +
        '<button type="button" data-v="nuevo" class="tap" style="padding:10px;border-radius:10px;border:2px solid var(--g-main);background:var(--g-light);color:var(--g-dark);font-family:inherit;font-size:11.5px;font-weight:800">' + (L ? 'Nuevo depósito' : 'New deposit') + '<br><span style="font-weight:600;font-size:9.5px;opacity:.8">' + (L ? 'se descuenta del presupuesto' : 'deducted from budget') + '</span></button>' +
        '<button type="button" data-v="tenia" class="tap" style="padding:10px;border-radius:10px;border:2px solid var(--hair);background:var(--sunk);color:var(--text2);font-family:inherit;font-size:11.5px;font-weight:800">' + (L ? 'Ya lo tenía ahorrado' : 'Already had it saved') + '<br><span style="font-weight:600;font-size:9.5px;opacity:.8">' + (L ? 'no afecta el mes' : "doesn't affect the month") + '</span></button>' +
      '</div></div>' +
    '<div class="ft-field"><label>' + (L ? 'Fecha' : 'Date') + '</label><input id="apFecha" type="date" value="' + FT.todayISO() + '"></div>' +
    '<div style="background:var(--sunk);border-radius:12px;padding:12px;margin-bottom:6px">' +
      '<label style="display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:700;cursor:pointer"><input type="checkbox" id="apRec" style="width:16px;height:16px">🔄 ' + (L ? 'Hacer este aporte recurrente' : 'Make this deposit recurring') + '</label>' +
      '<div id="apRecFreqWrap" style="display:none;margin-top:10px"><select id="apRecFreq"><option value="weekly">' + (L ? 'Cada semana' : 'Every week') + '</option><option value="biweekly">' + (L ? 'Cada quincena' : 'Every two weeks') + '</option><option value="monthly" selected>' + (L ? 'Cada mes' : 'Every month') + '</option></select>' +
      '<div style="font-size:10.5px;color:var(--text3);margin-top:6px">' + (L ? 'Se aplicará solo, sin que tengas que volver a entrar.' : 'Applies automatically, no need to come back and confirm.') + '</div></div>' +
    '</div>';

  var saving = false;
  FT.modal({
    title: titulo, html: body, saveLabel: L ? 'Guardar' : 'Save',
    onOpen: function (b) {
      var wrap = b.querySelector('#apTipo');
      wrap.querySelectorAll('button').forEach(function (btn) {
        btn.onclick = function () {
          origen = btn.getAttribute('data-v');
          wrap.querySelectorAll('button').forEach(function (x) {
            var on = x === btn;
            x.style.borderColor = on ? 'var(--g-main)' : 'var(--hair)'; x.style.background = on ? 'var(--g-light)' : 'var(--sunk)'; x.style.color = on ? 'var(--g-dark)' : 'var(--text2)';
          });
        };
      });
      b.querySelector('#apRec').onchange = function () { b.querySelector('#apRecFreqWrap').style.display = this.checked ? 'block' : 'none'; };
    },
    onSave: function (b) {
      if (saving) return true;
      var monto = parseFloat(b.querySelector('#apMonto').value) || 0;
      var fecha = b.querySelector('#apFecha').value;
      if (!monto || monto <= 0) { FT.toast(L ? 'Ingresa un monto válido' : 'Enter a valid amount'); return true; }
      if (!fecha) { FT.toast(L ? 'Selecciona una fecha' : 'Select a date'); return true; }
      var wantsRec = b.querySelector('#apRec').checked;
      function proceed() {
        saving = true;
        var f = FT.hogarFondos();
        var entry = { id: 'd_' + Date.now(), monto: monto, fecha: fecha, desdePres: origen === 'nuevo' };
        if (tipo === 'emerg') { f.emerg.hist = f.emerg.hist || []; f.emerg.hist.push(entry); f.emerg.actual = f.emerg.hist.reduce(function (a, h) { return a + (h.monto || 0); }, 0); if (origen === 'nuevo') registrarEnPresupuesto(monto, L ? 'Fondo emergencia hogar' : 'Household emergency fund'); }
        else { var meta = f.metas[idx]; if (meta) { meta.hist = meta.hist || []; meta.hist.push(entry); meta.actual = meta.hist.reduce(function (a, h) { return a + (h.monto || 0); }, 0); if (origen === 'nuevo') registrarEnPresupuesto(monto, meta.nombre || 'Meta hogar'); } }
        FT.saveHogarFondos(f);

        if (wantsRec) {
          var freq = b.querySelector('#apRecFreq').value;
          var descRec = tipo === 'emerg' ? (L ? 'Fondo emergencia hogar' : 'Household emergency fund') : ((f.metas[idx] && f.metas[idx].nombre) || 'Meta hogar');
          var nextDate = FT._advanceRecDate(freq, fecha);
          var recurring = FT.recurring();
          var metaIdRec = tipo === 'meta' && f.metas[idx] ? f.metas[idx].id : null;
          recurring.push({ id: 'rec_' + Date.now(), kind: 'meta', metaTipo: tipo, metaId: metaIdRec, metaIdx: idx, desc: descRec, amount: monto, freq: freq, hogar: true, desdePres: origen === 'nuevo', nextDate: nextDate, active: true, createdBy: FT.userName() });
          FT.set(FT.K.recurring, recurring);
        }
        FT.toast(L ? 'Aporte guardado' : 'Deposit saved');
        FT.closeTop();
        switchTab(activeTab);
      }
      if (activos.length) {
        var msg = wantsRec
          ? (L ? '⚠️ Ya tienes un aporte recurrente activo. ¿Crear otro de todos modos? Esto duplicaría los depósitos automáticos.' : '⚠️ You already have an active recurring deposit. Create another anyway? This would duplicate the automatic deposits.')
          : (L ? '⚠️ Ya tienes un aporte recurrente activo. ¿Seguro que quieres depositar manualmente también? Si el recurrente ya cubre este depósito, se duplicaría.' : '⚠️ You already have an active recurring deposit. Deposit manually too? If the recurring one already covers it, it will be duplicated.');
        FT.confirm(msg).then(function (ok) { if (ok) proceed(); });
        return true;
      }
      proceed();
      return true;
    }
  });
}
function registrarEnPresupuesto(monto, desc) {
  var d = FT.data();
  d.transactions.push({ id: Date.now(), type: 'ahorro', desc: desc, amount: monto, date: FT.todayISO(), cat: '🏠 Hogar', hogar: true, createdBy: FT.userName() });
  FT.saveData(d);
}

/* ── TAB DEPÓSITOS ── */
function tabDepositos() {

  var mesKey = FT.todayISO().slice(0, 7);
  var myTxs = (FT.data().transactions || []).filter(function (t) { return t.type === 'ingreso' && t.incomeKind !== 'extra' && String(t.date || '').startsWith(mesKey); })
    .map(function (t) { return { id: t.id, amount: parseFloat(t.amount) || 0, date: t.date, mine: true }; });

    ? (pp.data.transactions || []).filter(function (t) { return t.type === 'ingreso' && t.incomeKind !== 'extra' && String(t.date || '').startsWith(mesKey); })
        .map(function (t) { return { id: t.id, amount: parseFloat(t.amount) || 0, date: t.date, mine: false }; })
    : [];
  var all = myTxs.concat(pTxs).sort(function (a, b) { return String(b.date || '').localeCompare(String(a.date || '')); });
  var shown = all.slice(0, _depositosLimit);
  var partnerName = hogar.partnerName || (L ? 'Tu pareja' : 'Your partner');

  var depCard = '<div class="ft-card">' +
    '<div style="font-size:14px;font-weight:800">💰 ' + (L ? 'Depósitos de este mes' : 'Deposits this month') + '</div>' +
    '<div style="font-size:11px;color:var(--text3);margin-bottom:10px">' + hogarPctChk + '% ' + (L ? 'al presupuesto del hogar · ' : 'to household budget · ') + (100 - hogarPctChk) + '% ' + (L ? 'a cuenta personal' : 'to personal account') + '</div>' +

        '<div class="ic ft-tx-ico ' + (t.mine ? 'mint' : 'sky') + '">💵</div>' +
        '<div style="flex:1;min-width:0"><div style="font-size:12px;font-weight:700">' + (t.mine ? (FT.userName() || 'Tú') : partnerName) + ' · ' + FT.money(t.amount) + '</div>' +

        (t.mine ? '<div class="tap" style="cursor:pointer;color:var(--text3)" onclick="deleteMyIncomeTx(\'' + t.id + '\')">🗑</div>' : '') +
      '</div>';
    }).join('') + (all.length > _depositosLimit ? '<button class="ft-btn ft-btn-ghost tap" onclick="_depositosLimit+=10;switchTab(\'depositos\')">' + (L ? 'Ver más (' + (all.length - _depositosLimit) + ' más)' : 'See more (' + (all.length - _depositosLimit) + ' more)') + '</button>' : '')
      : '<div class="ft-empty">' + (L ? 'Sin depósitos registrados este mes' : 'No deposits recorded this month') + '</div>') +

  return depCard;
}
function deleteMyIncomeTx(id) {
  var L = es();
  FT.confirm(L ? '¿Eliminar este depósito?' : 'Delete this deposit?').then(function (ok) {
    if (!ok) return;
    var d = FT.data(); d.transactions = (d.transactions || []).filter(function (t) { return String(t.id) !== String(id); }); FT.saveData(d);
    var cheques = FT.cheques().filter(function (c) { return String(c.id) !== String(id); }); FT.set(FT.K.cheques, cheques);

function moverSobranteAMetas(monto) {
  var L = es(), hoy = FT.todayISO(), mesActual = hoy.slice(0, 7);
  if (FT.getRaw('ft_hogar_surplus_' + mesActual)) { FT.toast(L ? 'Ya distribuiste el sobrante de este mes' : "You already handled this month's surplus"); return; }
  FT.confirm(L ? '¿Mover ' + FT.money(monto) + ' a tu primera meta activa?' : 'Move ' + FT.money(monto) + ' to your first active goal?').then(function (ok) {
    if (!ok) return;
    var f = FT.hogarFondos();
    if (!f.metas.length) { FT.toast(L ? '⚠️ No tienes metas creadas todavía — créala primero en la pestaña Metas' : "⚠️ You don't have any goals yet — create one first in the Goals tab"); return; }
    var meta = f.metas.find(function (m) { return (m.actual || 0) < (m.meta || Infinity); }) || f.metas[0];
    meta.hist = meta.hist || [];
    meta.hist.push({ id: 'sob_' + Date.now(), monto: monto, fecha: hoy, nota: L ? 'Sobrante del hogar' : 'Household surplus' });
    meta.actual = meta.hist.reduce(function (a, h) { return a + (h.monto || 0); }, 0);
    FT.saveHogarFondos(f);
    FT.setRaw('ft_hogar_surplus_' + mesActual, JSON.stringify({ tipo: 'metas', monto: monto, fecha: hoy }));
    FT.toast('✅ ' + FT.money(monto) + (L ? ' movido a "' + meta.nombre + '"' : ' moved to "' + meta.nombre + '"'));
    switchTab('distribucion');
  });
}
function repartirSobranteIgual(monto) {
  var L = es(), hoy = FT.todayISO(), mesActual = hoy.slice(0, 7), miParte = monto / 2;
  if (FT.getRaw('ft_hogar_surplus_' + mesActual)) { FT.toast(L ? 'Ya distribuiste el sobrante de este mes' : "You already handled this month's surplus"); return; }
  FT.confirm(L ? '¿Depositar ' + FT.money(miParte) + ' a tu Ahorro libre? (tu mitad del sobrante)' : 'Deposit ' + FT.money(miParte) + ' to your Free Savings? (your half of the surplus)').then(function (ok) {

    FT.toast('✅ ' + FT.money(miParte) + (L ? ' a tu Ahorro libre. Avísale a tu pareja que registre su mitad también.' : " to your Free Savings. Let your partner know to register their half too."));
    switchTab('distribucion');
  });
}

    if (hogar.partnerEmail) FT.del('profile_' + hogar.partnerEmail.replace(/[^a-z0-9]/gi, '_'));
    FT.del(FT.K.profileB);
    FT.saveHogar({ connected: false, pendingInvite: false, manuallyLeft: true });
    render();
    FT.toast(L ? 'Saliste del hogar' : 'You left the household');
  });
}

/* ── SUBIR MI PERFIL A GAS (para que mi pareja lo lea) ── */
function pushMyProfileToGAS() {
  try {
    var u = FT.user(), hogar = FT.hogar();
    if (!hogar.connected || !u.email || hogar.manuallyLeft) return;
    var data = FT.data();
    var myDebts = FT.debts();
    var sharedDebts = myDebts.filter(function (d) { return d.owner === 'both' || d.type === 'hipoteca' || d.type === 'hogar'; })
      .map(function (d) { return { id: d.id, name: d.name, balance: d.balance, original: d.original, type: d.type, payment: d.payment, payDay: d.payDay, owner: d.owner, abonos: (d.abonos || []).slice(-30), updatedAt: d.updatedAt }; });
    var sharedDebtIds = {}; sharedDebts.forEach(function (d) { sharedDebtIds[String(d.id)] = true; });
    var sharedRecurring = FT.recurring().filter(function (r) { return r.kind === 'debt' && sharedDebtIds[String(r.debtId)]; });
    var hogarInv = FT.investments('hogar');
    var thisMonth = FT.todayISO().slice(0, 7);
    var personalSpentThisMonth = (data.transactions || []).filter(function (t) { return String(t.date || '').startsWith(thisMonth) && t.hogar !== true && (t.type === 'gasto' || t.type === 'suscripcion' || t.type === 'hipoteca'); })
      .reduce(function (a, t) { return a + (parseFloat(t.amount) || 0); }, 0);
    var limited = {
      transactions: (data.transactions || []).filter(function (t) { return String(t.date || '').startsWith(thisMonth) && (t.hogar === true || t.type === 'ingreso'); }),
      emergency: data.emergency || 0,
      subscriptions: (data.subscriptions || []).slice(-10),
      sharedDebts: sharedDebts.slice(-20),
      hogarInv: hogarInv.slice(-20),
      fondos: FT.hogarFondos(),
      personalSpentThisMonth: personalSpentThisMonth,
      sharedRecurring: sharedRecurring,
      servicios: FT.servicios().slice(-20),
      checking: FT.checking()
    };
    var params = new URLSearchParams({ action: 'saveProfile', email: u.email, name: u.name || '', income: u.income || 0, needs: u.needs || 0, wants: u.wants || 0, savings: u.savings || 0, dataJson: JSON.stringify(limited) });
    fetch(FT.GAS_URL + '?' + params.toString()).catch(function () {});
  } catch (e) {}
}

/* ── INIT ── */
document.addEventListener('ft:ready', function () {
  var t = function () { return FT.lang === 'es' ? '🏠 Hogar' : '🏠 Household'; };
  var sh = FT.shell({ active: 'hogar', title: t(), onPlus: function () { var hogar = FT.hogar(); if (hogar.connected && hogar.mode) abrirAporteModal('emerg'); else go('dashboard.html'); } });
  document.addEventListener('ft:langchange', function () { sh.setTitle(t()); render(); });
  document.addEventListener('ft:datachanged', render);

  render();

  var hogar = FT.hogar();
  if (hogar.manuallyLeft) return;
  if (hogar.pendingInvite) startPartnerPolling();
  if (hogar.connected) pushMyProfileToGAS();

  if (FT.user().email) {
    FT.checkPartner(FT.user().email).then(function (gasData) {
      if (!gasData || !gasData.connected) return;
      var h2 = FT.hogar();
      if (h2.manuallyLeft) return;
      if (gasData.partnerEmail && gasData.partnerEmail !== h2.partnerEmail) {
        h2.connected = true; h2.pendingInvite = false; h2.partnerEmail = gasData.partnerEmail;
        h2.partnerName = gasData.partnerName || h2.partnerName || (FT.lang === 'es' ? 'Tu pareja' : 'Your partner');
        FT.saveHogar(h2);
      }
      if (gasData.partnerEmail) FT.syncPartner();
    }).catch(function () {});
  }
});
</script>
