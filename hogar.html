<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>FinTrack Pro · Hogar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<script src="premium.js"></script>
<style>
/* Solo lo que balanceScreen/deudas.html no ya cubren en el DS compartido. */
.hg-hero{background:var(--white);border:1px solid var(--hair);border-radius:22px;padding:20px;margin-bottom:14px;border-top:3px solid var(--g-main);box-shadow:0 1px 3px rgba(20,20,30,.035);}
.hg-hero .lbl{font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:.4px;margin-bottom:4px;}
.hg-hero .amt{font-family:var(--round-font);font-weight:900;font-size:32px;letter-spacing:-1px;margin-bottom:14px;color:var(--ink);}
.hg-hero .members{display:flex;gap:10px;margin-bottom:12px;}
.hg-hero .mem{flex:1;background:var(--sunk);border-radius:14px;padding:12px;min-width:0;}
.hg-hero .mem .n{font-size:10px;color:var(--text3);margin-bottom:2px;}
.hg-hero .mem .a{font-size:16px;font-weight:800;}
.hg-hero .mem .p{font-size:10px;color:var(--text3);margin-top:2px;}
.hg-hero .box{background:var(--sunk);border-radius:12px;padding:12px;}
.hg-hero .box .r{display:flex;justify-content:space-between;font-size:11px;color:var(--text2);margin-bottom:6px;}
.hg-quick{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:6px;}
.hg-qi{display:flex;align-items:center;gap:10px;padding:12px;border-radius:16px;background:var(--white);border:1px solid var(--hair);cursor:pointer;}
.hg-more summary{cursor:pointer;font-size:12px;font-weight:700;color:var(--blue);margin-top:12px;list-style:none;}
.hg-more summary::-webkit-details-marker{display:none;}
.hg-more summary::after{content:' ▾';}
.hg-more[open] summary::after{content:' ▴';}
.hg-qi .t{font-size:12.5px;font-weight:800;}
.hg-qi .s{font-size:10px;color:var(--text3);}
.mode-card{border:2px solid var(--hair);border-radius:16px;padding:16px;cursor:pointer;margin-bottom:10px;position:relative;}
.mode-card.recommended::after{content:'⭐';position:absolute;top:14px;right:14px;font-size:13px;}
.mc-head{display:flex;align-items:center;gap:12px;margin-bottom:10px;}
.mc-ico{font-size:26px;}
.mc-title{font-size:14px;font-weight:800;}
.mc-sub{font-size:11px;color:var(--text3);}
.mc-ex{background:var(--sunk);border-radius:10px;padding:10px 12px;font-size:12px;margin-bottom:8px;}
.mc-ex .r{display:flex;justify-content:space-between;padding:2px 0;}
</style>
</head>
<body>
<div class="ft-app"><div class="ft-page" id="root"></div></div>
<script>
var activeTab = ''; // 19-oct-2026: la pantalla abre limpia; cada chip de "Más del hogar" abre su detalle
var _recentH = [], _patriH = {};
var _depositosLimit = 5, _gastosHogarLimit = 8;
var _pollTimer = null;

function es() { return FT.lang === 'es'; }
function go(url) { FT.go(url); }

/* ── CÁLCULOS ── */
function getSharedExpenses() {
  var d = FT.data(), thisMonth = FT.todayISO().slice(0, 7);
  // 15-oct-2026: 'ahorro' (aportes a metas/fondo de emergencia del hogar)
  // quitado de este filtro -- esto es "gastos del hogar" (lo que de verdad
  // se gastó), no aportes a fondos. Antes un aporte a una meta aparecía
  // como categoría "🏠 Hogar" en el desglose de gastos, inflando el total
  // y desalineando este número con el de Dashboard ("Gasto del hogar en
  // [mes]", que solo cuenta gasto/suscripcion/hipoteca -- ver totals() en
  // dashboard.html).
  return (d.transactions || []).filter(function (t) {
    return t.date && !FT.isPending(t) && String(t.date).startsWith(thisMonth) &&
      (t.type === 'gasto' || t.type === 'suscripcion' || t.type === 'hipoteca') && t.hogar === true;
  });
}
function getPersonalExpenses() {
  var d = FT.data(), now = new Date(), y = now.getFullYear(), m = now.getMonth();
  return (d.transactions || []).filter(function (t) {
    if (!t.date) return false;
    var p = String(t.date).split(/[-T]/);
    if (parseInt(p[0], 10) !== y || parseInt(p[1], 10) - 1 !== m) return false;
    if (t.hogar === true || FT.isPending(t)) return false;
    return t.type === 'gasto' || t.type === 'inversion' || (t.type === 'ahorro' && t.hogar !== true);
  });
}
function partnerSharedTxs() {
  var pp = FT.get('profile_' + (FT.hogar().partnerEmail || '').replace(/[^a-z0-9]/gi, '_'), null) || FT.get(FT.K.profileB, null);
  var now = new Date(), y = now.getFullYear(), m = now.getMonth();
  return pp && pp.data && pp.data.transactions
    ? (pp.data.transactions || []).filter(function (t) {
        if (!t.date || t.hogar !== true) return false;
        if (!(t.type === 'gasto' || t.type === 'suscripcion' || t.type === 'hipoteca')) return false; // mismo criterio que getSharedExpenses() -- sin 'ahorro'
        var p = String(t.date).split(/[-T]/);
        return parseInt(p[0], 10) === y && parseInt(p[1], 10) - 1 === m;
      })
    : [];
}
function calcHogar() {
  var pp = FT.partnerProfile();
  var myIncome = FT.user().income || 0, partnerIncome = pp ? (pp.income || 0) : 0;
  var total = myIncome + partnerIncome, mode = FT.hogar().mode;
  var myPct, partnerPct;
  if (mode === 'equal' || mode === 'common') { myPct = 50; partnerPct = 50; }
  else { myPct = total > 0 ? Math.round(myIncome / total * 100) : 50; partnerPct = 100 - myPct; }
  var shared = getSharedExpenses(), pShared = partnerSharedTxs();
  var sharedTotal = shared.reduce(function (a, t) { return a + (t.amount || 0); }, 0) + pShared.reduce(function (a, t) { return a + (t.amount || 0); }, 0);
  var mySharedPart = sharedTotal * myPct / 100, partnerSharedPart = sharedTotal * partnerPct / 100;
  // fondoAportado = dinero REAL que ya entró a la cuenta conjunta este mes
  // (reparto de cheque, campo hogarAmt) -- fuente única para "cuánto está
  // sobrando del hogar", compartida con fondosCards() más abajo, para que
  // los dos lean el mismo número.
  var _mesKey = FT.todayISO().slice(0, 7), chequesDelMes = [];
  try { chequesDelMes = (FT.cheques() || []).filter(function (c) { return c.mes === _mesKey; }); } catch (e) {}
  var fondoAportado = chequesDelMes.reduce(function (a, c) { return a + (c.hogarAmt || 0); }, 0);
  // Aportes al hogar capturados a mano (ingreso > Aporte al hogar) también son tu aporte real.
  fondoAportado += (FT.txs() || []).filter(function (t) { return t.aporteManual === true && String(t.date || '').slice(0, 7) === _mesKey; }).reduce(function (a, t) { return a + (parseFloat(t.amount) || 0); }, 0);
  return { myIncome: myIncome, partnerIncome: partnerIncome, total: total, myPct: myPct, partnerPct: partnerPct,
    shared: shared, pShared: pShared, sharedTotal: sharedTotal, mySharedPart: mySharedPart, partnerSharedPart: partnerSharedPart,
    fondoAportado: fondoAportado };
}
function incomeReceivedThisMonth() {
  var mesKey = FT.todayISO().slice(0, 7);
  var mine = (FT.data().transactions || []).filter(function (t) { return t.type === 'ingreso' && t.incomeKind === 'cheque' && String(t.date || '').startsWith(mesKey); })
    .reduce(function (a, t) { return a + (parseFloat(t.amount) || 0); }, 0);
  var pp = FT.partnerProfile();
  var partner = pp && pp.data && pp.data.transactions
    ? (pp.data.transactions || []).filter(function (t) { return t.type === 'ingreso' && t.incomeKind === 'cheque' && String(t.date || '').startsWith(mesKey); }).reduce(function (a, t) { return a + (parseFloat(t.amount) || 0); }, 0)
    : 0;
  return mine + partner;
}
function calcAvgAporte(hist) {
  if (!hist || !hist.length) return 0;
  var u = hist.slice(-6);
  return u.reduce(function (a, h) { return a + (h.monto || 0); }, 0) / u.length;
}
function calcProyeccion(actual, meta, fecha, avgAporte) {
  var falta = Math.max(0, (meta || 0) - (actual || 0)), hoy = new Date();
  if (fecha) {
    var fin = new Date(fecha + 'T00:00:00');
    var mesesRestantes = Math.max(0, (fin.getFullYear() - hoy.getFullYear()) * 12 + (fin.getMonth() - hoy.getMonth()));
    var necesitaPorMes = mesesRestantes > 0 ? falta / mesesRestantes : falta;
    var totalAlFin = (actual || 0) + (avgAporte * mesesRestantes);
    return { tipo: 'fecha', mesesRestantes: mesesRestantes, necesitaPorMes: necesitaPorMes, totalAlFin: totalAlFin, falta: falta };
  } else if (meta > 0 && avgAporte > 0) {
    return { tipo: 'meta', mesesParaMeta: Math.ceil(falta / avgAporte), porMes: avgAporte, porAnio: avgAporte * 12, falta: falta };
  } else if (avgAporte > 0) {
    return { tipo: 'libre', porMes: avgAporte, porAnio: avgAporte * 12 };
  }
  return null;
}

/* ── RENDER RAÍZ ── */
function render() {
  var hogar = FT.hogar();
  if (!hogar.connected && !hogar.pendingInvite) { renderNotConnected(); return; }
  if (hogar.pendingInvite) { renderPending(hogar); return; }
  if (!hogar.mode) { renderModeSelector(); return; }
  renderDashboard(hogar);
}

/* ── SIN CONECTAR ── */
function renderNotConnected() {
  var L = es();
  document.getElementById('root').innerHTML =
    '<div style="text-align:center;padding:50px 16px 0">' +
      '<div style="font-size:52px;margin-bottom:16px">👫</div>' +
      '<div style="font-size:19px;font-weight:800;margin-bottom:8px">' + (L ? 'Lleva el control en pareja' : 'Manage finances together') + '</div>' +
      '<div style="font-size:13px;color:var(--text3);margin-bottom:26px;line-height:1.5">' + (L ? 'Combinen sus ingresos, vean sus gastos del hogar y sepan cuánto le queda a cada quien cada mes.' : 'Combine your income, see household expenses and know how much each person has left each month.') + '</div>' +
      '<button class="ft-btn ft-btn-primary tap" style="margin-bottom:10px" onclick="startInvite()">+ ' + (L ? 'Invitar a mi hogar' : 'Invite to my home') + '</button>' +
      '<button class="ft-btn ft-btn-ghost tap" onclick="showAcceptCode()">' + (L ? 'Ya tengo un código' : 'I have a code') + '</button>' +
    '</div>';
}
function startInvite() {
  var code = 'FT-' + Math.random().toString(36).substring(2, 6).toUpperCase();
  FT.saveHogar({ connected: false, pendingInvite: true, inviteCode: code, myEmail: FT.user().email, myName: FT.userName() });
  FT.createInvite(FT.user().email, FT.userName(), code).catch(function () {});
  render();
  startPartnerPolling();
}
function showAcceptCode() {
  var L = es();
  FT.modal({
    title: L ? 'Ingresar código' : 'Enter code',
    html: '<p style="font-size:12px;color:var(--text3);margin:0 0 14px">' + (L ? 'Pide el código a quien te invitó' : 'Ask the person who invited you for their code') + '</p>' +
      '<div class="ft-field"><input id="codeInput" style="text-align:center;font-size:20px;font-weight:800;letter-spacing:3px" placeholder="FT-XXXX" value="' + (function () { try { var c = localStorage.getItem('ft_pending_code') || ''; return /^FT-[A-Z0-9]{4}$/.test(c) ? c : ''; } catch (e) { return ''; } })() + '" oninput="this.value=this.value.toUpperCase()"></div>',
    saveLabel: L ? 'Unirme al hogar' : 'Join household',
    onSave: function (body) { return acceptCode(body.querySelector('#codeInput').value); }
  });
}
var _acceptingCode = false;
function acceptCode(raw) {
  var L = es(), code = (raw || '').trim().toUpperCase();
  if (!code) { FT.toast(L ? '⚠️ Ingresa el código' : '⚠️ Enter the code'); return true; }
  if (_acceptingCode) return true;
  _acceptingCode = true;
  FT.acceptInvite(code, FT.user().email, FT.userName()).then(function (data) {
    _acceptingCode = false;
    if (data.error) {
      var msgs = { code_not_found: L ? '❌ Código no encontrado. Pide uno nuevo.' : '❌ Code not found. Ask for a new one.', code_already_used: L ? '❌ Código ya usado' : '❌ Code already used' };
      FT.toast(msgs[data.error] || '❌ ' + data.error);
      return;
    }
    var hg = { connected: true, pendingInvite: false, inviteCode: code, myEmail: FT.user().email, myName: FT.userName(),
      partnerName: data.partnerName || (L ? 'Tu pareja' : 'Your partner'), partnerEmail: data.partnerEmail || '', connectedAt: new Date().toISOString() };
    FT.saveHogar(hg); try { localStorage.removeItem('ft_pending_code'); } catch (e) {}
    FT.toast('🏠 ' + (L ? '¡Conectado! ' : 'Connected! ') + (data.partnerName || ''));
    FT.syncPartner();
    render();
  }).catch(function () { _acceptingCode = false; FT.toast(L ? '❌ Error de conexión — intenta de nuevo' : '❌ Connection error — try again'); });
  return false;
}

/* ── INVITACIÓN PENDIENTE ── */
function renderPending(hogar) {
  var L = es();
  document.getElementById('root').innerHTML =
    '<div class="ft-card">' +
      '<div style="font-size:15px;font-weight:800;margin-bottom:2px">' + (L ? 'Invitación enviada' : 'Invitation sent') + '</div>' +
      '<div style="font-size:12px;color:var(--text3);margin-bottom:14px">' + (L ? 'Comparte este código con tu pareja' : 'Share this code with your partner') + '</div>' +
      '<div style="background:var(--sunk);border:2px dashed var(--hair);border-radius:16px;padding:22px;text-align:center;margin-bottom:12px">' +
        '<div class="ft-num" style="font-size:28px;letter-spacing:3px;color:var(--g-main)">' + (hogar.inviteCode || '—') + '</div></div>' +
      '<div style="text-align:center;font-size:11px;color:var(--text3);margin-bottom:14px">⏳ ' + (L ? 'Esperando que tu pareja ingrese el código...' : 'Waiting for your partner to enter the code...') + '</div>' +
      '<div style="display:flex;gap:8px">' +
        '<button class="ft-btn ft-btn-primary tap" style="flex:1" onclick="copyInviteCode(\'' + (hogar.inviteCode || '') + '\')">📋 ' + (L ? 'Copiar código' : 'Copy code') + '</button>' +
        '<button class="ft-btn tap" style="flex:0 0 110px;background:var(--red-dim);color:var(--red)" onclick="cancelInvite()">' + (L ? 'Cancelar' : 'Cancel') + '</button>' +
      '</div></div>';
}
function copyInviteCode(code) { navigator.clipboard && navigator.clipboard.writeText(code).catch(function () {}); FT.toast(es() ? '📋 Código copiado' : '📋 Code copied'); }
function cancelInvite() { if (_pollTimer) { clearInterval(_pollTimer); _pollTimer = null; } FT.saveHogar({ connected: false, pendingInvite: false, manuallyLeft: false }); render(); }
function startPartnerPolling() {
  if (_pollTimer) clearInterval(_pollTimer);
  _pollTimer = setInterval(function () {
    var hogar = FT.hogar();
    if (!hogar.pendingInvite) { clearInterval(_pollTimer); _pollTimer = null; return; }
    FT.checkPartner(FT.user().email).then(function (data) {
      if (data && data.connected && data.partnerEmail) {
        clearInterval(_pollTimer); _pollTimer = null;
        var h = FT.hogar();
        h.connected = true; h.pendingInvite = false; h.partnerEmail = data.partnerEmail; h.partnerName = data.partnerName || (es() ? 'Tu pareja' : 'Your partner'); h.connectedAt = new Date().toISOString();
        FT.saveHogar(h);
        FT.toast('🏠 ' + (data.partnerName || (es() ? 'Tu pareja' : 'Your partner')) + ' ' + (es() ? 'se unió al hogar' : 'joined the household'));
        FT.syncPartner();
        render();
      }
    }).catch(function () {});
  }, 5000);
}

/* ── SELECTOR DE MODO ── */
function renderModeSelector() {
  var L = es(), pp = FT.partnerProfile();
  var myIncome = FT.user().income || 0, partnerIncome = pp ? (pp.income || 0) : 0, total = myIncome + partnerIncome;
  var myPct = total > 0 ? Math.round(myIncome / total * 100) : 50, partnerPct = 100 - myPct;
  var partnerName = _escHg(FT.hogar().partnerName || (L ? 'Tu pareja' : 'Your partner'));
  var recommended = myIncome !== partnerIncome ? 'proportional' : 'equal';
  function card(key, ico, title, sub, rows, pro, con) {
    return '<div class="mode-card ' + (recommended === key ? 'recommended' : '') + ' tap" onclick="setMode(\'' + key + '\')">' +
      '<div class="mc-head"><div class="mc-ico">' + ico + '</div><div><div class="mc-title">' + title + '</div><div class="mc-sub">' + sub + '</div></div></div>' +
      '<div class="mc-ex">' + rows.map(function (r) { return '<div class="r"><span>' + r[0] + '</span><span style="font-weight:800">' + r[1] + '</span></div>'; }).join('') + '</div>' +
      '<div style="font-size:11px;color:var(--g-main);font-weight:700">✅ ' + pro + '</div><div style="font-size:11px;color:var(--amber);font-weight:700">⚠️ ' + con + '</div></div>';
  }
  document.getElementById('root').innerHTML =
    '<div style="font-size:15px;font-weight:800;margin-bottom:2px">💡 ' + (L ? '¿Cómo quieren manejar sus finanzas?' : 'How do you want to manage your finances?') + '</div>' +
    '<div style="font-size:12px;color:var(--text3);margin-bottom:16px">' + (L ? 'Elige el modo que mejor se adapte a ustedes. Pueden cambiarlo en cualquier momento.' : 'Choose the mode that works best for you. You can change it anytime.') + '</div>' +
    card('equal', '⚖️', L ? '50 / 50 Estricto' : '50 / 50 Equal', L ? 'Cada quien pone exactamente la mitad' : 'Each person contributes exactly half',
      [[(FT.userName() || 'Tú') + (L ? ' aporta:' : ' contributes:'), FT.money(total * 0.5) + '/mes'], [partnerName + (L ? ' aporta:' : ' contributes:'), FT.money(total * 0.5) + '/mes']],
      L ? 'Simple y claro' : 'Simple and clear', L ? 'Ignora diferencia de ingresos' : 'Ignores income difference') +
    card('proportional', '📊', L ? 'Proporcional al ingreso' : 'Proportional to income', L ? 'Cada quien aporta según lo que gana' : 'Each contributes based on income',
      [[(FT.userName() || 'Tú') + ' (' + myPct + '%):', FT.money(myIncome) + '/mes'], [partnerName + ' (' + partnerPct + '%):', FT.money(partnerIncome) + '/mes']],
      L ? 'Más justo' : 'Fairer', L ? 'Más complejo de rastrear' : 'More complex to track') +
    card('common', '🏦', L ? 'Fondo común total' : 'Common fund', L ? 'Todo entra al hogar, se reparte lo que sobre' : 'All income goes to household, split what\'s left',
      [[L ? 'Ingreso total del hogar:' : 'Total household income:', FT.money(total)], [L ? 'Se reparte lo que sobre' : 'Split what\'s left', FT.money(total * 0.4 / 2) + (L ? ' c/u' : ' each')]],
      L ? 'Maximiza ahorro' : 'Maximizes savings', L ? 'Requiere más confianza' : 'Requires more trust');
}
function setMode(mode) {
  var h = FT.hogar(); h.mode = mode; h.modeSetAt = new Date().toISOString(); FT.saveHogar(h);
  FT.toast(es() ? '✅ Modo guardado' : '✅ Mode saved');
  activeTab = '';
  render();
}
function changeMode() { var h = FT.hogar(); delete h.mode; FT.saveHogar(h); render(); }

/* ── DASHBOARD ── */
function renderDashboard(hogar) {
  var L = es(), calc = calcHogar(), partnerName = _escHg(hogar.partnerName || (L ? 'Tu pareja' : 'Your partner'));
  var modeLabels = { equal: (L ? '⚖️ 50/50 Estricto' : '⚖️ 50/50 Equal'), proportional: (L ? '📊 Proporcional' : '📊 Proportional'), common: (L ? '🏦 Fondo común' : '🏦 Common fund') };

  var myChecking = FT.checking().filter(function (c) { return c.hogar; });
  var pCheckingRaw = FT.get(FT.K.partnerChecking, []); var partnerChecking = (Array.isArray(pCheckingRaw) ? pCheckingRaw : (pCheckingRaw ? [pCheckingRaw] : [])).filter(function (c) { return c.hogar; });
  var myCheckAmt = myChecking.reduce(function (a, c) { return a + (parseFloat(c.amount) || 0); }, 0);
  var partnerCheckAmt = partnerChecking.reduce(function (a, c) { return a + (parseFloat(c.amount) || 0); }, 0);
  var checkTotal = myCheckAmt + partnerCheckAmt;

  var hogarInv = FT.investments('hogar');
  var invTotal = hogarInv.reduce(function (a, i) { return a + (parseFloat(i.amount) || 0); }, 0);
  var fondos = FT.hogarFondos();
  var metasTotal = (fondos.metas || []).reduce(function (a, m) { return a + (parseFloat(m.actual) || 0); }, 0);
  // El fondo de EMERGENCIA del hogar faltaba aquí -- es dinero compartido
  // igual que las metas, así que sí cuenta para el patrimonio del hogar (lo
  // que se excluye a propósito es solo tu ahorro/emergencia PERSONAL, no
  // esto, que ya es de los dos).
  var emergTotal = (fondos.emerg && parseFloat(fondos.emerg.actual)) || 0;
  var patrimonioHogar = invTotal + checkTotal + metasTotal + emergTotal;

  // % real que se destina al hogar: "pago de casa" + "ahorro" -- Ramón lo
  // confirmó explícito (60% en su caso: 50+10). El hero de arriba antes
  // mostraba el INGRESO COMBINADO completo (100%) como si fuera "el
  // presupuesto" -- de ahí que siguiera pareciendo que dan el cheque
  // entero. Ahora el número grande es el presupuesto REAL (ese %), y cada
  // integrante muestra lo que aporta él con ese mismo %, no su sueldo
  // completo.
  var payPctHero = parseFloat(hogar.payPctHogar) || 50, savePctHero = parseFloat(hogar.saveHogarPct) || 10;
  var hogarPctTotal = payPctHero + savePctHero;
  var hogarBudgetHero = calc.total * hogarPctTotal / 100;
  var myBudgetHero = calc.myIncome * hogarPctTotal / 100, partnerBudgetHero = calc.partnerIncome * hogarPctTotal / 100;

  var totalIncomeReceived = incomeReceivedThisMonth();
  // El % se cancela entre recibido-al-hogar y presupuesto-del-hogar (los dos
  // se escalan por el mismo hogarPctTotal), así que es el mismo % que
  // recibido/ingreso combinado total -- se deja explícito así para que no
  // haga falta volver a derivarlo si algo de arriba cambia.
  var incomeReceivedPct = calc.total > 0 ? Math.min(100, Math.round(totalIncomeReceived / calc.total * 100)) : 0;
  // "Bote real" = lo que de verdad debería haber en la cuenta de cheques
  // compartida -- NO el cheque completo, solo el % de "pago de casa" (el
  // % de "ahorro" va aparte, a metas/fondos del hogar, no a esta cuenta --

function tabResumen(calc) {
  var L = es();

  // el texto "Otros" también en la columna del ícono).
  var byCat = {}; // label -> { amt, emoji }
  calc.shared.concat(calc.pShared).forEach(function (t) {
    var meta = FT.catMeta(t.cat || (L ? '📦 Otros' : '📦 Other'));
    var label = meta.label || (L ? 'Otros' : 'Other');
    if (!byCat[label]) byCat[label] = { amt: 0, emoji: meta.emoji || '📦' };

  });

function fondosCards(modo) {

        '<div style="display:flex;gap:6px;flex-shrink:0">' +
        '<button class="tap" style="background:var(--sunk);border:1.5px solid var(--hair);border-radius:10px;padding:6px 9px;font-size:12px;cursor:pointer;font-family:inherit" onclick="configMeta(' + idx + ')">⚙️</button>' +

/* ── MODAL DE APORTE ── */
function abrirAporteModal(tipo, idx, montoSugerido) {
  var L = es(), fondos = FT.hogarFondos();
  var titulo = tipo === 'emerg' ? (L ? 'Depositar al fondo de emergencia' : 'Deposit to emergency fund') : (fondos.metas[idx] ? (L ? 'Depositar a ' : 'Deposit to ') + fondos.metas[idx].nombre : 'Depositar');
  var curMetaId = tipo === 'meta' && fondos.metas[idx] ? fondos.metas[idx].id : null;
  var activos = FT.recurList(function (r) {
    if (!(r.kind === 'meta' && r.metaTipo === tipo)) return false;
    if (tipo === 'emerg') return true;
    return r.metaId != null ? r.metaId === curMetaId : r.metaIdx === idx; // fallback para recurrentes viejos sin metaId
  });
  var origen = 'nuevo'; // 'nuevo' = sale del presupuesto · 'tenia' = ya lo tenía ahorrado
  var hogarAccts = FT.checking().filter(function (a) { return a.hogar; });
  // 20-oct-2026 (aprobado vía simulación): la cuenta viene PRESELECCIONADA (la de la meta, o la primera conjunta), nunca en "Ninguna".
  var curMeta0 = tipo === 'emerg' ? fondos.emerg : fondos.metas[idx];
  var defAcct = (curMeta0 && curMeta0.accountId && hogarAccts.some(function (a) { return String(a.id) === String(curMeta0.accountId); }) ? curMeta0.accountId : (hogarAccts[0] ? hogarAccts[0].id : ''));

  var warnHtml = activos.length
    ? '<div style="background:#FFF4E5;border:1.5px solid #E8A33D;border-radius:10px;padding:10px 12px;margin-bottom:12px;font-size:12px;color:#8A5A00"><b>⚠️ ' + activos.length + ' ' + (L ? 'aporte(s) recurrente(s) activo(s)' : 'active recurring deposit(s)') + '</b><br>' +
      activos.map(function (r) { return FT.money(r.amount) + ' · ' + (es() ? 'próximo ' : 'next ') + FT.date(r.nextDate); }).join('<br>') + '</div>'
    : '';

  var body = warnHtml +
    '<div class="ft-field"><label>' + (L ? 'Monto' : 'Amount') + ' ($)</label><input id="apMonto" type="number" placeholder="0.00" value="' + (montoSugerido || '') + '"></div>' +
    '<div class="ft-field"><label>' + (L ? 'Tipo de depósito' : 'Deposit type') + '</label>' +
      '<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px" id="apTipo">' +
        '<button type="button" data-v="nuevo" class="tap" style="padding:10px;border-radius:10px;border:2px solid var(--g-main);background:var(--g-light);color:var(--g-dark);font-family:inherit;font-size:11.5px;font-weight:800">' + (L ? 'Sale de una cuenta' : 'Comes out of an account') + '<br><span style="font-weight:600;font-size:9.5px;opacity:.8">' + (L ? 'baja su disponible' : 'lowers its available balance') + '</span></button>' +
        '<button type="button" data-v="tenia" class="tap" style="padding:10px;border-radius:10px;border:2px solid var(--hair);background:var(--sunk);color:var(--text2);font-family:inherit;font-size:11.5px;font-weight:800">' + (L ? 'Ya estaba apartado' : 'Already set aside') + '<br><span style="font-weight:600;font-size:9.5px;opacity:.8">' + (L ? 'no mueve ninguna cuenta' : "doesn't move any account") + '</span></button>' +
      '</div></div>' +
    '<div class="ft-field"><label>' + (L ? 'Fecha' : 'Date') + '</label><input id="apFecha" type="date" value="' + FT.todayISO() + '"></div>' +
    '<div style="background:var(--sunk);border-radius:12px;padding:12px;margin-bottom:6px">' +
      '<label style="display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:700;cursor:pointer"><input type="checkbox" id="apRec" style="width:16px;height:16px">🔄 ' + (L ? 'Hacer este aporte recurrente' : 'Make this deposit recurring') + '</label>' +
      '<div id="apRecFreqWrap" style="display:none;margin-top:10px"><select id="apRecFreq"><option value="weekly">' + (L ? 'Cada semana' : 'Every week') + '</option><option value="biweekly">' + (L ? 'Cada quincena' : 'Every two weeks') + '</option><option value="monthly" selected>' + (L ? 'Cada mes' : 'Every month') + '</option></select>' +
      '<div style="font-size:10.5px;color:var(--text3);margin-top:6px">' + (L ? 'Se aplicará solo, sin que tengas que volver a entrar.' : 'Applies automatically, no need to come back and confirm.') + '</div></div>' +
    '</div>' +
    (hogarAccts.length ? '<div class="ft-field"><label>' + (L ? '¿De qué cuenta sale?' : 'Which account does it come from?') + '</label><select id="apAcct">' + hogarAccts.map(function (a) { return '<option value="' + a.id + '"' + (String(a.id) === String(defAcct) ? ' selected' : '') + '>' + a.name + ' · ' + (L ? 'Disponible ' : 'Available ') + FT.money(FT.accountFree(a), { cents: true }) + '</option>'; }).join('') + '<option value="">' + (L ? 'Ninguna (no mueve ninguna cuenta)' : 'None (does not move any account)') + '</option></select><div id="apPrev" style="font-size:12px;font-weight:700;color:var(--text2);margin-top:6px"></div><div class="dt-hint" style="margin:6px 0 0">' + (L ? 'El dinero pasa del disponible de esa cuenta a lo apartado para esta meta (queda dentro de la cuenta). Con "Ya estaba apartado" no se mueve nada.' : 'The money moves from that account\'s available balance to what is set aside for this goal (it stays inside the account). With "Already set aside" nothing moves.') + '</div></div>' : '');

  // Lo que la cuenta absorbe además del monto: si la meta/emergencia todavía no vive en esa cuenta, absorbe todo lo ya ahorrado.
  function apAbsorb(acctId) { return (curMeta0 && String(curMeta0.accountId) === String(acctId)) ? 0 : (parseFloat(curMeta0 && curMeta0.actual) || 0); }
  var saving = false;
  FT.modal({
    title: titulo, html: body, saveLabel: L ? 'Guardar' : 'Save',
    onOpen: function (b) {
      var wrap = b.querySelector('#apTipo');
      wrap.querySelectorAll('button').forEach(function (btn) {
        btn.onclick = function () {
          origen = btn.getAttribute('data-v');
          wrap.querySelectorAll('button').forEach(function (x) {
            var on = x === btn;
            x.style.borderColor = on ? 'var(--g-main)' : 'var(--hair)'; x.style.background = on ? 'var(--g-light)' : 'var(--sunk)'; x.style.color = on ? 'var(--g-dark)' : 'var(--text2)';
          });
        };
      });
      b.querySelector('#apRec').onchange = function () { b.querySelector('#apRecFreqWrap').style.display = this.checked ? 'block' : 'none'; };
      var apA = b.querySelector('#apAcct'), apM = b.querySelector('#apMonto'), apP = b.querySelector('#apPrev');
      // Si esta meta/emergencia ya vive en una cuenta, solo puede salir de ella (\"Ya estaba apartado" inflaría el total de la cuenta).
      if (curMeta0 && curMeta0.accountId && b.querySelector('[data-v=\"tenia\"]')) { b.querySelector('[data-v=\"tenia\"]').style.display = 'none'; b.querySelector('#apTipo').style.gridTemplateColumns = '1fr'; }
      function apUpd() { if (!apA || !apP) return; var a = FT.checking().find(function (x) { return String(x.id) === String(apA.value); }); if (!a || origen !== 'nuevo') { apP.textContent = ''; return; } var v = FT.numMoney(apM.value), libre = FT.accountFree(a), need = (v > 0 ? v : 0) + apAbsorb(a.id); apP.textContent = (L ? 'Disponible ' : 'Available ') + FT.money(libre, { cents: true }) + ' → ' + (L ? 'quedará ' : 'will be ') + FT.money(libre - need, { cents: true }) + (need > v && v > 0 ? (L ? ' (incluye ' + FT.money(need - v, { cents: true }) + ' que ya tenían ahorrados)' : ' (includes ' + FT.money(need - v, { cents: true }) + ' already saved)') : ''); apP.style.color = libre - need < -0.005 ? 'var(--red)' : 'var(--text2)'; }
      if (apA) { apA.onchange = apUpd; apM.addEventListener('input', apUpd); b.querySelector('#apTipo').addEventListener('click', function () { setTimeout(apUpd, 0); }); apUpd(); }
    },
    onSave: function (b) {
      if (saving) return true;
      var monto = parseFloat(b.querySelector('#apMonto').value) || 0;
      var fecha = b.querySelector('#apFecha').value;
      if (!monto || monto <= 0) { FT.toast(L ? 'Ingresa un monto válido' : 'Enter a valid amount'); return true; }
      if (!fecha) { FT.toast(L ? 'Selecciona una fecha' : 'Select a date'); return true; }
      var wantsRec = b.querySelector('#apRec').checked;
      var acctEl = b.querySelector('#apAcct');
      var checkingAccountId = (acctEl && acctEl.value) || undefined;
      function proceed() {
        saving = true;
        // Bank-like: al depositar desde una cuenta, la meta/emergencia queda como apartado DENTRO de esa cuenta.
        if (origen === 'nuevo' && checkingAccountId) { var mm = tipo === 'emerg' ? null : (FT.hogarFondos().metas[idx] || {}).id; FT.linkHogarFondo(tipo === 'emerg' ? 'hogaremerg' : 'hogarmeta', mm, checkingAccountId); }
        var f = FT.hogarFondos();
        var entry = { id: 'd_' + Date.now(), monto: monto, fecha: fecha, desdePres: origen === 'nuevo' };
        if (tipo === 'emerg') { f.emerg.hist = f.emerg.hist || []; f.emerg.hist.push(entry); f.emerg.actual = f.emerg.hist.reduce(function (a, h) { return a + (h.monto || 0); }, 0); if (origen === 'nuevo') registrarEnPresupuesto(monto, L ? 'Fondo emergencia hogar' : 'Household emergency fund', checkingAccountId); }
        else { var meta = f.metas[idx]; if (meta) { meta.hist = meta.hist || []; meta.hist.push(entry); meta.actual = meta.hist.reduce(function (a, h) { return a + (h.monto || 0); }, 0); if (origen === 'nuevo') registrarEnPresupuesto(monto, meta.nombre || (L ? 'Meta hogar' : 'Household goal'), checkingAccountId); } }
        FT.saveHogarFondos(f);

        if (wantsRec) {
          var freq = b.querySelector('#apRecFreq').value;
          var descRec = tipo === 'emerg' ? (L ? 'Fondo emergencia hogar' : 'Household emergency fund') : ((f.metas[idx] && f.metas[idx].nombre) || (L ? 'Meta hogar' : 'Household goal'));
          var nextDate = FT._advanceRecDate(freq, fecha);
          var recurring = FT.recurring();
          var metaIdRec = tipo === 'meta' && f.metas[idx] ? f.metas[idx].id : null;
          recurring.push({ id: 'rec_' + Date.now(), kind: 'meta', metaTipo: tipo, metaId: metaIdRec, metaIdx: idx, desc: descRec, amount: monto, freq: freq, hogar: true, desdePres: origen === 'nuevo', nextDate: nextDate, active: true, createdBy: FT.userName(), checkingAccountId: checkingAccountId });
          FT.set(FT.K.recurring, recurring);
        }
        FT.toast(L ? 'Aporte guardado' : 'Deposit saved');
        FT.closeTop();
        switchTab(activeTab);
      }
      // Primero el aviso de recurrente duplicado y, si se acepta, el de saldo negativo (se encadenan: uno no salta al otro).
      function checkSaldo() {
        if (origen === 'nuevo' && checkingAccountId) {
          var chkA = FT.checkOverdraft(checkingAccountId, monto + apAbsorb(checkingAccountId));
          if (!chkA.ok) {
            var anm = (FT.checking().find(function (x) { return String(x.id) === String(checkingAccountId); }) || {}).name || '';
            FT.confirm(L ? '«' + anm + '» quedaría en negativo (te faltan ' + FT.money(chkA.shortfall, { cents: true }) + '). ¿Continuar?' : '"' + anm + '" would go negative (short ' + FT.money(chkA.shortfall, { cents: true }) + '). Continue?').then(function (okA) { if (okA) proceed(); });
            return;
          }
        }
        proceed();
      }
      if (activos.length) {
        var msg = wantsRec
          ? (L ? '⚠️ Ya tienes un aporte recurrente activo. ¿Crear otro de todos modos? Esto duplicaría los depósitos automáticos.' : '⚠️ You already have an active recurring deposit. Create another anyway? This would duplicate the automatic deposits.')
          : (L ? '⚠️ Ya tienes un aporte recurrente activo. ¿Seguro que quieres depositar manualmente también? Si el recurrente ya cubre este depósito, se duplicaría.' : '⚠️ You already have an active recurring deposit. Deposit manually too? If the recurring one already covers it, it will be duplicated.');
        FT.confirm(msg).then(function (ok) { if (ok) checkSaldo(); });
        return true;
      }
      checkSaldo();
      return true;
    }
  });
}
function registrarEnPresupuesto(monto, desc, checkingAccountId) {
  if (checkingAccountId) FT.deductChecking(checkingAccountId, monto, FT.todayISO());
  var d = FT.data();
  d.transactions.push({ id: Date.now(), type: 'ahorro', desc: desc, amount: monto, date: FT.todayISO(), cat: '🏠 Hogar', hogar: true, createdBy: FT.userName(), checkingAccountId: checkingAccountId });
  FT.saveData(d);
}

/* ── TAB DEPÓSITOS ── */
function tabDepositos() {

    .map(function (t) { return { id: t.id, amount: parseFloat(t.amount) || 0, date: t.date, mine: true }; });

        .map(function (t) { return { id: t.id, amount: parseFloat(t.amount) || 0, date: t.date, mine: false }; })

    '<div style="font-size:11px;color:var(--text3);margin-bottom:10px">' + hogarPctChk + '% ' + (L ? 'al presupuesto del hogar · ' : 'to household budget · ') + (100 - hogarPctChk) + '% ' + (L ? 'a cuenta personal' : 'to personal account') + '</div>' +

function _depAsignarHtml(t) {
  var L = es();
  if (t.mine) {
    var row = FT.cheques().find(function (c) { return String(c.txId) === String(t.id); });

    var sin = parseFloat(row.hogarSinAsignar) || 0;
    if (sin > 0.5) return '<div style="font-size:11px;margin-top:3px"><b style="color:var(--amber,#8a5a00)">' + FT.money(sin, { cents: true }) + ' ' + (L ? 'sin asignar' : 'unassigned') + '</b> · <span class="tap" style="color:var(--blue);font-weight:800;cursor:pointer" onclick="asignarMio(\'' + _safeId(row.id) + '\')">' + (L ? 'Asignar' : 'Assign') + '</span></div>';
    if ((row.asignaciones || []).length) return '<div style="font-size:11px;margin-top:3px"><span class="tap" style="color:var(--blue);font-weight:800;cursor:pointer" onclick="cambiarReparto(\'' + _safeId(row.id) + '\')">' + (L ? 'Cambiar reparto' : 'Change split') + '</span></div>';
    return '';
  }
  var u = FT.partnerUnassigned().find(function (x) { return String(x.txId) === String(t.id); });

}
function deleteMyIncomeTx(id) {

function toggleDistConfig() { var el = document.getElementById('distConfig'); if (el) el.style.display = el.style.display === 'none' ? 'block' : 'none'; }

}
function saveDistConfig() {

  h.payPctHogar = parseInt(document.getElementById('paySlider').value, 10) || 50;
  h.saveHogarPct = parseInt(document.getElementById('saveSlider').value, 10) || 10;
  h.myPayFreq = document.getElementById('myFreqSel').value;
  h.partPayFreq = document.getElementById('partFreqSel').value;
  FT.saveHogar(h);
  FT.toast(es() ? '✅ Configuración guardada' : '✅ Config saved');

}
function moverSobranteAMetas(monto) {
  var L = es(), hoy = FT.todayISO(), mesActual = hoy.slice(0, 7);
  if (FT.getRaw('ft_hogar_surplus_' + mesActual)) { FT.toast(L ? 'Ya distribuiste el sobrante de este mes' : "You already handled this month's surplus"); return; }
  FT.confirm(L ? '¿Mover ' + FT.money(monto) + ' a tu primera meta activa?' : 'Move ' + FT.money(monto) + ' to your first active goal?').then(function (ok) {
    if (!ok) return;
    var f = FT.hogarFondos();
    if (!f.metas.length) { FT.toast(L ? '⚠️ No tienes metas creadas todavía — créala primero en la pestaña Metas' : "⚠️ You don't have any goals yet — create one first in the Goals tab"); return; }
    var meta = f.metas.find(function (m) { return (m.actual || 0) < (m.meta || Infinity); }) || f.metas[0];
    // Si la meta es un apartado de una cuenta, el sobrante sale de su disponible (el total de la cuenta no cambia).
    var linkedAcct = meta.accountId && FT.checking().some(function (a) { return String(a.id) === String(meta.accountId); }) ? meta.accountId : null;
    var chkS = linkedAcct ? FT.checkOverdraft(linkedAcct, monto) : { ok: true };
    var metaId = meta.id;
    var go = function () {
      if (FT.getRaw('ft_hogar_surplus_' + mesActual)) return;
      var f = FT.hogarFondos(), meta = f.metas.find(function (m) { return m.id === metaId; });
      if (!meta) return;
      if (linkedAcct) FT.deductChecking(linkedAcct, monto, hoy);
      moverSobranteApply(f, meta, monto, hoy, mesActual, L);
    };
    if (!chkS.ok) { FT.confirm(L ? 'La cuenta de esa meta quedaría en negativo (te faltan ' + FT.money(chkS.shortfall, { cents: true }) + '). ¿Continuar?' : "That goal's account would go negative (short " + FT.money(chkS.shortfall, { cents: true }) + '). Continue?').then(function (okS) { if (okS) go(); }); return; }
    go();
  });
}
function moverSobranteApply(f, meta, monto, hoy, mesActual, L) {
  meta.hist = meta.hist || [];
  meta.hist.push({ id: 'sob_' + Date.now(), monto: monto, fecha: hoy, nota: L ? 'Sobrante del hogar' : 'Household surplus' });
  meta.actual = meta.hist.reduce(function (a, h) { return a + (h.monto || 0); }, 0);
  FT.saveHogarFondos(f);
  FT.setRaw('ft_hogar_surplus_' + mesActual, JSON.stringify({ tipo: 'metas', monto: monto, fecha: hoy }));
  FT.toast('✅ ' + FT.money(monto) + (L ? ' movido a "' + meta.nombre + '"' : ' moved to "' + meta.nombre + '"'));
  switchTab('distribucion');
}
function repartirSobranteIgual(monto) {
  var L = es(), hoy = FT.todayISO(), mesActual = hoy.slice(0, 7), miParte = monto / 2;
  if (FT.getRaw('ft_hogar_surplus_' + mesActual)) { FT.toast(L ? 'Ya distribuiste el sobrante de este mes' : "You already handled this month's surplus"); return; }
  FT.confirm(L ? '¿Depositar ' + FT.money(miParte) + ' a tu Ahorro libre? (tu mitad del sobrante)' : 'Deposit ' + FT.money(miParte) + ' to your Free Savings? (your half of the surplus)').then(function (ok) {
    if (!ok) return;
    FT.addSavings({ id: Date.now(), amount: miParte, date: hoy, note: L ? 'Tu mitad del sobrante del hogar' : 'Your half of the household surplus' });

  tarjeta: { ico: '💳', color: 'var(--amber)', bg: '#FBF0DD' },
  personal: { ico: '📦', color: '#7B5EA7', bg: '#EFE9F5' }
};
function tabDeudas() {
  var L = es(), hogar = FT.hogar(), partnerName = _escHg(hogar.partnerName || (L ? 'Tu pareja' : 'Your partner'));
  var debts = FT.debts(), sharedDebts = debts.filter(function (d) { return d.owner === 'both'; }), myDebts = debts.filter(function (d) { return !d.owner || d.owner === 'me'; });
  var pp = FT.partnerProfile();
  // Todo lo que trae pp.data.sharedDebts YA se fusionó a mi propio ft_debts
  // (ver FT.syncPartner -> _mergeSharedDebtsIntoMine, que corre con esta
  // misma lista) -- mostrarlo otra vez aquí sin filtrar duplicaba cada deuda
  // compartida: una vez en "Deudas compartidas" (la mía, editable) y otra en
  // esta sección de solo lectura. Solo tiene sentido mostrar aquí lo que por
  // algún motivo (aún no corrió el sync, error de red) no se haya fusionado.
  var mySharedIds = {}; sharedDebts.forEach(function (d) { mySharedIds[String(d.id)] = true; });
  var partnerSharedDebts = ((pp && pp.data && pp.data.sharedDebts) || []).filter(function (d) { return !mySharedIds[String(d.id)]; });
  var partnerSharedTotal = partnerSharedDebts.reduce(function (a, d) { return a + (parseFloat(d.balance) || 0); }, 0);

  function debtCard(d, shared) {
    var st = DEBT_TYPE_STYLE[d.type] || DEBT_TYPE_STYLE.personal;
    var pct = d.original > 0 ? Math.min(Math.round((d.original - d.balance) / d.original * 100), 100) : 0;
    var myAmt = shared ? (d.payment || 0) * (d.splitMe || 50) / 100 : (d.payment || 0);
    var partnerAmt = shared ? (d.payment || 0) * (d.splitPartner || 50) / 100 : 0;
    return '<div class="ft-card">' +
      '<div style="display:flex;align-items:center;gap:10px;margin-bottom:8px">' +
        '<div class="ic" style="background:' + st.bg + '">' + st.ico + '</div>' +
        '<div style="flex:1"><div style="font-size:13px;font-weight:800">' + (d.name || '—') + '</div><div style="font-size:10px;color:var(--text3)">' + (L ? 'Saldo' : 'Balance') + ': ' + FT.money(d.balance) + ' · APR ' + (d.apr || 0) + '%</div></div>' +
        '<div style="font-size:15px;font-weight:800;color:' + st.color + '">' + FT.money(d.balance) + '</div>' +
      '</div>' +
      '<div class="ft-track" style="margin-bottom:10px"><div class="ft-fill" data-pct="' + pct + '" style="width:0;background:' + st.color + '"></div></div>' +
      (shared ? '<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px">' +
        '<div style="background:var(--g-light);border-radius:10px;padding:8px;text-align:center"><div style="font-size:10px;color:var(--g-dark)">' + (FT.userName() || 'Tú') + ' (' + (d.splitMe || 50) + '%)</div><div style="font-size:13px;font-weight:800;color:var(--g-main)">' + FT.money(myAmt) + '/mes</div></div>' +
        '<div style="background:var(--sky-bg);border-radius:10px;padding:8px;text-align:center"><div style="font-size:10px;color:var(--sky-tx)">' + partnerName + ' (' + (d.splitPartner || 50) + '%)</div><div style="font-size:13px;font-weight:800;color:var(--sky-tx)">' + FT.money(partnerAmt) + '/mes</div></div></div>' +
        '<div style="display:flex;gap:8px">' +
        '<button class="ft-btn ft-btn-primary tap" style="margin:0" onclick="FT.setRaw(FT.K.openAbonar,\'' + d.id + '\');go(\'deudas.html\')">💳 ' + (L ? 'Abonar' : 'Pay') + '</button>' +
        '<button class="ft-btn ft-btn-ghost tap" style="margin:0" onclick="makeDebtPersonal(\'' + d.id + '\')">👤 ' + (L ? 'Cambiar a solo mía' : 'Change to personal') + '</button></div>'
        : '<div style="display:flex;align-items:center;gap:8px"><div style="flex:1;font-size:11px;color:var(--text3)">' + FT.money(d.payment || 0) + '/mes · ' + (L ? 'Solo tuya' : 'Yours only') + '</div>' +

    '</div>';
  }
  var totalShared = sharedDebts.reduce(function (a, d) { return a + (d.balance || 0); }, 0);

  if (partnerSharedDebts.length) {
    out += '<div style="font-size:11px;font-weight:800;color:var(--text3);text-transform:uppercase;margin:14px 4px 4px">🔗 ' + (L ? 'Deudas que ' + partnerName + ' marcó como compartidas' : 'Debts ' + partnerName + ' marked as shared') + '</div>' +
      '<div style="font-size:10.5px;color:var(--text3);margin:0 4px 8px">' + (L ? 'Solo lectura — no puedes editarlas desde aquí' : "Read-only — you can't edit these from here") + '</div>' +

        var st = DEBT_TYPE_STYLE[d.type] || DEBT_TYPE_STYLE.personal;
        return '<div style="display:flex;align-items:center;gap:10px;padding:10px;background:var(--sunk);border-radius:12px;margin-bottom:8px">' +

          '<div style="font-size:13px;font-weight:800;color:' + st.color + '">' + FT.money(d.balance) + '</div></div>';
      }).join('');
  }
  if (myDebts.length) {
    out += '<div style="font-size:11px;font-weight:800;color:var(--text3);text-transform:uppercase;margin:14px 4px 4px">👤 ' + (L ? 'Mis deudas' : 'My debts') + '</div>' +

      myDebts.map(function (d) { return debtCard(d, false); }).join('');

  if (!debts.length && !partnerSharedDebts.length) {
    out += '<div class="ft-card" style="text-align:center;padding:40px 20px"><div style="font-size:40px;margin-bottom:12px">💳</div><div style="font-size:14px;font-weight:700;margin-bottom:12px">' + (L ? 'Sin deudas registradas' : 'No debts recorded') + '</div><button class="ft-btn ft-btn-primary tap" style="width:auto;padding:11px 20px;margin:0 auto" onclick="go(\'deudas.html\')">' + (L ? '+ Agregar deuda' : '+ Add debt') + '</button></div>';
  }
  out += '<button class="ft-btn ft-btn-ghost tap" style="margin-top:4px" onclick="go(\'deudas.html\')">' + (L ? 'Gestionar todas las deudas →' : 'Manage all debts →') + '</button>';
  return out;
}
function makeDebtShared(id) {
  var debts = FT.debts(), i = debts.findIndex(function (d) { return String(d.id) === String(id); }); if (i < 0) return;
  debts[i].owner = 'both'; debts[i].splitMe = 50; debts[i].splitPartner = 50; debts[i].splitMode = 'equal';

function makeDebtPersonal(id) {

}

  var list = all.map(function (i) {

      '<div style="font-size:11px;color:var(--text3)">' + (i.type || '') + (i.platform ? ' · ' + i.platform : '') + (i.addedBy ? ' · ' + i.addedBy : '') + '</div></div>' +

  }).join('');
  return '<div class="ft-card">' + summary + addBtn + list + '</div>';
}

/* ── SALIR DEL HOGAR ── */
function leaveHousehold() {
  var L = es();
  FT.confirm(L ? '¿Salir del hogar? Dejarás de ver el dashboard combinado.' : 'Leave household? You will stop seeing the combined dashboard.').then(function (ok) {
    if (!ok) return;
    if (_pollTimer) { clearInterval(_pollTimer); _pollTimer = null; }
    var hogar = FT.hogar();
    if (hogar.partnerEmail) FT.del('profile_' + hogar.partnerEmail.replace(/[^a-z0-9]/gi, '_'));
    FT.del(FT.K.profileB);
    FT.saveHogar({ connected: false, pendingInvite: false, manuallyLeft: true });
    render();
    FT.toast(L ? 'Saliste del hogar' : 'You left the household');
  });
}

/* ── SUBIR MI PERFIL A GAS (para que mi pareja lo lea) ──
   Movido a FT.pushProfileToGAS() en premium.js -- ahora corre solo desde
   ahí (debounced en cada ft:datachanged + al arrancar la app), no solo al
   abrir esta pantalla. Se deja esta función como alias por compatibilidad
   con el onclick de abajo. */
function pushMyProfileToGAS() { FT.pushProfileToGAS(); }

/* ── INIT ── */
document.addEventListener('ft:ready', function () {
  var t = function () { return FT.lang === 'es' ? '🏠 Hogar' : '🏠 Household'; };
  var sh = FT.shell({ active: 'hogar', title: t(), onPlus: function () { FT.openPicker({ ctx: 'hogar' }); } });
  document.addEventListener('ft:langchange', function () { sh.setTitle(t()); render(); });
  document.addEventListener('ft:datachanged', render);
  // Llegar desde el ＋ de otra pantalla con ?deposit=emerg abre directo el depósito a la emergencia del hogar.
  try { if (new URLSearchParams(location.search).get('cheques') === '1') setTimeout(function () { if (FT.hogar().connected && FT.hogar().mode) openChequesSheet(); }, 500); } catch (e) {}
  try { if (new URLSearchParams(location.search).get('deposit') === 'emerg') setTimeout(function () { if (FT.hogar().connected && FT.hogar().mode) abrirAporteModal('emerg'); }, 500); } catch (e) {}

  render();

  var hogar = FT.hogar();
  if (hogar.manuallyLeft) return;
  if (hogar.pendingInvite) startPartnerPolling();
  if (hogar.connected) pushMyProfileToGAS();

  if (FT.user().email) {
    FT.checkPartner(FT.user().email).then(function (gasData) {
      if (!gasData || !gasData.connected) return;
      var h2 = FT.hogar();
      if (h2.manuallyLeft) return;
      if (h2.connected) { if (gasData.partnerEmail) FT.syncPartner(); return; } // ya conectado -- solo trae lo nuevo
      // Estaba DESCONECTADO localmente pero GAS todavía recuerda un hogar para
      // este correo (ej. otro dispositivo, o esta cuenta se registró de nuevo
      // desde cero) -- antes esto reconectaba solo y volvía a traer deudas y
      // recurrentes viejos sin que nadie lo pidiera. Ahora se pregunta primero;
      // si dice que no, se marca manuallyLeft para no volver a preguntar cada
      // vez que abra Hogar.
      if (gasData.partnerEmail) {
        var pname = gasData.partnerName || gasData.partnerEmail;
        FT.confirm(es()
          ? 'Detectamos que ya tenías un hogar conectado con ' + pname + '. ¿Reconectar y traer sus deudas/recurrentes compartidos?'
          : 'We found you already had a household connected with ' + pname + '. Reconnect and bring in their shared debts/recurring items?'
        ).then(function (ok) {
          var h3 = FT.hogar();
          if (!ok) { h3.manuallyLeft = true; FT.saveHogar(h3); return; }
          h3.connected = true; h3.pendingInvite = false; h3.manuallyLeft = false; h3.partnerEmail = gasData.partnerEmail;
          h3.partnerName = pname; h3.connectedAt = new Date().toISOString();
          FT.saveHogar(h3);
          FT.syncPartner();
          render();
        });
      }
    }).catch(function () {});
  }
});
</script>
