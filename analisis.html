<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>FinTrack Pro · Análisis</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<script src="premium.js"></script>
</head>
<body>
<div class="ft-app"><div class="ft-page" id="root"></div></div>
<script>
var COLORS = ['var(--g-main)', 'var(--red)', 'var(--blue)', 'var(--amber)', 'var(--purple)', '#2EC4B6', '#FF6B6B', '#A8DADC'];
function es() { return FT.lang === 'es'; }

function buildMonthlyTrend(data) {
  var now = new Date(), months = [];
  for (var i = 5; i >= 0; i--) months.push(new Date(now.getFullYear(), now.getMonth() - i, 1).toISOString().slice(0, 7));
  return months.map(function (m) {
    var txs = (data.transactions || []).filter(function (t) { return (t.date || '').startsWith(m); });
    var income = 0, expenses = 0;
    txs.forEach(function (t) {
      var a = parseFloat(t.amount) || 0;
      if (t.type === 'ingreso') income += a;
      else if ((t.type === 'gasto' || t.type === 'suscripcion' || t.type === 'hipoteca') && t.hogar !== true) expenses += a;
    });
    var d = new Date(m + '-02');
    return { month: m, label: d.toLocaleDateString(es() ? 'es-MX' : 'en-US', { month: 'short' }), income: income, expenses: expenses };
  });
}

function renderTrendChart(trend) {
  var L = es(), W = 800, H = 190, padL = 20, padR = 20, padT = 16, padB = 30;
  var maxVal = Math.max(1, trend.reduce(function (m, t) { return Math.max(m, t.income, t.expenses); }, 0));
  var stepX = (W - padL - padR) / (trend.length - 1 || 1);
  function scaleY(v) { return H - padB - (v / maxVal) * (H - padT - padB); }
  function pathFor(key) { return trend.map(function (t, i) { return (i === 0 ? 'M' : 'L') + (padL + i * stepX).toFixed(1) + ',' + scaleY(t[key]).toFixed(1); }).join(' '); }
  function dots(key) { return trend.map(function (t, i) { return '<circle cx="' + (padL + i * stepX).toFixed(1) + '" cy="' + scaleY(t[key]).toFixed(1) + '" r="4.5" fill="' + (key === 'income' ? '#1A7A4A' : '#E14B4F') + '"/>'; }).join(''); }
  var labels = trend.map(function (t, i) { return '<text x="' + (padL + i * stepX).toFixed(1) + '" y="' + (H - 8) + '" font-size="13" fill="#A0A3AF" text-anchor="middle">' + t.label + '</text>'; }).join('');
  var trendUp = trend.length > 1 && trend[trend.length - 1].expenses > trend[trend.length - 2].expenses;
  return '<div class="ft-card">' +
    '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">' +
      '<div style="font-size:13px;font-weight:800">📈 ' + (L ? 'Tendencia (6 meses)' : 'Trend (6 months)') + '</div>' +
      '<div style="display:flex;gap:12px;font-size:10px;color:var(--text3)">' +
        '<span><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:#1A7A4A;margin-right:3px"></span>' + (L ? 'Ingresos' : 'Income') + '</span>' +
        '<span><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:#E14B4F;margin-right:3px"></span>' + (L ? 'Gastos' : 'Expenses') + '</span>' +
      '</div></div>' +
    '<svg style="width:100%;max-height:190px;display:block" viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="xMidYMid meet">' +
      '<path d="' + pathFor('income') + '" fill="none" stroke="#1A7A4A" stroke-width="3"/>' +
      '<path d="' + pathFor('expenses') + '" fill="none" stroke="#E14B4F" stroke-width="3"/>' + dots('income') + dots('expenses') + labels +
    '</svg>' +
    '<div style="font-size:11px;color:var(--text3);margin-top:6px">' + (trendUp ? (L ? '⚠️ Tus gastos subieron respecto al mes pasado' : '⚠️ Your expenses went up vs last month') : (L ? '✅ Tus gastos bajaron o se mantuvieron vs el mes pasado' : '✅ Your expenses went down or stayed the same vs last month')) + '</div>' +
  '</div>';
}

function render() {
  var L = es(), data = FT.data(), now = new Date(), month = FT.todayISO().slice(0, 7);
  var txs = (data.transactions || []).filter(function (t) { return (t.date || '').startsWith(month); });

  var income = 0, expenses = 0, invested = 0, hogarExpenses = 0, personalAhorro = 0, extraIncome = 0, chequeIncome = 0;
  var catMap = {};
  txs.forEach(function (t) {
    var a = parseFloat(t.amount) || 0;
    if (t.type === 'ingreso') { income += a; if (t.incomeKind === 'extra') extraIncome += a; else chequeIncome += a; return; }
    if (t.type === 'inversion') { invested += a; return; }
    if (t.type === 'ahorro') { if (t.hogar !== true) personalAhorro += a; return; }
    if (t.type === 'gasto' || t.type === 'suscripcion' || t.type === 'hipoteca') {
      if (t.hogar === true) { hogarExpenses += a; return; }
      expenses += a;
      var cat = t.cat || t.type || 'Otro';
      catMap[cat] = (catMap[cat] || 0) + a;
    }
  });
  var cats = Object.keys(catMap).map(function (k) { return [k, catMap[k]]; }).sort(function (a, b) { return b[1] - a[1]; });
  var maxCat = cats[0] ? cats[0][1] : 1;
  var trend = buildMonthlyTrend(data);

  var hogar = FT.hogar(), hogarConn = FT.hogarConnected();
  var hogarPct = hogarConn ? ((parseFloat(hogar.payPctHogar) || 50) + (parseFloat(hogar.saveHogarPct) || 10)) : 0;
  var persPct = hogarConn ? (100 - hogarPct) : 100;
  var monthlyIncome = FT.user().income || 0;
  var personalBudget = hogarConn ? (chequeIncome * persPct / 100 + extraIncome) : monthlyIncome;
  var personalLeft = personalBudget - expenses - personalAhorro - invested;

  var dayOfMonth = now.getDate(), daysInMonth = new Date(now.getFullYear(), now.getMonth() + 1, 0).getDate();
  var dailyRate = dayOfMonth > 0 ? expenses / dayOfMonth : 0;
  var projectedTotal = dailyRate * daysInMonth;
  var willOverspend = personalBudget > 0 && projectedTotal > personalBudget;

  var mesActualHogar = month, partnerHogarExpenses = 0, pp = null;
  if (hogarConn && hogar.partnerEmail) {
    pp = FT.partnerProfile();
    if (pp && pp.data && pp.data.transactions) {
      partnerHogarExpenses = pp.data.transactions.filter(function (t) { return t.hogar === true && (t.type === 'gasto' || t.type === 'suscripcion' || t.type === 'hipoteca') && String(t.date || '').startsWith(mesActualHogar); })
        .reduce(function (a, t) { return a + (parseFloat(t.amount) || 0); }, 0);
    }
  }
  var partnerIncomeAn = (pp && parseFloat(pp.income) > 0) ? parseFloat(pp.income) : (parseFloat(hogar.partnerIncome) || 0);
  var hogarExpensesCombined = hogarExpenses + partnerHogarExpenses;
  var totalIncomeHogar = monthlyIncome + partnerIncomeAn;
  var hogarBudgetCombined = totalIncomeHogar * ((parseFloat(hogar.payPctHogar) || 50) / 100);
  var hogarSurplusCombinedRaw = hogarBudgetCombined - hogarExpensesCombined;
  var hogarSurplusCombined = Math.max(0, hogarSurplusCombinedRaw);
  var myPctHogarAn = 50;
  if (hogar.mode !== 'equal' && hogar.mode !== 'common') myPctHogarAn = totalIncomeHogar > 0 ? Math.round(monthlyIncome / totalIncomeHogar * 100) : 50;
  var miParteSurplusHogar = hogarConn ? (hogarSurplusCombined * myPctHogarAn / 100) : 0;
  var ahorroPotencialPersonal = income - expenses - personalAhorro - invested;
  var ahorroPotencialCombinado = ahorroPotencialPersonal + miParteSurplusHogar;

  var hogarExplainCard = hogarConn ? '<div class="ft-card">' +
      '<div style="font-size:13px;font-weight:800;margin-bottom:10px">🏠 ' + (L ? 'Cómo se reparte tu sueldo' : 'How your paycheck splits') + '</div>' +
      '<div style="font-size:12px;color:var(--text2);line-height:1.5;margin-bottom:10px">' +
        (L ? 'De cada cheque, <b>' + hogarPct + '%</b> se va al presupuesto del hogar (modo "' + (hogar.mode === 'common' ? 'fondo común' : hogar.mode || 'equal') + '") y <b>' + persPct + '%</b> es tuyo, personal. El dinero extra (bonos, freelance, etc.) no se reparte — es 100% tuyo.'
           : 'From each paycheck, <b>' + hogarPct + '%</b> goes to the household budget (mode "' + (hogar.mode === 'common' ? 'common fund' : hogar.mode || 'equal') + '") and <b>' + persPct + '%</b> is yours. Extra income (bonuses, freelance, etc.) isn\'t split — it\'s 100% yours.') +
      '</div>' +
      '<div class="ft-row"><span class="k">' + (L ? 'Gastado del hogar este mes' : 'Household spent this month') + '</span><span class="v">' + FT.money(hogarExpenses) + '</span></div>' +
      '<div class="ft-row"><span class="k">' + (L ? 'Gastado personal este mes' : 'Personal spent this month') + '</span><span class="v">' + FT.money(expenses) + '</span></div>' +
      (extraIncome > 0 ? '<div class="ft-row"><span class="k">' + (L ? 'Ingreso extra recibido este mes' : 'Extra income received this month') + '</span><span class="v" style="color:var(--g-main)">+' + FT.money(extraIncome) + '</span></div>' : '') +
      '<div style="font-size:10px;color:var(--text3);margin-top:6px">' + (L ? 'Lo del hogar nunca cuenta en tu análisis personal de abajo.' : "Household spending never counts toward your personal analysis below.") + '</div>' +
    '</div>' : '';

  var diagnosisMsg = '';
  if (hogarConn && personalBudget > 0) {
    if (extraIncome > 0 && expenses > personalBudget - extraIncome) {
      diagnosisMsg = L ? 'Este mes gastaste más de lo normal, pero recibiste <b>' + FT.money(extraIncome) + '</b> extra — por eso no estás en números rojos. Sin ese ingreso extra, ya habrías pasado tu presupuesto personal.'
        : 'You spent more than usual this month, but you received <b>' + FT.money(extraIncome) + '</b> extra — that\'s why you\'re not in the red. Without that extra income, you\'d already be over your personal budget.';
    } else if (willOverspend) {
      diagnosisMsg = L ? 'Estás gastando más rápido de lo que tu presupuesto aguanta. No es solo este mes — si es un patrón que se repite, conviene ajustar el presupuesto o el gasto, no solo taparlo con ingresos extra cuando lleguen.'
        : "You're spending faster than your budget can handle. If this repeats month after month, it's worth adjusting your budget or your spending — not just patching it with extra income when it shows up.";
    } else {
      diagnosisMsg = L ? 'Vas dentro de tu presupuesto personal. Sigue así.' : "You're within your personal budget. Keep it up.";
    }
  }

  var statusCard = hogarConn && personalBudget > 0 ? '<div class="ft-card" style="background:' + (willOverspend ? 'var(--red-dim)' : 'var(--g-light)') + '">' +
      '<div style="font-size:13px;font-weight:800;margin-bottom:8px;color:' + (willOverspend ? 'var(--red)' : 'var(--g-dark)') + '">' + (willOverspend ? '⚠️' : '✅') + ' ' + (L ? '¿Cómo vas este mes?' : 'How are you doing this month?') + '</div>' +
      '<div style="font-size:12px;color:var(--text2);line-height:1.6">' + (L ? 'Llevas gastados <b>' + FT.money(expenses) + '</b> de tu presupuesto personal de <b>' + FT.money(personalBudget) + '</b> (' + persPct + '% de tu cheque' + (extraIncome > 0 ? ' + tu ingreso extra' : '') + ').' : 'You\'ve spent <b>' + FT.money(expenses) + '</b> of your personal budget of <b>' + FT.money(personalBudget) + '</b> (' + persPct + '% of your paycheck' + (extraIncome > 0 ? ' + your extra income' : '') + ').') + '</div>' +
      '<div style="display:flex;justify-content:space-between;font-size:13px;font-weight:800;margin-top:10px;padding-top:10px;border-top:1px solid rgba(0,0,0,.08)"><span>' + (L ? 'Te queda este mes' : 'Left this month') + '</span><span style="color:' + (personalLeft < 0 ? 'var(--red)' : 'var(--g-main)') + '">' + (personalLeft < 0 ? '-' : '') + FT.money(Math.abs(personalLeft)) + '</span></div>' +
      '<div style="font-size:11px;color:var(--text3);margin-top:10px">' + (willOverspend
        ? (L ? 'Si sigues gastando a este ritmo ($' + Math.round(dailyRate) + '/día), vas a terminar el mes en <b>' + FT.money(projectedTotal) + '</b> — <b style="color:var(--red)">' + FT.money(projectedTotal - personalBudget) + ' por encima</b> de tu presupuesto.' : 'If you keep spending at this rate ($' + Math.round(dailyRate) + '/day), you\'ll end the month at <b>' + FT.money(projectedTotal) + '</b> — <b style="color:var(--red)">' + FT.money(projectedTotal - personalBudget) + ' over</b> your budget.')
        : (L ? 'A este ritmo ($' + Math.round(dailyRate) + '/día) terminarías el mes en ' + FT.money(projectedTotal) + ', dentro de tu presupuesto.' : 'At this rate ($' + Math.round(dailyRate) + '/day) you\'d end the month at ' + FT.money(projectedTotal) + ', within budget.')) + '</div>' +
      (diagnosisMsg ? '<div style="font-size:11.5px;color:var(--text2);margin-top:10px;padding-top:10px;border-top:1px solid rgba(0,0,0,.08);line-height:1.5">💬 ' + diagnosisMsg + '</div>' : '') +
    '</div>' : '';

  var autoTxs = txs.filter(function (t) { return t.autoRecurring === true; }).sort(function (a, b) { return String(b.date || '').localeCompare(String(a.date || '')); });
  var autoTotal = autoTxs.reduce(function (a, t) { return a + (parseFloat(t.amount) || 0); }, 0);
  var recurringCard = autoTxs.length ? '<div class="ft-card">' +
      '<div style="font-size:13px;font-weight:800;margin-bottom:4px">🔄 ' + (L ? 'Automático este mes' : 'Automatic this month') + '</div>' +
      '<div style="font-size:10.5px;color:var(--text3);margin-bottom:12px">' + (L ? 'Esto se aplicó solo, sin que tuvieras que entrar — así vas a ir todo el mes.' : "This applied automatically, without you having to check in — this is how it goes all month.") + '</div>' +
      '<div style="display:flex;justify-content:space-between;font-size:12px;font-weight:700;background:var(--sunk);border-radius:10px;padding:10px 12px;margin-bottom:10px"><span>' + (L ? 'Total automático' : 'Automatic total') + '</span><span>' + FT.money(autoTotal) + '</span></div>' +
      autoTxs.map(function (t) {
        var ico = t.type === 'gasto' ? '💳' : t.type === 'ahorro' ? '💰' : t.type === 'inversion' ? '📈' : '📝';
        var tag = t.hogar === true ? '🏠' : '👤';
        return '<div style="display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--hair)">' +
          '<div style="font-size:16px;flex-shrink:0">' + ico + '</div>' +
          '<div style="flex:1;min-width:0"><div style="font-size:12px;font-weight:700">' + (t.desc || '') + '</div><div style="font-size:10px;color:var(--text3)">' + tag + ' ' + (t.hogar === true ? (L ? 'Hogar' : 'Household') : (L ? 'Personal' : 'Personal')) + ' · ' + (t.date || '') + '</div></div>' +
          '<div style="font-size:12.5px;font-weight:800;color:' + (t.type === 'ingreso' ? 'var(--g-main)' : 'var(--red)') + ';flex-shrink:0">' + (t.type === 'ingreso' ? '+' : '-') + FT.money(t.amount || 0) + '</div></div>';
      }).join('') +
    '</div>' : '';

  var h = renderTrendChart(trend) + hogarExplainCard + statusCard + recurringCard +
    '<div class="ft-card">' +
      '<div style="font-size:13px;font-weight:800;margin-bottom:14px">📅 ' + (L ? 'Resumen del mes (personal)' : 'Month summary (personal)') + '</div>' +
      '<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px">' +
        '<div style="background:var(--g-light);border-radius:12px;padding:12px;text-align:center"><div style="font-size:16px;font-weight:800;color:var(--g-main)">' + FT.money(income) + '</div><div style="font-size:10px;color:var(--g-dark)">' + (L ? 'Ingresos' : 'Income') + '</div></div>' +
        '<div style="background:var(--red-dim);border-radius:12px;padding:12px;text-align:center"><div style="font-size:16px;font-weight:800;color:var(--red)">' + FT.money(expenses) + '</div><div style="font-size:10px;color:var(--red)">' + (L ? 'Gastos' : 'Expenses') + '</div></div>' +
        '<div style="background:var(--sky-bg);border-radius:12px;padding:12px;text-align:center"><div style="font-size:16px;font-weight:800;color:var(--blue)">' + FT.money(invested) + '</div><div style="font-size:10px;color:var(--blue)">' + (L ? 'Inversiones' : 'Investments') + '</div></div>' +
      '</div>' +
      (income > 0 ? '<div style="margin-top:14px">' +
        '<div style="display:flex;justify-content:space-between;font-size:11px;font-weight:700;margin-bottom:6px"><span>' + (L ? 'Ahorro potencial' : 'Potential savings') + '</span><span style="color:' + (ahorroPotencialPersonal >= 0 ? 'var(--g-main)' : 'var(--red)') + '">' + FT.money(ahorroPotencialPersonal) + '</span></div>' +
        '<div class="ft-track"><div class="ft-fill" data-pct="' + Math.min(100, Math.max(0, (expenses + personalAhorro + invested) / income * 100)).toFixed(0) + '" style="width:0;background:' + (ahorroPotencialPersonal >= 0 ? 'var(--g-main)' : 'var(--red)') + '"></div></div>' +
        '<div style="font-size:9px;color:var(--text3);margin-top:4px">' + (L ? 'Ingreso menos gastos, ahorro e inversión ya hechos este mes' : 'Income minus expenses, savings and investing already done this month') + '</div></div>' : '') +
    '</div>' +

    (hogarConn ? '<div class="ft-card" style="border:2px solid var(--purple)">' +
      '<div style="font-size:13px;font-weight:800;margin-bottom:2px;color:var(--purple)">🏠+👤 ' + (L ? 'Tu ahorro potencial REAL (personal + hogar)' : 'Your REAL savings potential (personal + household)') + '</div>' +
      '<div style="font-size:10px;color:var(--text3);margin-bottom:12px">' + (L ? 'Esto es distinto al de arriba — aquí sí se suma lo que sobra en el hogar. El de arriba es solo tu presupuesto personal, sin tocar' : 'This is different from the one above — here the household surplus IS added in. The one above is only your personal budget, untouched') + '</div>' +
      '<div class="ft-row"><span class="k">1️⃣ ' + (L ? 'Tu ahorro potencial personal' : 'Your personal savings potential') + '</span><span class="v" style="color:' + (ahorroPotencialPersonal >= 0 ? 'var(--g-main)' : 'var(--red)') + '">' + FT.money(ahorroPotencialPersonal) + '</span></div>' +
      '<div style="padding:9px 0;border-bottom:1px solid var(--hair)">' +
        '<div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:6px"><span class="k" style="color:var(--text2)">2️⃣ ' + (L ? 'Sobrante combinado del hogar (tú + tu pareja)' : 'Combined household surplus (you + your partner)') + '</span><span style="font-weight:800;color:' + (hogarSurplusCombinedRaw >= 0 ? 'var(--g-main)' : 'var(--red)') + '">' + (hogarSurplusCombinedRaw >= 0 ? '' : '-') + FT.money(Math.abs(hogarSurplusCombinedRaw)) + '</span></div>' +
        '<div style="background:var(--sunk);border-radius:8px;padding:8px 10px;font-size:10.5px;color:var(--text3);line-height:1.6">' +
          '<div>' + (L ? 'Presupuesto del hogar' : 'Household budget') + ' (' + FT.money(totalIncomeHogar) + ' × ' + (parseFloat(hogar.payPctHogar) || 50) + '%): <b>' + FT.money(hogarBudgetCombined) + '</b></div>' +
          '<div>− ' + (L ? 'Gastado del hogar (de los dos, es un solo gasto compartido)' : 'Household spent (both, one shared expense)') + ': <b>' + FT.money(hogarExpensesCombined) + '</b></div>' +
          '<div style="margin-top:2px;padding-top:2px;border-top:1px dashed var(--hair)">= ' + (hogarSurplusCombinedRaw >= 0 ? (L ? 'Sobrante combinado' : 'Combined surplus') : (L ? 'Déficit combinado (no se resta del ahorro, solo no suma)' : "Combined deficit (doesn't subtract from savings, just doesn't add)")) + ': <b>' + FT.money(Math.abs(hogarSurplusCombinedRaw)) + '</b></div>' +
        '</div></div>' +
      '<div class="ft-row"><span class="k">3️⃣ ' + (L ? 'Tu parte de ese sobrante (' + myPctHogarAn + '%, ' + ((hogar.mode === 'equal' || hogar.mode === 'common') ? 'reparto equitativo' : 'según tu ingreso') + ')' : 'Your share of that surplus (' + myPctHogarAn + '%, ' + ((hogar.mode === 'equal' || hogar.mode === 'common') ? 'equal split' : 'based on your income') + ')') + '</span><span class="v" style="color:' + (miParteSurplusHogar >= 0 ? 'var(--g-main)' : 'var(--red)') + '">' + (miParteSurplusHogar >= 0 ? '+' : '-') + FT.money(Math.abs(miParteSurplusHogar)) + '</span></div>' +
      '<div style="display:flex;justify-content:space-between;align-items:center;font-size:13.5px;padding:12px 0 4px;border-top:2px solid var(--purple);margin-top:4px"><span style="font-weight:800;color:var(--purple)">= ' + (L ? 'Total que podrías ahorrar este mes' : 'Total you could save this month') + '</span><span style="font-weight:800;font-size:16px;color:' + (ahorroPotencialCombinado >= 0 ? 'var(--g-main)' : 'var(--red)') + '">' + FT.money(ahorroPotencialCombinado) + '</span></div>' +
      '<div style="font-size:10px;color:var(--text3);margin-top:4px">' + (L ? '(1) + (3) — tu presupuesto personal más tu parte del hogar, si sobró algo' : '(1) + (3) — your personal budget plus your share of the household, if anything was left over') + '</div>' +
    '</div>' : '') +

    (cats.length ? '<div class="ft-card">' +
      '<div style="font-size:13px;font-weight:800;margin-bottom:4px">🏷️ ' + (L ? 'Gastos por categoría (personal)' : 'Expenses by category (personal)') + '</div>' +
      '<div style="font-size:10px;color:var(--text3);margin-bottom:10px">' + (L ? 'No incluye gastos marcados "del hogar"' : 'Excludes expenses tagged "household"') + '</div>' +
      cats.map(function (c, i) {
        var meta = FT.catMeta(c[0], i);
        return '<div style="display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--hair)">' +
          '<div style="font-size:12px;font-weight:600;width:90px;flex-shrink:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + (meta.emoji ? meta.emoji + ' ' : '') + meta.label + '</div>' +
          '<div class="ft-track" style="flex:1"><div class="ft-fill" data-pct="' + (c[1] / maxCat * 100).toFixed(0) + '" style="width:0;background:' + COLORS[i % COLORS.length] + '"></div></div>' +
          '<div style="font-size:12px;font-weight:800;flex-shrink:0;width:70px;text-align:right">' + FT.money(c[1]) + '</div></div>';
      }).join('') +
    '</div>' : '<div class="ft-card" style="text-align:center;padding:40px 20px"><div style="font-size:36px;margin-bottom:10px">📊</div><div style="font-size:13px;color:var(--text3)">' + (L ? 'Sin gastos este mes' : 'No expenses this month') + '</div></div>');

  document.getElementById('root').innerHTML = h;
  requestAnimationFrame(function () { document.querySelectorAll('.ft-fill[data-pct]').forEach(function (f) { f.style.width = f.getAttribute('data-pct') + '%'; }); });
}

document.addEventListener('ft:ready', function () {
  var t = function () { return FT.lang === 'es' ? 'Análisis' : 'Analysis'; };
  var sh = FT.shell({ active: '', title: t() });
  document.addEventListener('ft:langchange', function () { sh.setTitle(t()); render(); });
  document.addEventListener('ft:datachanged', render);
  render();
});
</script>
</body>
</html>
