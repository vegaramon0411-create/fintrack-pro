<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>FinTrack Pro · Metas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<script src="premium.js"></script>
</head>
<body>
<div class="ft-app"><div class="ft-page" id="root"></div></div>
<script>
var ICONS = ['🎯', '🚗', '✈️', '🏠', '🎓', '💍', '📱', '🛡️', '💰'];

function es() { return FT.lang === 'es'; }

/* 20-oct-2026 (aprobado vía simulación): las metas salen de la cuenta que elijas, como un apartado dentro de ella. */
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function acctName(id) { var a = FT.checking().find(function (x) { return String(x.id) === String(id); }); return a ? esc(a.name) : (es() ? 'su cuenta' : 'its account'); }
function freqText(f, L) { return f === 'weekly' ? (L ? 'cada semana' : 'every week') : f === 'biweekly' ? (L ? 'cada quincena' : 'every two weeks') : (L ? 'cada mes' : 'every month'); }
function stuck(rec, g) { var a = g.accountId || rec.accountId; return !!(a && rec.active !== false && !rec.paused && rec.nextDate && rec.nextDate <= FT.todayISO() && !FT.checkOverdraft(a, rec.amount + FT.goalAbsorbNeed(g.id, a)).ok); }
function acctOpts(sel) { var def = FT.user().defaultAccountId; return FT.checking().filter(function (a) { return !a.hogar; }).map(function (a) { return '<option value="' + esc(a.id) + '"' + ((sel ? String(sel) === String(a.id) : String(def) === String(a.id)) ? ' selected' : '') + '>' + esc(a.name) + ' · ' + (es() ? 'Disponible ' : 'Available ') + FT.money(FT.accountFree(a), { cents: true }) + '</option>'; }).join(''); }

function render() {
  var L = es(), goals = FT.goals(), root = document.getElementById('root');
  // Bug real de QA (B5): crear una meta SÍ funcionaba (el "+" del menú
  // inferior ya abre el formulario), pero la propia página de Metas no
  // tenía ningún botón visible -- solo se descubría por accidente. Ahora
  // hay un botón "Nueva meta" aquí mismo, tanto vacía como con metas ya
  // creadas.
  if (!goals.length) {
    root.innerHTML = '<div class="ft-empty" style="padding:60px 20px"><div style="font-size:44px;margin-bottom:10px">🎯</div><div style="font-size:15px;font-weight:800;color:var(--ink);margin-bottom:5px">' + (L ? 'Sin metas aún' : 'No goals yet') + '</div><div style="margin-bottom:18px">' + (L ? 'Crea tu primera meta de ahorro' : 'Create your first savings goal') + '</div>' +
      '<button class="ft-btn ft-btn-primary tap" style="max-width:220px;margin:0 auto" onclick="openForm(null)">＋ ' + (L ? 'Nueva meta' : 'New goal') + '</button></div>';
    return;
  }
  root.innerHTML = '<div class="ft-section-head"><h3>' + (L ? 'Mis metas' : 'My goals') + '</h3><button class="link" onclick="openForm(null)">＋ ' + (L ? 'Nueva meta' : 'New goal') + '</button></div>' +
    goals.map(function (g) {
    var saved = parseFloat(g.saved) || 0, target = parseFloat(g.target) || 1;
    var pct = Math.min(Math.round(saved / target * 100), 100), done = pct >= 100;
    var color = done ? 'var(--g-main)' : 'var(--amber)';
    var rec = g.recurring ? FT.recurGet(g.recId) : null;
    return '<div class="ft-card">' +
      '<div style="display:flex;align-items:center;gap:12px;margin-bottom:12px">' +
        '<div style="width:44px;height:44px;border-radius:13px;display:grid;place-items:center;font-size:22px;background:' + (done ? 'var(--g-light)' : 'var(--peach-bg)') + ';flex-shrink:0">' + (g.icon || '🎯') + '</div>' +
        '<div style="flex:1;min-width:0"><div style="font-size:14px;font-weight:800">' + esc(g.name) + '</div>' +
        '<div style="font-size:11px;color:var(--text3)">' + FT.money(saved) + ' ' + (L ? 'de' : 'of') + ' ' + FT.money(target) + '</div></div>' +
        '<div style="font-size:16px;font-weight:800;color:' + color + '">' + pct + '%</div></div>' +
      '<div class="ft-track" style="margin-bottom:9px"><div class="ft-fill" data-pct="' + pct + '" style="background:' + color + '"></div></div>' +
      '<div style="display:flex;justify-content:space-between;font-size:11px;color:var(--text3);margin-bottom:8px">' +
        '<span>' + (L ? 'Faltan' : 'Remaining') + ': ' + FT.money(Math.max(0, target - saved)) + '</span>' +
        (g.deadline ? '<span>' + (L ? 'Límite' : 'Due') + ': ' + FT.date(g.deadline) + '</span>' : '') + '</div>' +
      (g.accountId ? '<div style="font-size:10.5px;font-weight:700;color:var(--blue);background:var(--sky-bg);border-radius:9px;padding:7px 9px;margin-bottom:8px">🔗 ' + (L ? 'Apartada dentro de ' : 'Set aside inside ') + acctName(g.accountId) + '</div>' : '') +
      (g.recurring && rec ? '<div style="font-size:10.5px;font-weight:700;color:var(--g-dark);background:var(--g-light);border-radius:9px;padding:7px 9px;margin-bottom:10px">🔁 ' + (L ? 'Aporte automático' : 'Automatic deposit') + ': ' + FT.money(rec.amount) + ' ' + freqText(rec.freq, L) + (g.accountId || rec.accountId ? (L ? ' · sale de ' : ' · from ') + acctName(g.accountId || rec.accountId) : '') + (stuck(rec, g) ? ' · <span style="color:var(--amber,#8a5a00)">⏳ ' + (L ? 'no alcanza el disponible: pendiente' : 'not enough available: pending') + '</span>' : '') + '</div>' : '') +
      (done ? '<div style="background:var(--g-light);color:var(--g-dark);border-radius:10px;padding:8px;font-size:12px;font-weight:800;text-align:center;margin-bottom:10px">🎉 ' + (L ? '¡Meta alcanzada!' : 'Goal reached!') + '</div>' : '') +
      '<div style="display:flex;gap:8px">' +
        '<button class="ft-btn ft-btn-primary tap" style="flex:2" data-abonar="' + g.id + '">' + (L ? 'Abonar' : 'Add') + '</button>' +
        '<button class="ft-btn ft-btn-ghost tap" style="flex:0 0 46px;padding:12px 0" data-edit="' + g.id + '">✏️</button>' +
        '<button class="ft-btn tap" style="flex:0 0 46px;padding:12px 0;background:var(--red-dim);color:var(--red)" data-del="' + g.id + '">🗑️</button>' +
      '</div>' +
    '</div>';
  }).join('');

  requestAnimationFrame(function () { root.querySelectorAll('.ft-fill').forEach(function (f) { f.style.width = f.getAttribute('data-pct') + '%'; }); });
  root.querySelectorAll('[data-abonar]').forEach(function (b) { b.onclick = function () { openAbonar(b.getAttribute('data-abonar')); }; });
  root.querySelectorAll('[data-edit]').forEach(function (b) { b.onclick = function () { openForm(b.getAttribute('data-edit')); }; });
  root.querySelectorAll('[data-del]').forEach(function (b) { b.onclick = function () { deleteGoal(b.getAttribute('data-del')); }; });
}

function openForm(id) {
  var L = es(), g = id ? FT.goals().find(function (x) { return String(x.id) === String(id); }) : null;
  var rec = g && g.recurring ? FT.recurGet(g.recId) : null;
  FT.modal({
    title: g ? (L ? 'Editar meta' : 'Edit goal') : (L ? 'Nueva meta' : 'New goal'),
    html:
      '<div class="ft-field"><label>' + (L ? 'Nombre de la meta' : 'Goal name') + '</label><input id="gName" value="' + (g ? esc(g.name) : '') + '" placeholder="' + (L ? 'ej. Vacaciones, Auto nuevo...' : 'e.g. Vacation, New car...') + '"></div>' +
      '<div class="ft-field"><label>' + (L ? 'Meta total' : 'Goal') + ' ($)</label><input id="gTarget" type="number" step="0.01" min="0" value="' + (g ? g.target : '') + '"></div>' +
      '<div class="ft-field"><label>' + (L ? 'Ahorrado hasta ahora' : 'Saved so far') + ' ($)</label><input id="gSaved" type="number" step="0.01" min="0" value="' + (g ? g.saved : 0) + '"></div>' +
      '<div class="ft-field"><label>' + (L ? 'Fecha límite (opcional)' : 'Deadline (optional)') + '</label><input id="gDeadline" type="date" value="' + (g ? g.deadline || '' : '') + '"></div>' +
      '<div class="ft-field"><label>' + (L ? 'Ícono' : 'Icon') + '</label><select id="gIcon">' + ICONS.map(function (i) { return '<option ' + (g && g.icon === i ? 'selected' : '') + '>' + i + '</option>'; }).join('') + '</select></div>' +
      '<div class="ft-switchrow" id="gRecRow" style="display:flex;align-items:center;justify-content:space-between;background:var(--sunk);border:1.5px solid var(--hair);border-radius:13px;padding:12px 14px;margin-bottom:13px">' +
        '<div style="font-size:12.5px;font-weight:700">🔁 ' + (L ? 'Hacer recurrente' : 'Make it recurring') + '<small style="display:block;font-weight:500;color:var(--text3);font-size:10.5px;margin-top:1px">' + (L ? 'Aporta un monto fijo automáticamente, desde la cuenta que elijas' : 'Deposits a fixed amount automatically, from the account you pick') + '</small></div>' +
        '<div class="tap" id="gRecSw" style="width:42px;height:24px;border-radius:99px;position:relative;cursor:pointer;flex-shrink:0;background:' + (g && g.recurring ? 'var(--g-main)' : 'var(--hair)') + '"><i style="position:absolute;top:3px;left:' + (g && g.recurring ? '21px' : '3px') + ';width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2)"></i></div>' +
      '</div>' +
      '<div class="ft-field" id="gRecAmtWrap" style="display:' + (g && g.recurring ? 'block' : 'none') + '"><label>' + (L ? 'Aporte automático' : 'Automatic deposit') + ' ($)</label><input id="gRecAmount" type="number" step="0.01" min="0" value="' + (rec ? rec.amount : '') + '">' +
        '<label style="margin-top:8px">' + (L ? '¿Cada cuándo?' : 'How often?') + '</label><select id="gRecFreq">' + [['weekly', L ? 'Cada semana' : 'Every week'], ['biweekly', L ? 'Cada quincena' : 'Every two weeks'], ['monthly', L ? 'Cada mes' : 'Every month']].map(function (f) { return '<option value="' + f[0] + '"' + ((rec ? rec.freq : 'monthly') === f[0] ? ' selected' : '') + '>' + f[1] + '</option>'; }).join('') + '</select>' +
        '<label style="margin-top:8px">' + (L ? '¿De qué cuenta sale?' : 'Which account does it come from?') + '</label>' + (g && g.accountId ? '<div style="font-size:12.5px;font-weight:700">' + acctName(g.accountId) + '<div style="font-size:10.5px;font-weight:500;color:var(--text3)">' + (L ? 'Esta meta vive dentro de esa cuenta' : 'This goal lives inside that account') + '</div></div>' : '<select id="gRecAcct">' + acctOpts(rec && rec.accountId) + '<option value=""' + (rec && !rec.accountId && g ? ' selected' : '') + '>' + (L ? 'Ninguna (no descuenta ninguna cuenta)' : 'None (does not deduct any account)') + '</option></select>') +
        '<div style="font-size:10.5px;color:var(--text3);margin-top:6px">' + (L ? 'Sale del disponible de esa cuenta y queda apartado para la meta. Si ese día no alcanza, queda pendiente y te avisa.' : 'It comes out of that account\'s available balance and is set aside for the goal. If it is short that day it stays pending and you get a notice.') + '</div></div>',
    saveLabel: L ? 'Guardar meta' : 'Save goal',
    onOpen: function (body) {
      var sw = body.querySelector('#gRecSw'), wrap = body.querySelector('#gRecAmtWrap');
      var on = !!(g && g.recurring);
      sw.onclick = function () {
        on = !on;
        sw.style.background = on ? 'var(--g-main)' : 'var(--hair)';
        sw.querySelector('i').style.left = on ? '21px' : '3px';
        wrap.style.display = on ? 'block' : 'none';
        sw.dataset.on = on ? '1' : '0';
      };
      sw.dataset.on = on ? '1' : '0';
    },
    onSave: function (body) {
      var name = body.querySelector('#gName').value.trim();
      var target = parseFloat(body.querySelector('#gTarget').value) || 0;
      var saved = parseFloat(body.querySelector('#gSaved').value) || 0;
      var deadline = body.querySelector('#gDeadline').value;
      var icon = body.querySelector('#gIcon').value;
      if (!name) { FT.toast(L ? '⚠️ Ingresa un nombre' : '⚠️ Enter a name'); return true; }
      if (!target) { FT.toast(L ? '⚠️ Ingresa una meta' : '⚠️ Enter a target'); return true; }
      var goals = FT.goals();
      var gg;
      var gOld = g ? goals.find(function (x) { return String(x.id) === String(id); }) : null;
      var linkedEdit = gOld && gOld.accountId && FT.checking().some(function (a) { return String(a.id) === String(gOld.accountId); });
      var more = linkedEdit ? +(saved - (parseFloat(gOld.saved) || 0)).toFixed(2) : 0;
      // Subir "Ahorrado" en una meta apartada saca dinero del disponible de su cuenta: si no alcanza, pide confirmar antes de tocar nada.
      if (more > 0.004) {
        var chkE = FT.checkOverdraft(gOld.accountId, more);
        if (!chkE.ok) {
          var an = (FT.checking().find(function (x) { return String(x.id) === String(gOld.accountId); }) || {}).name || '';
          FT.confirm(L ? '«' + esc(an) + '» quedaría en negativo (te faltan ' + FT.money(chkE.shortfall, { cents: true }) + '). ¿Guardar de todos modos?' : '"' + esc(an) + '" would go negative (short ' + FT.money(chkE.shortfall, { cents: true }) + '). Save anyway?').then(function (okE) { if (okE) { commitGoal(); FT.closeTop(); } });
          return true;
        }
      }
      commitGoal();
      function commitGoal() {
      goals = FT.goals();
      if (g) {
        gg = goals.find(function (x) { return String(x.id) === String(id); });
        // Meta apartada dentro de una cuenta: cambiar lo ahorrado mueve la diferencia contra el DISPONIBLE de esa cuenta (el total no cambia) y queda en Movimientos de la cuenta.
        if (gg.accountId && FT.checking().some(function (a) { return String(a.id) === String(gg.accountId); })) {
          var oldS = parseFloat(gg.saved) || 0;
          if (Math.abs(oldS - saved) > 0.004) { FT.creditChecking(gg.accountId, oldS - saved); gg.vaultLog = (gg.vaultLog || []).concat([{ date: FT.todayISO(), acctId: gg.accountId, amount: +(oldS - saved).toFixed(2), note: 'edit' }]).slice(-40); }
        }
        Object.assign(gg, { name: name, target: target, saved: saved, deadline: deadline, icon: icon });
      }
      else { gg = { id: 'g_' + Date.now(), name: name, target: target, saved: saved, deadline: deadline, icon: icon, recurring: false, createdAt: new Date().toISOString() }; goals.push(gg); }
      FT.saveGoals(goals);
      var wantsRec = body.querySelector('#gRecSw').dataset.on === '1';
      var recAmt = parseFloat(body.querySelector('#gRecAmount').value) || 0;
      var recFreq = (body.querySelector('#gRecFreq') || {}).value || 'monthly', recAcct = body.querySelector('#gRecAcct') ? (body.querySelector('#gRecAcct').value || null) : undefined;
      if (wantsRec && recAmt > 0) FT.setGoalRecurring(gg.id, recAmt, recFreq, recAcct);
      else if (gg.recurring) FT.clearGoalRecurring(gg.id);
      FT.toast(L ? '✅ Meta guardada' : '✅ Goal saved');
      render();
      }
    }
  });
}

function openAbonar(id) {
  var L = es(), g = FT.goals().find(function (x) { return String(x.id) === String(id); });
  if (!g) return;
  var linked = g.accountId && FT.checking().some(function (a) { return String(a.id) === String(g.accountId); });
  var accts = FT.checking().filter(function (a) { return !a.hogar; });
  var src = linked
    ? '<div class="ft-field"><label>' + (L ? '¿De qué cuenta sale?' : 'Which account does it come from?') + '</label><div style="font-size:13px;font-weight:800">' + acctName(g.accountId) + '</div><div style="font-size:10.5px;color:var(--text3)">' + (L ? 'Esta meta vive dentro de esa cuenta: el dinero pasa de su disponible a lo apartado.' : 'This goal lives inside that account: the money moves from its available balance to what is set aside.') + '</div></div>'
    : '<div class="ft-field"><label>' + (L ? '¿De qué cuenta sale?' : 'Which account does it come from?') + '</label><select id="aAcct">' + acctOpts() + '<option value="">' + (L ? 'Ninguna: ya estaba apartado fuera de mis cuentas' : 'None: it was already set aside outside my accounts') + '</option></select></div>';
  FT.modal({
    title: (L ? 'Abonar a ' : 'Add to ') + g.name,
    html: '<div class="ft-field"><label>' + (L ? 'Monto' : 'Amount') + ' ($)</label><input id="aAmount" inputmode="decimal" placeholder="0.00"></div>' + src + '<div id="aPrev" style="font-size:12px;font-weight:700;color:var(--text2);margin-top:-2px"></div>',
    saveLabel: L ? 'Abonar' : 'Add',
    onOpen: function (body) {
      var amtEl = body.querySelector('#aAmount'), sel = body.querySelector('#aAcct'), prev = body.querySelector('#aPrev');
      function acctId() { return linked ? g.accountId : (sel ? sel.value : ''); }
      function upd() {
        var a = FT.checking().find(function (x) { return String(x.id) === String(acctId()); }), v = FT.numMoney(amtEl.value);
        if (!a) { prev.textContent = ''; return; }
        var libre = FT.accountFree(a);
        var need = (v > 0 ? v : 0) + FT.goalAbsorbNeed(id, a.id);
        prev.textContent = (L ? 'Disponible ' : 'Available ') + FT.money(libre, { cents: true }) + ' → ' + (L ? 'quedará ' : 'will be ') + FT.money(libre - need, { cents: true }) + (need > v && v > 0 ? (L ? ' (incluye ' + FT.money(need - v, { cents: true }) + ' que ya tenías ahorrados en la meta)' : ' (includes ' + FT.money(need - v, { cents: true }) + ' already saved in the goal)') : '');
        prev.style.color = libre - need < -0.005 ? 'var(--red)' : 'var(--text2)';
      }
      amtEl.addEventListener('input', upd); if (sel) sel.addEventListener('change', upd); upd();
    },
    onSave: function (body) {
      var amt = FT.numMoney(body.querySelector('#aAmount').value);
      if (!(amt > 0)) { FT.toast(L ? '⚠️ Ingresa un monto' : '⚠️ Enter an amount'); return true; }
      var sel = body.querySelector('#aAcct'), acctId = linked ? g.accountId : (sel ? (sel.value || null) : null);
      function doIt() { FT.goalDeposit(id, amt, { accountId: acctId }); FT.toast(L ? '✅ Abono registrado' : '✅ Added to goal'); FT.closeTop(); render(); }
      if (acctId) {
        var chk = FT.checkOverdraft(acctId, amt + FT.goalAbsorbNeed(id, acctId));
        if (!chk.ok) { FT.confirm(L ? '«' + acctName(acctId) + '» quedaría en negativo (te faltan ' + FT.money(chk.shortfall, { cents: true }) + '). ¿Continuar?' : '"' + acctName(acctId) + '" would go negative (short ' + FT.money(chk.shortfall, { cents: true }) + '). Continue?').then(function (ok) { if (ok) doIt(); }); return true; }
      }
      doIt();
      return true;
    }
  });
}
function deleteGoal(id) {
  var L = es();
  FT.confirm(L ? '¿Eliminar esta meta?' : 'Delete this goal?').then(function (ok) {
    if (!ok) return;
    var g = FT.goals().find(function (x) { return String(x.id) === String(id); });
    if (g && g.accountId) FT.linkGoal(id, null); // lo apartado vuelve al disponible de su cuenta (no se pierde)
    if (g && g.recurring) FT.clearGoalRecurring(id);
    FT.saveGoals(FT.goals().filter(function (x) { return String(x.id) !== String(id); }));
    FT.toast(L ? '🗑️ Eliminada' : '🗑️ Deleted');
    render();
  });
}

document.addEventListener('ft:ready', function () {
  var t = function () { return FT.lang === 'es' ? 'Mis Metas' : 'My Goals'; };
  var sh = FT.shell({ active: '', title: t(), onPlus: function () { openForm(null); } });
  document.addEventListener('ft:langchange', function () { sh.setTitle(t()); render(); });
  document.addEventListener('ft:datachanged', render);
  render();
});
</script>
</body>
</html>
