<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>FinTrack Pro · Suscripciones</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<script src="premium.js"></script>
</head>
<body>
<div class="ft-app"><div class="ft-page" id="root"></div></div>
<script>
document.addEventListener('ft:ready', function () {
  var t = function () { return FT.lang === 'es' ? 'Suscripciones' : 'Subscriptions'; };
  var scr;
  var sh = FT.shell({
    active: '',
    title: t(),
    onPlus: function () { scr && scr.openForm(null); }
  });
  scr = FT.recurringItemsScreen({ kind: 'sub', mount: '#root' });
  document.addEventListener('ft:langchange', function () { sh.setTitle(t()); });
});
</script>
</body>
</html>
