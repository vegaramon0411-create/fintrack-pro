<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>FinTrack Pro · Configuración</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<script src="premium.js"></script>
<style>
:root{ --text:var(--ink); --off:var(--sunk); --border:var(--hair); }
.section{margin-bottom:20px;}
.section-title{font-size:11px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px;padding:0 4px;}
.card{background:var(--white);border:1px solid var(--border);border-radius:16px;overflow:hidden;box-shadow:0 1px 3px rgba(20,20,30,.035);}
.setting-row{display:flex;align-items:center;padding:14px 16px;border-bottom:1px solid var(--off);}
.setting-row:last-child{border-bottom:none;}
.setting-ico{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;font-size:18px;flex-shrink:0;margin-right:12px;}
.setting-info{flex:1;min-width:0;}
.setting-label{font-size:13px;font-weight:700;}
.setting-sub{font-size:11px;color:var(--text3);}
.setting-ctrl{flex-shrink:0;color:var(--text3);}
select.field-input{background:var(--off);border:1.5px solid var(--border);border-radius:10px;padding:6px 10px;font-size:13px;font-family:inherit;outline:none;}
</style>
</head>
<body>
<div class="ft-app"><div class="ft-page" id="root"></div></div>
<script>
function es() { return FT.lang === 'es'; }
function go(url) { FT.go(url); }

function render() {
  var L = es(), u = FT.user();
  document.getElementById('root').innerHTML =
  '<div class="section"><div class="section-title">' + (L ? 'CUENTA' : 'ACCOUNT') + '</div><div class="card">' +
    row('👤', 'var(--sky-bg)', L ? 'Mi Perfil' : 'My Profile', L ? 'Nombre, ingreso, metas' : 'Name, income, goals', "go('perfil.html')") +
    row('💰', 'var(--g-light)', L ? 'Saldos iniciales' : 'Starting balances', L ? 'Cuentas, ahorro, metas, deudas' : 'Accounts, savings, goals, debts', "go('onboarding.html')") +
    '<div class="setting-row"><div class="setting-ico" style="background:var(--g-light)">🌐</div><div class="setting-info"><div class="setting-label">' + (L ? 'Idioma' : 'Language') + '</div></div>' +
      '<div class="setting-ctrl"><div style="display:flex;background:var(--off);border:1px solid var(--border);border-radius:20px;overflow:hidden;font-size:11px;font-weight:700">' +
        '<div class="tap" style="padding:5px 12px;cursor:pointer;' + (L ? 'background:var(--g-main);color:#fff' : 'color:var(--text3)') + '" onclick="FT.setLang(\'es\')">ES</div>' +
        '<div class="tap" style="padding:5px 12px;cursor:pointer;' + (!L ? 'background:var(--g-main);color:#fff' : 'color:var(--text3)') + '" onclick="FT.setLang(\'en\')">EN</div></div></div></div>' +
    '<div class="setting-row"><div class="setting-ico" style="background:var(--amb-dim,rgba(224,149,46,.12))">💰</div><div class="setting-info"><div class="setting-label">' + (L ? 'Moneda' : 'Currency') + '</div></div>' +
      '<div class="setting-ctrl"><select class="field-input" id="currencySelect" onchange="saveCurrency()"><option value="USD">USD ($)</option><option value="MXN">MXN ($)</option><option value="EUR">EUR (€)</option></select></div></div>' +
  '</div></div>' +

  '<div class="section"><div class="section-title">' + (L ? 'DATOS' : 'DATA') + '</div><div class="card">' +
    row('📤', 'var(--g-light)', L ? 'Exportar respaldo' : 'Export backup', L ? 'Todo tu historial, deudas, fondos e inversiones' : 'All your history, debts, funds and investments', 'exportData()') +
    row('📥', 'var(--sky-bg)', L ? 'Restaurar respaldo' : 'Restore backup', L ? 'Desde un archivo .json exportado antes' : 'From a previously exported .json file', "document.getElementById('importFileInput').click()") +
    '<input type="file" id="importFileInput" accept=".json" style="display:none" onchange="importData(event)">' +
    '<div class="setting-row tap" style="cursor:pointer" onclick="clearData()"><div class="setting-ico" style="background:var(--red-dim)">🗑️</div><div class="setting-info"><div class="setting-label" style="color:var(--red)">' + (L ? 'Borrar todos mis datos' : 'Clear all my data') + '</div><div class="setting-sub">' + (L ? 'Esto no se puede deshacer' : 'This cannot be undone') + '</div></div><div class="setting-ctrl" style="color:var(--red)">›</div></div>' +
  '</div></div>' +

  '<div class="section"><div class="section-title">' + (L ? 'SESIÓN' : 'SESSION') + '</div><div class="card">' +
    '<div class="setting-row tap" style="cursor:pointer" onclick="FT.logout()"><div class="setting-ico" style="background:var(--red-dim)">🚪</div><div class="setting-info"><div class="setting-label" style="color:var(--red)">' + (L ? 'Cerrar sesión' : 'Sign out') + '</div></div><div class="setting-ctrl" style="color:var(--red)">›</div></div>' +
  '</div></div>' +

  '<div style="text-align:center;padding:20px 0;color:var(--text3);font-size:11px">FinTrack Pro · Versión 2.0</div>';

  if (u.currency) document.getElementById('currencySelect').value = u.currency;
}
function row(ico, bg, label, sub, onclickJs) {
  return '<div class="setting-row tap" style="cursor:pointer" onclick="' + onclickJs + '"><div class="setting-ico" style="background:' + bg + '">' + ico + '</div>' +
    '<div class="setting-info"><div class="setting-label">' + label + '</div><div class="setting-sub">' + sub + '</div></div><div class="setting-ctrl">›</div></div>';
}

function saveCurrency() {
  var u = FT.user();
  u.currency = document.getElementById('currencySelect').value;
  FT.saveUser(u);
  FT.toast(es() ? '✅ Moneda actualizada' : '✅ Currency updated');
}

function exportData() { FT.exportBackup(); FT.toast(es() ? '✅ Respaldo descargado' : '✅ Backup downloaded'); }
function importData(e) {
  var L = es(), file = e.target.files[0]; if (!file) return;
  FT.readBackupFile(file).then(function (backup) {
    var fecha = backup._meta.exportedAt ? backup._meta.exportedAt.split('T')[0] : '?';
    var ok = confirm(L
      ? 'Este respaldo es del ' + fecha + ' (de ' + (backup._meta.user || '—') + ').\n\n⚠️ Esto REEMPLAZA lo que tienes ahora mismo en este teléfono por lo del respaldo. Si tienes datos nuevos sin respaldar aquí, se perderán.\n\n¿Continuar?'
      : 'This backup is from ' + fecha + ' (by ' + (backup._meta.user || '—') + ').\n\n⚠️ This REPLACES what you currently have on this phone with what\'s in the backup. Any newer data not in this backup will be lost.\n\nContinue?');
    if (!ok) return;
    FT.applyBackup(backup);
    FT.toast(L ? '✅ Datos restaurados correctamente' : '✅ Data restored successfully');
    setTimeout(function () { go('dashboard.html'); }, 1500);
  }).catch(function () {
    FT.toast(L ? '❌ Archivo inválido' : '❌ Invalid file');
  });
  e.target.value = '';
}
function clearData() {
  var L = es();
  var h = FT.hogar();
  var warnHogar = (h && h.connected) ? (L
    ? ' También saldrás de tu hogar compartido — tu pareja no verá tus datos borrados, pero para volver a compartir necesitarán invitarse de nuevo.'
    : " You will also leave your shared household — your partner won't see your deleted data, but you'll need to invite each other again to reconnect.") : '';
  if (!confirm((L
    ? '¿Borrar TODOS tus datos? Esto también borra tu perfil (ingreso, cheque, configuración) y vas a tener que registrarte de nuevo desde cero. No se puede deshacer.'
    : "Delete ALL your data? This also erases your profile (income, paycheck, settings) and you'll have to sign up again from scratch. This cannot be undone.") + warnHogar)) return;
  FT.clearAllData();
  FT.toast(L ? '🗑️ Datos eliminados' : '🗑️ Data cleared');
  setTimeout(function () { location.href = 'login.html'; }, 1200);
}

document.addEventListener('ft:ready', function () {
  var t = function () { return FT.lang === 'es' ? 'Configuración' : 'Settings'; };
  var sh = FT.shell({ active: '', title: t() });
  document.addEventListener('ft:langchange', function () { sh.setTitle(t()); render(); });
  render();
});
</script>
</body>
</html>
