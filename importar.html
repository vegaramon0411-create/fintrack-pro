<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>FinTrack Pro · Importar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<script src="premium.js"></script>
<style>
/* Alias de nombres viejos -> tokens del DS compartido, para no tener que
   reescribir cada regla de este importador (es la pantalla mas grande de
   logica propia del rebuild: parsers de banco/broker + flujo IA). */
:root{
  --text:var(--ink); --off:var(--sunk); --border:var(--hair);
  --shadow:0 2px 12px rgba(0,0,0,.06); --shadow-md:0 4px 24px rgba(0,0,0,.09);
  --blu-dim:rgba(67,97,224,.10); --amb-dim:rgba(224,149,46,.12);
}
.steps{display:flex;gap:0;padding:4px 0 0;max-width:700px;margin:0 auto;}
.step{flex:1;text-align:center;position:relative;}
.step::after{content:'';position:absolute;top:14px;left:50%;width:100%;height:2px;background:var(--border);z-index:0;}
.step:last-child::after{display:none;}
.step-dot{width:28px;height:28px;border-radius:50%;background:var(--border);color:var(--text3);font-size:11px;font-weight:800;display:grid;place-items:center;margin:0 auto 6px;position:relative;z-index:1;transition:all .2s;}
.step.done .step-dot{background:var(--g-main);color:white;}
.step.active .step-dot{background:var(--g-dark);color:white;box-shadow:0 0 0 4px rgba(15,81,50,.15);}
.step-label{font-size:10px;font-weight:600;color:var(--text3);}
.step.active .step-label{color:var(--g-main);}
.step.done .step-label{color:var(--g-main);}
.page{padding:16px 0;max-width:700px;margin:0 auto;padding-bottom:40px;}
.card{background:var(--white);border:1px solid var(--hair);border-radius:16px;padding:18px;margin-bottom:14px;box-shadow:0 1px 3px rgba(20,20,30,.035);}
.card-title{font-size:14px;font-weight:800;margin-bottom:4px;}
.card-sub{font-size:12px;color:var(--text3);margin-bottom:16px;}
.format-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;}
.fmt-card{border:2px solid var(--border);border-radius:14px;padding:16px;cursor:pointer;transition:all .15s;background:var(--white);}
.fmt-card:hover{border-color:var(--g-main);background:var(--g-light);}
.fmt-card.selected{border-color:var(--g-main);background:var(--g-light);}
.fmt-ico{font-size:28px;margin-bottom:8px;}
.fmt-name{font-size:13px;font-weight:800;margin-bottom:3px;}
.fmt-sub{font-size:11px;color:var(--text3);}
.upload-zone{border:2px dashed var(--border);border-radius:14px;padding:32px 20px;text-align:center;cursor:pointer;transition:all .2s;background:var(--off);}
.upload-zone:hover,.upload-zone.drag{border-color:var(--g-main);background:var(--g-light);}
.upload-zone input{display:none;}
.uz-ico{font-size:36px;margin-bottom:10px;}
.uz-title{font-size:14px;font-weight:700;margin-bottom:4px;}
.uz-sub{font-size:12px;color:var(--text3);}
.credits-badge{display:flex;align-items:center;gap:8px;background:linear-gradient(135deg,var(--g-dark),var(--g-main));color:white;border-radius:10px;padding:10px 14px;margin-bottom:14px;font-size:12px;font-weight:600;}
.credits-badge .cb-num{font-size:20px;font-weight:800;margin-left:auto;}
.review-filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;}
.rf-chip{background:var(--off);border:1.5px solid var(--border);border-radius:20px;padding:6px 12px;font-size:11px;font-weight:700;cursor:pointer;color:var(--text3);}
.rf-chip.on{background:var(--g-main);border-color:var(--g-main);color:white;}
.tx-review-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--off);min-width:0;}
.tx-review-row:last-child{border-bottom:none;}
.trr-check{width:20px;height:20px;border-radius:6px;border:2px solid var(--border);display:grid;place-items:center;cursor:pointer;flex-shrink:0;}
.trr-check.on{background:var(--g-main);border-color:var(--g-main);}
.trr-status{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.trr-info{flex:1;min-width:0;}
.trr-name{font-size:12px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.trr-meta{font-size:10px;color:var(--text3);margin-top:1px;}
.trr-amt{font-size:13px;font-weight:800;flex-shrink:0;}
.trr-cat{font-size:10px;font-weight:600;padding:2px 8px;border-radius:20px;flex-shrink:0;}
.zelle-opts{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px;}
.zo-btn{font-size:10px;font-weight:700;padding:3px 9px;border-radius:20px;border:1.5px solid var(--border);cursor:pointer;background:var(--white);color:var(--text2);}
.zo-btn.on{background:var(--g-main);border-color:var(--g-main);color:white;}
.summary-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:16px;}
.sum-card{background:var(--off);border-radius:12px;padding:14px;text-align:center;}
.sum-val{font-size:20px;font-weight:800;margin-bottom:3px;}
.sum-lbl{font-size:10px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.4px;}
.dup-warn{background:#FFF3E0;border:1px solid #FAD9B5;border-radius:10px;padding:10px 12px;font-size:11px;color:#7A3B0A;margin-top:6px;display:flex;align-items:center;gap:8px;}
.ai-q{padding:12px 0;border-bottom:1px solid var(--border);}
.ai-q-label{font-size:12px;font-weight:700;color:var(--text);margin-bottom:8px;}
.ai-q-opts{display:flex;gap:6px;flex-wrap:wrap;}
.ai-opt{background:white;border:1.5px solid var(--border);border-radius:20px;padding:7px 13px;font-size:11.5px;font-weight:700;color:var(--text2);cursor:pointer;font-family:inherit;}
.ai-opt.on{background:var(--g-main);border-color:var(--g-main);color:white;}
.ai-q-input{width:100%;margin-top:8px;padding:9px 11px;border:1.5px solid var(--border);border-radius:8px;font-size:12px;font-family:inherit;box-sizing:border-box;}
</style>
</head>
<body>
<div class="ft-app"><div class="ft-page">
  <div class="steps" id="stepsBar">
    <div class="step active" id="s1"><div class="step-dot">1</div><div class="step-label" data-es="Formato" data-en="Format">Formato</div></div>
    <div class="step" id="s2"><div class="step-dot">2</div><div class="step-label" data-es="Archivo" data-en="File">Archivo</div></div>
    <div class="step" id="s3"><div class="step-dot">3</div><div class="step-label" data-es="Revisar" data-en="Review">Revisar</div></div>
    <div class="step" id="s4"><div class="step-dot">4</div><div class="step-label" data-es="Importar" data-en="Import">Importar</div></div>
  </div>
  <div class="page" id="page"></div>
</div></div>

<!-- PANEL DE CRÉDITOS IA — su propio overlay (no FT.sheet), incluye compra + canje de código -->
<div id="creditsPanel" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:400;align-items:flex-end;justify-content:center">
  <div style="background:white;border-radius:20px 20px 0 0;width:100%;max-width:500px;padding:24px;padding-bottom:calc(24px + env(safe-area-inset-bottom))">
    <div style="text-align:center;margin-bottom:16px">
      <div style="font-size:32px;margin-bottom:6px">💎</div>
      <div id="creditsPanelTitle" style="font-size:17px;font-weight:800;margin-bottom:4px">Créditos IA</div>
      <div id="creditsPanelSub" style="font-size:12px;color:var(--text3)"></div>
    </div>
    <div style="background:var(--sunk);border-radius:14px;padding:14px;margin-bottom:12px">
      <div style="font-size:12px;font-weight:800;margin-bottom:8px">⚡ <span data-es="Créditos extra — se acumulan, nunca vencen" data-en="Extra credits — they add up, never expire">Créditos extra — se acumulan, nunca vencen</span></div>
      <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-bottom:10px">
        <div style="background:white;border:1.5px solid var(--hair);border-radius:10px;padding:10px;text-align:center"><div style="font-size:18px;font-weight:800">+5</div><div style="font-size:13px;font-weight:700;color:var(--g-main)">$2.99</div></div>
        <div style="background:white;border:1.5px solid var(--hair);border-radius:10px;padding:10px;text-align:center"><div style="font-size:18px;font-weight:800">+15</div><div style="font-size:13px;font-weight:700;color:var(--g-main)">$6.99</div></div>
      </div>
      <button id="btnComprarEtsy" style="width:100%;background:var(--g-main);color:white;border:none;border-radius:10px;padding:12px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;margin-bottom:10px">🛒 <span data-es="Comprar créditos en Etsy" data-en="Buy credits on Etsy">Comprar créditos en Etsy</span></button>
      <div style="font-size:11px;color:var(--text3);text-align:center;margin-bottom:8px" data-es="Después de comprar, activa tu código aquí:" data-en="After buying, activate your code here:">Después de comprar, activa tu código aquí:</div>
      <div style="display:flex;gap:8px">
        <input id="codeInputStatic" type="text" placeholder="Ej: FZ5-R4M9" autocomplete="off" autocorrect="off" autocapitalize="characters" style="flex:1;background:white;border:1.5px solid var(--hair);border-radius:10px;padding:10px;font-size:14px;font-family:inherit;outline:none">
        <button id="btnActivarCode" style="background:var(--blue);color:white;border:none;border-radius:10px;padding:10px 16px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit">Activar</button>
      </div>
      <div id="codeResult" style="margin-top:8px;font-size:12px;font-weight:700;text-align:center;min-height:18px"></div>
    </div>
    <button id="btnCerrarCredits" style="width:100%;background:var(--sunk);border:1.5px solid var(--hair);border-radius:10px;padding:12px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit">Cerrar</button>
  </div>
</div>

<script>
var step = 1;
var importMode = null;   // 'bank' | 'fidelity' | 'manual' | 'ai'
var importIsHogar = false;
var parsedRows = [];     // filas detectadas
var reviewRows = [];     // filas clasificadas
var activeFilter = 'all';
var aiAnswers = {};

function es() { return FT.lang === 'es'; }
function go(url) { FT.go(url); }
function openCreditsPanel() {
  var L = es(), prem = FT.isPremium();
  var panel = document.getElementById('creditsPanel');
  document.getElementById('creditsPanelTitle').textContent = prem ? (L ? 'Tus créditos IA se agotaron' : 'Your AI credits ran out') : (L ? 'Función Premium' : 'Premium Feature');
  document.getElementById('creditsPanelSub').textContent = prem ? (L ? 'Usaste tus ' + MAX_AI_PREMIUM + ' créditos del mes. Compra más para seguir.' : 'You used your ' + MAX_AI_PREMIUM + ' monthly credits. Buy more to continue.') : (L ? 'El análisis IA es exclusivo para usuarios Premium.' : 'AI analysis is exclusive to Premium users.');
  panel.style.display = 'flex';
  document.getElementById('codeResult').textContent = '';
  document.getElementById('codeInputStatic').value = '';
}
var MAX_AI_PREMIUM = 10;
function activarCodigoCreditos() {
  var L = es(), input = document.getElementById('codeInputStatic'), result = document.getElementById('codeResult');
  var code = input.value.trim().toUpperCase();
  if (!code) { result.textContent = L ? '⚠️ Escribe el código' : '⚠️ Enter the code'; return; }
  var r = FT.redeemCode(code);
  if (r.ok) {
    result.style.color = 'var(--g-main)'; result.textContent = '✅ +' + r.added + ' ' + (L ? 'créditos activados' : 'credits activated');
    input.value = '';
    setTimeout(function () { document.getElementById('creditsPanel').style.display = 'none'; renderStep1(); }, 1500);
  } else {
    result.style.color = 'var(--red)'; result.textContent = '❌ ' + r.msg;
  }
}

function setStep(n) {
  step = n;
  [1, 2, 3, 4].forEach(function (i) {
    var el = document.getElementById('s' + i);
    el.classList.remove('active', 'done');
    if (i < n) el.classList.add('done');
    if (i === n) el.classList.add('active');
  });
}

/* ══════════════════════════════════════
   PASO 1 — SELECTOR DE FORMATO
══════════════════════════════════════ */
function renderStep1() {
  setStep(1);
  aiAnswers = {}; // elegir formato de nuevo = importación nueva de verdad
  var L = es();
  var isPrem = FT.isPremium(), left = FT.creditsLeft();

  document.getElementById('page').innerHTML =
  '<div class="card">' +
    '<div class="card-title">' + (L ? '¿Qué quieres importar?' : 'What do you want to import?') + '</div>' +
    '<div class="card-sub">' + (L ? 'Selecciona el tipo de archivo — detectamos el formato automáticamente' : 'Select the file type — we detect the format automatically') + '</div>' +
    '<div class="format-grid">' +
      '<div class="fmt-card" onclick="selectFormat(\'bank\')" id="fmt_bank"><div class="fmt-ico">🏦</div><div class="fmt-name">' + (L ? 'Banco' : 'Bank') + '</div><div class="fmt-sub" style="margin-bottom:8px">' + (L ? 'CSV de tu banco' : 'Your bank CSV') + '</div>' +
        '<div style="display:flex;flex-wrap:wrap;gap:3px">' + ['SoFi', 'Chase', 'Capital One', 'Wells Fargo', 'BBVA MX', 'Banorte', 'Banamex'].map(function (b) { return '<span style="font-size:9px;font-weight:600;background:var(--off);color:var(--text3);padding:1px 6px;border-radius:20px">' + b + '</span>'; }).join('') + '<span style="font-size:9px;font-weight:600;background:var(--off);color:var(--text3);padding:1px 6px;border-radius:20px">' + (L ? '+ más' : '+ more') + '</span></div></div>' +
      '<div class="fmt-card" onclick="selectFormat(\'fidelity\')" id="fmt_fidelity"><div class="fmt-ico">📈</div><div class="fmt-name">' + (L ? 'Broker / Inversiones' : 'Broker / Investments') + '</div><div class="fmt-sub" style="margin-bottom:8px">' + (L ? 'CSV de tu broker' : 'Your broker CSV') + '</div>' +
        '<div style="display:flex;flex-wrap:wrap;gap:3px">' + ['Fidelity', 'Schwab', 'Robinhood', 'Vanguard', 'GBM+', 'E*TRADE'].map(function (b) { return '<span style="font-size:9px;font-weight:600;background:var(--off);color:var(--text3);padding:1px 6px;border-radius:20px">' + b + '</span>'; }).join('') + '<span style="font-size:9px;font-weight:600;background:var(--off);color:var(--text3);padding:1px 6px;border-radius:20px">' + (L ? '+ más' : '+ more') + '</span></div></div>' +
      '<div class="fmt-card" onclick="selectFormat(\'manual\')" id="fmt_manual"><div class="fmt-ico">📋</div><div class="fmt-name">' + (L ? 'Mi hoja propia' : 'My spreadsheet') + '</div><div class="fmt-sub">' + (L ? 'CSV personalizado con tus gastos en cualquier formato' : 'Custom CSV with your expenses in any format') + '</div></div>' +
      '<div class="fmt-card" onclick="' + (isPrem && left > 0 ? "selectFormat('ai')" : 'openCreditsPanel()') + '" id="fmt_ai" style="' + (!isPrem ? 'opacity:.6' : '') + '">' +
        '<div class="fmt-ico">🤖</div><div class="fmt-name">' + (L ? 'IA — Cualquier formato ✨' : 'AI — Any format ✨') + '</div><div class="fmt-sub" style="margin-bottom:6px">' + (L ? 'Foto · PDF · CSV desconocido' : 'Photo · PDF · Unknown CSV') + '</div>' +
        '<div style="font-size:10px;color:var(--text2);margin-bottom:6px">' + (L ? 'EUA 🇺🇸 · México 🇲🇽 · Cualquier país 🌍' : 'USA 🇺🇸 · Mexico 🇲🇽 · Any country 🌍') + '</div>' +
        (!isPrem ? '<div style="font-size:9px;font-weight:700;background:var(--g-light);color:var(--g-main);padding:2px 8px;border-radius:20px;display:inline-block">💎 Premium</div>'
          : left === 0 ? '<div style="font-size:9px;font-weight:700;background:var(--amb-dim);color:var(--amber);padding:2px 8px;border-radius:20px;display:inline-block">' + (L ? 'Límite del mes alcanzado' : 'Monthly limit reached') + '</div>'
          : '<div style="font-size:9px;font-weight:700;background:var(--g-light);color:var(--g-main);padding:2px 8px;border-radius:20px;display:inline-block">✨ ' + left + ' ' + (L ? 'análisis disponibles' : 'analyses left') + '</div>') +
      '</div>' +
    '</div>' +
    (isPrem ? '<div class="credits-badge" onclick="openCreditsPanel()" style="margin-top:14px;cursor:pointer"><span>💎 ' + (L ? 'análisis IA disponibles' : 'AI analyses left') + '</span><span class="cb-num">' + left + '</span></div>' : '') +
  '</div>';
}

function selectFormat(fmt) {
  importMode = fmt;
  document.querySelectorAll('.fmt-card').forEach(function (c) { c.classList.remove('selected'); });
  var el = document.getElementById('fmt_' + fmt);
  if (el) el.classList.add('selected');
  setTimeout(renderStep2, 300);
}

/* ══════════════════════════════════════
   PASO 2 — SUBIR ARCHIVO
══════════════════════════════════════ */
function toggleAiQuestions() {
  var content = document.getElementById('aiQContent'), chev = document.getElementById('aiQChevron');
  var open = content.style.display !== 'none';
  content.style.display = open ? 'none' : 'block';
  chev.style.transform = open ? 'rotate(0deg)' : 'rotate(180deg)';
}
function toggleAiOpt(btn) {
  var q = btn.dataset.q, v = btn.dataset.v;
  var group = document.querySelectorAll('.ai-opt[data-q="' + q + '"]');
  group.forEach(function (b) { b.classList.remove('on'); });
  btn.classList.add('on');
  aiAnswers[q] = v;

  var showIf = function (id, cond) { var el = document.getElementById(id); if (el) el.style.display = cond ? 'block' : 'none'; };
  showIf('aiQ_pagaCredito', q === 'pago' && (v === 'credito' || v === 'ambos'));
  showIf('aiQ_zelleSi', q === 'zelle' && v === 'si');
  var detalle = function (id) { return document.getElementById(id); };
  if (q === 'pagaCredito') detalle('aiQ_pagaCreditoDetalle').style.display = v === 'si' ? 'block' : 'none';
  if (q === 'multiTarjeta') detalle('aiQ_multiTarjetaDetalle').style.display = v === 'si' ? 'block' : 'none';
  if (q === 'chequeCambio') detalle('aiQ_chequeCambioDetalle').style.display = v === 'si' ? 'block' : 'none';
  if (q === 'vaults') detalle('aiQ_vaultsDetalle').style.display = v === 'si' ? 'block' : 'none';
}
function buildAiInstructionsFromQuestions() {
  var L = es(), parts = [];
  var val = function (id) { var el = document.getElementById(id); return el ? el.value.trim() : ''; };

  if (aiAnswers.pago === 'credito') parts.push(L ? 'La mayoría de sus compras las paga con tarjeta de crédito.' : 'Most purchases are paid with credit card.');
  if (aiAnswers.pago === 'debito') parts.push(L ? 'La mayoría de sus compras las paga con débito o cheques.' : 'Most purchases are paid with debit or checking.');
  if (aiAnswers.pago === 'ambos') parts.push(L ? 'Paga sus compras mezclando crédito y débito/cheques.' : 'Payments are a mix of credit and debit/checking.');

  if (aiAnswers.pagaCredito === 'si') {
    var d = val('aiQ_pagaCreditoDetalle');
    parts.push(L ? 'Paga su(s) tarjeta(s) de crédito desde otra cuenta que también aparece en este archivo — ese pago de tarjeta NO es un gasto nuevo, es una transferencia interna (marca is_transfer:true).' + (d ? ' Detalle: ' + d : '')
      : 'They pay their credit card(s) from another account that also appears in this file — that card payment is NOT a new expense, it\'s an internal transfer (mark is_transfer:true).' + (d ? ' Detail: ' + d : ''));
  } else if (aiAnswers.pagaCredito === 'no') {
    parts.push(L ? 'El pago de la tarjeta ya está reflejado aparte, no viene en este archivo — no hay riesgo de duplicado por eso.' : 'The card payment is already reflected separately, not in this file — no duplicate risk from that.');
  }
  if (aiAnswers.multiTarjeta === 'si') {
    var d2 = val('aiQ_multiTarjetaDetalle');
    parts.push(L ? 'Tiene más de una tarjeta de crédito' + (d2 ? ' (' + d2 + ')' : '') + ' — trata cada una como cuenta separada, no las mezcles.' : 'They have more than one credit card' + (d2 ? ' (' + d2 + ')' : '') + ' — treat each as a separate account, don\'t merge them.');
  }
  if (aiAnswers.zelle === 'si') {
    if (aiAnswers.zelleTipo === 'cobro') parts.push(L ? 'Los depósitos de Zelle/Venmo normalmente son gente devolviéndole su parte de un gasto compartido — NO son ingreso nuevo.' : 'Zelle/Venmo deposits are usually people paying back their share of a shared expense — NOT new income.');
    else if (aiAnswers.zelleTipo === 'pago') parts.push(L ? 'Los movimientos de Zelle/Venmo normalmente son pagos suyos a alguien más — trátalos como gasto normal.' : "Zelle/Venmo movements are usually their own payments to someone else — treat as a normal expense.");
    else if (aiAnswers.zelleTipo === 'varia') parts.push(L ? 'Usa Zelle/Venmo seguido pero el motivo varía — usa el contexto de la descripción para decidir si es gasto o solo un reembolso entre personas.' : "They use Zelle/Venmo often but the reason varies — use the description context to decide if it's a real expense or just a reimbursement between people.");
  }
  if (aiAnswers.chequeCambio === 'si') {
    var d3 = aiAnswers.chequeCambioDetalle || val('aiQ_chequeCambioDetalle');
    parts.push(L ? 'Su cheque de nómina cambió de cuenta destino recientemente.' + (d3 ? ' Detalle: ' + d3 : '') + ' Usa la fecha de cada transacción para saber a cuál cuenta debió haber llegado en ese momento.' : 'Their paycheck destination account changed recently.' + (d3 ? ' Detail: ' + d3 : '') + " Use each transaction's date to figure out which account it should have landed in at that time.");
  }
  if (aiAnswers.vaults === 'si') {
    var d4 = aiAnswers.vaultsDetalle || val('aiQ_vaultsDetalle');
    parts.push(L ? 'Su banco tiene bolsillos/sub-cuentas internas (como SoFi Vaults) donde mueve dinero propio de un lado a otro — esos movimientos NUNCA son gasto ni ingreso real, siempre son transferencias internas (is_transfer:true), sin importar el nombre que tenga el bolsillo.' + (d4 ? ' Detalle: ' + d4 : '')

/* ══════════════════════════════════════
   PARSER CSV — detecta formato automáticamente
══════════════════════════════════════ */
function parseCSV(text, filename) {
  var L = es();
  var clean = text.replace(/^﻿/, '').replace(/\r\n/g, '\n').replace(/\r/g, '\n');
  var lines = clean.split('\n').filter(function (l) { return l.trim(); });

  var headerIdx = 0;
  for (var i = 0; i < Math.min(5, lines.length); i++) { if (lines[i].indexOf(',') > -1 && lines[i].length > 5) { headerIdx = i; break; } }
  var header = parseCSVLine(lines[headerIdx]).map(function (h) { return h.trim().toLowerCase(); });

  // Si el CSV no trae ninguna columna de fecha reconocible, avisar ANTES de
  // importar — si no, cada fila se guarda con la fecha de HOY en silencio,
  // y luego es imposible saber si algo se duplicó o son transacciones distintas.
  var DATE_COLS = ['fecha', 'date', 'transaction date', 'posted date', 'trade date', 'activity date', 'run date', 'authorized date', 'post date', 'process date'];
  var hasDateCol = DATE_COLS.some(function (c) { return header.indexOf(c) > -1; });
  if (!hasDateCol) {
    var seguir = confirm(L
      ? '⚠️ Este archivo no tiene una columna de fecha reconocible.\n\nSi continúas, TODAS las filas se guardarán con la fecha de HOY, y no vas a poder distinguir después si algo se duplicó o son movimientos distintos.\n\nCancela y agrega una columna "Fecha" (formato AAAA-MM-DD) antes de volver a intentar.\n\n¿Continuar de todos modos, sabiendo que perderás las fechas reales?'
      : '⚠️ This file has no recognizable date column.\n\nIf you continue, ALL rows will be saved with TODAY\'s date, and you won\'t be able to tell later if something was duplicated or is a different transaction.\n\nCancel and add a "Date" column (YYYY-MM-DD format) before trying again.\n\nContinue anyway, knowing you\'ll lose the real dates?');
    if (!seguir) {
      var zone = document.getElementById('dropZone');
      if (zone) zone.innerHTML = '<div class="uz-ico">📅</div><div class="uz-title">' + (L ? 'Agrega una columna de fecha' : 'Add a date column') + '</div><div class="uz-sub">' + (L ? 'Vuelve a subir el archivo cuando esté lista' : 'Re-upload the file once it’s ready') + '</div>';
      return;
    }
  }

  if (header.indexOf('symbol') > -1 || header.indexOf('action') > -1) { importMode = 'fidelity'; parseFidelity(header, lines.slice(headerIdx + 1)); }
  else if (header.indexOf('account name') > -1 || header.indexOf('primary category') > -1) { importMode = 'bank'; parseSoFi(header, lines.slice(headerIdx + 1)); }
  else if (header.indexOf('fecha') > -1 || header.indexOf('monto') > -1 || header.indexOf('descripción') > -1) { importMode = 'manual'; parseManual(header, lines.slice(headerIdx + 1)); }
  else { parseGeneric(header, lines.slice(headerIdx + 1)); }
}

function parseCSVLine(line) {
  var result = [], cur = '', inQ = false;
  for (var i = 0; i < line.length; i++) {
    var c = line[i];
    if (c === '"' && !inQ) { inQ = true; continue; }
    if (c === '"' && inQ) { inQ = false; continue; }
    if (c === ',' && !inQ) { result.push(cur.trim()); cur = ''; continue; }
    cur += c;
  }
  result.push(cur.trim());
  return result;
}
function parseAmount(str) {
  if (!str) return 0;
  var clean = String(str).replace(/--/, '-').replace(/\$/g, '').replace(/,/g, '').trim();
  return parseFloat(clean) || 0;
}
function parseDate(str) {
  if (!str) return FT.todayISO();
  str = str.trim();
  if (/^\d{4}-\d{2}-\d{2}$/.test(str)) return str;
  if (/^\d{1,2}\/\d{1,2}\/\d{4}$/.test(str)) { var p = str.split('/'); return p[2] + '-' + p[0].padStart(2, '0') + '-' + p[1].padStart(2, '0'); }
  var months = { ene: 1, jan: 1, feb: 2, mar: 3, abr: 4, apr: 4, may: 5, jun: 6, jul: 7, ago: 8, aug: 8, sep: 9, oct: 10, nov: 11, dic: 12, dec: 12 };
  var m2 = str.toLowerCase().match(/(\d{1,2})\s+([a-z]+)\s+(\d{4})/);
  if (m2) { var mo = months[m2[2].slice(0, 3)]; if (mo) return m2[3] + '-' + String(mo).padStart(2, '0') + '-' + m2[1].padStart(2, '0'); }
  return FT.todayISO();
}

/* ══════════════════════════════════════
   PARSER: Bancos — SoFi, Chase, Capital One,
   Wells Fargo, BBVA MX, Banorte, Banamex, etc.
══════════════════════════════════════ */
function parseSoFi(header, lines) {
  var hasCargo = header.indexOf('cargo') > -1 || header.indexOf('retiro') > -1 || header.indexOf('débito') > -1 || header.indexOf('debito') > -1;
  var hasAbono = header.indexOf('abono') > -1 || header.indexOf('depósito') > -1 || header.indexOf('deposito') > -1 || header.indexOf('crédito') > -1;
  if (hasCargo || hasAbono) { parseMexicanBank(header, lines); return; }

  function find(keys) { for (var i = 0; i < keys.length; i++) { var idx = header.indexOf(keys[i]); if (idx >= 0) return idx; } return -1; }
  var idx = {
    date: find(['authorized date', 'transaction date', 'date', 'fecha']),
    posted: find(['posted date', 'post date']),
    account: find(['account name', 'account']),
    desc: find(['description', 'merchant', 'payee', 'concepto']),
    cat: find(['primary category', 'category', 'type']),
    detcat: find(['detailed category']),
    amount: find(['amount', 'importe', 'monto']),
    debit: find(['debit amount', 'debit', 'withdrawals']),
    credit: find(['credit amount', 'credit', 'deposits'])
  };

  parsedRows = lines.filter(function (l) { return l.trim(); }).map(function (l) {
    var c = parseCSVLine(l), amount = 0;
    if (idx.amount >= 0 && c[idx.amount]) amount = parseAmount(c[idx.amount]);
    else if (idx.debit >= 0 || idx.credit >= 0) { var debit = parseAmount(c[idx.debit] || '0'), credit = parseAmount(c[idx.credit] || '0'); amount = credit > 0 ? credit : -Math.abs(debit); }
    return {
      date: parseDate(c[idx.date >= 0 ? idx.date : idx.posted] || ''),
      account: idx.account >= 0 ? (c[idx.account] || '') : '',
      desc: idx.desc >= 0 ? (c[idx.desc] || '') : '',
      cat: idx.cat >= 0 ? (c[idx.cat] || '') : '',
      detcat: idx.detcat >= 0 ? (c[idx.detcat] || '') : '',
      amount: amount
    };
  }).filter(function (r) { return r.desc; });
  classifyBankRows();
}

function parseMexicanBank(header, lines) {
  function find(keys, def) { for (var i = 0; i < keys.length; i++) { var idx = header.indexOf(keys[i]); if (idx >= 0) return idx; } return def == null ? -1 : def; }
  var idx = {
    date: find(['fecha', 'date'], 0), desc: find(['descripción', 'descripcion', 'concepto', 'description'], 1),
    cargo: find(['cargo', 'retiro', 'débito', 'debito', 'debit']), abono: find(['abono', 'depósito', 'deposito', 'crédito', 'credito', 'credit']),
    saldo: find(['saldo', 'balance'])
  };
  parsedRows = lines.filter(function (l) { return l.trim(); }).map(function (l) {
    var c = parseCSVLine(l), cargo = parseAmount(c[idx.cargo] || '0'), abono = parseAmount(c[idx.abono] || '0');
    var amount = abono > 0 ? abono : -Math.abs(cargo);
    return { date: parseDate(c[idx.date] || ''), account: 'MX', desc: c[idx.desc] || '', cat: '', detcat: '', amount: amount, currency: 'MXN' };
  }).filter(function (r) { return r.desc && r.amount !== 0; });
  classifyBankRows();
}

/* ══════════════════════════════════════
   PARSER: Manual (tu hoja)
══════════════════════════════════════ */
function parseManual(header, lines) {
  var idx = { date: header.indexOf('fecha'), desc: header.indexOf('descripción') >= 0 ? header.indexOf('descripción') : header.indexOf('descripcion'), cat: header.indexOf('categoría') >= 0 ? header.indexOf('categoría') : header.indexOf('categoria'), amount: header.indexOf('monto') };
  parsedRows = lines.filter(function (l) { return l.trim(); }).map(function (l) {
    var c = parseCSVLine(l);
    return { date: parseDate(c[idx.date] || ''), desc: c[idx.desc] || '', cat: c[idx.cat] || '', amount: parseAmount(c[idx.amount] || '0') };
  }).filter(function (r) { return r.desc; });

  reviewRows = parsedRows.map(function (r) { return Object.assign({}, r, { status: 'include', type: 'gasto', ftCat: mapManualCategory(r.cat), zelleType: null, isDuplicate: checkDuplicate(r.date, Math.abs(r.amount), r.desc), selected: true }); });
  renderStep3();
}

/* ══════════════════════════════════════
   PARSER: Brokers — Fidelity, Schwab, Robinhood, Vanguard
══════════════════════════════════════ */
function parseFidelity(header, lines) {
  var isSchwab = header.indexOf('action') > -1 && header.indexOf('symbol') > -1 && header.indexOf('run date') === -1;
  var isRobinhood = header.indexOf('activity date') > -1 || header.indexOf('trans code') > -1 || header.indexOf('instrument') > -1;
  var isVanguard = header.indexOf('trade date') > -1 && (header.indexOf('transaction type') > -1 || header.indexOf('shares') > -1);
  if (isSchwab && header.indexOf('run date') === -1) { parseSchwab(header, lines); return; }
  if (isRobinhood) { parseRobinhood(header, lines); return; }
  if (isVanguard) { parseVanguard(header, lines); return; }

  function find(keys, def) { for (var i = 0; i < keys.length; i++) { var idx = header.indexOf(keys[i]); if (idx >= 0) return idx; } return def == null ? -1 : def; }
  var idx = { date: header.indexOf('run date'), action: header.indexOf('action'), symbol: header.indexOf('symbol'), desc: header.indexOf('description'), price: find(['price ($)', 'price']), qty: header.indexOf('quantity'), amount: find(['amount ($)', 'amount']), acct: header.indexOf('account number') };

var TRANSFER_KEYWORDS = ['transfer to', 'transfer from', 'transferencia', 'zelle payment to', 'apple cash sent', 'venmo', 'paypal transfer', 'credit card payment', 'debt payment', 'sofi credit card', 'capital one payment'];
var ZELLE_KEYWORDS = ['zelle', 'apple cash', 'venmo', 'cash app', 'paypal'];
var INCOME_KEYWORDS = ['direct deposit', 'payroll', 'salary', 'deposit', 'dividend', 'interest paid'];

function isTransfer(row) {
  var d = (row.desc + ' ' + row.cat + ' ' + (row.detcat || '')).toLowerCase();
  if (row.cat && row.cat.toLowerCase().indexOf('transfer') > -1) return true;
  if (row.cat && row.cat.toLowerCase().indexOf('debt payment') > -1) return true;
  return TRANSFER_KEYWORDS.some(function (k) { return d.indexOf(k) > -1; });
}
function isZelle(row) { var d = row.desc.toLowerCase(); return ZELLE_KEYWORDS.some(function (k) { return d.indexOf(k) > -1; }); }
function isIncome(row) { var d = (row.desc + ' ' + row.cat).toLowerCase(); return INCOME_KEYWORDS.some(function (k) { return d.indexOf(k) > -1; }) && row.amount > 0; }

   REVISIÓN DE DUPLICADOS
══════════════════════════════════════ */
function checkDuplicate(date, amount, desc) {
  var txs = FT.txs();
  var dNorm = (desc || '').toLowerCase().replace(/[^a-z0-9]/g, '').slice(0, 10);
  return txs.some(function (t) {
    if (t.date !== date) return false;
    if (Math.abs(parseFloat(t.amount) - amount) > 0.01) return false;
    var tNorm = (t.desc || '').toLowerCase().replace(/[^a-z0-9]/g, '').slice(0, 10);
    return tNorm === dNorm;
  });
}

async function processAIFile(file, forcedMediaType, csvText) {
  var L = es();
  if (FT.creditsLeft() <= 0) { FT.toast(L ? '❌ Sin análisis IA disponibles este mes' : '❌ No AI analyses left this month'); renderStep2(); return; }

  var zone = document.getElementById('dropZone');
  zone.innerHTML = '<div class="uz-ico">🤖</div><div class="uz-title">' + (L ? 'Analizando con IA...' : 'Analyzing with AI...') + '</div><div class="uz-sub">' + (L ? 'Esto puede tomar unos segundos' : 'This may take a few seconds') + '</div>';

  try {
    var isCSVText = forcedMediaType === 'text/csv' && csvText;
    var isImage = !isCSVText && file.type.startsWith('image/');
    var userInstructions = buildAiInstructionsFromQuestions();

    var basePrompt = 'Extract ALL transactions from this financial document.\n' +
      (userInstructions ? '\nIMPORTANT — the user described how they manage their money, use this to correctly classify transactions, detect internal transfers, and avoid duplicating money that just moved between their own accounts (mark those "is_transfer": true instead of a real expense/income):\n"""\n' + userInstructions + '\n"""\n' : '') +
      'Respond ONLY with a raw JSON array, no markdown, no explanation:\n' +
      '[\n  {\n    "date": "YYYY-MM-DD",\n    "description": "merchant or description",\n    "amount": -10.50,\n    "category": "one of: Restaurantes, Supermercado, Gasolina, Salud, Entretenimiento, Ropa, Servicios, Inversión, Ingreso, Otros",\n    "type": "gasto or ingreso or inversion or venta",\n    "is_transfer": false,\n    "ticker": ""\n  }\n]\n' +
      'Rules:\n- Negative amounts = expenses/purchases\n- Positive amounts = income/deposits\n- Mark transfers between own accounts with "is_transfer": true\n- For investments: fill "ticker" with the stock symbol (NVDA, AAPL, etc.)\n- Ignore "Electronic Funds Transfer" lines (internal deposits to brokerage)\n- Today is ' + FT.todayISO();

    var reqImage = null, reqMediaType = null, reqPrompt = basePrompt, reqCsv = null;
    if (isCSVText) {
      reqCsv = csvText.slice(0, 8000);
    } else if (isImage) {
      reqImage = await compressAndEncode(file);
      reqMediaType = 'image/jpeg';
    } else { // PDF
      var buf = await file.arrayBuffer();
      var bytes = new Uint8Array(buf), bin = '';
      for (var i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
      reqImage = btoa(bin);
      reqMediaType = 'application/pdf';
    }

    var res = await fetch('/api/scan', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ image: reqImage, mediaType: reqMediaType, prompt: isCSVText ? basePrompt + '\n\nHere is the CSV content:\n```\n' + reqCsv + '\n```' : basePrompt, isTextOnly: isCSVText, csvContent: reqCsv })
    });
    var data = await res.json();
    FT.useCredit();

    var rows, retried = false;
    try {
      var raw = (data.raw || '').replace(/```json|```/g, '').trim();
      var parsed = data.result || JSON.parse(raw);
      rows = Array.isArray(parsed) ? parsed : [parsed];
    } catch (e) {
      if (!retried) {
        retried = true;
        zone.innerHTML = '<div class="uz-ico">🤖</div><div class="uz-title">' + (L ? 'Reintentando con formato simplificado...' : 'Retrying with simplified format...') + '</div>';
        var simplePrompt = isCSVText
          ? 'List all transactions from this CSV. For each row, respond with just: DATE|DESCRIPTION|AMOUNT\nOne per line. Use negative amounts for expenses.\n\nCSV:\n' + csvText.slice(0, 4000)
          : 'List all transactions visible in this image. For each one: DATE|DESCRIPTION|AMOUNT\nOne per line. Negative = expense.';
        try {
          var res2 = await fetch('/api/scan', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ image: isCSVText ? null : reqImage, mediaType: isCSVText ? null : (reqMediaType || 'image/jpeg'), prompt: simplePrompt, isTextOnly: isCSVText, csvContent: isCSVText ? csvText.slice(0, 4000) : null }) });
          var data2 = await res2.json();
          var raw2 = (data2.raw || data2.result || '').toString();
          rows = raw2.split('\n').filter(function (l) { return l.indexOf('|') > -1; }).map(function (l) {
            var parts = l.split('|');
            return { date: parseDate((parts[0] || '').trim()), description: (parts[1] || '').trim(), amount: parseAmount((parts[2] || '').trim()), category: 'Otros', type: parseAmount((parts[2] || '').trim()) < 0 ? 'gasto' : 'ingreso', is_transfer: false };
          }).filter(function (r) { return r.description && r.amount !== 0; });
        } catch (e2) { throw new Error(L ? 'La IA no pudo extraer transacciones tras 2 intentos' : 'AI could not extract transactions after 2 attempts'); }
      }
    }

    if (!rows || !rows.length) throw new Error(L ? 'No se encontraron transacciones en el documento' : 'No transactions found in document');

    parsedRows = rows.map(function (r) { return { date: parseDate(r.date || ''), desc: r.description || '', cat: r.category || 'Otros', amount: parseFloat(r.amount) || 0, isTransfer: r.is_transfer || false, ticker: r.ticker || '', type: r.type || 'gasto' }; });
    reviewRows = parsedRows.map(function (r) { return Object.assign({}, r, { status: r.isTransfer ? 'exclude' : 'include', type: r.type || (r.amount < 0 ? 'gasto' : 'ingreso'), ftCat: r.cat, zelleType: null, isDuplicate: checkDuplicate(r.date, Math.abs(r.amount), r.desc), selected: !r.isTransfer }); });
    renderStep3();
  } catch (err) {
    var zone2 = document.getElementById('dropZone');
    var errTitle = L ? 'Error al analizar' : 'Error analyzing', errMsg = err.message, errTip = '';
    if (err.message.indexOf('API key') > -1) { errTitle = L ? '⚙️ Error de configuración' : '⚙️ Configuration error'; errMsg = L ? 'La API key no está configurada correctamente.' : 'API key is not configured correctly.'; errTip = L ? 'Contacta al soporte de FinTrack Pro.' : 'Contact FinTrack Pro support.'; }
    else if (err.message.indexOf('413') > -1 || err.message.indexOf('too large') > -1 || err.message.indexOf('grande') > -1) { errTitle = L ? '📏 Archivo demasiado grande' : '📏 File too large'; errMsg = L ? 'El archivo es muy pesado. Intenta con una imagen más pequeña o menos páginas.' : 'File is too large. Try a smaller image or fewer pages.'; }
    else if (err.message.indexOf('429') > -1 || err.message.indexOf('rate') > -1) { errTitle = L ? '⏳ Demasiadas solicitudes' : '⏳ Too many requests'; errMsg = L ? 'Espera unos segundos e intenta de nuevo.' : 'Wait a few seconds and try again.'; }
    else if (err.message.indexOf('No transactions') > -1 || err.message.indexOf('No se encontraron') > -1) { errTitle = L ? '🔍 Sin transacciones detectadas' : '🔍 No transactions detected'; errMsg = L ? '¿Es un estado de cuenta o recibo válido? Asegúrate de que la imagen sea clara.' : 'Is this a valid statement or receipt? Make sure the image is clear.'; }
    else if (err.message.indexOf('tras 2 intentos') > -1 || err.message.indexOf('after 2 attempts') > -1) { errTitle = L ? '🤖 La IA no pudo procesar este formato' : '🤖 AI could not process this format'; errMsg = L ? 'Prueba con el importador CSV manual o toma una foto más clara.' : 'Try the manual CSV importer or take a clearer photo.'; }
    if (zone2) zone2.innerHTML = '<div class="uz-ico">❌</div><div class="uz-title" style="margin-bottom:6px">' + errTitle + '</div><div class="uz-sub" style="margin-bottom:' + (errTip ? '4px' : '12px') + '">' + errMsg + '</div>' + (errTip ? '<div class="uz-sub" style="margin-bottom:12px;font-style:italic">' + errTip + '</div>' : '') + '<button class="ft-btn ft-btn-ghost tap" style="max-width:200px;margin:0 auto;display:block" onclick="renderStep2()">' + (L ? '← Intentar de nuevo' : '← Try again') + '</button>';
  }
}

async function compressAndEncode(file) {
  return new Promise(function (resolve) {
    var reader = new FileReader();
    reader.onload = function (e) {
      var img = new Image();
      img.onload = function () {
        var canvas = document.createElement('canvas'), w = img.width, h = img.height;
        if (w > 1200) { h = Math.round(h * 1200 / w); w = 1200; }
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', 0.8).split(',')[1]);
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

      if (!u || !u.email) return;
      var data = await FT.checkAccess(u.email);
      if (data && data.creditsExtra && data.creditsExtra > 0) {
        var c = FT.getCredits();
        if (data.creditsExtra > (c.extra || 0)) { c.extra = data.creditsExtra; FT.set(FT.K.aiCredits, c); if (step === 1) renderStep1(); }
      }
    } catch (e) {}
  })();
});
</script>
