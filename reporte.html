<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>FinTrack Pro · Reporte Mensual</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<script src="premium.js"></script>
<style>
/* El reporte se ve deliberadamente distinto al resto de la app — es un
   "documento" generado, no otra pantalla más — pero vive dentro de FT.shell()
   como todas las demás para que la navegación sea idéntica. */
:root{
  --amb-dim:rgba(224,149,46,.12); --pur-dim:rgba(123,94,167,.10); --blu-dim:rgba(67,97,224,.10);
}
.period-bar{display:flex;gap:8px;padding:0 0 14px;overflow-x:auto;scrollbar-width:none;}
.period-bar::-webkit-scrollbar{display:none;}
.p-chip{background:var(--sunk);border:1.5px solid var(--hair);border-radius:20px;padding:7px 16px;font-size:12px;font-weight:700;cursor:pointer;color:var(--text3);white-space:nowrap;flex-shrink:0;font-family:inherit;}
.p-chip.on{background:var(--ink);border-color:var(--ink);color:#fff;}
.report-shell{background:var(--white);border:1px solid var(--hair);border-radius:20px;overflow:hidden;box-shadow:0 1px 3px rgba(20,20,30,.035);}
.rh{background:linear-gradient(135deg,#0F5132 0%,#1A7A4A 60%,#22A362 100%);padding:28px 24px 24px;color:white;position:relative;overflow:hidden;}
.rh::before{content:'';position:absolute;top:-40px;right:-40px;width:160px;height:160px;border-radius:50%;background:rgba(255,255,255,.08);}
.rh::after{content:'';position:absolute;bottom:-50px;left:30px;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.05);}
.rh-logo{display:flex;align-items:center;gap:9px;margin-bottom:18px;position:relative;z-index:1;}
.rh-mark{width:34px;height:34px;background:rgba(255,255,255,.2);border-radius:11px;display:grid;place-items:center;font-size:16px;}
.rh-brand{font-size:15px;font-weight:800;}
.rh-title{font-size:23px;font-weight:800;letter-spacing:-.5px;margin-bottom:4px;position:relative;z-index:1;}
.rh-sub{font-size:12px;opacity:.7;position:relative;z-index:1;}
.rh-period{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.18);border-radius:20px;padding:5px 13px;font-size:11px;font-weight:700;margin-top:12px;position:relative;z-index:1;}
.rb{padding:24px 20px;}
.rg{font-size:14px;color:var(--text2);line-height:1.6;margin-bottom:22px;padding-bottom:22px;border-bottom:1px solid var(--hair);}
.rs{font-size:12px;font-weight:800;color:var(--ink);margin-bottom:12px;}
.kpi-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:22px;}
.kpi{background:var(--sunk);border-radius:12px;padding:14px;text-align:center;}
.kpi-ico{font-size:20px;margin-bottom:6px;}
.kpi-val{font-size:17px;font-weight:800;letter-spacing:-.4px;}
.kpi-lbl{font-size:9px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.4px;margin-top:2px;}
.rule-wrap{background:var(--sunk);border-radius:12px;padding:16px;margin-bottom:22px;}
.rule-item{margin-bottom:14px;}
.rule-item:last-child{margin-bottom:0;}
.rule-hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;}
.rule-name{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700;}
.rule-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
.rule-right{display:flex;align-items:center;gap:8px;font-size:10px;}
.rule-amts{color:var(--text3);}
.rule-pct{font-size:10px;font-weight:700;padding:2px 7px;border-radius:20px;}
.rule-track{background:var(--hair);border-radius:100px;height:7px;overflow:hidden;}
.rule-fill{height:100%;border-radius:100px;transition:width 1s ease;}
.cat-list{margin-bottom:22px;}
.cat-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--hair);}
.cat-row:last-child{border-bottom:none;}
.cat-ico{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;font-size:14px;flex-shrink:0;}
.cat-name{font-size:12px;font-weight:700;flex:1;}
.cat-r{text-align:right;}
.cat-amt{font-size:12px;font-weight:800;}
.cat-pct{font-size:10px;color:var(--text3);}
.cmp-wrap{background:var(--sunk);border-radius:12px;padding:4px 0;margin-bottom:22px;}
.cmp-row{display:flex;justify-content:space-between;align-items:center;padding:9px 14px;border-bottom:1px solid var(--hair);}
.cmp-row:last-child{border-bottom:none;}
.cmp-lbl{font-size:12px;color:var(--text2);}
.cmp-vals{display:flex;align-items:center;gap:8px;}
.cmp-prev{font-size:11px;color:var(--text3);font-weight:600;}
.cmp-curr{font-size:12px;font-weight:800;}
.cmp-delta{font-size:9px;font-weight:700;padding:2px 6px;border-radius:20px;}
.delta-bad{background:var(--red-dim);color:var(--red);}
.delta-good{background:var(--g-light);color:var(--g-main);}
.delta-neutral{background:var(--chip);color:var(--text3);}
.ins-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:22px;}
.ins{border-radius:10px;padding:12px;font-size:11px;line-height:1.5;}
.ins strong{font-weight:800;display:block;margin-bottom:2px;font-size:12px;}
.ins-warn{background:var(--red-dim);color:#8B1A24;}
.ins-good{background:var(--g-light);color:var(--g-dark);}
.ins-info{background:var(--blu-dim);color:#1D2C5E;}
.ins-tip{background:var(--amb-dim);color:#7A3B0A;}
.tx-section{margin-bottom:20px;}
.tx-sec-hd{font-size:12px;font-weight:800;padding:10px 14px;border-radius:10px 10px 0 0;display:flex;justify-content:space-between;align-items:center;}
.tx-row{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid rgba(0,0,0,.04);}
.tx-row:last-child{border-bottom:none;}
.tx-ico{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;font-size:14px;flex-shrink:0;}
.tx-info{flex:1;min-width:0;}
.tx-name{font-size:12px;font-weight:700;}
.tx-meta{font-size:10px;color:var(--text3);margin-top:1px;display:flex;align-items:center;gap:5px;}
.tx-tag{font-size:9px;font-weight:700;padding:1px 6px;border-radius:20px;}
.tx-amt{font-size:13px;font-weight:800;flex-shrink:0;}
.sum-box{background:linear-gradient(135deg,var(--g-dark),var(--g-main));border-radius:14px;padding:18px 20px;color:white;margin-bottom:6px;}
.sum-row{display:flex;justify-content:space-between;align-items:center;font-size:12px;margin-bottom:7px;}
.sum-row:last-child{margin-bottom:0;}
.sum-divider{height:1px;background:rgba(255,255,255,.2);margin:10px 0;}
.sum-total{font-size:16px!important;font-weight:800!important;}
.page-divider{text-align:center;padding:20px 0;color:var(--text3);font-size:11px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;}
.rf{background:var(--sunk);padding:20px;text-align:center;border-top:1px solid var(--hair);}
.rf-logo{display:flex;align-items:center;justify-content:center;gap:7px;margin-bottom:8px;}
.rf-mark{width:26px;height:26px;background:linear-gradient(135deg,var(--g-dark),var(--g-main));border-radius:8px;display:grid;place-items:center;font-size:12px;}
.rf-name{font-size:13px;font-weight:800;}
.rf-text{font-size:10px;color:var(--text3);line-height:1.6;}
.rf-links{display:flex;justify-content:center;gap:14px;margin-top:10px;}
.rf-link{font-size:10px;color:var(--g-main);text-decoration:none;font-weight:700;}
@media print{
  .ft-header,.ft-nav,.period-bar{display:none!important;}
  .ft-page{padding:0;}
  .report-shell{box-shadow:none;border-radius:0;}
  body{background:white;}
}
</style>
</head>
<body>
<div class="ft-app"><div class="ft-page">
  <div class="period-bar" id="periodBar"></div>
  <div id="page"></div>
</div></div>
<script>
var selectedPeriod = null; // { year, month, key } — null = mes más reciente con datos
function es() { return FT.lang === 'es'; }
var MONTH_NAMES_ES = ['Enero', 'Febrero', 'Marzo', 'Abril', 'Mayo', 'Junio', 'Julio', 'Agosto', 'Septiembre', 'Octubre', 'Noviembre', 'Diciembre'];
var MONTH_NAMES_EN = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
function monthName(m, l) { return l === 'es' ? MONTH_NAMES_ES[m] : MONTH_NAMES_EN[m]; }
function money(n) { return FT.money(n, { cents: true }); }

var CATEGORY_TYPE_MAP = {
  '🛒 Supermercado': 'needs', '🏠 Renta / Hipoteca': 'needs', '⛽ Gasolina': 'needs',
  '💊 Salud': 'needs', '📱 Teléfono/Internet': 'needs', '🔧 Mantenimiento': 'needs',
  '🍔 Restaurantes': 'wants', '🎬 Entretenimiento': 'wants', '👕 Ropa': 'wants',
  '✈️ Viajes': 'wants', '📦 Otros': 'wants'
};
var CAT_COLORS = {
  '🛒': '#1A7A4A', '🏠': '#E14B4F', '⛽': '#4361E0', '💊': '#22A362',
  '📱': '#7B5EA7', '🔧': '#E0952E', '🍔': '#E0952E', '🎬': '#7B5EA7',
  '👕': '#7B5EA7', '✈️': '#4361E0', '📦': '#A0A3AF', 'default': '#A0A3AF'
};
function catColor(cat) { return CAT_COLORS[String(cat).split(' ')[0]] || CAT_COLORS.default; }
function getCategoryType(cat) { return CATEGORY_TYPE_MAP[cat] || 'wants'; }

function getAvailablePeriods() {
  var seen = {};
  FT.txs().forEach(function (t) {
    var p = String(t.date || '').split('-').map(Number);
    if (p.length < 2) return;
    var key = p[0] + '-' + (p[1] - 1);
    seen[key] = { year: p[0], month: p[1] - 1, key: key };
  });
  return Object.keys(seen).map(function (k) { return seen[k]; }).sort(function (a, b) { return b.year - a.year || b.month - a.month; });
}
function getTxForPeriod(year, month) {
  return FT.txs().filter(function (t) {
    var p = String(t.date || '').split('-').map(Number);
    return p.length >= 2 && p[0] === year && (p[1] - 1) === month;
  });
}
function calcTotals(txs) {
  var t = { ingreso: 0, gasto: 0, inversion: 0, ahorro: 0, suscripcion: 0, hipoteca: 0 };
  txs.forEach(function (tx) { t[tx.type] = (t[tx.type] || 0) + (parseFloat(tx.amount) || 0); });
  t.spent = t.gasto + t.suscripcion + t.hipoteca;
  var needsSpent = 0, wantsSpent = 0;
  txs.forEach(function (tx) {
    if (['gasto', 'suscripcion', 'hipoteca'].indexOf(tx.type) === -1) return;
    var amt = parseFloat(tx.amount) || 0;
    if (tx.type === 'hipoteca') { needsSpent += amt; return; }
    if (getCategoryType(tx.cat) === 'needs') needsSpent += amt; else wantsSpent += amt;
  });
  t.needsSpent = needsSpent; t.wantsSpent = wantsSpent;
  t.savedTotal = t.ahorro + t.inversion;
  t.superavit = t.ingreso - t.spent - t.savedTotal;
  return t;
}
function getCatTotals(txs) {
  var cats = {};
  txs.filter(function (t) { return ['gasto', 'hipoteca', 'suscripcion'].indexOf(t.type) > -1; }).forEach(function (t) {
    var cat = t.cat || '📦 Otros';
    if (!cats[cat]) cats[cat] = { amount: 0, emoji: cat.split(' ')[0], color: catColor(cat) };
    cats[cat].amount += parseFloat(t.amount) || 0;
  });
  return Object.keys(cats).map(function (name) { return Object.assign({ name: name }, cats[name]); }).sort(function (a, b) { return b.amount - a.amount; });
}

function renderPeriodBar() {
  var periods = getAvailablePeriods();
  var now = new Date();
  if (!periods.length) periods.push({ year: now.getFullYear(), month: now.getMonth(), key: now.getFullYear() + '-' + now.getMonth() });
  if (!selectedPeriod) selectedPeriod = periods[0];
  document.getElementById('periodBar').innerHTML = periods.map(function (p) {
    return '<button class="p-chip tap ' + (selectedPeriod.key === p.key ? 'on' : '') + '" data-y="' + p.year + '" data-m="' + p.month + '" data-k="' + p.key + '">' + monthName(p.month, FT.lang) + ' ' + p.year + '</button>';
  }).join('');
  document.querySelectorAll('#periodBar [data-k]').forEach(function (b) {
    b.onclick = function () { selectedPeriod = { year: parseInt(b.getAttribute('data-y'), 10), month: parseInt(b.getAttribute('data-m'), 10), key: b.getAttribute('data-k') }; renderPeriodBar(); renderReport(); };
  });
}

function renderReport() {
  var L = es(), page = document.getElementById('page');

  if (!FT.isPremium()) {
    page.innerHTML = '<div style="text-align:center;padding:60px 20px;max-width:440px;margin:0 auto">' +
      '<div style="font-size:48px;margin-bottom:14px">🔒</div>' +
      '<div style="font-size:18px;font-weight:800;margin-bottom:8px">' + (L ? 'Función Premium' : 'Premium Feature') + '</div>' +
      '<div style="font-size:13px;color:var(--text3);margin-bottom:22px">' + (L ? 'El reporte mensual está disponible en el plan Premium.' : 'The monthly report is available in the Premium plan.') + '</div>' +
      '<button class="ft-btn ft-btn-primary tap" style="width:auto;padding:12px 26px" onclick="FT.showUpgradeModal()">💎 ' + (L ? 'Activar Premium' : 'Activate Premium') + '</button></div>';
    return;
  }
  if (!selectedPeriod) { page.innerHTML = ''; return; }

  var year = selectedPeriod.year, month = selectedPeriod.month;
  var txs = getTxForPeriod(year, month), totals = calcTotals(txs), cats = getCatTotals(txs);
  var prevMonth = month === 0 ? 11 : month - 1, prevYear = month === 0 ? year - 1 : year;
  var prevTxs = getTxForPeriod(prevYear, prevMonth), prevTotals = calcTotals(prevTxs);

  var u = FT.user();
  var income = u.income || 0, needs = u.needs || Math.round(income * .50), wants = u.wants || Math.round(income * .30), savings = u.savings || Math.round(income * .20);
  var nPct = needs > 0 ? Math.min(Math.round(totals.needsSpent / needs * 100), 999) : 0;
  var wPct = wants > 0 ? Math.min(Math.round(totals.wantsSpent / wants * 100), 999) : 0;
  var sPct = savings > 0 ? Math.min(Math.round(totals.savedTotal / savings * 100), 999) : 0;

  var periodLabel = monthName(month, FT.lang) + ' ' + year;
  var planLabel = FT.isPremium() ? (L ? 'Plan Premium' : 'Premium Plan') : (L ? 'Plan Free' : 'Free Plan');

  var T = L ? {
    greeting: 'Hola <strong>' + (u.name || 'Usuario') + '</strong> 👋<br><br>Aquí está tu resumen financiero de <strong>' + periodLabel + '</strong>. Este mes tuviste un ingreso de <strong>' + money(totals.ingreso) + '</strong> y gastaste <strong>' + money(totals.spent) + '</strong>' + (totals.superavit >= 0 ? ', lo que representa un superávit de <strong style="color:var(--g-main)">+' + money(totals.superavit) + '</strong>. ¡Sigue así!' : ', resultando en un déficit de <strong style="color:var(--red)">-' + money(Math.abs(totals.superavit)) + '</strong>. Analiza tus gastos para mejorar.'),
    summary: 'Resumen del mes', income: 'Ingreso', spent: 'Gastado', saved: 'Ahorrado/Invertido',
    rule: 'Regla 50 / 30 / 20', needs: 'Necesidades', wants: 'Gustos', savings: 'Ahorro',
    topCats: 'Top categorías', vsLast: 'Comparativa vs. mes anterior', insights: 'Insights del mes', detailTitle: 'Detalle de movimientos',
    incomes: 'Ingresos', expenses: 'Gastos', investments: 'Inversiones', savings2: 'Ahorro',
    finalSummary: 'Resumen final', totalInc: 'Total ingresos', totalExp: 'Total gastos',
    totalInv: 'Inversiones', totalSav: 'Ahorro', netSurplus: 'Superávit neto', netDeficit: 'Déficit neto', noTx: 'Sin movimientos este mes'
  } : {
    greeting: 'Hi <strong>' + (u.name || 'User') + '</strong> 👋<br><br>Here\'s your financial summary for <strong>' + periodLabel + '</strong>. This month you earned <strong>' + money(totals.ingreso) + '</strong> and spent <strong>' + money(totals.spent) + '</strong>' + (totals.superavit >= 0 ? ', resulting in a surplus of <strong style="color:var(--g-main)">+' + money(totals.superavit) + '</strong>. Keep it up!' : ', resulting in a deficit of <strong style="color:var(--red)">-' + money(Math.abs(totals.superavit)) + '</strong>. Review your expenses to improve.'),
    summary: 'Monthly summary', income: 'Income', spent: 'Spent', saved: 'Saved/Invested',
    rule: '50 / 30 / 20 Rule', needs: 'Needs', wants: 'Wants', savings: 'Savings',
    topCats: 'Top categories', vsLast: 'Comparison vs. last month', insights: 'Monthly insights', detailTitle: 'Transaction detail',
    incomes: 'Income', expenses: 'Expenses', investments: 'Investments', savings2: 'Savings',
    finalSummary: 'Final summary', totalInc: 'Total income', totalExp: 'Total expenses',
    totalInv: 'Investments', totalSav: 'Savings', netSurplus: 'Net surplus', netDeficit: 'Net deficit', noTx: 'No transactions this month'
  };

  var insights = [];
  if (nPct >= 90) insights.push({ cls: 'ins-warn', title: '🚨 ' + T.needs + ' al ' + nPct + '%', body: L ? 'Superaste tu límite de Necesidades por ' + money(totals.needsSpent - needs) + '.' : 'You exceeded your Needs limit by ' + money(totals.needsSpent - needs) + '.' });
  else insights.push({ cls: 'ins-good', title: '✅ ' + T.needs + ' bajo control', body: L ? 'Usaste solo el ' + nPct + '% de tu límite. Te quedan ' + money(needs - totals.needsSpent) + '.' : 'You used only ' + nPct + '% of your limit. ' + money(needs - totals.needsSpent) + ' remaining.' });
  if (wPct <= 50) insights.push({ cls: 'ins-good', title: '✅ ' + T.wants + ' optimizados', body: L ? 'Solo el ' + wPct + '% de tu límite. Tienes ' + money(wants - totals.wantsSpent) + ' disponibles.' : 'Only ' + wPct + '% of your limit. ' + money(wants - totals.wantsSpent) + ' available.' });
  else insights.push({ cls: 'ins-info', title: '💡 ' + T.wants + ' al ' + wPct + '%', body: L ? 'Llevas ' + money(totals.wantsSpent) + ' en gustos. Tu límite es ' + money(wants) + '.' : 'You\'ve spent ' + money(totals.wantsSpent) + ' on wants. Your limit is ' + money(wants) + '.' });
  if (totals.inversion > 0) insights.push({ cls: 'ins-good', title: '📈 Invertiste ' + money(totals.inversion), body: L ? '¡Excelente hábito para tu futuro financiero!' : 'Excellent habit for your financial future!' });
  else insights.push({ cls: 'ins-tip', title: '💡 ' + (L ? 'Sin inversiones este mes' : 'No investments this month'), body: L ? 'Considera invertir aunque sea una pequeña cantidad.' : 'Consider investing even a small amount.' });
  if (totals.superavit > 0) insights.push({ cls: 'ins-good', title: '💚 Superávit +' + money(totals.superavit), body: L ? 'Terminaste el mes con dinero positivo. ¡Bien hecho!' : 'You ended the month with positive cash flow. Well done!' });
  else insights.push({ cls: 'ins-warn', title: '🔴 ' + (L ? 'Déficit' : 'Deficit') + ' -' + money(Math.abs(totals.superavit)), body: L ? 'Gastaste más de lo que ingresaste. Revisa tus categorías.' : 'You spent more than you earned. Review your categories.' });

  function delta(curr, prev, goodIfDown) {
    var diff = curr - prev;
    if (Math.abs(diff) < 0.01) return '<span class="cmp-delta delta-neutral">= ' + (L ? 'igual' : 'same') + '</span>';
    var isGood = goodIfDown ? diff < 0 : diff > 0;
    return '<span class="cmp-delta ' + (isGood ? 'delta-good' : 'delta-bad') + '">' + (diff > 0 ? '+' : '') + money(Math.abs(diff)) + '</span>';
  }

  var TYPE_ICO = { gasto: '💸', ingreso: '💰', inversion: '📈', ahorro: '🛡️', suscripcion: '🔄', hipoteca: '🏠' };
  var TYPE_BG = { gasto: 'var(--red-dim)', ingreso: 'var(--g-light)', inversion: 'var(--blu-dim)', ahorro: 'var(--amb-dim)', suscripcion: 'var(--pur-dim)', hipoteca: 'var(--red-dim)' };
  var TYPE_CLR = { gasto: 'var(--red)', ingreso: 'var(--g-main)', inversion: 'var(--blue)', ahorro: 'var(--amber)', suscripcion: 'var(--purple)', hipoteca: 'var(--red)' };

  function txRows(list) {
    if (!list.length) return '<div style="padding:14px;text-align:center;font-size:12px;color:var(--text3)">' + T.noTx + '</div>';
    return list.slice().sort(function (a, b) { return new Date(b.date) - new Date(a.date); }).map(function (t) {
      var d = FT.date(t.date, 'D MMM'), isIncome = t.type === 'ingreso';
      return '<div class="tx-row"><div class="tx-ico" style="background:' + (TYPE_BG[t.type] || 'var(--sunk)') + '">' + (TYPE_ICO[t.type] || '💳') + '</div>' +
        '<div class="tx-info"><div class="tx-name">' + (t.desc || t.cat || t.type) + '</div>' +
        '<div class="tx-meta">' + d + (t.cat ? ' · <span class="tx-tag" style="background:' + (TYPE_BG[t.type] || 'var(--sunk)') + ';color:' + (TYPE_CLR[t.type] || 'var(--text2)') + '">' + t.cat + '</span>' : '') + '</div></div>' +
        '<div class="tx-amt" style="color:' + (isIncome ? 'var(--g-main)' : 'var(--red)') + '">' + (isIncome ? '+' : '-') + money(t.amount) + '</div></div>';
    }).join('');
  }

  var incomeList = txs.filter(function (t) { return t.type === 'ingreso'; });
  var gastoList = txs.filter(function (t) { return ['gasto', 'hipoteca', 'suscripcion'].indexOf(t.type) > -1; });
  var inversionList = txs.filter(function (t) { return t.type === 'inversion'; });
  var ahorroList = txs.filter(function (t) { return t.type === 'ahorro'; });
  var netLabel = totals.superavit >= 0 ? T.netSurplus : T.netDeficit;
  var netColor = totals.superavit >= 0 ? '#22A362' : '#FF6B6B';

  page.innerHTML =
  '<div class="report-shell">' +

        ruleItem('var(--blue)', T.wants, totals.wantsSpent, wants, wPct, 'var(--blue)', 'var(--blu-dim)', 'var(--blue)') +
        ruleItem('var(--amber)', T.savings, totals.savedTotal, savings, sPct, 'var(--amber)', 'var(--amb-dim)', 'var(--amber)') +
      '</div>' +

      '<div class="rs">' + T.topCats + '</div>' +
      '<div class="cat-list">' + (cats.length ? cats.slice(0, 6).map(function (c) {
        var pct = totals.spent > 0 ? Math.round(c.amount / totals.spent * 100) : 0;
        return '<div class="cat-row"><div class="cat-ico" style="background:' + c.color + '22">' + c.emoji + '</div>' +
          '<div style="flex:1;min-width:0"><div class="cat-name">' + c.name + '</div><div style="height:3px;border-radius:100px;background:' + c.color + ';width:' + pct + '%;max-width:120px;margin-top:5px"></div></div>' +
          '<div class="cat-r"><div class="cat-amt" style="color:' + c.color + '">' + money(c.amount) + '</div><div class="cat-pct">' + pct + '%</div></div></div>';
      }).join('') : '<div style="padding:14px;text-align:center;font-size:12px;color:var(--text3)">' + T.noTx + '</div>') + '</div>' +

      (prevTxs.length ? '<div class="rs">' + T.vsLast + ' (' + monthName(prevMonth, FT.lang) + ' ' + prevYear + ')</div>' +
        '<div class="cmp-wrap">' +
          '<div class="cmp-row"><span class="cmp-lbl">' + T.income + '</span><div class="cmp-vals"><span class="cmp-prev">' + money(prevTotals.ingreso) + '</span><span class="cmp-curr" style="color:var(--g-main)">' + money(totals.ingreso) + '</span>' + delta(totals.ingreso, prevTotals.ingreso, false) + '</div></div>' +
          '<div class="cmp-row"><span class="cmp-lbl">' + T.spent + '</span><div class="cmp-vals"><span class="cmp-prev">' + money(prevTotals.spent) + '</span><span class="cmp-curr" style="color:var(--red)">' + money(totals.spent) + '</span>' + delta(totals.spent, prevTotals.spent, true) + '</div></div>' +
          '<div class="cmp-row"><span class="cmp-lbl">' + T.investments + '</span><div class="cmp-vals"><span class="cmp-prev">' + money(prevTotals.inversion) + '</span><span class="cmp-curr" style="color:var(--blue)">' + money(totals.inversion) + '</span>' + delta(totals.inversion, prevTotals.inversion, false) + '</div></div>' +
          '<div class="cmp-row"><span class="cmp-lbl">' + T.savings + '</span><div class="cmp-vals"><span class="cmp-prev">' + money(prevTotals.ahorro) + '</span><span class="cmp-curr" style="color:var(--amber)">' + money(totals.ahorro) + '</span>' + delta(totals.ahorro, prevTotals.ahorro, false) + '</div></div>' +
        '</div>' : '') +

      '<div class="rs">' + T.insights + '</div>' +
      '<div class="ins-grid">' + insights.map(function (i) { return '<div class="ins ' + i.cls + '"><strong>' + i.title + '</strong>' + i.body + '</div>'; }).join('') + '</div>' +
    '</div>' +

    '<div class="rf"><div class="rf-logo"><div class="rf-mark">💎</div><div class="rf-name">FinTrack Pro</div></div>' +
      '<div class="rf-text">' + (L ? 'Reporte generado localmente — tus datos nunca salen de tu dispositivo.' : 'Report generated locally — your data never leaves your device.') + '</div>' +
      '<div class="rf-links"><a href="dashboard.html" class="rf-link">' + (L ? 'Ir al Dashboard' : 'Go to Dashboard') + '</a><a href="analisis.html" class="rf-link">' + (L ? 'Ver Análisis' : 'View Analysis') + '</a></div></div>' +

    '<div class="page-divider">── ' + (L ? 'Página 2 de 2 — Detalle de movimientos' : 'Page 2 of 2 — Transaction detail') + ' ──</div>' +

    '<div class="rh" style="background:linear-gradient(135deg,#1D2C5E 0%,#2D4A9E 55%,#4361E0 100%)">' +
      '<div class="rh-logo"><div class="rh-mark">📋</div><div class="rh-brand">FinTrack Pro</div></div>' +
      '<div class="rh-title">' + T.detailTitle + '</div><div class="rh-sub">' + periodLabel + '</div>' +
      '<div class="rh-period">📊 ' + txs.length + ' ' + (L ? 'movimientos registrados' : 'registered transactions') + '</div></div>' +

    '<div class="rb">' +
      '<div class="kpi-row">' +
        '<div class="kpi"><div class="kpi-ico">💰</div><div class="kpi-val" style="color:var(--g-main)">' + money(totals.ingreso) + '</div><div class="kpi-lbl">' + T.incomes + '</div></div>' +
        '<div class="kpi"><div class="kpi-ico">💸</div><div class="kpi-val" style="color:var(--red)">' + money(totals.spent) + '</div><div class="kpi-lbl">' + T.expenses + '</div></div>' +
        '<div class="kpi"><div class="kpi-ico">📈</div><div class="kpi-val" style="color:var(--blue)">' + money(totals.inversion) + '</div><div class="kpi-lbl">' + T.investments + '</div></div>' +
      '</div>' +
      (incomeList.length ? '<div class="tx-section"><div class="tx-sec-hd" style="background:var(--g-light);color:var(--g-dark)">💰 ' + T.incomes + '<span style="background:var(--g-main);color:white;font-size:10px;padding:3px 10px;border-radius:20px">+' + money(totals.ingreso) + '</span></div><div style="background:#F7FBF9;border-radius:0 0 12px 12px;border:1px solid #D4EDE1;border-top:none">' + txRows(incomeList) + '</div></div>' : '') +
      (gastoList.length ? '<div class="tx-section"><div class="tx-sec-hd" style="background:var(--red-dim);color:#8B1A24">💸 ' + T.expenses + '<span style="background:var(--red);color:white;font-size:10px;padding:3px 10px;border-radius:20px">-' + money(totals.spent) + '</span></div><div style="background:#FEF9F9;border-radius:0 0 12px 12px;border:1px solid #F5C6CA;border-top:none">' + txRows(gastoList) + '</div></div>' : '') +
      (inversionList.length ? '<div class="tx-section"><div class="tx-sec-hd" style="background:var(--blu-dim);color:#1D2C5E">📈 ' + T.investments + '<span style="background:var(--blue);color:white;font-size:10px;padding:3px 10px;border-radius:20px">-' + money(totals.inversion) + '</span></div><div style="background:#F5F7FF;border-radius:0 0 12px 12px;border:1px solid #C7D2FA;border-top:none">' + txRows(inversionList) + '</div></div>' : '') +
      (ahorroList.length ? '<div class="tx-section"><div class="tx-sec-hd" style="background:var(--amb-dim);color:#7A3B0A">🛡️ ' + T.savings2 + '<span style="background:var(--amber);color:white;font-size:10px;padding:3px 10px;border-radius:20px">-' + money(totals.ahorro) + '</span></div><div style="background:#FFFAF5;border-radius:0 0 12px 12px;border:1px solid #FAD9B5;border-top:none">' + txRows(ahorroList) + '</div></div>' : '') +
      '<div class="sum-box"><div style="font-size:11px;opacity:.7;margin-bottom:12px;font-weight:700;text-transform:uppercase;letter-spacing:.5px">' + T.finalSummary + '</div>' +
        '<div class="sum-row"><span style="opacity:.8">' + T.totalInc + '</span><strong>+' + money(totals.ingreso) + '</strong></div>' +
        '<div class="sum-row"><span style="opacity:.8">' + T.totalExp + '</span><strong>-' + money(totals.spent) + '</strong></div>' +
        '<div class="sum-row"><span style="opacity:.8">' + T.totalInv + '</span><strong>-' + money(totals.inversion) + '</strong></div>' +
        '<div class="sum-row"><span style="opacity:.8">' + T.totalSav + '</span><strong>-' + money(totals.ahorro) + '</strong></div>' +
        '<div class="sum-divider"></div>' +
        '<div class="sum-row sum-total"><span style="opacity:.9">' + netLabel + '</span><strong style="font-size:20px;color:' + netColor + '">' + (totals.superavit >= 0 ? '+' : '-') + money(Math.abs(totals.superavit)) + '</strong></div></div>' +
    '</div>' +

    '<div class="rf"><div class="rf-logo"><div class="rf-mark">💎</div><div class="rf-name">FinTrack Pro</div></div>' +
      '<div class="rf-text">' + (L ? 'Tus datos son completamente privados y nunca salen de tu dispositivo.' : 'Your data is completely private and never leaves your device.') + '</div>' +
      '<div class="rf-links"><a href="https://www.etsy.com/shop/finanzone" class="rf-link">Etsy · finanzone</a><a href="mailto:finanzone@gmail.com" class="rf-link">' + (L ? 'Soporte' : 'Support') + '</a></div></div>' +
  '</div>';

  requestAnimationFrame(function () { document.querySelectorAll('.rule-fill[data-pct]').forEach(function (f) { f.style.width = f.getAttribute('data-pct') + '%'; }); });
}
function ruleItem(dotColor, label, spent, limit, pct, barColor, pctBg, pctColor) {
  return '<div class="rule-item"><div class="rule-hd"><div class="rule-name"><div class="rule-dot" style="background:' + dotColor + '"></div>' + label + '</div>' +
    '<div class="rule-right"><span class="rule-amts">' + money(spent) + ' / ' + money(limit) + '</span><span class="rule-pct" style="background:' + pctBg + ';color:' + pctColor + '">' + pct + '%</span></div></div>' +
    '<div class="rule-track"><div class="rule-fill" data-pct="' + Math.min(pct, 100) + '" style="width:0;background:' + barColor + '"></div></div></div>';
}

function downloadPDF() {
  var period = selectedPeriod ? monthName(selectedPeriod.month, FT.lang) + ' ' + selectedPeriod.year : 'Reporte';
  document.title = 'FinTrack Pro · ' + period;
  window.print();
  setTimeout(function () { document.title = 'FinTrack Pro · Reporte Mensual'; }, 2000);
}
function manualRefresh() {
  renderPeriodBar(); renderReport();
  FT.toast(es() ? '🔄 Reporte actualizado' : '🔄 Report refreshed');
}

document.addEventListener('ft:ready', function () {
  var t = function () { return FT.lang === 'es' ? 'Reporte Mensual' : 'Monthly Report'; };
  var sh = FT.shell({
    active: '', title: t(),
    kebab: [
      { label: '🔄 ' + (es() ? 'Refrescar' : 'Refresh'), onClick: manualRefresh },
      { label: '⬇️ ' + (es() ? 'Descargar PDF' : 'Download PDF'), onClick: downloadPDF }
    ]
  });
  document.addEventListener('ft:langchange', function () { sh.setTitle(t()); renderPeriodBar(); renderReport(); });
  document.addEventListener('ft:datachanged', function () { renderPeriodBar(); renderReport(); });

  renderPeriodBar();
  renderReport();

  // Refrescar en vivo: al volver a esta pestaña, o si otra pestaña cambió los datos
  document.addEventListener('visibilitychange', function () { if (!document.hidden) { renderPeriodBar(); renderReport(); } });
  window.addEventListener('focus', function () { renderPeriodBar(); renderReport(); });
  window.addEventListener('storage', function (e) {
    if (['ft_data', 'ft_debts', 'ft_subs', 'ft_investments', 'ft_hogar_inv', 'ft_hogar'].indexOf(e.key) > -1) { renderPeriodBar(); renderReport(); }
  });
});
</script>
