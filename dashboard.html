<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>FinTrack Pro · Inicio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<script src="premium.js"></script>
<style>
  /* dashboard.html — tokens y clases .ft-* vienen de premium.js */
  .d-hero{text-align:center;margin-bottom:8px;cursor:pointer;}
  .d-hero .cap{font-size:12px;font-weight:700;color:var(--text3);display:inline-flex;align-items:center;gap:5px;}
  .d-hero .row{display:flex;align-items:center;justify-content:center;gap:11px;margin-top:8px;}
  .d-hero .sign{width:23px;height:23px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:14px;font-weight:900;}
  .d-hero .sign.neg{background:var(--red);}.d-hero .sign.pos{background:var(--g-main);}
  .d-hero .amt{font-family:var(--round-font);font-weight:900;font-size:47px;letter-spacing:-1.8px;line-height:1;font-variant-numeric:tabular-nums;}
  .d-hero .amt .cur{font-size:.42em;color:var(--text3);font-weight:800;margin-right:4px;letter-spacing:0;}
  .d-split{display:flex;justify-content:center;gap:8px;margin-top:15px;flex-wrap:wrap;}
  .d-split .c{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:800;padding:7px 12px;border-radius:99px;background:var(--chip);font-variant-numeric:tabular-nums;cursor:pointer;}
  .d-split .c small{color:var(--text3);font-weight:700;}
  .d-split .c .m{width:15px;height:15px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:9px;font-weight:900;}
  .d-split .c .m.neg{background:var(--red);}.d-split .c .m.pos{background:var(--g-main);}

  .d-bud-h{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:10px;}
  .d-bud-h .t{font-size:11px;font-weight:700;color:var(--text3);}
  .d-bud-h .r{font-family:var(--round-font);font-weight:900;font-size:18px;letter-spacing:-.5px;cursor:pointer;background:none;border:none;color:var(--ink);}
  .d-bud-a{display:flex;justify-content:space-between;margin-top:11px;font-size:10.5px;font-weight:700;color:var(--text3);}
  .d-bud-a button{background:none;border:none;color:var(--text3);font-weight:700;font-size:10.5px;cursor:pointer;font-family:var(--ui-font);}
  .d-bud-day{font-size:10.5px;font-weight:700;color:var(--text3);text-align:center;margin-top:9px;padding-top:9px;border-top:1px solid var(--hair);}

  .d-legend{font-size:9.5px;color:var(--text3);text-align:center;display:flex;align-items:center;justify-content:center;gap:5px;margin-top:8px;}
  .d-legend i{width:14px;border-top:1.5px dashed #C9CACF;display:inline-block;}

  .d-mrow{margin-bottom:14px;}
  .d-mrow .mt{display:flex;justify-content:space-between;align-items:center;font-size:11.5px;font-weight:700;margin-bottom:6px;}
  .d-mrow .mt .l{color:var(--text2);cursor:pointer;display:inline-flex;align-items:center;gap:4px;background:none;border:none;font-family:var(--ui-font);font-weight:700;font-size:11.5px;}
  .d-mrow .mt .n{font-family:var(--round-font);font-weight:800;color:var(--text3);font-variant-numeric:tabular-nums;}
  .d-mrow .mt .n b{color:var(--ink);}
  .d-mtrack{height:7px;border-radius:99px;background:var(--sunk);overflow:hidden;}
  .d-mfill{height:100%;border-radius:99px;transition:width .8s cubic-bezier(.22,1,.36,1);}
  .d-mrow .foot{display:flex;justify-content:space-between;font-size:9.5px;color:var(--text3);margin-top:4px;font-weight:700;}
  .d-alert{display:flex;gap:8px;align-items:center;background:var(--red-dim);color:#B23B3F;border-radius:11px;padding:9px 12px;font-size:11.5px;font-weight:700;margin-top:6px;}

  .d-cheque .sub{font-size:11px;color:var(--text3);margin:3px 0 12px;}
  .d-empty{text-align:center;color:var(--text3);font-size:12.5px;padding:24px 10px;}
</style>
</head>
<body>
<div class="ft-app"><div class="ft-page" id="dashRoot"></div></div>

<script>
var MONTH_OFF = 0;      // 0 = mes actual, -1 = anterior…
var HERO_VIEW = 0;      // 0 Personal · 1 Hogar · 2 Patrimonio
var TAB = FT.getRaw('ft_dash_tab', 'resumen');
var shell;

var MES = { es:['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'],
            en:['January','February','March','April','May','June','July','August','September','October','November','December'] };

function viewDate(off) { var d = new Date(); d.setDate(1); d.setMonth(d.getMonth() + (off == null ? MONTH_OFF : off)); return d; }
function monthKey(off) { var d = viewDate(off); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0'); }
function monthLabel() { var d = viewDate(); return MES[FT.lang][d.getMonth()] + ' ' + d.getFullYear(); }

function greeting() {
  var h = new Date().getHours();
  var es = FT.lang === 'es';
  var g = h < 12 ? (es ? 'Buenos días' : 'Good morning') : h < 19 ? (es ? 'Buenas tardes' : 'Good afternoon') : (es ? 'Buenas noches' : 'Good evening');
  return g + ', ' + (FT.user().name || '').split(' ')[0];
}
function daysLeft() {
  if (MONTH_OFF !== 0) return 0;
  var d = new Date(), last = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate();
  return last - d.getDate();
}

/* ── cálculos ── */
function monthTxs(off) {
  var mk = monthKey(off);
  return FT.txsCounted().filter(function (t) { return String(t.date || '').slice(0, 7) === mk; });
}
function totals() {
  var txs = monthTxs();
  var t = { gasto: 0, ingreso: 0, ahorro: 0, inversion: 0, suscripcion: 0, hipoteca: 0, needs: 0, wants: 0, hogarTotal: 0, txs: txs };
  // 15-oct-2026, a petición EXPLÍCITA de Ramón (confirmado vía pregunta
  // directa, tras idas y vueltas en esta misma sesión -- las partes 18-22
  // habían llegado a que un gasto de hogar pagado con TU cuenta personal
  // sí contaba contra tu presupuesto personal; Ramón pidió revertir eso a
  // separación TOTAL por etiqueta): cualquier movimiento marcado
  // hogar:true (gasto, ahorro, inversión) NUNCA cuenta hacia tu lado
  // personal, sin importar con qué cuenta se pagó NI si el hogar sigue
  // conectado ahora mismo -- la etiqueta de la transacción decide sola.
  // (Revisión encontró que condicionar esto a FT.hogarConnected() creaba
  // un desacuerdo real con FT.personalAvailable(), que nunca filtró por
  // conexión: si desconectas el hogar a medio mes con transacciones
  // hogar:true ya guardadas -- la etiqueta nunca se borra sola --, antes
  // esas transacciones volvían a contar aquí pero no en personalAvailable().
  // `t.hogarTotal` sigue sumando TODO el gasto marcado de hogar (para la
  // vista combinada "Gasto del hogar en [mes]", hogarCombined, más abajo;
  // esa vista ya está oculta cuando el hogar no está conectado, así que
  // sumar aquí sin condicionar a `conn` no cambia nada visible).
  txs.forEach(function (x) {
    var a = parseFloat(x.amount) || 0;
    var isExpenseType = x.type === 'gasto' || x.type === 'suscripcion' || x.type === 'hipoteca';
    if (x.hogar === true) {
      if (isExpenseType) t.hogarTotal += a;
      return; // separación total por etiqueta -- nunca toca tu lado personal
    }
    if (x.type === 'ingreso' && x.incomeKind === 'venta') return; // venta de inversión: no es dinero nuevo
    t[x.type] = (t[x.type] || 0) + a;
    if (isExpenseType) {
      var kind = x.type === 'hipoteca' ? 'needs' : FT.entryCategoryType(x.cat);
      if (kind === 'needs') t.needs += a; else t.wants += a;
    }
  });
  t.personalAhorro = t.ahorro;
  // 15-oct-2026, a petición de Ramón: el ahorro apartado a un fondo sigue
  // siendo tuyo mientras no lo retires ni lo uses -- no es un gasto, así
  // que no debe restar de "Presupuesto restante"/"Gastado este mes". La
  // inversión sí sigue restando ("no está en mi cuenta"). Nota: esto es
  // DISTINTO de patrimonio().disp (más abajo), que sigue restando ahorro a
  // propósito -- ahí el ahorro se suma de vuelta via FT.savingsBalance(),
  // así que la resta ahí es necesaria para no contarlo dos veces en el
  // patrimonio total. t.spent es solo para presupuesto/gasto del mes, no
  // para patrimonio.
  t.spent = t.needs + t.wants + t.inversion;
  return t;
}
function partnerHogarSpent() {
  var h = FT.hogar();
  if (!h.connected || !h.partnerEmail) return 0;
  var pp = FT.get('profile_' + h.partnerEmail.replace(/[^a-z0-9]/gi, '_'), null);
  if (!pp || !pp.data || !pp.data.transactions) return 0;
  var mk = monthKey();
  return pp.data.transactions.filter(function (t) {
    return t.hogar === true && String(t.date || '').slice(0, 7) === mk && ['gasto', 'suscripcion', 'hipoteca'].indexOf(t.type) > -1;
  }).reduce(function (s, t) { return s + (parseFloat(t.amount) || 0); }, 0);
}
// 15-oct-2026, a petición de Ramón: antes, en cuanto había hogar
// conectado, esto IGNORABA por completo el plan que hubieras elegido en
// Perfil (ej. 70/20/10) y forzaba 50/30/20 de fábrica -- los montos en $
// se recalculaban bien contra tu % personal nuevo, pero el plan
// desaparecía en silencio. Ahora se usan SIEMPRE needsPct/wantsPct/
// savingsPct guardados (50/30/20 solo como default si nunca elegiste
// nada) aplicados sobre `base` -- con hogar o sin él, el plan se respeta
// y los montos en $ nunca quedan desfasados si el ingreso cambia después.
function limits() {
  var u = FT.user(), income = u.income || 0;
  var conn = FT.hogarConnected();
  var base = conn ? income * FT.personalPct() / 100 : income;
  var needsPct = u.needsPct != null ? u.needsPct : 50;
  var wantsPct = u.wantsPct != null ? u.wantsPct : 30;
  var savingsPct = u.savingsPct != null ? u.savingsPct : 20;
  return { base: base, needs: base * needsPct / 100, wants: base * wantsPct / 100, savings: base * savingsPct / 100, income: income };
}
function patrimonio() {
  var invVal = FT.investments().reduce(function (s, i) { return s + FT.investmentValue(i); }, 0);
  var mk = monthKey();
  var inc = FT.txsCounted().filter(function (t) { return t.type === 'ingreso' && String(t.date || '').slice(0, 7) === mk; });
  // 19-oct-2026: misma regla que FT.personalAvailable() -- solo 'cheque' se
  // reparte; el resto es 100% tuyo; 'venta' no cuenta (no es dinero nuevo).
  var cheque = inc.filter(function (t) { return t.incomeKind === 'cheque'; }).reduce(function (s, t) { return s + (parseFloat(t.amount) || 0); }, 0);
  var extra = inc.filter(function (t) { return t.incomeKind !== 'cheque' && t.incomeKind !== 'venta'; }).reduce(function (s, t) { return s + (parseFloat(t.amount) || 0); }, 0);
  var t = totals();
  // QA 29-sep-2026: si adelantas un gasto de hogar con tu cuenta PERSONAL,
  // ese dinero también sale de tu patrimonio -- no solo de tu presupuesto
  // 15-oct-2026: mismo criterio de separación total por etiqueta que
  // totals() ya usa -- ningún gasto/ahorro/inversión marcado hogar:true
  // toca tu patrimonio personal, sin importar con qué cuenta se pagó
  // (t.needs/t.wants/t.personalAhorro/t.inversion ya lo excluyen por
  // completo desde totals()).
  var disp = cheque * FT.personalPct() / 100 + extra - t.needs - t.wants - t.personalAhorro - t.inversion;
  return {
    total: FT.savingsBalance() + FT.emergencyBalance() + invVal + (FT.hogarConnected() ? disp : Math.max(0, disp)),
    parts: [
      [FT.lang === 'es' ? 'Ahorro libre' : 'Free savings', FT.savingsBalance()],
      [FT.lang === 'es' ? 'Fondo de emergencia' : 'Emergency fund', FT.emergencyBalance()],
      [FT.lang === 'es' ? 'Inversiones' : 'Investments', invVal],
      [FT.lang === 'es' ? 'Disponible personal' : 'Personal available', disp]
    ]
  };
}
// 12-oct-2026, a petición de Ramón: "necesito que todo esté registrado
// para poder analizar cuánto se va de mi presupuesto" -- esta función y
// catItems() más abajo (el "Resumen" del dashboard) solo contaban
// type:'gasto', dejando afuera suscripciones/hipoteca (mismo tipo de
// salida personal, solo con otro `type`) y TODO lo que se va a ahorro/
// inversión (reparto automático a fondos, aportes recurrentes) -- ese
// dinero sí sale de tu disponible del mes, solo no es "gasto" en el
// sentido de un gusto/necesidad. _CAT_EXPENSE_TYPES son los que ya tenían
// `cat` propio (se agrupan por categoría real, igual que siempre);
// ahorro/inversión no tienen una categoría granular así que se juntan en
// dos barras nuevas fijas.
var _CAT_EXPENSE_TYPES = { gasto: 1, suscripcion: 1, hipoteca: 1 };
function catBudgets() {
  var acc = {}, seen = {};
  for (var k = 1; k <= 3; k++) {
    monthTxs(MONTH_OFF - k).forEach(function (x) {
      if (x.hogar === true) return;
      var l;
      if (_CAT_EXPENSE_TYPES[x.type]) l = catLabel(x.cat);
      else if (x.type === 'ahorro') l = FT.lang === 'es' ? 'Ahorro' : 'Savings';
      else if (x.type === 'inversion') l = FT.lang === 'es' ? 'Inversión' : 'Investment';
      else return;
      acc[l] = (acc[l] || 0) + (parseFloat(x.amount) || 0);
    });
    var mk = monthKey(MONTH_OFF - k); seen[mk] = 1;
  }
  var months = Object.keys(seen).length || 3;
  var out = {};
  Object.keys(acc).forEach(function (l) { out[l] = acc[l] / months; });
  return out;
}
function catLabel(cat) { var m = String(cat || '').match(/^(\S+)\s+(.*)$/); return m ? m[2] : String(cat || ''); }
// 15-oct-2026, a petición de Ramón (con capturas): "cuando cambiamos de
// pantalla de personal a hogar se tiene que ver sus gastos" -- las barras
// de categoría de abajo del hero NUNCA cambiaban según la vista (siempre
// mostraban tus categorías PERSONALES, incluso viendo "Gasto del hogar").
// Mismo alcance que hogarCombined ya usa para el número de arriba (gasto/
// suscripción/hipoteca marcados hogar:true, tuyos + de tu pareja) -- así
// el número de la tarjeta y las barras de abajo cuentan exactamente lo
// mismo. Sin contorno de promedio-3-meses aquí: el perfil sincronizado de
// tu pareja solo trae SU mes actual (FT.pushProfileToGAS limita a
// thisMonth a propósito, nunca guarda su historial), no hay forma
// honesta de calcular un promedio de 3 meses que incluya su parte.
function hogarCatItems() {
  var byCat = {}, mk = monthKey();
  var h = FT.hogar(), partnerTxs = [];
  if (h.connected && h.partnerEmail) {
    var pp = FT.get('profile_' + h.partnerEmail.replace(/[^a-z0-9]/gi, '_'), null);
    partnerTxs = (pp && pp.data && pp.data.transactions) || [];
  }
  function add(list) {
    list.forEach(function (x) {
      if (x.hogar !== true || String(x.date || '').slice(0, 7) !== mk) return;
      if (['gasto', 'suscripcion', 'hipoteca'].indexOf(x.type) === -1) return;
      var l = catLabel(x.cat);
      byCat[l] = (byCat[l] || 0) + (parseFloat(x.amount) || 0);
    });
  }
  add(monthTxs());
  add(partnerTxs);
  var all = monthTxs().concat(partnerTxs);
  return Object.keys(byCat).map(function (l) {
    var emojiMatch = all.find(function (x) { return x.hogar === true && catLabel(x.cat) === l; });
    var em = emojiMatch ? (String(emojiMatch.cat).match(/^(\S+)\s/) || ['', ''])[1] : '';
    return { cat: (em ? em + ' ' : '') + l, spent: byCat[l] };
  });
}

/* ── render ── */
function render() {
  var es = FT.lang === 'es';
  var u = FT.user(), t = totals(), L = limits();
  // hogarCombined = gasto REAL de la casa (mío + de mi pareja), sin
  // importar de qué cuenta salió cada quien -- t.hogarTotal siempre sumó
  // todo lo marcado hogar:true sin importar la cuenta (totals() ya no
  // tiene un campo separado t.hogar desde el 15-oct-2026 -- separación
  // total por etiqueta, ver comentario en totals()).
  var hogarCombined = t.hogarTotal + partnerHogarSpent();
  // Presupuesto del hogar (QA 29-sep-2026): mismo cálculo que ya usa
  // hogar.html (hogarBudgetHero) -- % combinado (pago + ahorro de casa)
  // sobre el ingreso combinado de los dos. Se replica aquí en vez de
  // llamar a una función de hogar.html porque viven en archivos/scripts
  // separados -- sin tocar el módulo Hogar, solo se lee lo mismo que él ya
  // expone vía FT.hogar()/FT.partnerProfile().
  var hg = FT.hogar();
  var hogarPctTotal = (parseFloat(hg.payPctHogar) || 50) + (parseFloat(hg.saveHogarPct) || 10);
  var ppr = FT.partnerProfile();
  var combinedIncome = (u.income || 0) + (ppr ? (ppr.income || 0) : 0);
  var hogarBudget = combinedIncome * hogarPctTotal / 100;
  var hogarBudgetLeft = hogarBudget - hogarCombined;
  var pendingReparto = FT.pendingReparto();
  // FT.accountTotal (Fase 3) incluye lo apartado en fondos vinculados -- si
  // no hay ninguno vinculado, es exactamente lo mismo que sumar c.amount.
  var myPersonalAccts = FT.checking().filter(function (c) { return !c.hogar; }).reduce(function (a, c) { return a + FT.accountTotal(c); }, 0);

  // HERO
  var heroCap, heroAmt, heroSign, splitHTML = '';
  if (HERO_VIEW === 2) {
    var pat = patrimonio();
    heroCap = es ? 'Patrimonio personal' : 'Personal net worth'; heroAmt = pat.total; heroSign = 'pos';
  } else if (HERO_VIEW === 1) {
    // 15-oct-2026: el inglés se quedaba fijo en "Household spending" sin el
    // mes, mientras el español sí navegaba con las flechas de mes del shell
    // (viewDate()/MONTH_OFF) y lo mostraba -- un usuario en inglés que
    // retrocedía de mes veía el mismo texto sin importar qué mes miraba.
    heroCap = es ? 'Gasto del hogar en ' + MES[FT.lang][viewDate().getMonth()].toLowerCase() : 'Household spending in ' + MES.en[viewDate().getMonth()]; heroAmt = hogarCombined; heroSign = 'neg';
  } else {
    heroCap = es ? 'Gastado en ' + MES[FT.lang][viewDate().getMonth()].toLowerCase() : 'Spent in ' + MES.en[viewDate().getMonth()]; heroAmt = t.spent; heroSign = 'neg';
    splitHTML =
      '<div class="d-split">' +
        '<button class="c" onclick="explain(\'ingreso\')"><span class="m pos">+</span>' + FT.money(t.ingreso, { cents: true }) + ' <small>' + (es ? 'ingreso' : 'income') + '</small></button>' +
        (FT.hogarConnected() ? '<button class="c" onclick="explain(\'hogar\')"><span class="m neg">−</span>' + FT.money(hogarCombined, { cents: true }) + ' <small>' + (es ? 'hogar' : 'household') + '</small></button>' : '') +
      '</div>';
  }
  // N6: el hero mostraba redondeado a entero (regla original "sin decimales
  // en cifras grandes") mientras "Presupuesto restante"/$/día ya mostraban
  // centavos en el mismo vistazo -- dos rondas de QA distintas lo siguieron
  // marcando como "3 formatos" pese al fix previo de posicion del "$".
  // Se retira la excepcion: el hero ahora también muestra centavos, igual
  // que el resto de la pantalla (mismo criterio en FT.balanceScreen, abajo).
  var mp = FT.moneyParts(heroAmt, { cents: true });

  // BUDGET
  // Presupuesto = 100% personal (QA 29-sep-2026): contra L.base (tu % del
  // cheque, ej. 40%), no L.income (el cheque completo) -- si no, "Presupuesto
  // restante" mezclaba tu presupuesto personal con el 60%/lo que sea que se
  // va a hogar, que nunca fue tuyo para empezar. Sin hogar conectado,
  // L.base === L.income (limits() ya lo resuelve así), cero cambio para
  // quien no usa Hogar.
  var budgetLeft = (L.base || 0) - t.spent;
  var dl = daysLeft();
  var perDay = (L.base > 0 && dl > 0) ? Math.max(0, budgetLeft / dl) : 0;
  var spentPct = L.base > 0 ? Math.min(100, t.spent / L.base * 100) : 0;

  // La tarjeta "Presupuesto" cambia con la vista del hero (QA 29-sep-2026):
  // en la vista de Hogar (tocar el número grande la cicla), deja de decir
  // "tu presupuesto" y muestra el presupuesto REAL del hogar (los dos
  // juntos) en vez de seguir mostrando el personal -- antes se quedaba
  // fijo en personal sin importar qué vista del hero estuvieras viendo.
  var showHogarBudget = FT.hogarConnected() && HERO_VIEW === 1;
  var budCap = showHogarBudget ? (es ? 'Presupuesto del hogar' : 'Household budget') : (es ? 'Presupuesto de ' + MES[FT.lang][viewDate().getMonth()].toLowerCase() : 'Budget for ' + MES[FT.lang][viewDate().getMonth()].toLowerCase());
  var budLeftShown = showHogarBudget ? hogarBudgetLeft : budgetLeft;
  var budSpentPct = showHogarBudget ? (hogarBudget > 0 ? Math.min(100, hogarCombined / hogarBudget * 100) : 0) : spentPct;
  var budPerDay = showHogarBudget ? (hogarBudget > 0 && dl > 0 ? Math.max(0, hogarBudgetLeft / dl) : 0) : perDay;
  var budExplainKind = showHogarBudget ? 'presupuestoHogar' : 'presupuesto';

  // CATEGORY BARS -- 12-oct-2026: antes solo 'gasto', dejando afuera
  // suscripciones/hipoteca (mismo tipo de salida, otro `type`) y lo que se
  // va a ahorro/inversión (reparto automático, aportes recurrentes) --
  // Ramón: "necesito que todo esté registrado para analizar cuánto se va
  // de mi presupuesto". _CAT_EXPENSE_TYPES se agrupan por su categoría
  // real; ahorro/inversión no tienen categoría granular, se juntan en dos
  // barras fijas (mismas etiquetas que catBudgets() usa para el contorno).
  // showHogarBudget (ver arriba): las barras de categoría siguen a la
  // MISMA vista que ya sigue la tarjeta de presupuesto -- Hogar muestra
  // SOLO gasto de hogar (hogarCatItems, tuyo + de tu pareja), Personal
  // sigue mostrando solo lo tuyo, igual que siempre.
  var catItems;
  if (showHogarBudget) {
    catItems = hogarCatItems();
  } else {
    var budgets = catBudgets();
    var byCat = {}, ahorroThis = 0, invThis = 0;
    t.txs.forEach(function (x) {
      if (x.hogar === true) return;
      if (_CAT_EXPENSE_TYPES[x.type]) { var l = catLabel(x.cat); byCat[l] = (byCat[l] || 0) + (parseFloat(x.amount) || 0); }
      else if (x.type === 'ahorro') ahorroThis += parseFloat(x.amount) || 0;
      else if (x.type === 'inversion') invThis += parseFloat(x.amount) || 0;
    });
    catItems = Object.keys(byCat).map(function (l) {
      var emojiMatch = t.txs.find(function (x) { return _CAT_EXPENSE_TYPES[x.type] && catLabel(x.cat) === l; });
      var em = emojiMatch ? (String(emojiMatch.cat).match(/^(\S+)\s/) || ['', ''])[1] : '';
      return { cat: (em ? em + ' ' : '') + l, spent: byCat[l], budget: budgets[l] || 0 };
    });
    var ahorroLbl = es ? 'Ahorro' : 'Savings', invLbl = es ? 'Inversión' : 'Investment';
    if (ahorroThis > 0.005) catItems.push({ cat: '💰 ' + ahorroLbl, spent: ahorroThis, budget: budgets[ahorroLbl] || 0 });
    if (invThis > 0.005) catItems.push({ cat: '📈 ' + invLbl, spent: invThis, budget: budgets[invLbl] || 0 });
  }

  // MÉTODO
  var nP = L.needs > 0 ? Math.min(100, t.needs / L.needs * 100) : 0;
  var wP = L.wants > 0 ? Math.min(100, t.wants / L.wants * 100) : 0;
  var savingsSpent = t.personalAhorro + t.inversion;
  var sP = L.savings > 0 ? Math.min(100, savingsSpent / L.savings * 100) : 0;

  var lastTxs = t.txs.slice().sort(function (a, b) { return String(b.date).localeCompare(String(a.date)) || b.id - a.id; }).slice(0, 6);

  document.getElementById('dashRoot').innerHTML =
    '<div class="d-hero" onclick="cycleView()">' +
      '<div class="cap" onclick="event.stopPropagation();explain(\'' + (HERO_VIEW === 2 ? 'patrimonio' : 'gasto') + '\')">' + heroCap + ' <span class="ft-info">i</span></div>' +
      '<div class="row"><span class="sign ' + heroSign + '">' + (heroSign === 'neg' ? '−' : '+') + '</span>' +
        '<span class="amt"><span class="cur">' + mp.sym + '</span>' + mp.int + '<span style="font-size:.5em">' + mp.decSep + mp.dec + '</span></span></div>' +
      splitHTML +
    '</div>' +

    '<div class="ft-card">' +
      '<div class="d-bud-h"><span class="t">' + budCap + '</span>' +
        '<button class="r" onclick="explain(\'' + budExplainKind + '\')">' + FT.money(budLeftShown, { cents: true }) + ' ' + (es ? 'restante' : 'left') + '</button></div>' +
      '<div class="ft-track"><div class="ft-fill" id="dFill"></div></div>' +
      '<div class="d-bud-a"><button onclick="FT.go(\'perfil.html\')">↑ ' + (es ? 'Editar presupuesto' : 'Edit budget') + '</button>' +
        '<button onclick="openPicker()">↓ ' + (es ? 'Nueva transacción' : 'New transaction') + '</button></div>' +
      (dl > 0 ? '<div class="d-bud-day">' + FT.money(budPerDay, { cents: true }) + ' / ' + (es ? 'día disponible · ' + dl + ' días restantes' : 'day available · ' + dl + ' days left') + '</div>' : '') +
    '</div>' +

    '<div class="ft-section">' +
      '<div class="ft-tabs">' +
        '<button class="ft-tab ' + (TAB === 'resumen' ? 'on' : '') + '" onclick="setTab(\'resumen\')">' + (es ? 'Resumen' : 'Summary') + '</button>' +
        '<button class="ft-tab ' + (TAB === 'metodo' ? 'on' : '') + '" onclick="setTab(\'metodo\')">' + (es ? 'Método' : 'Method') + ' ' + (u.method || '50/30/20') + '</button>' +
      '</div>' +

      '<div class="ft-pane" id="pResumen" ' + (TAB === 'resumen' ? '' : 'hidden') + '>' +
        // max:6 (antes el default de 4) -- con ahorro/inversión sumados
        // arriba puede haber hasta 6 barras reales; con el tope viejo, dos
        // categorías de gasto genuinas se habrían quedado afuera por estas
        // dos nuevas.
        (catItems.length ? FT.catBars(catItems, { max: 6, scope: showHogarBudget ? 'hogar' : 'personal', month: monthKey() }) + (showHogarBudget ? '' : '<div class="d-legend"><i></i> ' + (es ? 'contorno = tu promedio de 3 meses' : 'outline = your 3-month average') + '</div>') : '<div class="d-empty">' + (showHogarBudget ? (es ? 'Sin gastos de hogar este mes' : 'No household spending this month') : (es ? 'Sin gastos personales este mes' : 'No personal spending this month')) + '</div>') +
        pendingBlockHTML(es) +
        '<div class="ft-section"><div class="ft-section-head"><h3>' + (es ? 'Últimos movimientos' : 'Recent activity') + '</h3><button class="link" onclick="FT.go(\'historial.html?f=' + (showHogarBudget ? 'hogar' : 'personal') + '&m=' + monthKey() + '\')">' + (es ? 'Ver todos' : 'See all') + '</button></div>' +
          (lastTxs.length ? lastTxs.map(function (x, i) { return FT.txRow(x, i); }).join('') : '<div class="d-empty">' + (es ? 'Aún no hay movimientos' : 'No activity yet') + '</div>') + '</div>' +
      '</div>' +

      '<div class="ft-pane" id="pMetodo" ' + (TAB === 'metodo' ? '' : 'hidden') + '>' +
        mrow(es ? 'Necesidades' : 'Needs', 'needs', t.needs, L.needs, nP, 'var(--g-main)') +
        mrow(es ? 'Gustos' : 'Wants', 'wants', t.wants, L.wants, wP, 'var(--amber)') +
        mrow(es ? 'Ahorro' : 'Savings', 'savings', savingsSpent, L.savings, sP, 'var(--blue)') +
        (nP >= 90 ? '<div class="d-alert">⚠️ ' + (es ? 'Necesidades casi al límite — te quedan ' : 'Needs almost at limit — ') + FT.money(Math.max(0, L.needs - t.needs), { cents: true }) + '</div>' : '') +
      '</div>' +
    '</div>' +

    '<div class="ft-card d-cheque">' +
      '<div class="ft-section-head" style="margin:0"><h3>' + (es ? 'Mi cheque' : 'My paycheck') + '</h3><button class="link" onclick="FT.go(\'historial.html\')">' + (es ? 'Ver historial' : 'History') + '</button></div>' +
      '<div class="sub">' + chequeSub() + '</div>' +
      '<button class="ft-btn ft-btn-primary tap" onclick="openCheque()">＋ ' + (es ? 'Recibí mi cheque' : 'I got paid') + '</button>' +
      // 12-oct-2026, a petición de Ramón: "busco la parte de repartos...
      // no encuentro" -- antes la regla de cada fondo/cuenta solo se veía
      // entrando una por una a cada pantalla; este botón junta todo en un
      // solo lugar (FT.openRepartoResumen, premium.js).
      '<button type="button" class="tap" onclick="FT.openRepartoResumen()" style="margin-top:9px;width:100%;display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border-radius:10px;border:1.5px solid var(--hair);background:#fff;color:var(--text2);font-family:var(--ui-font);font-weight:800;font-size:12px;cursor:pointer"><span>⚙️ ' + (es ? 'Cómo se reparte mi cheque' : 'How my paycheck gets split') + '</span><span>›</span></button>' +
      (pendingReparto > 0.005 ? '<button type="button" class="tap" onclick="openReparto()" style="margin-top:9px;width:100%;display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border-radius:10px;border:1.5px dashed var(--g-main);background:var(--g-light);color:var(--g-dark);font-family:var(--ui-font);font-weight:800;font-size:12px;cursor:pointer"><span>💰 ' + (es ? 'Sin repartir a tus fondos' : 'Unassigned to your funds') + '</span><span>' + FT.money(pendingReparto) + ' ›</span></button>' : '') +
      '<button type="button" class="tap" onclick="FT.go(\'midinero.html\')" style="margin-top:9px;width:100%;display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border-radius:10px;border:1.5px solid var(--hair);background:#fff;color:var(--text2);font-family:var(--ui-font);font-weight:800;font-size:12px;cursor:pointer"><span>🏦 ' + (es ? 'Mi dinero' : 'My money') + '</span><span>' + FT.money(myPersonalAccts, { cents: true }) + ' ›</span></button>' +
    '</div>' +

    stuckDebtsCardHTML(es) +
    pendingApprovalsCardHTML(es) +
    recurCardHTML(es);

  requestAnimationFrame(function () {
    var f = document.getElementById('dFill'); if (f) f.style.width = budSpentPct + '%';
    ['needs', 'wants', 'savings'].forEach(function (k) {
      var el = document.getElementById('mf_' + k);
      if (el) el.style.width = el.dataset.pct + '%';
    });
  });

  if (shell) {
    shell.setTitle(['Personal', FT.lang === 'es' ? 'Hogar' : 'Household', FT.lang === 'es' ? 'Patrimonio' : 'Net worth'][HERO_VIEW]);
    shell.setMonth(monthLabel());
    shell.setBellDot(FT.getNotifications().length > 0);
  }
}

/* Próximos (20-oct-2026): gastos/ingresos con fecha futura, todavía no mueven cuentas ni presupuesto. */
function pendingBlockHTML(es) {
  var list = FT.txs().filter(FT.isPending).sort(function (a, b) { return String(a.date).localeCompare(String(b.date)); }).slice(0, 5);
  if (!list.length) return '';
  return '<div class="ft-section"><div class="ft-section-head"><h3>⏳ ' + (es ? 'Próximos' : 'Upcoming') + '</h3></div>' +
    '<div class="sm" style="font-size:11px;color:var(--text3);margin:-4px 0 6px">' + (es ? 'Todavía no mueven tu cuenta ni tu presupuesto: se aplican solos ese día.' : 'They do not move your account or budget yet: they apply on their own that day.') + '</div>' +
    list.map(function (x, i) { return FT.txRow(x, i); }).join('') + '</div>';
}
function mrow(label, key, spent, limit, pct, color) {
  var es = FT.lang === 'es';
  if (pct >= 90) color = 'var(--red)';
  // Bug real de QA (N6): estos montos se mostraban sin centavos mientras
  // que "Últimos movimientos" (FT.txRow) sí los muestra -- un gasto de
  // $100.50 se veía como "$101" aquí pero "$100,50" en la lista de abajo,
  // pareciendo que no cuadraban. Mismo criterio (cents:true) en los dos
  // lados de la misma pantalla.
  return '<div class="d-mrow"><div class="mt">' +
    '<button class="l" onclick="explain(\'' + key + '\')">' + label + ' <span class="ft-chev">›</span></button>' +
    '<span class="n"><b>' + FT.money(spent, { cents: true }) + '</b> / ' + FT.money(limit, { cents: true }) + '</span></div>' +
    '<div class="d-mtrack"><div class="d-mfill" id="mf_' + key + '" data-pct="' + pct + '" style="width:0;background:' + color + '"></div></div>' +
    '<div class="foot"><span>' + Math.round(pct) + '% ' + (es ? 'usado' : 'used') + '</span><span>' + FT.money(Math.max(0, limit - spent), { cents: true }) + ' ' + (es ? 'disponible' : 'available') + '</span></div></div>';
}

/* Extracto de "Recurrentes" (♻️) — los 3 más próximos de cualquier categoría,
   con botón a la lista completa. Resuelve la duda de que el hub central sea
   difícil de encontrar si solo vive detrás del menú "Más". */
// 03-oct-2026, a petición de Ramón: los abonos recurrentes de deuda
// sacados de un fondo/vault ya no se aplican solos -- esta tarjeta (visible
// solo si hay al menos uno esperando) es el "revisar rápido" que pidió,
// con Aceptar/Saltar sin salir del dashboard. El bell del shell (arriba)
// también los lista vía FT.getNotifications(), como notificación.
function pendingApprovalsCardHTML(es) {
  var items; try { items = FT.pendingDebtApprovals(); } catch (e) { items = []; }

    items.map(function (p) {
      return '<div class="ft-mv" style="align-items:center">' +
        '<div class="ic rec">💳</div>' +
        '<div class="m"><div class="n">' + p.debtName + '</div><div class="d">' + p.fundLabel + ' · ' + FT.date(p.fecha) + '</div></div>' +
        '<div style="display:flex;flex-direction:column;align-items:flex-end;gap:5px">' +
          '<div class="amt in">' + FT.money(p.monto, { cents: true }) + '</div>' +
          '<div style="display:flex;gap:6px">' +
            '<button type="button" class="tap" data-appr-accept="' + p.debtId + '|' + p.abonoId + '" style="font-size:10px;font-weight:800;padding:4px 10px;border-radius:20px;border:none;background:var(--g-main);color:#fff">' + (es ? 'Aceptar' : 'Accept') + '</button>' +
            '<button type="button" class="tap" data-appr-skip="' + p.debtId + '|' + p.abonoId + '" style="font-size:10px;font-weight:800;padding:4px 10px;border-radius:20px;border:1px solid var(--hair);background:#fff;color:var(--text3)">' + (es ? 'Saltar' : 'Skip') + '</button>' +
          '</div>' +
        '</div>' +
      '</div>';
    }).join('') +
  '</div>';
}
// 12-oct-2026, caso real de Ramón: "SOFI CREDIT CARD" llevaba 5 días sin
// poder cobrarse porque su fondo "Tarjeta de crédito" estaba en $0 el día
// que tocaba -- 'insufficient' (premium.js, _applyRecDebt) no deja NINGÚN
// rastro visible a propósito (evita fabricar o bloquear para siempre), pero

// enterarse de que algo estaba atorado. Distinta de la de arriba: aquí no

function stuckDebtsCardHTML(es) {

  return '<div class="ft-card" style="border:1.5px solid #F5C2C2;background:#FDF2F2">' +

    items.map(function (s) {

        '<div class="ic rec">💳</div>' +
        '<div class="m"><div class="n">' + s.debtName + '</div><div class="d">' + (es ? 'desde el ' : 'since ') + FT.date(s.nextDate) + ' · ' + (es ? 'falta ' : 'short ') + FT.money(s.shortfall) + '</div></div>' +
        '<button type="button" class="tap" onclick="' + (s.fundSource.type === 'fund' ? "FT.setRaw('ft_open_fund','" + s.fundSource.id + "');" : '') + 'FT.go(\'' + (s.fundSource.type === 'emerg' ? 'emergencia.html' : 'ahorro.html') + '\')" style="font-size:10px;font-weight:800;padding:6px 11px;border-radius:20px;border:none;background:#C0392B;color:#fff;flex-shrink:0">' + (es ? 'Depositar' : 'Deposit') + '</button>' +
      '</div>';
    }).join('') +
  '</div>';
}
function recurCardHTML(es) {
  var all;
  try { all = (FT.recurAllList() || []).filter(function (i) { return !i.paused; }); } catch (e) { all = []; }
  if (!all.length) return '';
  var upcoming = all.slice(0, 3);
  return '<div class="ft-card">' +
    '<div class="ft-section-head" style="margin:0 0 4px"><h3>♻️ ' + (es ? 'Recurrentes próximos' : 'Upcoming recurring') + '</h3><button class="link" onclick="FT.go(\'recurrentes.html\')">' + (es ? 'Ver todos' : 'See all') + '</button></div>' +
    upcoming.map(function (i) {

        '<div class="amt in">' + FT.money(i.amount, { cents: true }) + '</div></div>';

}

function chequeSub() {
  var es = FT.lang === 'es', u = FT.user(), h = FT.hogar();
  var totH = (parseFloat(h.payPctHogar) || 50) + (parseFloat(h.saveHogarPct) || 10);
  var freqTxt = { weekly: es ? 'semanal' : 'weekly', biweekly: es ? 'quincenal' : 'biweekly', monthly: es ? 'mensual' : 'monthly' }[u.payFreq || 'biweekly'];
  return (es ? 'Pago ' : 'Pay ') + freqTxt + (FT.hogarConnected() ? ' · ' + (100 - totH) + (es ? '% personal / ' : '% personal / ') + totH + '% ' + (es ? 'hogar' : 'household') : '');
}

/* ── interacciones ── */
function cycleView() { HERO_VIEW = (HERO_VIEW + 1) % 3; render(); }
function setTab(tab) {
  TAB = tab; FT.setRaw('ft_dash_tab', tab);
  var pr = document.getElementById('pResumen'), pm = document.getElementById('pMetodo');
  pr.style.opacity = 0; pm.style.opacity = 0;
  document.querySelectorAll('.ft-tab').forEach(function (b) { b.classList.toggle('on', b.textContent.toLowerCase().indexOf(tab === 'metodo' ? (FT.lang === 'es' ? 'método' : 'method') : (FT.lang === 'es' ? 'resumen' : 'summary')) > -1); });
  setTimeout(function () { pr.hidden = tab !== 'resumen'; pm.hidden = tab !== 'metodo'; pr.style.opacity = 1; pm.style.opacity = 1; if (tab === 'metodo') render(); }, 110);
}

function explain(kind) {
  var es = FT.lang === 'es', t = totals(), L = limits(), rows, title;
  if (kind === 'gasto') {
    title = es ? 'Gastado este mes' : 'Spent this month';
    // 15-oct-2026: "Gasto del hogar que adelantaste" quitada de este
    // desglose -- Ramón pidió separación total por etiqueta (t.hogar ya
    // no existe en totals(), ningún gasto marcado hogar:true cuenta aquí
    // sin importar la cuenta con que se pagó).
    // 15-oct-2026 (2): "Ahorro apartado" ya NO se resta del total -- a
    // petición de Ramón, el ahorro sigue siendo tuyo mientras no lo
    // retires, así que no cuenta como gasto (t.spent ya no lo incluye,
    // ver totals()). Se deja la fila como informativa (sin signo −, fuera
    // de la suma) para que siga siendo visible cuánto apartaste.
    rows = [
      [(es ? 'Gastos (necesidades + gustos)' : 'Expenses'), '−' + FT.money(t.needs + t.wants)],
      [(es ? 'Invertido' : 'Invested'), '−' + FT.money(t.inversion)],
      [(es ? '= Total del mes' : '= Month total'), FT.money(t.spent)],
      [(es ? 'Ahorro apartado (no cuenta como gasto)' : 'Saved (not counted as spent)'), FT.money(t.personalAhorro)]
    ];
  } else if (kind === 'patrimonio') {
    var pat = patrimonio(); title = es ? 'Patrimonio personal' : 'Personal net worth';
    rows = pat.parts.map(function (p) { return [p[0], FT.money(p[1])]; }); rows.push([es ? '= Patrimonio' : '= Net worth', FT.money(pat.total)]);
  } else if (kind === 'presupuesto') {
    title = es ? 'Presupuesto del mes' : 'Monthly budget';
    // L.base = tu % personal del cheque (40% en su caso) cuando hay hogar
    // conectado; sin hogar, L.base === L.income (limits() ya lo resuelve).
    rows = [[es ? (FT.hogarConnected() ? 'Tu presupuesto (' + Math.round(FT.personalPct()) + '% de tu cheque)' : 'Ingreso del mes') : (FT.hogarConnected() ? 'Your budget (' + Math.round(FT.personalPct()) + '% of your paycheck)' : 'Monthly income'), FT.money(L.base)], [es ? '− Gastado' : '− Spent', FT.money(t.spent)], [es ? '= Restante' : '= Left', FT.money(L.base - t.spent)]];
  } else if (kind === 'presupuestoHogar') {
    // Presupuesto del HOGAR (QA 29-sep-2026): la tarjeta debajo del hero
    // cambia a esto cuando la vista del hero está en "Hogar" -- mismo
    // cálculo que hogar.html ya usa (hogarBudgetHero), replicado aquí sin
    // tocar ese módulo.
    title = es ? 'Presupuesto del hogar' : 'Household budget';
    var hg2 = FT.hogar();
    var hogarPctTotal2 = (parseFloat(hg2.payPctHogar) || 50) + (parseFloat(hg2.saveHogarPct) || 10);
    var ppr2 = FT.partnerProfile();
    var combinedIncome2 = (FT.user().income || 0) + (ppr2 ? (ppr2.income || 0) : 0);
    var hogarBudget2 = combinedIncome2 * hogarPctTotal2 / 100;
    var hogarCombined2 = t.hogarTotal + partnerHogarSpent();
    rows = [
      [es ? 'Presupuesto (' + Math.round(hogarPctTotal2) + '% combinado)' : 'Budget (' + Math.round(hogarPctTotal2) + '% combined)', FT.money(hogarBudget2)],
      [es ? '− Gastado (los dos)' : '− Spent (both)', FT.money(hogarCombined2)],
      [es ? '= Restante' : '= Left', FT.money(hogarBudget2 - hogarCombined2)]
    ];
  } else if (kind === 'ingreso') {
    title = es ? 'Ingreso del mes' : 'Monthly income';
    rows = t.txs.filter(function (x) { return x.type === 'ingreso' && x.incomeKind !== 'venta'; }).map(function (x) { return [x.desc, '+' + FT.money(x.amount, { cents: true })]; });
    if (!rows.length) rows = [[es ? 'Sin ingresos registrados' : 'No income logged', FT.money(0)]];
  } else if (kind === 'hogar') {
    title = es ? 'Gasto del hogar' : 'Household spending';
    // Revisión independiente: `hogarCombined` es una variable local de
    // render(), no existe aquí dentro de explain() -- usarla tronaba con
    // ReferenceError y esta hoja nunca abría. Mismo cálculo, expresado
    // directo con lo que sí está disponible en este scope.
    rows = [[es ? 'Tu gasto marcado hogar' : 'Your household expenses', FT.money(t.hogarTotal)], [es ? 'Gasto de tu pareja' : "Partner's expenses", FT.money(partnerHogarSpent())], [es ? '= Combinado' : '= Combined', FT.money(t.hogarTotal + partnerHogarSpent())]];
  } else if (kind === 'needs' || kind === 'wants' || kind === 'savings') {
    var pctLbl = { needs: '50%', wants: '30%', savings: '20%' }[kind];
    var spent = kind === 'needs' ? t.needs : kind === 'wants' ? t.wants : (t.personalAhorro + t.inversion);
    title = { needs: es ? 'Necesidades' : 'Needs', wants: es ? 'Gustos' : 'Wants', savings: es ? 'Ahorro' : 'Savings' }[kind];
    rows = [
      [es ? 'Base personal' : 'Personal base', FT.money(L.base)],
      ['× ' + pctLbl + ' (' + (es ? 'regla ' : '') + (FT.user().method || '50/30/20') + ')', FT.money(L[kind])],
      [es ? 'Usado' : 'Used', FT.money(spent)],
      [es ? 'Disponible' : 'Available', FT.money(Math.max(0, L[kind] - spent))]
    ];
  } else return;

  FT.sheet({
    title: (es ? '¿Cómo se calcula?' : 'How is this calculated?') + ' · ' + title,

// 15-oct-2026 (aprobado vía simulación): antes el selector solo decía "(X libre)"
// y escondía lo apartado en fondos -- una cuenta con $165 en un fondo y
// disponible negativo se veía como "no tengo nada". Ahora muestra las dos
// partes; "libre" se llama "Disponible" porque "Ahorro libre" (el fondo) y el
// libre de la cuenta eran dos cosas distintas con el mismo nombre.
function acctOptLabel(a) {
  var es = FT.lang === 'es', ap = FT.accountEarmarked(a.id);
  return a.name + ' · ' + (es ? 'Disponible ' : 'Available ') + FT.money(FT.accountFree(a), { cents: true }) + (ap > 0.004 ? ' · ' + (es ? 'Apartado ' : 'Set aside ') + FT.money(ap, { cents: true }) : '');
}

// Aviso en vivo bajo "¿De qué cuenta se paga?": solo aparece si el disponible no
// alcanza. Ofrece pasar lo necesario de los fondos vinculados al disponible en
// un toque (FT.coverFromFunds); si ni con los fondos alcanza, lo dice claro.
function renderAcctStatus(body, getAmount, onMoved) {
  var box = body.querySelector('#eAcctStatus'), sel = body.querySelector('#eAcctPers');
  if (!box) return;
  var es = FT.lang === 'es', wrap = body.querySelector('#eAcctPersWrap');
  box.innerHTML = '';
  if (!sel || !sel.value || (wrap && wrap.style.display === 'none')) return;
  var amt = FT.numMoney(getAmount());
  if (amt <= 0) return;
  var cov = FT.accountCoverage(sel.value, amt);
  if (cov.ok) return;
  var acct = FT.checking().find(function (a) { return String(a.id) === String(sel.value); }) || {};
  var box0 = 'style="border-radius:14px;padding:11px 12px;margin-top:8px;display:flex;flex-direction:column;gap:8px;';
  var btn = function (id, primary, txt) { return '<button type="button" id="' + id + '" class="tap" style="padding:10px 12px;border-radius:11px;font-family:var(--ui-font);font-weight:800;font-size:12.5px;cursor:pointer;border:1.5px solid ' + (primary ? 'transparent' : 'var(--hair)') + ';background:' + (primary ? 'linear-gradient(135deg,var(--g-dark),var(--g-main))' : 'transparent') + ';color:' + (primary ? '#fff' : 'var(--ink)') + '">' + txt + '</button>'; };
  var canFunds = cov.fundsTotal + 0.005 >= cov.shortfall;
  var canEmerg = !canFunds && cov.fundsTotal + cov.emerg + 0.005 >= cov.shortfall;
  var names = cov.funds.map(function (f) { return f.name; }).join(', ');
  if (canFunds || canEmerg) {
    box.innerHTML = '<div ' + box0 + 'background:var(--amber-bg,#FFF3DF)"><b style="color:var(--amber,#B7700F)">' + (es ? 'El disponible no alcanza: faltan ' : 'Available doesn\'t cover it: short ') + FT.money(cov.shortfall, { cents: true }) + '</b>' +
      '<span style="font-size:12px;color:var(--text2)">' + (es ? 'La cuenta sí tiene dinero, apartado en ' : 'The account does have money, set aside in ') + (names || (es ? 'Emergencia' : 'Emergency')) + (canEmerg ? (es ? ' y Emergencia.' : ' and Emergency.') : '.') + '</span>' +
      btn('eXfer', true, (es ? 'Pasar ' : 'Move ') + FT.money(cov.shortfall, { cents: true }) + (es ? ' de ' : ' from ') + (canEmerg ? (es ? 'tus fondos y Emergencia' : 'your funds and Emergency') : (cov.funds.length > 1 ? (es ? 'tus fondos' : 'your funds') : cov.funds[0].name)) + (es ? ' al disponible' : ' to available')) +
      '<span style="font-size:11px;color:var(--text3)">' + (es ? 'Es un traspaso dentro de la misma cuenta: el total no cambia.' : 'A transfer inside the same account: the total doesn\'t change.') + '</span></div>';
    body.querySelector('#eXfer').onclick = function () {
      var run = function (useEmerg) {
        // Se recalcula el faltante al ejecutar (no el capturado al dibujar el
        // aviso): con la confirmación de Emergencia (asíncrona) un doble toque
        // movería el mismo monto dos veces y dejaría el disponible de más.
        var fresh = FT.accountCoverage(sel.value, FT.numMoney(getAmount())).shortfall;
        if (fresh <= 0.004) { renderAcctStatus(body, getAmount, onMoved); return; }
        var r = FT.coverFromFunds(sel.value, fresh, { useEmergency: useEmerg }); FT.toast((es ? 'Pasaron ' : 'Moved ') + FT.money(r.moved, { cents: true }) + (es ? ' al disponible de ' : ' to available in ') + (acct.name || ''), { icon: '🔁', ms: 3200 }); if (onMoved) onMoved(); renderAcctStatus(body, getAmount, onMoved); };
      if (canEmerg) FT.confirm(es ? 'Esto usa tu fondo de Emergencia, que es solo para emergencias reales. ¿Continuar?' : 'This uses your Emergency fund, which is only for real emergencies. Continue?').then(function (ok) { if (ok) run(true); });
      else run(false);
    };
  } else if (FT.accountEarmarked(sel.value) > 0.004) {
    box.innerHTML = '<div ' + box0 + 'background:var(--red-bg,#FCECEC)"><b style="color:var(--red)">' + (es ? 'No alcanza ni con lo apartado' : 'Not enough even with what\'s set aside') + '</b>' +
      '<span style="font-size:12px;color:var(--text2)">' + (es ? 'La cuenta tiene ' + FT.money(FT.accountTotal(acct), { cents: true }) + ' en total y el gasto es de ' + FT.money(amt, { cents: true }) + '. Prueba con otra cuenta.' : 'The account has ' + FT.money(FT.accountTotal(acct), { cents: true }) + ' in total and the expense is ' + FT.money(amt, { cents: true }) + '. Try another account.') + '</span></div>';
  }
}

function openEntry(type) {

  var hogarAcctOpts = hogarAccts.concat(myAccts);

  }
  if (realType === 'ingreso' && myAccts.length) {

  }
  if (FT.hogarConnected() && (realType === 'gasto' || realType === 'inversion' || (realType === 'suscripcion' && !isServ))) {
    extra += '<div class="ft-field"><label>' + (es ? 'Es para' : 'For') + '</label><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><button type="button" id="ePers" class="tap" style="padding:9px;border-radius:10px;border:1.5px solid var(--g-main);background:var(--g-light);color:var(--g-dark);font-weight:800;font-family:var(--ui-font)">👤 ' + (es ? 'Personal' : 'Personal') + '</button><button type="button" id="eHog" class="tap" style="padding:9px;border-radius:10px;border:1px solid var(--hair);background:var(--sunk);color:var(--text2);font-weight:800;font-family:var(--ui-font)">🏠 ' + (es ? 'Hogar' : 'Household') + '</button></div></div>';
    if (canDeductAcct) {
      // Conjunta primero (grupo aparte, es la sugerencia/default -- no
      // toca tu presupuesto personal), luego tus cuentas personales (si
      // eliges una, SÍ cuenta contra tu presupuesto -- lo estás

      extra += '<div class="ft-field" id="eAcctWrap" style="display:none"><label>' + (es ? '¿De qué cuenta se paga?' : 'Paid from which account?') + '</label><select id="eAcct">' +
        (hogarAccts.length ? '<optgroup label="' + (es ? 'Conjunta' : 'Joint') + '">' + hogarAccts.map(function (a, i) { return '<option value="' + a.id + '"' + (i === 0 ? ' selected' : '') + '>' + a.name + ' (' + FT.money(FT.accountFree(a), { cents: true }) + ')</option>'; }).join('') + '</optgroup>' : '') +
        (myAccts.length ? '<optgroup label="' + (es ? 'Mi cuenta (adelantar)' : 'My account (front it)') + '">' + myAccts.map(function (a) { return '<option value="' + a.id + '">' + a.name + ' (' + FT.money(FT.accountFree(a), { cents: true }) + ')</option>'; }).join('') + '</optgroup>' : '') +
        // "Ninguna" al final (gasto en efectivo, o sin cuenta conjunta que
        // no quieres adelantar de tu bolsillo) -- si no hay ninguna cuenta
        // conjunta, esta es la que queda seleccionada por default (nunca
        // se elige una cuenta personal en automático, sin que el usuario
        // lo pida).
        '<option value=""' + (hogarAccts.length ? '' : ' selected') + '>' + (es ? 'Ninguna (efectivo / sin registrar)' : 'None (cash / untracked)') + '</option>' +
        '</select>' +
        '<p style="font-size:10px;color:var(--text3);margin-top:4px">' + (es ? 'La conjunta no toca tu presupuesto personal -- tu propia cuenta sí.' : "The joint account doesn't touch your personal budget -- your own account does.") + '</p>' +
      '</div>';
    }
  }
  if (realType === 'ahorro')
    extra += '<div class="ft-field"><label>' + (es ? 'Destino' : 'Destination') + '</label><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><button type="button" id="eLib" class="tap" style="padding:9px;border-radius:10px;border:1.5px solid var(--g-main);background:var(--g-light);color:var(--g-dark);font-weight:800;font-family:var(--ui-font)">💵 ' + (es ? 'Ahorro libre' : 'Free savings') + '</button><button type="button" id="eEmg" class="tap" style="padding:9px;border-radius:10px;border:1px solid var(--hair);background:var(--sunk);color:var(--text2);font-weight:800;font-family:var(--ui-font)">🛡️ ' + (es ? 'Emergencia' : 'Emergency') + '</button></div></div>';
  if (realType === 'ingreso')
    extra += '<label class="tap" style="display:flex;gap:9px;align-items:flex-start;background:var(--sunk);border:1px solid var(--hair);border-radius:11px;padding:10px 12px;cursor:pointer;font-size:11.5px;color:var(--text2)"><input type="checkbox" id="eDist" style="width:17px;height:17px;margin-top:1px;accent-color:var(--g-main)"><span>' + (es ? 'Repartir automáticamente a ahorro / emergencia / inversión según mis %.' : 'Auto-distribute to savings / emergency / investing by my %.') + '</span></label>';

  // 19-oct-2026, a petición de Ramón: un ingreso puede ser 100% mío o un APORTE

  // presupuesto personal: se anota como aporte del hogar (hogar:true), que tu
  // pareja ve y que cuenta como "Aportado" en Historial/Hogar. Opcionalmente
  // acredita una cuenta conjunta (se revierte solo si lo eliminas).
  if (realType === 'ingreso' && FT.hogarConnected()) {
    var jointAcctsK = FT.checking().filter(function (c) { return c.hogar; });
    extra = '<div class="ft-field" id="eKindWrap"><label>' + (es ? '¿Qué es este ingreso?' : 'What is this income?') + '</label>' +
      '<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><button type="button" id="eKMine" class="tap" style="padding:9px;border-radius:10px;border:1.5px solid var(--g-main);background:var(--g-light);color:var(--g-dark);font-weight:800;font-family:var(--ui-font)">🎁 ' + (es ? '100% mío' : '100% mine') + '</button>' +
      '<button type="button" id="eKHogar" class="tap" style="padding:9px;border-radius:10px;border:1px solid var(--hair);background:var(--sunk);color:var(--text2);font-weight:800;font-family:var(--ui-font)">🏠 ' + (es ? 'Aporte al hogar' : 'Household contribution') + '</button></div>' +
      '<p id="eKNote" style="font-size:10.5px;color:var(--text3);margin:6px 0 0">' + (es ? 'Suma a tu presupuesto personal.' : 'Adds to your personal budget.') + '</p></div>' +
      '<div class="ft-field" id="eAcctHWrap" style="display:none"><label>' + (es ? '¿A qué cuenta conjunta llega? (opcional)' : 'Which joint account does it land in? (optional)') + '</label><select id="eAcctH"><option value="">' + (es ? 'Ninguna' : 'None') + '</option>' +
        jointAcctsK.map(function (a) { return '<option value="' + a.id + '">' + a.name + ' (' + FT.money(FT.accountFree(a), { cents: true }) + ')</option>'; }).join('') + '</select></div>' + extra;
  }
  var state = { hogar: false, dest: 'libre', incomeHogar: false };
  var titles = { gasto: es ? 'Gasto' : 'Expense', ingreso: es ? 'Ingreso' : 'Income', ahorro: es ? 'Ahorro' : 'Savings', inversion: es ? 'Inversión' : 'Investment', suscripcion: es ? 'Suscripción' : 'Subscription', servicio: es ? 'Servicio del hogar' : 'Utility bill' };

  var ov = FT.modal({
    title: (es ? 'Nuevo: ' : 'New: ') + titles[type],
    html:
      '<div class="ft-field"><label>' + (es ? 'Descripción' : 'Description') + '</label><input id="eDesc" placeholder="' + (es ? 'Ej. Soriana' : 'e.g. Store') + '"></div>' +
      '<div class="ft-field"><label>' + (es ? 'Monto' : 'Amount') + '</label><input id="eAmt" inputmode="decimal" placeholder="$0"></div>' +
      '<div class="ft-field"><label>' + (es ? 'Fecha' : 'Date') + '</label><input id="eDate" type="date" value="' + FT.todayISO() + '"></div>' +
      extra,
    saveLabel: es ? 'Guardar registro' : 'Save entry',
    onOpen: function (body) {
      var h = body.querySelector('#eHog'), p = body.querySelector('#ePers'), acctWrap = body.querySelector('#eAcctWrap');
      var persAcctWrap = body.querySelector('#eAcctPersWrap');
      if (h) {
        h.onclick = function () { state.hogar = true; sel(h, p); if (acctWrap) acctWrap.style.display = ''; if (persAcctWrap) persAcctWrap.style.display = 'none'; };
        p.onclick = function () { state.hogar = false; sel(p, h); if (acctWrap) acctWrap.style.display = 'none'; if (persAcctWrap) persAcctWrap.style.display = ''; };
      }
      var kMine = body.querySelector('#eKMine'), kHog = body.querySelector('#eKHogar');
      if (kMine && kHog) {
        var acctInWrap = body.querySelector('#eAcctIn') ? body.querySelector('#eAcctIn').closest('.ft-field') : null, distWrap = body.querySelector('#eDist') ? body.querySelector('#eDist').closest('label') : null;
        var setKind = function (hogarKind) {

          if (distWrap) distWrap.style.display = hogarKind ? 'none' : '';
          body.querySelector('#eKNote').textContent = hogarKind
            ? (FT.lang === 'es' ? 'Va completo al hogar y NO suma a tu presupuesto personal. Tu pareja lo ve como aporte.' : 'Goes entirely to the household and does NOT add to your personal budget. Your partner sees it as a contribution.')
            : (FT.lang === 'es' ? 'Suma a tu presupuesto personal.' : 'Adds to your personal budget.');
        };

      // Aviso en vivo de la cuenta personal (ver renderAcctStatus): se
      // recalcula al teclear el monto, al cambiar de cuenta y al alternar
      // Personal/Hogar; tras un traspaso se refresca el texto del selector.
      var amtEl = body.querySelector('#eAmt'), persSel = body.querySelector('#eAcctPers');
      if (persSel && amtEl) {
        var refreshPersOpts = function () {
          Array.prototype.forEach.call(persSel.options, function (o) {
            if (!o.value) return;
            var a = FT.checking().find(function (x) { return String(x.id) === String(o.value); });

          });
        };
        var updAcctStatus = function () { renderAcctStatus(body, function () { return amtEl.value; }, refreshPersOpts); };
        amtEl.addEventListener('input', updAcctStatus);
        persSel.addEventListener('change', updAcctStatus);
        if (h) { h.addEventListener('click', updAcctStatus); p.addEventListener('click', updAcctStatus); }

      function sel(on, off) {
        on.style.borderColor = 'var(--g-main)'; on.style.background = 'var(--g-light)'; on.style.color = 'var(--g-dark)';
        off.style.borderColor = 'var(--hair)'; off.style.background = 'var(--sunk)'; off.style.color = 'var(--text2)';

        autoDist: body.querySelector('#eDist') ? body.querySelector('#eDist').checked : false,
        esServicioHogar: isServ,
        // Orden importa: el primer caso (hogar + canDeductAcct) es el
        // comportamiento de SIEMPRE, cubre gasto Y suscripción de hogar --
        // NO se puede perder al agregar los casos nuevos (gasto personal,
        // ingreso). Antes de este comentario hubo una versión que colapsaba
        // el chequeo a solo "realType==='gasto'", rompiendo en silencio la
        // cuenta de una suscripción de hogar -- corregido antes de subir.
        checkingAccountId: (state.hogar && canDeductAcct)
          ? (body.querySelector('#eAcct') ? body.querySelector('#eAcct').value : hogarAcctOpts[0].id)
          : (realType === 'gasto' && !state.hogar && body.querySelector('#eAcctPers') ? (body.querySelector('#eAcctPers').value || undefined)
            : (realType === 'ingreso' && body.querySelector('#eAcctIn') ? (body.querySelector('#eAcctIn').value || undefined) : undefined))
      };
      if (!o.desc || !FT.numMoney(o.amount) || !o.date) { FT.toast(FT.lang === 'es' ? 'Completa descripción, monto y fecha' : 'Fill description, amount and date'); return true; }

      // Aporte al hogar: se anota como aporte del hogar, sin tocar el presupuesto personal.
      if (realType === 'ingreso' && state.incomeHogar) {
        var esA = FT.lang === 'es', amtA = FT.numMoney(o.amount);
        if (!(amtA > 0)) { FT.toast(esA ? 'El monto debe ser mayor a 0' : 'Amount must be greater than 0'); return true; }
        var acctH = body.querySelector('#eAcctH') ? (body.querySelector('#eAcctH').value || '') : '';
        if (acctH) FT.creditChecking(acctH, amtA);
        var dA = FT.data();
        dA.transactions.push({ id: Date.now(), type: 'ahorro', desc: (esA ? 'Aporte al hogar — ' : 'Household contribution — ') + o.desc, amount: amtA, date: o.date, cat: '🏠 Hogar', hogar: true, createdBy: FT.userName(),
          checkingAccountId: acctH || undefined, acctCredited: acctH ? true : undefined, aporteManual: true });
        FT.saveData(dA);
        FT.toast((esA ? 'Aporte al hogar · ' : 'Household contribution · ') + FT.money(amtA, { cents: true }), { icon: '🏠' });
        render();
        FT.closeTop();
        return true;
      }

      // Gasto personal que excede el disponible → hoja de cobertura (opción C).
      function afterOverdraft() {
        if (realType === 'gasto' && !o.hogar) {
          var disp = FT.personalAvailable();
          var amt = FT.numMoney(o.amount);
          if (amt > disp) {
            var falt = Math.round((amt - Math.max(0, disp)) * 100) / 100;
            coberturaSheet(o.desc, falt).then(function (choice) {
              if (choice === 'libre' || choice === 'emergencia') o.cobertura = { source: choice, monto: falt };
              commit(o); FT.closeTop();
            });
            return;
          }
        }
        commit(o); FT.closeTop();
      }
      // Sobregiro estilo SoFi (Fase 1/2): si el gasto elige una cuenta y su
      // LIBRE no alcanza, se avisa y pide confirmación antes de dejarla en
      // negativo -- los fondos vinculados a esa cuenta NUNCA se tocan
      // solos para cubrir la diferencia (eso violaría la regla de que un
      // fondo/apartado nunca se mueve sin que el usuario lo pida).
      if (realType === 'gasto' && o.checkingAccountId) {
        var chk = FT.checkOverdraft(o.checkingAccountId, FT.numMoney(o.amount));
        if (!chk.ok) {
          var acctObj = FT.checking().find(function (a) { return String(a.id) === String(o.checkingAccountId); }) || {};
          if (acctObj.hogar) {
            // Gasto CONJUNTO sin fondos suficientes (QA 30-sep-2026): Ramón
            // fue explícito -- que la cuenta conjunta llegue a $0 es normal
            // (se hizo para cubrir gastos de la casa), así que el aviso
            // genérico de sobregiro ("¿continuar?") no es lo que quiere
            // aquí. En su lugar, opciones reales: transferir dinero a esa
            // cuenta ahí mismo, continuar igual, o cancelar.
            hogarInsufficientSheet(acctObj, chk).then(function (choice) {
              if (choice === 'continue') afterOverdraft();
              else if (choice === 'transfer') {
                FT.closeTop(); // cierra "Nuevo gasto" -- se retoma después de transferir
                FT.openTransfer({ toType: 'account', toId: acctObj.id, amount: chk.shortfall });
              }
              // 'cancel' o cerrar sin elegir: no hace nada, "Nuevo gasto" sigue abierto.
            });
            return true;
          }
          // Cuenta PERSONAL: el aviso simple de siempre (acortado -- era el
          // confirm() más largo de la app).
          FT.confirm(FT.lang === 'es'
            ? '«' + (acctObj.name || '') + '» quedaría en negativo (te faltan ' + FT.money(chk.shortfall, { cents: true }) + '). ¿Continuar?'
            : '"' + (acctObj.name || '') + '" would go negative (short ' + FT.money(chk.shortfall, { cents: true }) + '). Continue?'
          ).then(function (ok) { if (ok) afterOverdraft(); });
          return true;
        }
      }
      afterOverdraft();
      return true;
    }
  });

  function commit(o) {
    var e = FT.addEntry(o);
    if (e) {
      if (o.cobertura) FT.toast(FT.money(o.cobertura.monto) + (FT.lang === 'es' ? ' movido de ' : ' moved from ') + (o.cobertura.source === 'emergencia' ? (FT.lang === 'es' ? 'Emergencia' : 'Emergency') : (FT.lang === 'es' ? 'Ahorro libre' : 'Free savings')) + (FT.lang === 'es' ? ' para cubrir «' : ' to cover "') + o.desc + '»', { icon: '💵', ms: 4000 });
      else FT.toast((FT.lang === 'es' ? 'Registrado · ' : 'Logged · ') + FT.money(e.amount, { cents: true }), { icon: '✅' });
    }
    render();
  }
}

/** Hoja de cobertura: ¿de dónde cubrir el faltante de un gasto que excede el disponible? */
function coberturaSheet(name, falt) {
  var es = FT.lang === 'es';
  return new Promise(function (resolve) {
    FT.sheet({
      title: es ? 'Excede tu disponible' : 'Over your available',
      html: '<p style="font-size:13px;color:var(--text2);margin:2px 0 6px">' +
        (es ? 'Este gasto supera tu disponible del mes por ' : 'This expense is over your monthly available by ') +
        '<b>' + FT.money(falt) + '</b>. ' + (es ? '¿De dónde lo cubres?' : 'Where do you cover it from?') + '</p>',
      actions: [
        { label: '💵 ' + (es ? 'Ahorro libre' : 'Free savings') + ' · ' + FT.money(FT.savingsBalance()), primary: true, onClick: function () { resolve('libre'); } },
        { label: '🛡️ ' + (es ? 'Emergencia' : 'Emergency') + ' · ' + FT.money(FT.emergencyBalance()), onClick: function () { resolve('emergencia'); } },
        { label: es ? 'Dejarlo en rojo (gasto extra)' : 'Leave it negative', onClick: function () { resolve('rojo'); } }
      ]
    });
  });
}

/** Hoja de opciones cuando un gasto CONJUNTO no alcanza en la cuenta
 *  elegida (QA 30-sep-2026). A diferencia de un gasto personal, quedarse
 *  en $0 en la cuenta conjunta es normal (se hizo justo para cubrir gastos
 *  de la casa) -- Ramón no quiere el aviso genérico de sobregiro aquí,
 *  quiere opciones reales: transferir dinero a esa cuenta ahí mismo,
 *  continuar igual (queda en negativo), o cancelar. Resuelve
 *  'transfer'|'continue'|'cancel' -- cerrar el sheet sin elegir nunca
 *  resuelve nada, mismo criterio que el resto de los sheets de opciones. */
function hogarInsufficientSheet(acctObj, chk) {
  var es = FT.lang === 'es';
  return new Promise(function (resolve) {
    FT.sheet({
      title: '🏠 ' + (es ? 'No alcanza en «' + acctObj.name + '»' : 'Not enough in "' + acctObj.name + '"'),
      html: '<p style="font-size:13px;color:var(--text2);margin:2px 0 6px">' +
        (es ? 'Tiene ' + FT.money(chk.libre, { cents: true }) + ' disponible -- faltan ' : 'Has ' + FT.money(chk.libre, { cents: true }) + ' available -- short ') +
        '<b>' + FT.money(chk.shortfall, { cents: true }) + '</b>' + (es ? ' para este gasto. ¿Qué quieres hacer?' : ' for this expense. What do you want to do?') + '</p>',
      actions: [
        { label: '🔁 ' + (es ? 'Transferir dinero aquí' : 'Transfer money here'), primary: true, onClick: function () { resolve('transfer'); } },
        { label: '✅ ' + (es ? 'Continuar de todas formas' : 'Continue anyway'), onClick: function () { resolve('continue'); } },
        { label: es ? 'Cancelar' : 'Cancel', onClick: function () { resolve('cancel'); } }
      ]
    });
  });
}

function openCheque() {
  var es = FT.lang === 'es', h = FT.hogar(), u = FT.user();
  var totH = (parseFloat(h.payPctHogar) || 50) + (parseFloat(h.saveHogarPct) || 10);
  var checks = u.payFreq === 'weekly' ? 4 : u.payFreq === 'biweekly' ? 2 : 1;
  var expected = (u.income || 0) / checks;
  var st = { tipo: 'nuevo' };

  var ov = FT.modal({
    title: es ? 'Recibí mi cheque' : 'I got paid',
    html:
      '<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px">' +
        '<button type="button" id="cNuevo" class="tap" style="padding:9px;border-radius:10px;border:1.5px solid var(--g-main);background:var(--g-light);color:var(--g-dark);font-weight:800;font-family:var(--ui-font)">' + (es ? 'Nuevo (ingreso)' : 'New (income)') + '</button>' +
        '<button type="button" id="cExist" class="tap" style="padding:9px;border-radius:10px;border:1px solid var(--hair);background:var(--sunk);color:var(--text2);font-weight:800;font-family:var(--ui-font)">' + (es ? 'Ya lo tenía' : 'Already had it') + '</button>' +
      '</div>' +
      '<div class="ft-field"><label>' + (es ? 'Monto recibido' : 'Amount received') + '</label><input id="cMonto" inputmode="decimal" value="' + (expected > 0 ? expected.toFixed(2) : '') + '"></div>' +
      '<div id="cPrev" style="background:var(--sunk);border-radius:11px;padding:11px;font-size:11.5px;color:var(--text2);margin-bottom:6px"></div>',
    saveLabel: es ? 'Registrar cheque' : 'Log paycheck',
    onOpen: function (body) {
      var n = body.querySelector('#cNuevo'), x = body.querySelector('#cExist'), inp = body.querySelector('#cMonto');
      function sel(on, off) { on.style.borderColor = 'var(--g-main)'; on.style.background = 'var(--g-light)'; on.style.color = 'var(--g-dark)'; off.style.borderColor = 'var(--hair)'; off.style.background = 'var(--sunk)'; off.style.color = 'var(--text2)'; }
      n.onclick = function () { st.tipo = 'nuevo'; sel(n, x); prev(); };
      x.onclick = function () { st.tipo = 'existente'; sel(x, n); prev(); };
      inp.oninput = prev;
      function prev() {
        var m = parseFloat(inp.value) || 0;
        var hogarAmt = m * totH / 100, persAmt = m - hogarAmt;
        var savPct = u.savingsPct != null ? u.savingsPct : 20;
        body.querySelector('#cPrev').innerHTML = m > 0
          ? (es ? 'Se reparte: ' : 'Split: ') + '<b>🏠 ' + FT.money(hogarAmt) + '</b> ' + (es ? 'hogar · ' : 'household · ') + '<b>👤 ' + FT.money(persAmt) + '</b> ' + (es ? 'personal' : 'personal') +
            (st.tipo === 'nuevo' ? '<br>' + (es ? 'De tu parte personal, ' : 'Of your personal share, ') + '<b>' + FT.money(Math.round(persAmt * savPct / 100)) + '</b> (' + savPct + '%) ' + (es ? 'a Ahorro libre — «págate primero».' : 'to Free savings — "pay yourself first".') : '')
          : '';
      }
      prev();
    },
    onSave: function (body) {
      var m = parseFloat(body.querySelector('#cMonto').value);
      if (!m || m <= 0) { FT.toast(es ? 'Ingresa el monto' : 'Enter the amount'); return true; }
      var r = FT.recordCheque({ monto: m, tipo: st.tipo });
      if (r) {
        FT.toast('✅ ' + FT.money(r.monto) + (r.autoSaved > 0 ? ' · ' + FT.money(r.autoSaved) + (es ? ' a Ahorro libre' : ' to Free savings') : ''));
        // Parte del aporte hogar que ninguna cuenta con regla cubrió -- antes
        // este número no se veía en ningún lado, solo quedaba implícito
        // dentro del % de hogar. Aviso aparte para no perderlo en el toast
        // principal (que ya se cierra solo a los pocos segundos).
        if (r.hogarSinAsignar > 0.5) {
          // 20-oct-2026: en vez de un aviso que se va en 4 segundos, se abre la hoja para asignar ese dinero.
          setTimeout(function () { try { FT.openAsignar({ target: 'mine', chequeId: r.chequeId, monto: r.hogarSinAsignar, fecha: r.fecha }); } catch (e) {} }, 900);
        }
        // 15-oct-2026: el reparto a fondos de Ahorro libre ahora se aplica
        // solo (ver FT.recordCheque) -- este aviso es el equivalente al de
        // arriba, para que no se sienta silencioso solo porque ya no pide
        // confirmar.
        if (r.fondoSinAsignar > 0.5) {
          setTimeout(function () {
            FT.toast((es ? '💵 ' + FT.money(r.fondoSinAsignar) + ' sin repartir a ningún fondo -- sigue disponible en tu presupuesto' : '💵 ' + FT.money(r.fondoSinAsignar) + " not assigned to any fund -- still available in your budget"), { ms: 4500 });
          }, 5700);
        }
      }
      render();
    }
  });
}

/** Reparto de cheque a fondos de Ahorro libre (etapa 2) -- NUNCA se aplica
 *  solo: se sugiere según las reglas guardadas de cada fondo, el usuario
 *  ajusta montos o los deja en $0, y "Dejar todo disponible" es una salida
 *  explícita tan válida como repartir. */
function openReparto() {
  var es = FT.lang === 'es';
  var pending = FT.pendingReparto();
  if (pending <= 0.005) return;
  var funds = FT.savingsFunds();
  var alloc = FT.suggestFundAllocation(pending); // mismo criterio que FT.applyDist (etapa 3) -- un solo lugar con el algoritmo

  function rowsHTML() {
    return funds.map(function (f) {
      var v = alloc[f.id] || 0;
      return '<div class="ft-field" style="margin-bottom:8px"><label>' + f.emoji + ' ' + f.name +
        (f.rule ? ' <span style="font-weight:600;color:var(--text3)">(' + (f.rule.type === 'remainder' ? (es ? 'lo que sobre' : "what's left") : f.rule.type === 'pct' ? f.rule.value + '%' : FT.money(f.rule.value)) + ')</span>' : '') +
        '</label><input data-fund-amt="' + f.id + '" inputmode="decimal" value="' + (v > 0 ? v.toFixed(2) : '') + '" placeholder="$0"></div>';
    }).join('');
  }

  FT.modal({
    title: (es ? 'Repartir ' : 'Allocate ') + FT.money(pending),
    html:
      '<div style="background:var(--sky-bg);color:#2A4CC0;border-radius:10px;padding:9px 11px;font-size:11px;font-weight:600;margin-bottom:10px">' + (es ? 'Sugerido según tus reglas guardadas — ajusta los montos, o déjalos en $0 si no quieres repartir a un fondo.' : 'Suggested from your saved rules — adjust the amounts, or leave at $0 to skip a fund.') + '</div>' +
      '<div id="repRows">' + rowsHTML() + '</div>' +
      '<div id="repLeft" style="text-align:right;font-size:11px;font-weight:800;color:var(--text3);margin:2px 0 10px"></div>' +
      '<button type="button" id="repSkip" class="link" style="display:block;width:100%;text-align:center">' + (es ? 'Dejar todo disponible por ahora' : 'Leave it all unassigned for now') + '</button>',
    saveLabel: es ? 'Aplicar reparto' : 'Apply allocation',
    onOpen: function (body) {
      function updateLeft() {
        var used = 0;
        body.querySelectorAll('[data-fund-amt]').forEach(function (inp) { var v = parseFloat(inp.value) || 0; if (v > 0) used += v; });
        var left = pending - used;
        var lbl = body.querySelector('#repLeft');
        lbl.textContent = (es ? 'Sin repartir: ' : 'Unassigned: ') + FT.money(Math.max(0, left));
        lbl.style.color = left < -0.005 ? 'var(--red)' : 'var(--text3)';
      }
      body.querySelectorAll('[data-fund-amt]').forEach(function (inp) { inp.oninput = updateLeft; });
      updateLeft();
      var skip = body.querySelector('#repSkip');
      if (skip) skip.onclick = function () {
        FT.applyReparto([]);
        FT.toast(es ? '👍 Sigue disponible en tu mes' : "👍 Still available in your month's balance");
        FT.closeTop();
        render();
      };
    },
    onSave: function (body) {
      var used = 0, allocations = [];
      funds.forEach(function (f) {
        var inp = body.querySelector('[data-fund-amt="' + f.id + '"]');
        var v = inp ? (parseFloat(inp.value) || 0) : 0;
        if (v > 0) { allocations.push({ fundId: f.id, fundName: f.name, amount: v }); used += v; }
      });
      if (used > pending + 0.01) { FT.toast(es ? 'Repartiste más de lo disponible' : 'You allocated more than available'); return true; }
      FT.applyReparto(allocations);
      FT.toast(es ? '✅ Reparto aplicado' : '✅ Allocation applied');
      render();
    }
  });
}

/* ── init ── */
document.addEventListener('ft:ready', function () {
  if (!FT.getRaw('ft_onboarding_saldos_done') && !FT.getRaw('ft_user_setup')) { location.replace('onboarding.html'); return; }
  shell = FT.shell({
    active: 'home',
    title: 'Personal',
    onSwitch: cycleView,
    month: true,
    monthLabel: monthLabel(),
    onMonth: function (d) { if (d > 0 && MONTH_OFF >= 0) return; MONTH_OFF += d; render(); },
    onPlus: openPicker
  });
  // Tocar una fila de movimiento → hoja de detalle (§6: ninguna fila muerta)
  document.getElementById('dashRoot').addEventListener('click', function (e) {
    var row = e.target.closest('.ft-tx[data-txid]');
    if (row) { FT.openTxDetail(row.getAttribute('data-txid')); return; }
    var es = FT.lang === 'es';
    var accept = e.target.closest('[data-appr-accept]');
    if (accept) {
      var ap = accept.getAttribute('data-appr-accept').split('|');
      if (FT.resolveDebtApproval(ap[0], ap[1], true)) FT.toast(es ? '✅ Abono aplicado' : '✅ Payment applied');
      return;
    }
    var skip = e.target.closest('[data-appr-skip]');
    if (skip) {
      var sp = skip.getAttribute('data-appr-skip').split('|');
      FT.confirm(es ? '¿Saltar este pago? No se mueve nada y se vuelve a preguntar en el próximo periodo.' : "Skip this payment? Nothing moves, and you'll be asked again next period.").then(function (ok) {
        if (!ok) return;
        FT.resolveDebtApproval(sp[0], sp[1], false);
        FT.toast(es ? '⏭️ Pago saltado' : '⏭️ Payment skipped');
      });
    }
  });
  render();
  // 19-oct-2026: ingresos viejos sin tipo -- se etiquetan solos los obvios y se
  // pregunta (una vez al día como máximo) por los demás.
  setTimeout(function () { try { FT.reviewIncomeKinds(); } catch (e) {} }, 800);
});
document.addEventListener('ft:datachanged', render);
document.addEventListener('ft:langchange', render);
if (window.FT && FT._user) { /* boot ya corrió */ }
</script>
