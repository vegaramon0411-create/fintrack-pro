<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>FinTrack Pro · Inicio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<script src="premium.js"></script>
<style>
  /* dashboard.html — tokens y clases .ft-* vienen de premium.js */
  .d-hero{text-align:center;margin-bottom:8px;cursor:pointer;}
  .d-hero .cap{font-size:12px;font-weight:700;color:var(--text3);display:inline-flex;align-items:center;gap:5px;}
  .d-hero .row{display:flex;align-items:center;justify-content:center;gap:11px;margin-top:8px;}
  .d-hero .sign{width:23px;height:23px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:14px;font-weight:900;}
  .d-hero .sign.neg{background:var(--red);}.d-hero .sign.pos{background:var(--g-main);}
  .d-hero .amt{font-family:var(--round-font);font-weight:900;font-size:47px;letter-spacing:-1.8px;line-height:1;font-variant-numeric:tabular-nums;}
  .d-hero .amt .cur{font-size:.42em;color:var(--text3);font-weight:800;margin-left:4px;letter-spacing:0;}
  .d-split{display:flex;justify-content:center;gap:8px;margin-top:15px;flex-wrap:wrap;}
  .d-split .c{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:800;padding:7px 12px;border-radius:99px;background:var(--chip);font-variant-numeric:tabular-nums;cursor:pointer;}
  .d-split .c small{color:var(--text3);font-weight:700;}
  .d-split .c .m{width:15px;height:15px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:9px;font-weight:900;}
  .d-split .c .m.neg{background:var(--red);}.d-split .c .m.pos{background:var(--g-main);}

  .d-bud-h{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:10px;}
  .d-bud-h .t{font-size:11px;font-weight:700;color:var(--text3);}
  .d-bud-h .r{font-family:var(--round-font);font-weight:900;font-size:18px;letter-spacing:-.5px;cursor:pointer;background:none;border:none;color:var(--ink);}
  .d-bud-a{display:flex;justify-content:space-between;margin-top:11px;font-size:10.5px;font-weight:700;color:var(--text3);}
  .d-bud-a button{background:none;border:none;color:var(--text3);font-weight:700;font-size:10.5px;cursor:pointer;font-family:var(--ui-font);}
  .d-bud-day{font-size:10.5px;font-weight:700;color:var(--text3);text-align:center;margin-top:9px;padding-top:9px;border-top:1px solid var(--hair);}

  .d-legend{font-size:9.5px;color:var(--text3);text-align:center;display:flex;align-items:center;justify-content:center;gap:5px;margin-top:8px;}
  .d-legend i{width:14px;border-top:1.5px dashed #C9CACF;display:inline-block;}

  .d-mrow{margin-bottom:14px;}
  .d-mrow .mt{display:flex;justify-content:space-between;align-items:center;font-size:11.5px;font-weight:700;margin-bottom:6px;}
  .d-mrow .mt .l{color:var(--text2);cursor:pointer;display:inline-flex;align-items:center;gap:4px;background:none;border:none;font-family:var(--ui-font);font-weight:700;font-size:11.5px;}
  .d-mrow .mt .n{font-family:var(--round-font);font-weight:800;color:var(--text3);font-variant-numeric:tabular-nums;}
  .d-mrow .mt .n b{color:var(--ink);}
  .d-mtrack{height:7px;border-radius:99px;background:var(--sunk);overflow:hidden;}
  .d-mfill{height:100%;border-radius:99px;transition:width .8s cubic-bezier(.22,1,.36,1);}
  .d-mrow .foot{display:flex;justify-content:space-between;font-size:9.5px;color:var(--text3);margin-top:4px;font-weight:700;}
  .d-alert{display:flex;gap:8px;align-items:center;background:var(--red-dim);color:#B23B3F;border-radius:11px;padding:9px 12px;font-size:11.5px;font-weight:700;margin-top:6px;}

  .d-cheque .sub{font-size:11px;color:var(--text3);margin:3px 0 12px;}
  .d-empty{text-align:center;color:var(--text3);font-size:12.5px;padding:24px 10px;}
</style>
</head>
<body>
<div class="ft-app"><div class="ft-page" id="dashRoot"></div></div>

<script>
var MONTH_OFF = 0;      // 0 = mes actual, -1 = anterior…
var HERO_VIEW = 0;      // 0 Personal · 1 Hogar · 2 Patrimonio
var TAB = FT.getRaw('ft_dash_tab', 'resumen');
var shell;

var MES = { es:['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'],
            en:['January','February','March','April','May','June','July','August','September','October','November','December'] };

function viewDate(off) { var d = new Date(); d.setDate(1); d.setMonth(d.getMonth() + (off == null ? MONTH_OFF : off)); return d; }
function monthKey(off) { var d = viewDate(off); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0'); }
function monthLabel() { var d = viewDate(); return MES[FT.lang][d.getMonth()] + ' ' + d.getFullYear(); }

function greeting() {
  var h = new Date().getHours();
  var es = FT.lang === 'es';
  var g = h < 12 ? (es ? 'Buenos días' : 'Good morning') : h < 19 ? (es ? 'Buenas tardes' : 'Good afternoon') : (es ? 'Buenas noches' : 'Good evening');
  return g + ', ' + (FT.user().name || '').split(' ')[0];
}
function daysLeft() {
  if (MONTH_OFF !== 0) return 0;
  var d = new Date(), last = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate();
  return last - d.getDate();
}

/* ── cálculos ── */
function monthTxs(off) {
  var mk = monthKey(off);
  return FT.txs().filter(function (t) { return String(t.date || '').slice(0, 7) === mk; });
}
function totals() {
  var txs = monthTxs();
  var t = { gasto: 0, ingreso: 0, ahorro: 0, inversion: 0, suscripcion: 0, hipoteca: 0, needs: 0, wants: 0, hogar: 0, txs: txs };
  var conn = FT.hogarConnected();
  txs.forEach(function (x) {
    var a = parseFloat(x.amount) || 0;
    t[x.type] = (t[x.type] || 0) + a;
    if (x.type === 'gasto' || x.type === 'suscripcion' || x.type === 'hipoteca') {
      if (conn && x.hogar === true) { t.hogar += a; }
      else {
        var kind = x.type === 'hipoteca' ? 'needs' : FT.entryCategoryType(x.cat);
        if (kind === 'needs') t.needs += a; else t.wants += a;
      }
    }
  });
  t.spent = t.gasto + t.suscripcion + t.hipoteca + t.ahorro + t.inversion;
  t.personalAhorro = txs.filter(function (x) { return x.type === 'ahorro' && x.hogar !== true; }).reduce(function (s, x) { return s + (parseFloat(x.amount) || 0); }, 0);
  return t;
}
function partnerHogarSpent() {
  var h = FT.hogar();
  if (!h.connected || !h.partnerEmail) return 0;
  var pp = FT.get('profile_' + h.partnerEmail.replace(/[^a-z0-9]/gi, '_'), null);
  if (!pp || !pp.data || !pp.data.transactions) return 0;
  var mk = monthKey();
  return pp.data.transactions.filter(function (t) {
    return t.hogar === true && String(t.date || '').slice(0, 7) === mk && ['gasto', 'suscripcion', 'hipoteca'].indexOf(t.type) > -1;
  }).reduce(function (s, t) { return s + (parseFloat(t.amount) || 0); }, 0);
}
function limits() {
  var u = FT.user(), income = u.income || 0;
  var conn = FT.hogarConnected();
  var base = conn ? income * FT.personalPct() / 100 : income;
  return conn
    ? { base: base, needs: base * 0.5, wants: base * 0.3, savings: base * 0.2, income: income }
    : { base: base, needs: u.needs || base * 0.5, wants: u.wants || base * 0.3, savings: u.savings || base * 0.2, income: income };
}
function patrimonio() {
  var invVal = FT.investments().reduce(function (s, i) { return s + FT.investmentValue(i); }, 0);
  var mk = monthKey();
  var inc = FT.txs().filter(function (t) { return t.type === 'ingreso' && String(t.date || '').slice(0, 7) === mk; });
  var cheque = inc.filter(function (t) { return t.incomeKind !== 'extra' && t.incomeKind !== 'cobertura'; }).reduce(function (s, t) { return s + (parseFloat(t.amount) || 0); }, 0);
  var extra = inc.filter(function (t) { return t.incomeKind === 'extra' || t.incomeKind === 'cobertura'; }).reduce(function (s, t) { return s + (parseFloat(t.amount) || 0); }, 0);
  var t = totals();
  var disp = cheque * FT.personalPct() / 100 + extra - t.needs - t.wants - t.personalAhorro - t.inversion;
  return {
    total: FT.savingsBalance() + FT.emergencyBalance() + invVal + (FT.hogarConnected() ? disp : Math.max(0, disp)),
    parts: [
      [FT.lang === 'es' ? 'Ahorro libre' : 'Free savings', FT.savingsBalance()],
      [FT.lang === 'es' ? 'Fondo de emergencia' : 'Emergency fund', FT.emergencyBalance()],
      [FT.lang === 'es' ? 'Inversiones' : 'Investments', invVal],
      [FT.lang === 'es' ? 'Disponible personal' : 'Personal available', disp]
    ]
  };
}
/** promedio mensual de gasto por categoría en los 3 meses previos → contorno punteado */
function catBudgets() {
  var acc = {}, seen = {};
  for (var k = 1; k <= 3; k++) {
    monthTxs(MONTH_OFF - k).forEach(function (x) {
      if (x.type !== 'gasto' || x.hogar === true) return;
      var l = catLabel(x.cat);
      acc[l] = (acc[l] || 0) + (parseFloat(x.amount) || 0);
    });
    var mk = monthKey(MONTH_OFF - k); seen[mk] = 1;
  }
  var months = Object.keys(seen).length || 3;
  var out = {};
  Object.keys(acc).forEach(function (l) { out[l] = acc[l] / months; });
  return out;
}
function catLabel(cat) { var m = String(cat || '').match(/^(\S+)\s+(.*)$/); return m ? m[2] : String(cat || ''); }

/* ── render ── */
function render() {
  var es = FT.lang === 'es';
  var u = FT.user(), t = totals(), L = limits();
  var hogarCombined = t.hogar + partnerHogarSpent();

  // HERO
  var heroCap, heroAmt, heroSign, splitHTML = '';
  if (HERO_VIEW === 2) {
    var pat = patrimonio();
    heroCap = es ? 'Patrimonio personal' : 'Personal net worth'; heroAmt = pat.total; heroSign = 'pos';
  } else if (HERO_VIEW === 1) {
    heroCap = es ? 'Gasto del hogar en ' + MES[FT.lang][viewDate().getMonth()].toLowerCase() : 'Household spending'; heroAmt = hogarCombined; heroSign = 'neg';
  } else {
    heroCap = es ? 'Gastado en ' + MES[FT.lang][viewDate().getMonth()].toLowerCase() : 'Spent this month'; heroAmt = t.spent; heroSign = 'neg';
    splitHTML =
      '<div class="d-split">' +
        '<button class="c" onclick="explain(\'ingreso\')"><span class="m pos">+</span>' + FT.money(t.ingreso).replace('$', '') + ' <small>' + (es ? 'ingreso' : 'income') + '</small></button>' +
        (FT.hogarConnected() ? '<button class="c" onclick="explain(\'hogar\')"><span class="m neg">−</span>' + FT.money(hogarCombined).replace('$', '') + ' <small>' + (es ? 'hogar' : 'household') + '</small></button>' : '') +
      '</div>';
  }
  var mp = FT.moneyParts(heroAmt);

  // BUDGET
  var budgetLeft = (L.income || 0) - t.spent;
  var dl = daysLeft();
  var perDay = (L.income > 0 && dl > 0) ? Math.max(0, budgetLeft / dl) : 0;
  var spentPct = L.income > 0 ? Math.min(100, t.spent / L.income * 100) : 0;

  // CATEGORY BARS
  var budgets = catBudgets();
  var byCat = {};
  t.txs.filter(function (x) { return x.type === 'gasto' && x.hogar !== true; }).forEach(function (x) {
    var l = catLabel(x.cat); byCat[l] = (byCat[l] || 0) + (parseFloat(x.amount) || 0);
  });
  var catItems = Object.keys(byCat).map(function (l) {
    var emojiMatch = t.txs.find(function (x) { return catLabel(x.cat) === l; });
    var em = emojiMatch ? (String(emojiMatch.cat).match(/^(\S+)/) || [''])[0] : '';
    return { cat: (em ? em + ' ' : '') + l, spent: byCat[l], budget: budgets[l] || 0 };
  });

  // MÉTODO
  var nP = L.needs > 0 ? Math.min(100, t.needs / L.needs * 100) : 0;
  var wP = L.wants > 0 ? Math.min(100, t.wants / L.wants * 100) : 0;
  var savingsSpent = t.personalAhorro + t.inversion;
  var sP = L.savings > 0 ? Math.min(100, savingsSpent / L.savings * 100) : 0;

  var lastTxs = t.txs.slice().sort(function (a, b) { return String(b.date).localeCompare(String(a.date)) || b.id - a.id; }).slice(0, 6);

  document.getElementById('dashRoot').innerHTML =
    '<div class="d-hero" onclick="cycleView()">' +
      '<div class="cap" onclick="event.stopPropagation();explain(\'' + (HERO_VIEW === 2 ? 'patrimonio' : 'gasto') + '\')">' + heroCap + ' <span class="ft-info">i</span></div>' +
      '<div class="row"><span class="sign ' + heroSign + '">' + (heroSign === 'neg' ? '−' : '+') + '</span>' +
        '<span class="amt">' + mp.int + '<span class="cur">$</span></span></div>' +
      splitHTML +
    '</div>' +

    '<div class="ft-card">' +
      '<div class="d-bud-h"><span class="t">' + (es ? 'Presupuesto de ' : 'Budget for ') + MES[FT.lang][viewDate().getMonth()].toLowerCase() + '</span>' +
        '<button class="r" onclick="explain(\'presupuesto\')">' + FT.money(budgetLeft) + ' ' + (es ? 'restante' : 'left') + '</button></div>' +
      '<div class="ft-track"><div class="ft-fill" id="dFill"></div></div>' +
      '<div class="d-bud-a"><button onclick="FT.go(\'perfil.html\')">↑ ' + (es ? 'Editar presupuesto' : 'Edit budget') + '</button>' +
        '<button onclick="openPicker()">↓ ' + (es ? 'Nueva transacción' : 'New transaction') + '</button></div>' +
      (dl > 0 ? '<div class="d-bud-day">' + FT.money(perDay) + ' / ' + (es ? 'día disponible · ' + dl + ' días restantes' : 'day available · ' + dl + ' days left') + '</div>' : '') +
    '</div>' +

    '<div class="ft-section">' +
      '<div class="ft-tabs">' +
        '<button class="ft-tab ' + (TAB === 'resumen' ? 'on' : '') + '" onclick="setTab(\'resumen\')">' + (es ? 'Resumen' : 'Summary') + '</button>' +
        '<button class="ft-tab ' + (TAB === 'metodo' ? 'on' : '') + '" onclick="setTab(\'metodo\')">' + (es ? 'Método' : 'Method') + ' ' + (u.method || '50/30/20') + '</button>' +
      '</div>' +

      '<div class="ft-pane" id="pResumen" ' + (TAB === 'resumen' ? '' : 'hidden') + '>' +
        (catItems.length ? FT.catBars(catItems) + '<div class="d-legend"><i></i> ' + (es ? 'contorno = tu promedio de 3 meses' : 'outline = your 3-month average') + '</div>' : '<div class="d-empty">' + (es ? 'Sin gastos personales este mes' : 'No personal spending this month') + '</div>') +
        '<div class="ft-section"><div class="ft-section-head"><h3>' + (es ? 'Últimos movimientos' : 'Recent activity') + '</h3><button class="link" onclick="FT.go(\'historial.html\')">' + (es ? 'Ver todos' : 'See all') + '</button></div>' +
          (lastTxs.length ? lastTxs.map(function (x, i) { return FT.txRow(x, i); }).join('') : '<div class="d-empty">' + (es ? 'Aún no hay movimientos' : 'No activity yet') + '</div>') + '</div>' +
      '</div>' +

      '<div class="ft-pane" id="pMetodo" ' + (TAB === 'metodo' ? '' : 'hidden') + '>' +
        mrow(es ? 'Necesidades' : 'Needs', 'needs', t.needs, L.needs, nP, 'var(--g-main)') +
        mrow(es ? 'Gustos' : 'Wants', 'wants', t.wants, L.wants, wP, 'var(--amber)') +
        mrow(es ? 'Ahorro' : 'Savings', 'savings', savingsSpent, L.savings, sP, 'var(--blue)') +
        (nP >= 90 ? '<div class="d-alert">⚠️ ' + (es ? 'Necesidades casi al límite — te quedan ' : 'Needs almost at limit — ') + FT.money(Math.max(0, L.needs - t.needs)) + '</div>' : '') +
      '</div>' +
    '</div>' +

    '<div class="ft-card d-cheque">' +
      '<div class="ft-section-head" style="margin:0"><h3>' + (es ? 'Mi cheque' : 'My paycheck') + '</h3><button class="link" onclick="FT.go(\'historial.html\')">' + (es ? 'Ver historial' : 'History') + '</button></div>' +
      '<div class="sub">' + chequeSub() + '</div>' +
      '<button class="ft-btn ft-btn-primary tap" onclick="openCheque()">＋ ' + (es ? 'Recibí mi cheque' : 'I got paid') + '</button>' +
    '</div>' +

    recurCardHTML(es);

  requestAnimationFrame(function () {
    var f = document.getElementById('dFill'); if (f) f.style.width = spentPct + '%';
    ['needs', 'wants', 'savings'].forEach(function (k) {
      var el = document.getElementById('mf_' + k);
      if (el) el.style.width = el.dataset.pct + '%';
    });
  });

  if (shell) {
    shell.setTitle(['Personal', FT.lang === 'es' ? 'Hogar' : 'Household', FT.lang === 'es' ? 'Patrimonio' : 'Net worth'][HERO_VIEW]);
    shell.setMonth(monthLabel());
    shell.setBellDot(FT.getNotifications().length > 0);
  }
}

function mrow(label, key, spent, limit, pct, color) {
  var es = FT.lang === 'es';
  if (pct >= 90) color = 'var(--red)';
  return '<div class="d-mrow"><div class="mt">' +
    '<button class="l" onclick="explain(\'' + key + '\')">' + label + ' <span class="ft-chev">›</span></button>' +
    '<span class="n"><b>' + FT.money(spent) + '</b> / ' + FT.money(limit) + '</span></div>' +
    '<div class="d-mtrack"><div class="d-mfill" id="mf_' + key + '" data-pct="' + pct + '" style="width:0;background:' + color + '"></div></div>' +
    '<div class="foot"><span>' + Math.round(pct) + '% ' + (es ? 'usado' : 'used') + '</span><span>' + FT.money(Math.max(0, limit - spent)) + ' ' + (es ? 'disponible' : 'available') + '</span></div></div>';
}

/* Extracto de "Recurrentes" (♻️) — los 3 más próximos de cualquier categoría,
   con botón a la lista completa. Resuelve la duda de que el hub central sea
   difícil de encontrar si solo vive detrás del menú "Más". */
function recurCardHTML(es) {
  var all;
  try { all = (FT.recurAllList() || []).filter(function (i) { return !i.paused; }); } catch (e) { all = []; }
  if (!all.length) return '';
  var upcoming = all.slice(0, 3);
  return '<div class="ft-card">' +
    '<div class="ft-section-head" style="margin:0 0 4px"><h3>♻️ ' + (es ? 'Recurrentes próximos' : 'Upcoming recurring') + '</h3><button class="link" onclick="FT.go(\'recurrentes.html\')">' + (es ? 'Ver todos' : 'See all') + '</button></div>' +
    upcoming.map(function (i) {
      return '<div class="ft-mv tap" onclick="FT.go(\'recurrentes.html\')"><div class="ic rec">' + i.icon + '</div>' +
        '<div class="m"><div class="n">' + i.name + '</div><div class="d">' + (es ? 'próximo ' : 'next ') + FT.date(i.nextDate) + '</div></div>' +
        '<div class="amt in">' + FT.money(i.amount) + '</div></div>';
    }).join('') +
  '</div>';
}

function chequeSub() {
  var es = FT.lang === 'es', u = FT.user(), h = FT.hogar();
  var totH = (parseFloat(h.payPctHogar) || 50) + (parseFloat(h.saveHogarPct) || 10);
  var freqTxt = { weekly: es ? 'semanal' : 'weekly', biweekly: es ? 'quincenal' : 'biweekly', monthly: es ? 'mensual' : 'monthly' }[u.payFreq || 'biweekly'];
  return (es ? 'Pago ' : 'Pay ') + freqTxt + (FT.hogarConnected() ? ' · ' + (100 - totH) + (es ? '% personal / ' : '% personal / ') + totH + '% ' + (es ? 'hogar' : 'household') : '');
}

/* ── interacciones ── */
function cycleView() { HERO_VIEW = (HERO_VIEW + 1) % 3; render(); }
function setTab(tab) {
  TAB = tab; FT.setRaw('ft_dash_tab', tab);
  var pr = document.getElementById('pResumen'), pm = document.getElementById('pMetodo');
  pr.style.opacity = 0; pm.style.opacity = 0;
  document.querySelectorAll('.ft-tab').forEach(function (b) { b.classList.toggle('on', b.textContent.toLowerCase().indexOf(tab === 'metodo' ? (FT.lang === 'es' ? 'método' : 'method') : (FT.lang === 'es' ? 'resumen' : 'summary')) > -1); });
  setTimeout(function () { pr.hidden = tab !== 'resumen'; pm.hidden = tab !== 'metodo'; pr.style.opacity = 1; pm.style.opacity = 1; if (tab === 'metodo') render(); }, 110);
}

function explain(kind) {
  var es = FT.lang === 'es', t = totals(), L = limits(), rows, title;
  if (kind === 'gasto') {
    title = es ? 'Gastado este mes' : 'Spent this month';
    rows = [
      [(es ? 'Gastos (necesidades + gustos)' : 'Expenses'), '−' + FT.money(t.needs + t.wants)],
      [(es ? 'Gasto del hogar (tu parte)' : 'Household (your share)'), '−' + FT.money(t.hogar)],
      [(es ? 'Ahorro apartado' : 'Saved'), '−' + FT.money(t.personalAhorro)],
      [(es ? 'Invertido' : 'Invested'), '−' + FT.money(t.inversion)],
      [(es ? '= Total del mes' : '= Month total'), FT.money(t.spent)]
    ];
  } else if (kind === 'patrimonio') {
    var pat = patrimonio(); title = es ? 'Patrimonio personal' : 'Personal net worth';
    rows = pat.parts.map(function (p) { return [p[0], FT.money(p[1])]; }); rows.push([es ? '= Patrimonio' : '= Net worth', FT.money(pat.total)]);
  } else if (kind === 'presupuesto') {
    title = es ? 'Presupuesto del mes' : 'Monthly budget';
    rows = [[es ? 'Ingreso del mes' : 'Monthly income', FT.money(L.income)], [es ? '− Gastado' : '− Spent', FT.money(t.spent)], [es ? '= Restante' : '= Left', FT.money(L.income - t.spent)]];
  } else if (kind === 'ingreso') {
    title = es ? 'Ingreso del mes' : 'Monthly income';
    rows = t.txs.filter(function (x) { return x.type === 'ingreso'; }).map(function (x) { return [x.desc, '+' + FT.money(x.amount, { cents: true })]; });
    if (!rows.length) rows = [[es ? 'Sin ingresos registrados' : 'No income logged', FT.money(0)]];
  } else if (kind === 'hogar') {
    title = es ? 'Gasto del hogar' : 'Household spending';
    rows = [[es ? 'Tu gasto marcado hogar' : 'Your household expenses', FT.money(t.hogar)], [es ? 'Gasto de tu pareja' : "Partner's expenses", FT.money(partnerHogarSpent())], [es ? '= Combinado' : '= Combined', FT.money(t.hogar + partnerHogarSpent())]];
  } else if (kind === 'needs' || kind === 'wants' || kind === 'savings') {
    var pctLbl = { needs: '50%', wants: '30%', savings: '20%' }[kind];
    var spent = kind === 'needs' ? t.needs : kind === 'wants' ? t.wants : (t.personalAhorro + t.inversion);
    title = { needs: es ? 'Necesidades' : 'Needs', wants: es ? 'Gustos' : 'Wants', savings: es ? 'Ahorro' : 'Savings' }[kind];
    rows = [
      [es ? 'Base personal' : 'Personal base', FT.money(L.base)],
      ['× ' + pctLbl + ' (' + (es ? 'regla ' : '') + (FT.user().method || '50/30/20') + ')', FT.money(L[kind])],
      [es ? 'Usado' : 'Used', FT.money(spent)],
      [es ? 'Disponible' : 'Available', FT.money(Math.max(0, L[kind] - spent))]
    ];
  } else return;

  FT.sheet({
    title: (es ? '¿Cómo se calcula?' : 'How is this calculated?') + ' · ' + title,
    html: rows.map(function (r) { return '<div class="ft-row"><span class="k">' + r[0] + '</span><span class="v">' + r[1] + '</span></div>'; }).join('')
  });
}

function openPicker() {
  var es = FT.lang === 'es';
  var opts = [
    ['gasto', '💸', es ? 'Gasto' : 'Expense'], ['ingreso', '💰', es ? 'Ingreso' : 'Income'],
    ['ahorro', '💵', es ? 'Ahorro' : 'Savings'], ['inversion', '📈', es ? 'Inversión' : 'Investment'],
    ['suscripcion', '🔄', es ? 'Suscripción' : 'Subscription'], ['servicio', '🏠', es ? 'Servicio hogar' : 'Household service']
  ];
  var ov = FT.sheet({
    title: es ? '¿Qué quieres registrar?' : 'What do you want to log?',
    html: '<div style="display:grid;grid-template-columns:1fr 1fr;gap:9px">' +
      opts.map(function (o) {
        return '<button class="tap" data-t="' + o[0] + '" style="display:flex;flex-direction:column;align-items:center;gap:5px;padding:15px 8px;border-radius:13px;border:1px solid var(--hair);background:var(--sunk);cursor:pointer;font-family:var(--ui-font);font-size:12px;font-weight:800;color:var(--ink)"><span style="font-size:21px">' + o[1] + '</span>' + o[2] + '</button>';
      }).join('') + '</div>'
  });
  ov.querySelectorAll('[data-t]').forEach(function (b) {
    b.addEventListener('click', function () { FT.closeTop(); openEntry(b.getAttribute('data-t')); });
  });
}

function openEntry(type) {
  var es = FT.lang === 'es';
  var isServ = type === 'servicio';
  var realType = isServ ? 'suscripcion' : type;
  var CATS = ['🛒 Supermercado', '🍔 Restaurantes', '💊 Salud', '⛽ Gasolina', '🏠 Renta / Hipoteca', '📱 Teléfono/Internet', '🎬 Entretenimiento', '👕 Ropa', '✈️ Viajes', '🔧 Mantenimiento', '📦 Otros'];
  var extra = '';
  if (realType === 'gasto' || realType === 'hipoteca') extra += '<div class="ft-field"><label>' + (es ? 'Categoría' : 'Category') + '</label><select id="eCat">' + CATS.map(function (c) { return '<option>' + c + '</option>'; }).join('') + '</select></div>';
  if (FT.hogarConnected() && (realType === 'gasto' || realType === 'inversion' || (realType === 'suscripcion' && !isServ)))
    extra += '<div class="ft-field"><label>' + (es ? 'Es para' : 'For') + '</label><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><button type="button" id="ePers" class="tap" style="padding:9px;border-radius:10px;border:1.5px solid var(--g-main);background:var(--g-light);color:var(--g-dark);font-weight:800;font-family:var(--ui-font)">👤 ' + (es ? 'Personal' : 'Personal') + '</button><button type="button" id="eHog" class="tap" style="padding:9px;border-radius:10px;border:1px solid var(--hair);background:var(--sunk);color:var(--text2);font-weight:800;font-family:var(--ui-font)">🏠 ' + (es ? 'Hogar' : 'Household') + '</button></div></div>';
  if (realType === 'ahorro')
    extra += '<div class="ft-field"><label>' + (es ? 'Destino' : 'Destination') + '</label><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><button type="button" id="eLib" class="tap" style="padding:9px;border-radius:10px;border:1.5px solid var(--g-main);background:var(--g-light);color:var(--g-dark);font-weight:800;font-family:var(--ui-font)">💵 ' + (es ? 'Ahorro libre' : 'Free savings') + '</button><button type="button" id="eEmg" class="tap" style="padding:9px;border-radius:10px;border:1px solid var(--hair);background:var(--sunk);color:var(--text2);font-weight:800;font-family:var(--ui-font)">🛡️ ' + (es ? 'Emergencia' : 'Emergency') + '</button></div></div>';
  if (realType === 'ingreso')
    extra += '<label class="tap" style="display:flex;gap:9px;align-items:flex-start;background:var(--sunk);border:1px solid var(--hair);border-radius:11px;padding:10px 12px;cursor:pointer;font-size:11.5px;color:var(--text2)"><input type="checkbox" id="eDist" style="width:17px;height:17px;margin-top:1px;accent-color:var(--g-main)"><span>' + (es ? 'Repartir automáticamente a ahorro / emergencia / inversión según mis %.' : 'Auto-distribute to savings / emergency / investing by my %.') + '</span></label>';

  var state = { hogar: false, dest: 'libre' };
  var titles = { gasto: es ? 'Gasto' : 'Expense', ingreso: es ? 'Ingreso' : 'Income', ahorro: es ? 'Ahorro' : 'Savings', inversion: es ? 'Inversión' : 'Investment', suscripcion: es ? 'Suscripción' : 'Subscription', servicio: es ? 'Servicio del hogar' : 'Household service' };

  var ov = FT.modal({
    title: (es ? 'Nuevo: ' : 'New: ') + titles[type],
    html:
      '<div class="ft-field"><label>' + (es ? 'Descripción' : 'Description') + '</label><input id="eDesc" placeholder="' + (es ? 'Ej. Soriana' : 'e.g. Store') + '"></div>' +
      '<div class="ft-field"><label>' + (es ? 'Monto' : 'Amount') + '</label><input id="eAmt" inputmode="decimal" placeholder="$0"></div>' +
      '<div class="ft-field"><label>' + (es ? 'Fecha' : 'Date') + '</label><input id="eDate" type="date" value="' + FT.todayISO() + '"></div>' +
      extra,
    saveLabel: es ? 'Guardar registro' : 'Save entry',
    onOpen: function (body) {
      var h = body.querySelector('#eHog'), p = body.querySelector('#ePers');
      if (h) { h.onclick = function () { state.hogar = true; sel(h, p); }; p.onclick = function () { state.hogar = false; sel(p, h); }; }
      var lib = body.querySelector('#eLib'), emg = body.querySelector('#eEmg');
      if (lib) { emg.onclick = function () { state.dest = 'emergencia'; sel(emg, lib); }; lib.onclick = function () { state.dest = 'libre'; sel(lib, emg); }; }
      function sel(on, off) {
        on.style.borderColor = 'var(--g-main)'; on.style.background = 'var(--g-light)'; on.style.color = 'var(--g-dark)';
        off.style.borderColor = 'var(--hair)'; off.style.background = 'var(--sunk)'; off.style.color = 'var(--text2)';
      }
    },
    onSave: function (body) {
      var o = {
        type: realType,
        desc: body.querySelector('#eDesc').value.trim(),
        amount: body.querySelector('#eAmt').value,
        date: body.querySelector('#eDate').value,
        cat: body.querySelector('#eCat') ? body.querySelector('#eCat').value : undefined,
        hogar: state.hogar, dest: state.dest,
        incomeKind: realType === 'ingreso' ? 'extra' : undefined,
        autoDist: body.querySelector('#eDist') ? body.querySelector('#eDist').checked : false,
        esServicioHogar: isServ
      };
      if (!o.desc || !parseFloat(o.amount) || !o.date) { FT.toast(FT.lang === 'es' ? 'Completa descripción, monto y fecha' : 'Fill description, amount and date'); return true; }

      // Gasto personal que excede el disponible → hoja de cobertura (opción C).
      if (realType === 'gasto' && !o.hogar) {
        var disp = FT.personalAvailable();
        var amt = parseFloat(o.amount);
        if (amt > disp) {
          var falt = Math.round((amt - Math.max(0, disp)) * 100) / 100;
          coberturaSheet(o.desc, falt).then(function (choice) {
            if (choice === 'libre' || choice === 'emergencia') o.cobertura = { source: choice, monto: falt };
            commit(o); FT.closeTop();
          });
          return true;
        }
      }
      commit(o);
    }
  });

  function commit(o) {
    var e = FT.addEntry(o);
    if (e) {
      if (o.cobertura) FT.toast(FT.money(o.cobertura.monto) + (FT.lang === 'es' ? ' movido de ' : ' moved from ') + (o.cobertura.source === 'emergencia' ? (FT.lang === 'es' ? 'Emergencia' : 'Emergency') : (FT.lang === 'es' ? 'Ahorro libre' : 'Free savings')) + (FT.lang === 'es' ? ' para cubrir «' : ' to cover "') + o.desc + '»', { icon: '💵', ms: 4000 });
      else FT.toast((FT.lang === 'es' ? 'Registrado · ' : 'Logged · ') + FT.money(e.amount, { cents: true }), { icon: '✅' });
    }
    render();
  }
}

/** Hoja de cobertura: ¿de dónde cubrir el faltante de un gasto que excede el disponible? */
function coberturaSheet(name, falt) {
  var es = FT.lang === 'es';
  return new Promise(function (resolve) {
    FT.sheet({
      title: es ? 'Excede tu disponible' : 'Over your available',
      html: '<p style="font-size:13px;color:var(--text2);margin:2px 0 6px">' +
        (es ? 'Este gasto supera tu disponible del mes por ' : 'This expense is over your monthly available by ') +
        '<b>' + FT.money(falt) + '</b>. ' + (es ? '¿De dónde lo cubres?' : 'Where do you cover it from?') + '</p>',
      actions: [
        { label: '💵 ' + (es ? 'Ahorro libre' : 'Free savings') + ' · ' + FT.money(FT.savingsBalance()), primary: true, onClick: function () { resolve('libre'); } },
        { label: '🛡️ ' + (es ? 'Emergencia' : 'Emergency') + ' · ' + FT.money(FT.emergencyBalance()), onClick: function () { resolve('emergencia'); } },
        { label: es ? 'Dejarlo en rojo (gasto extra)' : 'Leave it negative', onClick: function () { resolve('rojo'); } }
      ]
    });
  });
}

function openCheque() {
  var es = FT.lang === 'es', h = FT.hogar(), u = FT.user();
  var totH = (parseFloat(h.payPctHogar) || 50) + (parseFloat(h.saveHogarPct) || 10);
  var checks = u.payFreq === 'weekly' ? 4 : u.payFreq === 'biweekly' ? 2 : 1;
  var expected = (u.income || 0) / checks;
  var st = { tipo: 'nuevo' };

  var ov = FT.modal({
    title: es ? 'Recibí mi cheque' : 'I got paid',
    html:
      '<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px">' +
        '<button type="button" id="cNuevo" class="tap" style="padding:9px;border-radius:10px;border:1.5px solid var(--g-main);background:var(--g-light);color:var(--g-dark);font-weight:800;font-family:var(--ui-font)">' + (es ? 'Nuevo (ingreso)' : 'New (income)') + '</button>' +
        '<button type="button" id="cExist" class="tap" style="padding:9px;border-radius:10px;border:1px solid var(--hair);background:var(--sunk);color:var(--text2);font-weight:800;font-family:var(--ui-font)">' + (es ? 'Ya lo tenía' : 'Already had it') + '</button>' +
      '</div>' +
      '<div class="ft-field"><label>' + (es ? 'Monto recibido' : 'Amount received') + '</label><input id="cMonto" inputmode="decimal" value="' + (expected > 0 ? expected.toFixed(2) : '') + '"></div>' +
      '<div id="cPrev" style="background:var(--sunk);border-radius:11px;padding:11px;font-size:11.5px;color:var(--text2);margin-bottom:6px"></div>',
    saveLabel: es ? 'Registrar cheque' : 'Log paycheck',
    onOpen: function (body) {
      var n = body.querySelector('#cNuevo'), x = body.querySelector('#cExist'), inp = body.querySelector('#cMonto');
      function sel(on, off) { on.style.borderColor = 'var(--g-main)'; on.style.background = 'var(--g-light)'; on.style.color = 'var(--g-dark)'; off.style.borderColor = 'var(--hair)'; off.style.background = 'var(--sunk)'; off.style.color = 'var(--text2)'; }
      n.onclick = function () { st.tipo = 'nuevo'; sel(n, x); prev(); };
      x.onclick = function () { st.tipo = 'existente'; sel(x, n); prev(); };
      inp.oninput = prev;
      function prev() {
        var m = parseFloat(inp.value) || 0;
        var hogarAmt = m * totH / 100, persAmt = m - hogarAmt;
        var savPct = u.savingsPct != null ? u.savingsPct : 20;
        body.querySelector('#cPrev').innerHTML = m > 0
          ? (es ? 'Se reparte: ' : 'Split: ') + '<b>🏠 ' + FT.money(hogarAmt) + '</b> ' + (es ? 'hogar · ' : 'household · ') + '<b>👤 ' + FT.money(persAmt) + '</b> ' + (es ? 'personal' : 'personal') +
            (st.tipo === 'nuevo' ? '<br>' + (es ? 'De tu parte personal, ' : 'Of your personal share, ') + '<b>' + FT.money(Math.round(persAmt * savPct / 100)) + '</b> (' + savPct + '%) ' + (es ? 'a Ahorro libre — «págate primero».' : 'to Free savings — "pay yourself first".') : '')
          : '';
      }
      prev();
    },
    onSave: function (body) {
      var m = parseFloat(body.querySelector('#cMonto').value);
      if (!m || m <= 0) { FT.toast(es ? 'Ingresa el monto' : 'Enter the amount'); return true; }
      var r = FT.recordCheque({ monto: m, tipo: st.tipo });
      if (r) FT.toast('✅ ' + FT.money(r.monto) + (r.autoSaved > 0 ? ' · ' + FT.money(r.autoSaved) + (es ? ' a Ahorro libre' : ' to Free savings') : ''));
      render();
    }
  });
}

/* ── init ── */
document.addEventListener('ft:ready', function () {
  if (!FT.getRaw('ft_onboarding_saldos_done') && !FT.getRaw('ft_user_setup')) { location.replace('onboarding.html'); return; }
  shell = FT.shell({
    active: 'home',
    title: 'Personal',
    onSwitch: cycleView,
    month: true,
    monthLabel: monthLabel(),
    onMonth: function (d) { if (d > 0 && MONTH_OFF >= 0) return; MONTH_OFF += d; render(); },
    onPlus: openPicker
  });
  // Tocar una fila de movimiento → hoja de detalle (§6: ninguna fila muerta)
  document.getElementById('dashRoot').addEventListener('click', function (e) {
    var row = e.target.closest('.ft-tx[data-txid]');
    if (row) openTxDetail(row.getAttribute('data-txid'));
  });
  render();
});

function openTxDetail(id) {
  var es = FT.lang === 'es';
  var x = FT.txs().find(function (t) { return String(t.id) === String(id); });
  if (!x) return;
  var typeName = { gasto: es ? 'Gasto' : 'Expense', ingreso: es ? 'Ingreso' : 'Income', ahorro: es ? 'Ahorro' : 'Savings', inversion: es ? 'Inversión' : 'Investment', suscripcion: es ? 'Suscripción' : 'Subscription', hipoteca: es ? 'Renta/Hipoteca' : 'Rent/Mortgage' }[x.type] || x.type;
  var rows = [
    [es ? 'Tipo' : 'Type', typeName],
    [es ? 'Categoría' : 'Category', x.cat || '—'],
    [es ? 'Fecha' : 'Date', FT.date(x.date)],
    [es ? 'Monto' : 'Amount', FT.money(x.amount, { cents: true })]
  ];
  if (x.hogar) rows.push([es ? 'Marcado' : 'Tagged', es ? 'Del hogar' : 'Household']);
  if (x.auto) rows.push([es ? 'Origen' : 'Source', es ? 'Automático' : 'Automatic']);
  FT.sheet({
    title: x.desc,
    html: rows.map(function (r) { return '<div class="ft-row"><span class="k">' + r[0] + '</span><span class="v">' + r[1] + '</span></div>'; }).join(''),
    actions: [
      { label: '🗑️ ' + (es ? 'Eliminar' : 'Delete'), onClick: function () {
          FT.confirm(es ? '¿Eliminar este movimiento? Se revierten los saldos vinculados.' : 'Delete this entry? Linked balances will be reverted.').then(function (ok) {
            if (ok) { FT.deleteTx(x.id); FT.toast(es ? 'Eliminado' : 'Deleted'); render(); }
          });
        } }
    ]
  });
}
document.addEventListener('ft:datachanged', render);
document.addEventListener('ft:langchange', render);
if (window.FT && FT._user) { /* boot ya corrió */ }
</script>
</body>
</html>
