<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>FinTrack Pro · Recurrentes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<script src="premium.js"></script>
</head>
<body>
<div class="ft-app"><div class="ft-page" id="root"></div></div>
<script>
var filterMode = 'all';
var FILTERS = [
  ['all', '🔁', 'Todos', 'All'],
  ['debt', '💳', 'Deudas', 'Debts'],
  ['ahorro', '💵', 'Ahorro libre', 'Free savings'],
  ['emerg', '🛡️', 'Emergencia', 'Emergency'],
  ['inversion', '📈', 'Inversión', 'Investment'],
  ['metapersonal', '🎯', 'Mis metas', 'My goals'],
  ['hogar', '🏠', 'Aportes hogar', 'Household deposits'],
  ['sub', '🔄', 'Suscripciones', 'Subscriptions'],
  ['serv', '🏠', 'Servicios', 'Utilities'],
  ['transferencia', '🔁', 'Transferencias', 'Transfers']
];
var PASTEL = { debt: 'coral', ahorro: 'mint', emerg: 'sky', inversion: 'peach', hogar: 'pink', metapersonal: 'peach', sub: 'pink', serv: 'coral', transferencia: 'sky' };
var PASTEL_TX = { debt: 'var(--coral-tx)', ahorro: 'var(--mint-tx)', emerg: 'var(--sky-tx)', inversion: 'var(--peach-tx)', hogar: 'var(--pink-tx)', metapersonal: 'var(--peach-tx)', sub: 'var(--pink-tx)', serv: 'var(--coral-tx)', transferencia: 'var(--sky-tx)' };
var PAGE_LABEL = { debt: ['Deudas', 'Debts'], ahorro: ['Ahorro libre', 'Free savings'], emerg: ['Emergencia', 'Emergency'], inversion: ['Inversiones', 'Investments'], hogar: ['Hogar', 'Household'], metapersonal: ['Metas', 'Goals'], sub: ['Suscripciones', 'Subscriptions'], serv: ['Servicios', 'Utilities'], transferencia: ['Mi dinero', 'My money'] };

function es() { return FT.lang === 'es'; }
// Personalizado (12-oct-2026, a petición de Ramón): mismo criterio de
// equivalente-mensual-aproximado que ya usa FT.recurringItemsScreen para
// subs/servicios -- 30.44 días/mes promedio.
function toMonthly(i) {
  if (i.freq === 'annual') return i.amount / 12;
  if (i.freq === 'weekly') return i.amount * 4.33;
  if (i.freq === 'biweekly') return i.amount * 2.17;
  if (typeof i.freq === 'string' && i.freq.indexOf('custom:') === 0) {
    var parts = i.freq.split(':'), n = parseInt(parts[1], 10) || 1, unit = parts[2];
    var daysPer = unit === 'days' ? n : unit === 'weeks' ? n * 7 : unit === 'years' ? n * 365.25 : n * 30.44;
    return daysPer > 0 ? i.amount * (30.44 / daysPer) : i.amount;
  }
  return i.amount;
}
function freqLbl(f) { var L = es(); return { weekly: L ? 'Semanal' : 'Weekly', biweekly: L ? 'Quincenal' : 'Biweekly', monthly: L ? 'Mensual' : 'Monthly', annual: L ? 'Anual' : 'Annual' }[f] || FT.customFreqLabel(f) || f; }

function render() {
  var L = es(), root = document.getElementById('root');
  var all = FT.recurAllList();
  var active = all.filter(function (i) { return !i.paused; });
  // Una transferencia recurrente es neutral (mueve dinero entre tus propias
  // cuentas/fondos, regla #1) -- no es un compromiso real como una deuda o
  // suscripción, así que no debe inflar el "total recurrente activo".
  var total = active.filter(function (i) { return i.pk !== 'transferencia'; }).reduce(function (a, i) { return a + toMonthly(i); }, 0);
  var items = filterMode === 'all' ? all : all.filter(function (i) { return i.pk === filterMode; });

  var h = '<div class="ft-card">' +
    '<div style="font-size:11px;color:var(--text3);font-weight:700;text-transform:uppercase;letter-spacing:.4px;margin-bottom:6px">' + (L ? 'Total recurrente activo' : 'Total active recurring payments') + '</div>' +
    '<div class="ft-num" style="font-size:30px">' + FT.money(total) + '<span style="font-size:13px;color:var(--text3);font-weight:600">/' + (L ? 'mes' : 'mo') + '</span></div>' +
    '<div style="font-size:11px;color:var(--text3);margin-top:4px">' + all.length + ' ' + (L ? 'recurrente(s) en total · ' : ('recurring ' + (all.length === 1 ? 'item' : 'items') + ' total · ')) + active.length + ' ' + (L ? 'activo(s)' : 'active') + '</div></div>';

  h += '<div style="display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;margin-bottom:14px">' +
    FILTERS.map(function (f) {
      var on = filterMode === f[0];
      return '<button class="tap" data-f="' + f[0] + '" style="flex-shrink:0;background:' + (on ? 'var(--ink)' : 'var(--sunk)') + ';border:1.5px solid ' + (on ? 'var(--ink)' : 'var(--hair)') + ';color:' + (on ? '#fff' : 'var(--text2)') + ';border-radius:99px;padding:6px 13px;font-size:12px;font-weight:700;font-family:inherit;cursor:pointer;white-space:nowrap">' + f[1] + ' ' + (L ? f[2] : f[3]) + '</button>';
    }).join('') + '</div>';

  if (!items.length) {
    h += '<div class="ft-empty">' + (L ? 'Nada por aquí en este filtro.' : 'Nothing here for this filter.') + '</div>';
  } else {
    h += '<div class="ft-card" style="padding:2px 16px">' + items.map(function (i) {
      var days = i.nextDate ? Math.ceil((new Date(i.nextDate + 'T00:00:00') - new Date(new Date().toDateString())) / 86400000) : null;
      return '<div class="tap" data-manage="' + i.uid + '" style="display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--hair);cursor:pointer">' +
        '<div class="ft-tx-ico ' + PASTEL[i.pk] + '" style="width:42px;height:42px;font-size:19px;display:grid;place-items:center;border-radius:13px;flex-shrink:0">' + i.icon + '</div>' +
        '<div style="flex:1;min-width:0">' +
          '<div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap">' +
            '<div style="font-size:13.5px;font-weight:800">' + i.name + '</div>' +
            (i.paused ? '<span style="font-size:9px;font-weight:800;padding:2px 7px;border-radius:20px;background:var(--chip);color:var(--text3)">' + (L ? 'PAUSADO' : 'PAUSED') + '</span>' : '<span style="font-size:9px;font-weight:800;padding:2px 7px;border-radius:20px;background:var(--g-light);color:var(--g-dark)">🔁 ' + (L ? 'Activo' : 'Active') + '</span>') +
            (i.autopay ? '<span style="font-size:9px;font-weight:800;padding:2px 7px;border-radius:20px;background:var(--g-light);color:var(--g-dark)">🔁 AUTOPAY</span>' : '<span style="font-size:9px;font-weight:800;padding:2px 7px;border-radius:20px;background:var(--peach-bg,#FBEFE8);color:var(--peach-tx,#8A5A12)">✋ MANUAL</span>') +
          '</div>' +
          '<div style="font-size:10.5px;color:var(--text3)">' + i.typeLabel + ' · ' + freqLbl(i.freq) + '</div>' +
          '<div style="font-size:10.5px;color:var(--text3);margin-top:1px">' + (L ? 'próximo' : 'next') + ' <b style="color:var(--text2)">' + (i.nextDate ? FT.date(i.nextDate) : '—') + '</b>' +
            (!i.paused && days != null && days >= 0 && days <= 3 ? ' · ' + (days === 0 ? (L ? 'hoy' : 'today') : days + 'd') : '') +
            (i.lastApplied ? ' · ' + (L ? 'último' : 'last') + ' <b style="color:var(--text2)">' + FT.date(i.lastApplied) + '</b>' : '') + '</div>' +
        '</div>' +
        '<div style="text-align:right;flex-shrink:0">' +
          '<div style="font-size:14px;font-weight:800;color:' + PASTEL_TX[i.pk] + '">' + FT.money(i.amount) + '</div>' +
          '<div style="font-size:9.5px;color:var(--blue);font-weight:700">' + (L ? 'Gestionar →' : 'Manage →') + '</div>' +
        '</div>' +
      '</div>';
    }).join('') + '</div>';
  }

  root.innerHTML = h;
  root.querySelectorAll('[data-f]').forEach(function (b) { b.onclick = function () { filterMode = b.getAttribute('data-f'); render(); }; });
  root.querySelectorAll('[data-manage]').forEach(function (b) { b.onclick = function () { openManage(b.getAttribute('data-manage')); }; });
}

function openManage(uid) {
  var L = es(), items = FT.recurAllList(), i = items.find(function (x) { return x.uid === uid; });
  if (!i) return;
  var deleteWarn = i.kind === 'debt'
    ? (L ? 'Se cancela el abono automático. La deuda sigue existiendo, solo dejas de pagarla sola.' : 'This cancels the automatic payment. The debt itself is not deleted.')
    : i.kind === 'metapersonal'
    ? (L ? 'Se cancela el aporte automático. La meta sigue existiendo, solo dejas de abonarle sola.' : 'This cancels the automatic deposit. The goal itself is not deleted.')
    : (i.uid.indexOf('recurring:') === 0)
    ? (L ? 'Se elimina este recurrente. Podrás crear otro cuando quieras.' : 'This recurring item is removed. You can create another anytime.')
    : (L ? 'Se elimina por completo — no queda registrado en ' + (PAGE_LABEL[i.pk] ? PAGE_LABEL[i.pk][0] : '') + '.' : 'It is deleted entirely — no longer listed in ' + (PAGE_LABEL[i.pk] ? PAGE_LABEL[i.pk][1] : '') + '.');
  var pageLabel = PAGE_LABEL[i.pk] ? (L ? PAGE_LABEL[i.pk][0] : PAGE_LABEL[i.pk][1]) : '';

  FT.modal({
    title: L ? 'Gestionar' : 'Manage',
    html:
      '<div style="text-align:center;margin:2px 0 16px">' +
        '<div class="ft-tx-ico ' + PASTEL[i.pk] + '" style="width:56px;height:56px;font-size:26px;display:grid;place-items:center;border-radius:16px;margin:0 auto 10px">' + i.icon + '</div>' +
        '<div style="font-size:15px;font-weight:800">' + i.name + '</div>' +
        '<div style="font-size:11.5px;color:var(--text3);margin-top:2px">' + i.typeLabel + '</div></div>' +
      '<div class="ft-field"><label>' + (L ? 'Monto' : 'Amount') + ' ($)</label><input id="mgAmount" type="number" step="0.01" min="0" value="' + i.amount + '"></div>' +
      '<div class="ft-field"><label>' + (L ? 'Frecuencia' : 'Frequency') + '</label><select id="mgFreq">' +
        ['weekly', 'biweekly', 'monthly', 'annual'].map(function (f) { return '<option value="' + f + '" ' + (f === i.freq ? 'selected' : '') + '>' + freqLbl(f) + '</option>'; }).join('') +
        '<option value="custom"' + (typeof i.freq === 'string' && i.freq.indexOf('custom:') === 0 ? ' selected' : '') + '>' + (L ? 'Personalizado' : 'Custom') + '</option></select>' +
        FT.customFreqSubFormHTML('mg', i.freq) + '</div>' +
      '<div class="ft-field"><label>' + (L ? 'Próxima fecha' : 'Next date') + '</label><input id="mgDate" type="date" value="' + (i.nextDate || FT.todayISO()) + '"></div>' +
      // Autopay (15-oct-2026, a petición de Ramón): distinto del switch
      // Activo/Pausado de abajo (ese es si ESTA app lo aplica sola) --
      // autopay es si quien de verdad cobra (tu banco, el proveedor) ya lo
      // hace solo, fuera de la app. Sirve para que un recordatorio por
      // correo sepa si debe avisar "nomás FYI" o "tienes que pagarlo tú".
      '<label class="ft-field" style="display:flex;align-items:center;gap:9px;cursor:pointer;background:var(--sunk);border-radius:10px;padding:10px 12px"><input type="checkbox" id="mgAutopay" ' + (i.autopay ? 'checked' : '') + ' style="width:18px;height:18px;flex-shrink:0"><span style="font-size:12px;font-weight:700">' + (L ? 'Se cobra solo (autopay con el banco/proveedor)' : "Charged automatically (autopay with the bank/provider)") + '</span></label>' +
      '<div id="mgSwRow" style="display:flex;align-items:center;justify-content:space-between;background:var(--sunk);border:1.5px solid var(--hair);border-radius:13px;padding:12px 14px;margin-bottom:6px">' +
        '<div style="font-size:12.5px;font-weight:700" id="mgSwTxt">' + (i.paused ? (L ? 'Pausado' : 'Paused') : (L ? 'Activo' : 'Active')) + '<small style="display:block;font-weight:500;color:var(--text3);font-size:10.5px;margin-top:1px" id="mgSwSub">' + (i.paused ? (L ? 'No se aplicará hasta reanudar' : "Won't apply until resumed") : (L ? 'Se aplica automáticamente cada periodo' : 'Applies automatically every period')) + '</small></div>' +
        '<div class="tap" id="mgSw" style="width:42px;height:24px;border-radius:99px;position:relative;cursor:pointer;flex-shrink:0;background:' + (i.paused ? 'var(--hair)' : 'var(--g-main)') + '"><i style="position:absolute;top:3px;left:' + (i.paused ? '3px' : '21px') + ';width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2)"></i></div>' +
      '</div>' +
      '<div class="tap" id="mgGo" style="font-size:12px;font-weight:700;color:var(--blue);text-align:center;padding:10px 0 4px">' + (L ? 'Ver detalle completo en ' + pageLabel : 'See full details in ' + pageLabel) + ' →</div>' +
      '<div class="tap" id="mgDel" style="font-size:12.5px;font-weight:700;color:var(--red);text-align:center;padding:10px 0 4px;border-top:1px solid var(--hair);margin-top:6px">🗑️ ' + (L ? 'Eliminar recurrente' : 'Delete recurring item') + '</div>',
    saveLabel: L ? 'Guardar cambios' : 'Save changes',
    onOpen: function (body) {
      var cf = FT.wireCustomFreqSubForm(body, 'mg');
      var freqSel = body.querySelector('#mgFreq');
      cf.show(freqSel.value === 'custom');
      freqSel.addEventListener('change', function () { cf.show(freqSel.value === 'custom'); });
      var paused = i.paused;
      var sw = body.querySelector('#mgSw'), txt = body.querySelector('#mgSwTxt'), sub = body.querySelector('#mgSwSub');
      sw.onclick = function () {
        paused = !paused;
        sw.dataset.paused = paused ? '1' : '0';
        sw.style.background = paused ? 'var(--hair)' : 'var(--g-main)';
        sw.querySelector('i').style.left = paused ? '3px' : '21px';
        txt.textContent = paused ? (L ? 'Pausado' : 'Paused') : (L ? 'Activo' : 'Active');
        sub.textContent = paused ? (L ? 'No se aplicará hasta reanudar' : "Won't apply until resumed") : (L ? 'Se aplica automáticamente cada periodo' : 'Applies automatically every period');
      };
      sw.dataset.paused = paused ? '1' : '0';
      body.querySelector('#mgGo').onclick = function () { FT.closeTop(); FT.go(i.page); };
      body.querySelector('#mgDel').onclick = function () {
        FT.confirm(deleteWarn + ' ' + (L ? '¿Eliminar?' : 'Delete?')).then(function (ok) {
          if (!ok) return;
          FT.recurAllDelete(uid);
          FT.closeTop();
          FT.toast(L ? '🗑️ Eliminado' : '🗑️ Deleted');
          render();
        });
      };
    },
    onSave: function (body) {
      var amount = parseFloat(body.querySelector('#mgAmount').value) || i.amount;
      var freq = body.querySelector('#mgFreq').value;
      if (freq === 'custom') freq = FT.wireCustomFreqSubForm(body, 'mg').getFreq();
      var nextDate = body.querySelector('#mgDate').value;
      var autopay = !!body.querySelector('#mgAutopay').checked;
      var paused = body.querySelector('#mgSw').dataset.paused === '1';
      FT.recurAllUpdate(uid, { amount: amount, freq: freq, nextDate: nextDate, autopay: autopay });
      FT.recurAllPause(uid, paused);
      FT.toast(L ? '✅ Recurrente actualizado' : '✅ Recurring updated');
      render();
    }
  });
}

document.addEventListener('ft:ready', function () {
  var t = function () { return FT.lang === 'es' ? 'Recurrentes' : 'Recurring'; };
  var sh = FT.shell({ active: '', title: t() });
  document.addEventListener('ft:langchange', function () { sh.setTitle(t()); render(); });
  document.addEventListener('ft:datachanged', render);
  render();
});
</script>
</body>
</html>
