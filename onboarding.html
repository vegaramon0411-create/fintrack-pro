<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>FinTrack Pro · Saldos iniciales</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<script src="premium.js"></script>
<style>
  /* onboarding.html — usa los tokens de premium.js */
  .ob-top{padding:22px 20px 10px;}
  .ob-top h1{font-family:var(--round-font);font-weight:900;font-size:21px;letter-spacing:-.8px;}
  .ob-top p{font-size:12.5px;color:var(--text3);line-height:1.5;margin-top:6px;}
  .ob-page{padding:6px 18px 140px;}

  /* Tracker global del registro (mismo .wz-steps de login.html) */
  .ob-steps{display:flex;align-items:center;padding:0 20px;margin-bottom:4px;}
  .ob-steps .st{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;position:relative;}
  .ob-steps .st:not(:last-child)::after{content:"";position:absolute;top:11px;left:60%;width:80%;height:2px;background:var(--g-main);}
  .ob-steps .st .n{width:22px;height:22px;border-radius:50%;background:var(--g-main);color:#fff;font-family:var(--round-font);font-weight:900;font-size:9.5px;display:grid;place-items:center;position:relative;z-index:1;}
  .ob-steps .st.on .n{box-shadow:0 0 0 4px var(--g-light);}
  .ob-steps .st .l{font-size:7.5px;font-weight:700;color:var(--g-main);}

  /* 19-oct-2026, a petición de Ramón: "muy confuso, te pierdes, no sabes cómo
     agregar otra cuenta". Ahora son 5 pasitos con su propio indicador, una
     sola cosa por pantalla y el botón de agregar siempre visible. */
  .sub-steps{display:flex;gap:6px;margin:4px 0 14px;}
  .sub-steps .ss{flex:1;text-align:center;font-size:10px;font-weight:800;color:var(--text3);}
  .sub-steps .ss .bar{height:5px;border-radius:99px;background:var(--hair);margin-bottom:5px;}
  .sub-steps .ss.done .bar,.sub-steps .ss.on .bar{background:var(--g-main);}
  .sub-steps .ss.on{color:var(--g-dark);}

  .ob-card{border:1px solid var(--hair);border-radius:16px;padding:15px;margin-bottom:12px;box-shadow:0 2px 10px -5px rgba(20,20,30,.06);}
  .ob-card .ch{display:flex;align-items:center;gap:10px;margin-bottom:12px;}
  .ob-card .ch .ci{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;font-size:17px;flex-shrink:0;}
  .ob-card .ch b{font-family:var(--round-font);font-weight:900;font-size:13.5px;}
  .ob-card .ch small{display:block;font-size:10px;color:var(--text3);font-weight:600;margin-top:1px;}

  .done-row{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:var(--g-light);margin-bottom:8px;}
  .done-row .nm{flex:1;min-width:0;font-size:13px;font-weight:700;color:var(--g-dark);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .done-row .am{font-size:13px;font-weight:800;color:var(--g-dark);}
  .link-btn{background:none;border:none;color:var(--blue);font-weight:800;font-size:12px;cursor:pointer;font-family:var(--ui-font);padding:6px 0;}

  .item{background:var(--sunk);border-radius:14px;padding:13px;margin-bottom:10px;}
  .item .hd{display:flex;align-items:center;gap:8px;margin-bottom:10px;}
  .item .hd .ic{width:32px;height:32px;border-radius:10px;background:#fff;display:grid;place-items:center;font-size:16px;flex-shrink:0;}
  .item .hd .kind{flex:1;font-size:11px;font-weight:800;color:var(--text3);text-transform:uppercase;letter-spacing:.3px;}
  .item .hd .rm{background:none;border:none;color:var(--red);font-size:12px;font-weight:800;cursor:pointer;font-family:var(--ui-font);padding:4px 6px;}
  .item label{display:block;font-size:11px;font-weight:800;color:var(--text2);margin:8px 0 4px;}
  .item input,.item select{width:100%;box-sizing:border-box;background:#fff;border:1.5px solid var(--hair);border-radius:10px;padding:11px 12px;font-size:14px;font-family:var(--ui-font);min-width:0;}
  .item .seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;}
  .item .seg button{padding:9px 4px;border-radius:10px;border:1.5px solid var(--hair);background:#fff;font-size:12px;font-weight:800;font-family:var(--ui-font);color:var(--text2);cursor:pointer;}
  .item .seg button.on{border-color:var(--g-main);background:var(--g-light);color:var(--g-dark);}

  .addbar{border:1.5px dashed var(--g-main);border-radius:14px;padding:12px;background:#fff;margin-bottom:12px;}
  .addbar .t{font-size:11.5px;font-weight:800;color:var(--g-dark);margin-bottom:8px;}
  .addbar .chips{display:flex;flex-wrap:wrap;gap:7px;}
  .addbar .chips button{border:1.5px solid var(--g-main);background:var(--g-light);color:var(--g-dark);border-radius:99px;padding:9px 13px;font-size:12.5px;font-weight:800;cursor:pointer;font-family:var(--ui-font);}
  .tot{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-radius:12px;background:var(--sunk);font-size:12.5px;font-weight:700;margin-bottom:12px;}
  .tot b{font-size:15px;font-weight:900;}
  .mini-note{font-size:11.5px;color:var(--text3);line-height:1.5;}
  .add-row{width:100%;background:none;border:1.5px dashed var(--hair);border-radius:11px;padding:10px;font-size:12px;font-weight:800;color:var(--text3);cursor:pointer;font-family:var(--ui-font);}
  .rev-sec{margin-bottom:12px;}
  .rev-sec h4{font-size:11px;font-weight:800;color:var(--text3);text-transform:uppercase;letter-spacing:.4px;margin:0 0 6px;display:flex;justify-content:space-between;align-items:center;}
  .rev-row{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--hair);font-size:13px;}
  .rev-row:last-child{border-bottom:none;}

  .ob-foot{position:fixed;left:0;right:0;bottom:0;max-width:var(--ft-appw,480px);margin:0 auto;background:#fff;border-top:1px solid var(--hair);display:flex;gap:10px;padding:13px 18px calc(13px + env(safe-area-inset-bottom));z-index:80;}
  .ob-foot button{border:none;border-radius:14px;padding:13px;font-size:13px;font-weight:800;cursor:pointer;font-family:var(--ui-font);}
  .ob-foot .save{flex:1;color:#fff;background:linear-gradient(135deg,var(--g-dark),var(--g-main));box-shadow:0 10px 20px -10px rgba(15,81,50,.55);}
  .ob-foot .skip{flex:0 0 auto;background:var(--sunk);border:1.5px solid var(--hair);color:var(--text2);padding:13px 16px;}
</style>
</head>
<body>
<div class="ft-app">

  <div class="ob-steps">
    <div class="st done"><div class="n">1</div><div class="l" data-es="Perfil" data-en="Profile">Perfil</div></div>
    <div class="st done"><div class="n">2</div><div class="l" data-es="Pago" data-en="Pay">Pago</div></div>
    <div class="st done"><div class="n">3</div><div class="l" data-es="Método" data-en="Method">Método</div></div>
    <div class="st done"><div class="n">4</div><div class="l" data-es="Prefs" data-en="Prefs">Prefs</div></div>
    <div class="st on"><div class="n">5</div><div class="l" data-es="Saldos" data-en="Balances">Saldos</div></div>
  </div>
  <div class="ob-top">
    <h1 id="obTitle"></h1>
    <p id="obSub"></p>
  </div>

  <div class="ob-page">
    <div class="sub-steps" id="subSteps"></div>
    <div id="stepBody"></div>
  </div>

  <div class="ob-foot" id="obFoot"></div>
</div>

<script>
function T(es, en) { return FT.lang === 'es' ? es : en; }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
function num(v) { return FT.numMoney ? FT.numMoney(v) : (parseFloat(v) || 0); }

/* Tipos que se pueden agregar. Tarjeta/préstamo/auto/hipoteca son DEUDAS (lo que debes), no cuentas. */
var ACCT_KINDS = {
  checking: { ico: '🏦', es: 'Cuenta de cheques', en: 'Checking account', defEs: 'Cuenta de cheques', defEn: 'Checking account' },
  cash:     { ico: '💵', es: 'Efectivo', en: 'Cash', defEs: 'Efectivo', defEn: 'Cash' },
  other:    { ico: '➕', es: 'Otra cuenta', en: 'Other account', defEs: '', defEn: '' }
};
var SAV_KINDS = {
  ahorro:     { ico: '💵', es: 'Ahorro libre', en: 'Free savings', defEs: 'Ahorro libre', defEn: 'Free savings' },
  emergencia: { ico: '🛡️', es: 'Fondo de emergencia', en: 'Emergency fund', defEs: 'Fondo de emergencia', defEn: 'Emergency fund' },
  meta:       { ico: '🎯', es: 'Meta o apartado', en: 'Goal or set-aside', defEs: '', defEn: '' }
};
var DEBT_KINDS = {
  tarjeta:  { ico: '💳', es: 'Tarjeta de crédito', en: 'Credit card', kind: 'wants' },
  auto:     { ico: '🚗', es: 'Auto', en: 'Vehicle', kind: 'needs' },
  hipoteca: { ico: '🏠', es: 'Hipoteca', en: 'Mortgage', kind: 'needs' },
  personal: { ico: '📦', es: 'Préstamo personal', en: 'Personal loan', kind: 'needs' }
};
var STEPS = [
  { k: 'cuentas', es: 'Cuentas', en: 'Accounts' }, { k: 'ahorros', es: 'Ahorros', en: 'Savings' },
  { k: 'inversion', es: 'Inversión', en: 'Investing' }, { k: 'deudas', es: 'Deudas', en: 'Debts' }, { k: 'revisar', es: 'Revisar', en: 'Review' }
];
var S = { step: 0, accounts: [], savings: [], invs: [], debts: [] };
var _uid = 0, _saving = false;

/* ─── Estado ya guardado (re-edición desde Configuración o sesión restaurada) ───
   Esto YA está en la app: se muestra de solo lectura y NUNCA se vuelve a agregar
   (antes, abrir "Saldos iniciales" de nuevo duplicaba cada cuenta y cada saldo). */
function existing() {
  var emerg = 0; try { emerg = parseFloat(FT.data().emergency) || 0; } catch (e) {}
  return {
    accounts: FT.checking() || [],
    savings: FT.savingsBalance ? FT.savingsBalance() : 0,
    emerg: emerg,
    invs: (FT.investments('') || []).length + (FT.investments('hogar') || []).length,
    debts: (FT.debts() || [])
  };
}

function addItem(list, kind) {
  var it = { uid: ++_uid, kind: kind, name: '', amount: '', hogar: false, payment: '' };
  if (list === 'accounts') it.name = T(ACCT_KINDS[kind].defEs, ACCT_KINDS[kind].defEn);
  if (list === 'savings') it.name = T(SAV_KINDS[kind].defEs, SAV_KINDS[kind].defEn);
  if (list === 'invs') { it.hogar = kind === 'hogar'; }
  S[list].push(it);
  renderStep();
  var items = document.querySelectorAll('#stepBody .item'); var last = items.length ? items[items.length - 1].querySelector('input[data-f="name"]') : null;
  if (last) { try { last.focus(); last.select(); } catch (e) {} }
}
function removeItem(list, uid) {
  S[list] = S[list].filter(function (x) { return x.uid !== uid; });
  renderStep();
}
function findItem(list, uid) { return S[list].find(function (x) { return x.uid === uid; }); }

/* ─── Render ─── */
function renderStep() {
  var st = STEPS[S.step], L = FT.lang === 'es';
  var titles = {
    cuentas: ['🏦 ¿Dónde tienes tu dinero?', '🏦 Where is your money?', 'Agrega cada cuenta de tu banco o tu efectivo, con lo que tiene hoy. Puedes agregar todas las que quieras.', 'Add each bank account or your cash, with what it holds today. You can add as many as you want.'],
    ahorros: ['💵 ¿Qué tienes ahorrado?', '💵 What have you saved?', 'Ahorro libre, fondo de emergencia o dinero apartado para algo. Si no tienes, sigue al siguiente.', 'Free savings, emergency fund or money set aside for something. If you have none, go on to the next one.'],
    inversion: ['📈 ¿Tienes inversiones?', '📈 Do you have investments?', 'Acciones, fondos, cripto, lo que sea. Pon cuánto vale hoy. Si no tienes, sigue.', 'Stocks, funds, crypto, anything. Enter what it is worth today. If you have none, move on.'],
    deudas: ['💳 ¿Debes algo?', '💳 Do you owe anything?', 'Tarjetas, auto, hipoteca o préstamos. Pon cuánto debes hoy. El detalle (interés, fechas) lo completas después en Deudas.', 'Cards, car, mortgage or loans. Enter what you owe today. You can add the details (interest, dates) later in Debts.'],
    revisar: ['✅ Revisa y confirma', '✅ Review and confirm', 'Esto es lo que vas a guardar. Todo se puede editar, pausar o eliminar después.', 'This is what you will save. Everything can be edited, paused or deleted later.']
  }[st.k];
  document.getElementById('obTitle').textContent = L ? titles[0] : titles[1];
  document.getElementById('obSub').textContent = L ? titles[2] : titles[3];
  document.getElementById('subSteps').innerHTML = STEPS.map(function (s, i) {
    return '<div class="ss ' + (i < S.step ? 'done' : (i === S.step ? 'on' : '')) + '"><div class="bar"></div>' + (i + 1) + '. ' + (L ? s.es : s.en) + '</div>';
  }).join('');

  var body = document.getElementById('stepBody'), h = '';
  var ex = existing();

  if (st.k === 'cuentas') {
    h += '<div class="ob-card" id="hogarCard"></div>';
    if (ex.accounts.length) {
      h += '<div class="ob-card"><div class="ch"><div class="ci" style="background:var(--g-light)">✅</div><div><b>' + T('Ya tienes registradas', 'Already registered') + '</b><small>' + T('No se vuelven a agregar. Para cambiarlas usa «Mis cuentas».', 'They are not added again. To change them use "My accounts".') + '</small></div></div>' +
        ex.accounts.map(function (c) { return '<div class="done-row"><span>' + (c.hogar ? '🏠' : '🏦') + '</span><span class="nm">' + esc(c.name || T('Cuenta', 'Account')) + '</span><span class="am">' + FT.money(FT.accountTotal ? FT.accountTotal(c) : (c.amount || 0), { cents: true }) + '</span></div>'; }).join('') +
        '<button type="button" class="link-btn" onclick="FT.checkingAccountsScreen(false)">' + T('Editar o eliminar mis cuentas ›', 'Edit or delete my accounts ›') + '</button>' +
        (FT.hogarConnected() ? '<br><button type="button" class="link-btn" onclick="FT.checkingAccountsScreen(true)">' + T('Editar cuentas conjuntas ›', 'Edit joint accounts ›') + '</button>' : '') +
        '</div>';
    }
    h += S.accounts.map(function (a) { return acctHtml(a); }).join('');
    h += '<div class="addbar"><div class="t">' + T('＋ Agregar otra cuenta:', '＋ Add another account:') + '</div><div class="chips">' +
      Object.keys(ACCT_KINDS).map(function (k) { return '<button type="button" data-add="accounts:' + k + '">' + ACCT_KINDS[k].ico + ' ' + T(ACCT_KINDS[k].es, ACCT_KINDS[k].en) + '</button>'; }).join('') +
      '</div></div>';
    h += '<div class="tot"><span>' + T('Total en estas cuentas nuevas', 'Total in these new accounts') + '</span><b id="totAccounts"></b></div>';
    h += '<div class="mini-note">' + T('¿Tarjeta de crédito o préstamo? Eso es una deuda: se agrega en el paso 4.', 'Credit card or loan? That is a debt: add it in step 4.') + '</div>';
  }

  if (st.k === 'ahorros') {
    h += obHogarEmergNote();
    h += obHogarMetasHtml();
    h += obPersonalSavingsHtml();
    h += S.savings.map(function (a) { return savHtml(a); }).join('');
    h += '<div class="addbar"><div class="t">' + T('＋ Agregar:', '＋ Add:') + '</div><div class="chips">' +
      Object.keys(SAV_KINDS).map(function (k) { return '<button type="button" data-add="savings:' + k + '">' + SAV_KINDS[k].ico + ' ' + T(SAV_KINDS[k].es, SAV_KINDS[k].en) + '</button>'; }).join('') + '</div></div>';
    h += '<div class="tot"><span>' + T('Total ahorrado (nuevo)', 'Total saved (new)') + '</span><b id="totSavings"></b></div>';
  }

  if (st.k === 'inversion') {
    h += obInvEditHtml();
    h += S.invs.map(function (a) { return invHtml(a); }).join('');
    h += '<div class="addbar"><div class="t">' + T('＋ Agregar inversión:', '＋ Add investment:') + '</div><div class="chips">' +
      '<button type="button" data-add="invs:personal">👤 ' + T('Personal', 'Personal') + '</button>' +
      (FT.hogarConnected() ? '<button type="button" data-add="invs:hogar">🏠 ' + T('Del hogar', 'Household') + '</button>' : '') + '</div></div>';
    h += '<div class="tot"><span>' + T('Total invertido (nuevo)', 'Total invested (new)') + '</span><b id="totInvs"></b></div>';
  }

  if (st.k === 'deudas') {
    if (ex.debts.length) h += obDebtsListHtml(ex.debts);
    h += S.debts.map(function (a) { return debtHtml(a); }).join('');
    h += '<div class="addbar"><div class="t">' + T('＋ Agregar deuda:', '＋ Add debt:') + '</div><div class="chips">' +
      Object.keys(DEBT_KINDS).map(function (k) { return '<button type="button" data-add="debts:' + k + '">' + DEBT_KINDS[k].ico + ' ' + T(DEBT_KINDS[k].es, DEBT_KINDS[k].en) + '</button>'; }).join('') + '</div></div>';
    h += '<div class="tot"><span>' + T('Total que debes (nuevo)', 'Total you owe (new)') + '</span><b id="totDebts"></b></div>';
  }

  if (st.k === 'revisar') h += reviewHtml();

  body.innerHTML = h;
  if (st.k === 'cuentas') { renderHogarCard(); }
  updTotals();
  renderFoot();
  try { window.scrollTo(0, 0); } catch (e) {}
}

function nameField(a, ph) { return '<label>' + T('Nombre', 'Name') + '</label><input data-f="name" data-uid="' + a.uid + '" type="text" placeholder="' + esc(ph || '') + '" value="' + esc(a.name) + '">'; }
function amtField(a, label) { return '<label>' + label + '</label><input data-f="amount" data-uid="' + a.uid + '" type="text" inputmode="decimal" placeholder="$0.00" value="' + esc(a.amount) + '">'; }
function head(ico, kindLbl, list, a) { return '<div class="hd"><div class="ic">' + ico + '</div><div class="kind">' + kindLbl + '</div><button type="button" class="rm" data-rm="' + list + ':' + a.uid + '">✕ ' + T('Quitar', 'Remove') + '</button></div>'; }

function acctHtml(a) {
  var k = ACCT_KINDS[a.kind];
  return '<div class="item" data-list="accounts">' + head(k.ico, T(k.es, k.en), 'accounts', a) +
    nameField(a, T('Ej. Mi cuenta de SoFi', 'E.g. My SoFi account')) + amtField(a, T('¿Cuánto tiene hoy?', 'How much is in it today?')) +
    (FT.hogarConnected() || FT.hogar().pendingInvite
      ? '<label>' + T('¿De quién es?', 'Whose is it?') + '</label><div class="seg"><button type="button" data-own="' + a.uid + ':0" class="' + (!a.hogar ? 'on' : '') + '">👤 ' + T('Mía', 'Mine') + '</button><button type="button" data-own="' + a.uid + ':1" class="' + (a.hogar ? 'on' : '') + '">🏠 ' + T('Conjunta', 'Joint') + '</button></div>'
      : '') + '</div>';
}
﻿function savHtml(a) {
  var k = SAV_KINDS[a.kind];
  // Con hogar: emergencia y metas se eligen Mías o Del hogar (las del hogar son de los dos y las ve tu pareja); el ahorro libre es siempre personal.
  var own = (obHogarOn() && a.kind !== 'ahorro' && !(a.kind === 'emergencia' && obHogarEmergExists()))
    ? '<label>' + T('¿De quién es?', 'Whose is it?') + '</label><div class="seg"><button type="button" data-sown="' + a.uid + ':0" class="' + (!a.hogar ? 'on' : '') + '">👤 ' + T('Mío', 'Mine') + '</button><button type="button" data-sown="' + a.uid + ':1" class="' + (a.hogar ? 'on' : '') + '">🏠 ' + T('Del hogar', 'Household') + '</button></div>' + (a.hogar ? '<div class="mini-note" style="margin-top:6px">' + T('De los dos: tu pareja también lo ve.', 'Shared: your partner sees it too.') + '</div>' : '') : '';
  return '<div class="item" data-list="savings">' + head(k.ico, T(k.es, k.en), 'savings', a) +
    nameField(a, a.kind === 'meta' ? T('Ej. Vacaciones', 'E.g. Vacation') : '') + amtField(a, T('¿Cuánto tienes ahí hoy?', 'How much is in it today?')) + own +
    (a.kind === 'meta' ? '<label>' + T('¿Cuánto quieres juntar? (opcional)', 'How much do you want to save? (optional)') + '</label><input data-f="target" data-uid="' + a.uid + '" type="text" inputmode="decimal" placeholder="$0.00" value="' + esc(a.target || '') + '">' : '') + '</div>';
}
function invHtml(a) {
  return '<div class="item" data-list="invs">' + head(a.hogar ? '🏠' : '📈', a.hogar ? T('Inversión del hogar', 'Household investment') : T('Inversión personal', 'Personal investment'), 'invs', a) +
    nameField(a, T('Ej. Fidelity, VOO, Bitcoin', 'E.g. Fidelity, VOO, Bitcoin')) + amtField(a, T('¿Cuánto vale hoy?', 'What is it worth today?')) + '</div>';
}
function debtHtml(a) {
  var k = DEBT_KINDS[a.kind];
  return '<div class="item" data-list="debts">' + head(k.ico, T(k.es, k.en), 'debts', a) +
    nameField(a, T('Ej. Visa Chase', 'E.g. Chase Visa')) + amtField(a, T('¿Cuánto debes hoy?', 'How much do you owe today?')) +
    '<label>' + T('Pago mensual (opcional)', 'Monthly payment (optional)') + '</label><input data-f="payment" data-uid="' + a.uid + '" type="text" inputmode="decimal" placeholder="$0.00" value="' + esc(a.payment) + '"></div>';
}

function sumList(list) { return S[list].reduce(function (s, a) { return s + (num(a.amount) || 0); }, 0); }
function updTotals() {
  var m = { totAccounts: 'accounts', totSavings: 'savings', totInvs: 'invs', totDebts: 'debts' };
  Object.keys(m).forEach(function (id) { var el = document.getElementById(id); if (el) el.textContent = FT.money(sumList(m[id]), { cents: true }); });
}

function reviewHtml() {
  var h = '', any = false;
  function sec(title, rows, step) {
    if (!rows.length) return '';
    any = true;
    return '<div class="ob-card rev-sec"><h4><span>' + title + '</span><button type="button" class="link-btn" data-goto="' + step + '">' + T('Editar', 'Edit') + '</button></h4>' + rows.join('') + '</div>';
  }
  function row(ico, nm, amt) { return '<div class="rev-row"><span>' + ico + ' ' + esc(nm) + '</span><b>' + FT.money(amt, { cents: true }) + '</b></div>'; }
  var accts = S.accounts.map(function (a) { return row(a.hogar ? '🏠' : ACCT_KINDS[a.kind].ico, a.name || T(ACCT_KINDS[a.kind].es, ACCT_KINDS[a.kind].en), num(a.amount)); });
  var sav = S.savings.map(function (a) { return row(SAV_KINDS[a.kind].ico, a.name || T(SAV_KINDS[a.kind].es, SAV_KINDS[a.kind].en), num(a.amount)); });
  var inv = S.invs.map(function (a) { return row(a.hogar ? '🏠' : '📈', a.name || T('Inversión', 'Investment'), num(a.amount)); });
  var debts = S.debts.map(function (a) { return row(DEBT_KINDS[a.kind].ico, a.name || T(DEBT_KINDS[a.kind].es, DEBT_KINDS[a.kind].en), num(a.amount)); });
  h += sec('🏦 ' + T('Cuentas', 'Accounts'), accts, 0) + sec('💵 ' + T('Ahorros', 'Savings'), sav, 1) + sec('📈 ' + T('Inversiones', 'Investments'), inv, 2) + sec('💳 ' + T('Deudas', 'Debts'), debts, 3);
  if (!any) h += '<div class="ob-card"><div class="mini-note">' + T('No agregaste nada nuevo. Puedes continuar y agregar tus datos después desde Más → Saldos iniciales, o desde cada sección.', 'You did not add anything new. You can continue and add your data later from More → Starting balances, or from each section.') + '</div></div>';
  else {
    var assets = sumList('accounts') + sumList('savings') + sumList('invs'), owed = sumList('debts');
    h += '<div class="tot"><span>' + T('Tienes (nuevo)', 'You have (new)') + '</span><b>' + FT.money(assets, { cents: true }) + '</b></div>' +
      '<div class="tot"><span>' + T('Debes (nuevo)', 'You owe (new)') + '</span><b>' + FT.money(owed, { cents: true }) + '</b></div>';
  }
  if ((FT.hogarConnected() || FT.hogar().pendingInvite) && (S.accounts.some(function (a) { return a.hogar; }) || S.invs.some(function (a) { return a.hogar; }))) {
    h += '<div class="ob-card" style="background:var(--g-light)"><div class="mini-note" style="color:var(--g-dark)">🏠 ' + T('Lo que marcaste como del hogar lo verá tu pareja cuando se conecte, y podrá confirmarlo o corregirlo. Lo personal nunca se comparte.', 'What you marked as household will be shown to your partner, who can confirm or correct it. Personal items are never shared.') + '</div></div>';
  }
  return h;
}

function renderFoot() {
  var f = document.getElementById('obFoot'), last = S.step === STEPS.length - 1;
  f.innerHTML =
    (S.step === 0 ? '<button class="skip" onclick="skipOnboarding()">' + T('Saltar', 'Skip') + '</button>' : '<button class="skip" onclick="goStep(' + (S.step - 1) + ')">← ' + T('Atrás', 'Back') + '</button>') +
    (last ? '<button class="save" onclick="saveOnboarding()">' + T('Confirmar y empezar', 'Confirm and start') + '</button>'
          : '<button class="save" onclick="goStep(' + (S.step + 1) + ')">' + T('Siguiente', 'Next') + ' →</button>');
}
function goStep(i) {
  // Una meta necesita saber cuánto quieres juntar; si no, aparecería como "alcanzada" desde el día 1.
  if (i > S.step) {
    var sinObjetivo = S.savings.find(function (a) { return a.kind === 'meta' && num(a.amount) + num(a.target) > 0 && !(num(a.target) > 0); });
    if (sinObjetivo && S.step === 1) { FT.toast(T('Pon cuánto quieres juntar en «' + (sinObjetivo.name || 'tu meta') + '»', 'Enter how much you want to save in "' + (sinObjetivo.name || 'your goal') + '"')); return; }
  }
  S.step = Math.max(0, Math.min(STEPS.length - 1, i)); renderStep();
}

/* ─── Eventos (delegados: escribir NO re-dibuja, así no se pierde el cursor) ─── */
document.getElementById('stepBody').addEventListener('input', function (e) {
  var el = e.target, uid = parseInt(el.getAttribute('data-uid'), 10), f = el.getAttribute('data-f');
  if (!f) return;
  var list = el.closest('.item').getAttribute('data-list'), it = findItem(list, uid);
  if (!it) return;
  it[f] = el.value; it._touched = true;
  if (f === 'amount') updTotals();
});
document.getElementById('stepBody').addEventListener('click', function (e) {
  var b = e.target.closest('button'); if (!b) return;
  var a = b.getAttribute('data-add'), r = b.getAttribute('data-rm'), o = b.getAttribute('data-own'), g = b.getAttribute('data-goto');
  if (a) { var p = a.split(':'); addItem(p[0], p[1]); }
  else if (r) { var q = r.split(':'); removeItem(q[0], parseInt(q[1], 10)); }
  else if (o) { var w = o.split(':'), it = findItem('accounts', parseInt(w[0], 10)); if (it) { it.hogar = w[1] === '1'; it._touched = true; renderStep(); } }
  else if (b.getAttribute('data-sown')) { var w2 = b.getAttribute('data-sown').split(':'), it2 = findItem('savings', parseInt(w2[0], 10)); if (it2) { it2.hogar = w2[1] === '1'; it2._touched = true; renderStep(); } }
  else if (g != null) goStep(parseInt(g, 10));
});

  if (S.hm && hogarOn_) { var fm = FT.hogarFondos(), chg = false; Object.keys(S.hm).forEach(function (id) { var st = S.hm[id], m = (fm.metas || []).find(function (x) { return String(x.id) === String(id); }); if (!m) return; if (st.tot != null) { var dl = +(st.tot - (st.base != null ? st.base : (parseFloat(m.actual) || 0))).toFixed(2); if (Math.abs(dl) > 0.004) { m.hist = (m.hist || []).concat([{ id: ridH('adj_'), monto: dl, fecha: hoy, desdePres: false, nota: T('Ajuste al configurar', 'Adjustment when setting up') }]); m.actual = m.hist.reduce(function (s, h) { return s + (h.monto || 0); }, 0); chg = true; } } if (st.tgt != null && st.tgt > 0 && st.tgt !== (parseFloat(m.meta) || 0)) { m.meta = st.tgt; chg = true; } }); if (chg) FT.saveHogarFondos(fm); S.hm = null; }
  // Inversiones ya registradas con el valor corregido.
  if (S.inv) { ['', 'hogar'].forEach(function (sc) { var li = FT.investments(sc) || [], ch2 = false; Object.keys(S.inv).forEach(function (k) { var p = k.split(':'); if (p[0] !== sc) return; var it = li[parseInt(p[1], 10)]; if (!it) return; var v = S.inv[k], sh = parseFloat(it.shares) || 1; if (v !== (parseFloat(it.amount) || 0)) { it.amount = v; it.curPrice = +(v / sh).toFixed(4); ch2 = true; } }); if (ch2) FT.saveInvestments(li, sc); }); S.inv = null; }
  S.savings.forEach(function (a) { if (a.kind === 'meta') a._saved = true; });

  // Inversiones
  ['', 'hogar'].forEach(function (scope) {
    var rows = S.invs.filter(function (a) { return ((scope === 'hogar') === !!(a.hogar && hogarOn)) && num(a.amount) > 0 && !a._saved; });
    if (!rows.length) return;
    var list = FT.investments(scope);
    rows.forEach(function (a) {
      var monto = num(a.amount);
      list.push({ id: rid('i_onb_'), ticker: ((a.name || '').trim() || (L ? 'Inversión' : 'Investment')).toUpperCase(), type: 'other', shares: 1, avgPrice: monto, curPrice: monto, amount: monto,
        platform: '', modo: 'yaLaTenia', fecha: hoy, addedBy: user.name || '', addedAt: new Date().toISOString() });
    });
    FT.saveInvestments(list, scope);
    rows.forEach(function (a) { a._saved = true; });
  });

  // Deudas (lo básico; el detalle se completa en Deudas)
  var debts = S.debts.filter(function (a) { return num(a.amount) > 0 && !a._saved; });
  if (debts.length) {
    var all = FT.debts();
    debts.forEach(function (a) {
      var k = DEBT_KINDS[a.kind], bal = num(a.amount);
      all.push({ id: Date.now() + Math.floor(Math.random() * 100000), type: a.kind, name: (a.name || '').trim() || (L ? k.es : k.en), balance: bal, payment: num(a.payment), apr: 0, term: 0,
        original: bal, limit: 0, minPayment: 0, kind: k.kind, abonos: [], paidMonths: {}, owner: (hogarOn && a.kind === 'hipoteca') ? 'both' : 'me', createdAt: new Date().toISOString(), updatedAt: new Date().toISOString() });
      if (hogarOn && a.kind === 'hipoteca') { var dl = all[all.length - 1]; dl.splitMe = 50; dl.splitPartner = 50; dl.splitMode = 'equal'; }
    });
    FT.saveDebts(all);
    debts.forEach(function (a) { a._saved = true; });
  }

  FT.setRaw('ft_onboarding_saldos_done', '1');
  location.replace('dashboard.html');
}

/* ─── INIT ─── */
(function initOnboarding() {
  FT.applyLang(document);
  obDetectExisting();
  var ex = existing();
  // Primera vez (sin cuentas): ya hay una cuenta de cheques lista para llenar.
  if (!ex.accounts.length) addItem('accounts', 'checking'); else renderStep();
  document.addEventListener('ft:langchange', function () { renderStep(); });
})();
</script>
