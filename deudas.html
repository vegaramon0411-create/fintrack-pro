<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>FinTrack Pro · Deudas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<script src="premium.js"></script>
<style>
  .dt-sum{background:#fff;border:1px solid var(--hair);border-radius:18px;padding:20px 18px;box-shadow:0 1px 3px rgba(20,20,30,.035);margin-bottom:18px;text-align:center;}
  .dt-sum .l{font-size:11px;font-weight:700;color:var(--text3);}
  .dt-sum .v{font-family:var(--round-font);font-weight:900;font-size:34px;letter-spacing:-1.2px;color:var(--red);margin:5px 0 14px;font-variant-numeric:tabular-nums;}
  .dt-sum .prow{display:flex;justify-content:space-between;font-size:10.5px;color:var(--text3);font-weight:700;margin:6px 0 16px;}
  .dt-sum .g{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .dt-sum .g div{background:var(--sunk);border-radius:12px;padding:12px 10px;}
  .dt-sum .g .k{font-size:10px;color:var(--text3);font-weight:700;}
  .dt-sum .g .n{font-family:var(--round-font);font-weight:900;font-size:16px;margin-top:5px;letter-spacing:-.3px;}

  .dt-card{background:#fff;border:1px solid var(--hair);border-radius:16px;padding:15px;margin-bottom:12px;box-shadow:0 1px 3px rgba(20,20,30,.035);cursor:pointer;}
  .dt-card .top{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
  .dt-card .ic{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;font-size:17px;flex-shrink:0;}
  .dt-card .nm{font-family:var(--round-font);font-weight:900;font-size:14px;}
  .dt-card .mt{font-size:10px;color:var(--text3);font-weight:700;}
  .dt-card .bal{margin-left:auto;text-align:right;}
  .dt-card .bal .v{font-family:var(--round-font);font-weight:900;font-size:15px;}
  .dt-card .bal .k{font-size:9px;color:var(--text3);}
  .dt-card .qa{display:flex;flex-direction:column;gap:6px;margin-left:4px;}
  .dt-card .qa span{cursor:pointer;font-size:14px;color:var(--text3);}
  .dt-pctrow{display:flex;justify-content:space-between;font-size:10.5px;color:var(--text3);font-weight:700;margin-bottom:10px;}
  .dt-thismonth{background:var(--sunk);border-radius:10px;padding:9px 11px;margin-bottom:10px;}
  .dt-thismonth .top2{display:flex;justify-content:space-between;font-size:10.5px;font-weight:700;margin-bottom:6px;}
  .dt-stats3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:10px;}
  .dt-stats3 .s{text-align:center;}
  .dt-stats3 .s .v{font-family:var(--round-font);font-weight:900;font-size:13px;}
  .dt-stats3 .s .k{font-size:9px;color:var(--text3);font-weight:700;}

  .dt-typegrid{display:grid;grid-template-columns:1fr 1fr;gap:9px;}
  .dt-typegrid .tc{border:1.5px solid var(--hair);border-radius:14px;padding:14px 10px;text-align:center;cursor:pointer;background:var(--sunk);}
  .dt-typegrid .tc .e{font-size:24px;}
  .dt-typegrid .tc .n{font-family:var(--round-font);font-weight:900;font-size:12.5px;margin-top:6px;}
  .dt-typegrid .tc .s{font-size:9.5px;color:var(--text3);margin-top:2px;}

  .dt-seg{display:flex;gap:8px;margin-bottom:4px;}
  .dt-seg button{flex:1;padding:9px;border-radius:10px;border:1.5px solid var(--hair);background:var(--sunk);font-family:var(--ui-font);font-size:12px;font-weight:800;color:var(--text2);cursor:pointer;}
  .dt-seg button.on{border-color:var(--g-main);background:var(--g-light);color:var(--g-dark);}
  .dt-seg.red button.on{border-color:var(--red);background:var(--red-dim);color:var(--red);}
  .dt-hint{font-size:10.5px;color:var(--text3);margin-top:5px;}
  .dt-typehdr{display:flex;align-items:center;gap:10px;border-radius:12px;padding:12px 14px;margin-bottom:16px;}
  .dt-typehdr .n{font-size:13px;font-weight:800;} .dt-typehdr .s{font-size:11px;color:var(--text3);}
  .dt-preview{background:var(--red-dim);border-radius:12px;padding:13px;margin:10px 0;}
  .dt-preview .t{font-size:11.5px;font-weight:900;color:#8A1E22;margin-bottom:7px;}
  .dt-preview .r{display:flex;justify-content:space-between;font-size:11.5px;padding:4px 0;}
  .dt-preview .r .k{color:var(--text2);}
  .dt-preview .tip{background:var(--g-light);color:var(--g-dark);border-radius:9px;padding:8px 10px;font-size:11px;margin-top:8px;}
  .dt-costbox{background:linear-gradient(135deg,rgba(225,75,79,.08),rgba(225,75,79,.02));border:1.5px solid rgba(225,75,79,.2);border-radius:14px;padding:15px;margin:14px 0;}
  .dt-costbox .lab{font-size:10.5px;font-weight:800;color:var(--text3);text-transform:uppercase;letter-spacing:.4px;}
  .dt-costbox .big{font-family:var(--round-font);font-weight:900;font-size:24px;color:var(--red);margin:4px 0;}
  .dt-amort{width:100%;border-collapse:collapse;font-size:11.5px;}
  .dt-amort th{background:var(--sunk);padding:7px 6px;text-align:left;font-size:9.5px;color:var(--text3);text-transform:uppercase;}
  .dt-amort td{padding:7px 6px;border-bottom:1px solid var(--hair);}
  .dt-abrow{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--hair);cursor:pointer;}
  .dt-abrow:last-child{border-bottom:none;}
  .dt-chiprow{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;}
  .dt-chiprow button{background:#fff;border:1.5px solid var(--g-main);color:var(--g-dark);border-radius:20px;padding:5px 10px;font-size:11px;font-weight:700;cursor:pointer;font-family:var(--ui-font);}
  .dt-empty{text-align:center;padding:50px 20px;}
  .dt-empty .e{font-size:52px;margin-bottom:12px;}
</style>
</head>
<body>
<div class="ft-app"><div class="ft-page" id="root"></div></div>
<script>
var TYPE_CFG = {
  hipoteca:  { es:{name:'Hipoteca',sub:'Casa · Condo · Propiedad'}, en:{name:'Mortgage',sub:'House · Condo · Property'}, ico:'🏠', color:'var(--red)', bg:'var(--red-dim)', hasInterest:true, hasOriginal:true, hasLimit:false, fixedTerm:true, defaultAPR:6.8, exampleTerm:360, kind:'needs' },
  auto:      { es:{name:'Auto / Vehículo',sub:'Auto · Moto · Camión'}, en:{name:'Auto / Vehicle',sub:'Car · Motorcycle · Truck'}, ico:'🚗', color:'var(--blue)', bg:'var(--sky-bg)', hasInterest:true, hasOriginal:false, hasLimit:false, fixedTerm:true, defaultAPR:6.9, exampleTerm:60, kind:'needs' },
  tarjeta:   { es:{name:'Tarjeta de crédito',sub:'Visa · MC · Amex · Discover'}, en:{name:'Credit card',sub:'Visa · MC · Amex · Discover'}, ico:'💳', color:'var(--amber)', bg:'#FBF0DD', hasInterest:true, hasOriginal:false, hasLimit:true, fixedTerm:false, defaultAPR:24.99, exampleTerm:null, kind:'wants' },
  personal:  { es:{name:'Préstamo personal',sub:'Familiar · Banco · Sin interés'}, en:{name:'Personal loan',sub:'Family · Bank · 0% interest'}, ico:'📦', color:'#7B5EA7', bg:'#EFE9F5', hasInterest:false, hasOriginal:false, hasLimit:false, fixedTerm:true, defaultAPR:0, exampleTerm:24, kind:'needs' }
};
function es() { return FT.lang === 'es'; }
function money(n, d) { return FT.money(n, { cents: !!d }); }
function cfg(t) { return TYPE_CFG[t] || TYPE_CFG.personal; }
function info(t) { var c = cfg(t); return c[FT.lang] || c.es; }

/* ═══════════════ LISTA ═══════════════ */
function render() {
  var debts = FT.debts();
  if (!debts.length) {
    document.getElementById('root').innerHTML =
      '<div class="ft-section-head"><h3>' + (es() ? 'Deudas' : 'Debts') + '</h3></div>' +
      '<div class="dt-empty"><div class="e">💳</div><div style="font-weight:800;margin-bottom:6px">' + (es() ? 'Sin deudas registradas' : 'No debts recorded') + '</div>' +
      '<div style="font-size:12.5px;color:var(--text3);margin-bottom:18px">' + (es() ? 'Agrega una para hacer seguimiento de tu progreso' : 'Add one to track your progress') + '</div>' +
      '<button class="ft-btn ft-btn-primary tap" style="max-width:220px;margin:0 auto" onclick="openTypePicker()">＋ ' + (es() ? 'Nueva deuda' : 'New debt') + '</button></div>';
    return;
  }
  var totBal = 0, totPay = 0, totOrig = 0;
  debts.forEach(function (d) { totBal += +d.balance || 0; totPay += +d.payment || 0; totOrig += Math.max(+d.original || 0, +d.balance || 0); });
  var paidPct = totOrig > 0 ? Math.max(0, Math.round((totOrig - totBal) / totOrig * 100)) : 0;

  var sum = '<div class="dt-sum"><div class="l">' + (es() ? 'Deuda total' : 'Total debt') + '</div><div class="v">' + money(totBal) + '</div>' +
    '<div class="ft-track"><div class="ft-fill" id="dtSumFill" style="background:linear-gradient(90deg,var(--red),#B23B3F);width:0"></div></div>' +
    '<div class="dt-prow"><span>' + paidPct + '% ' + (es() ? 'pagado' : 'paid') + '</span><span>' + (es() ? 'de ' : 'of ') + money(totOrig) + ' ' + (es() ? 'originales' : 'original') + '</span></div>' +
    '<div class="g"><div><div class="k">' + (es() ? 'Pagos mensuales' : 'Monthly payments') + '</div><div class="n">' + money(totPay) + '/' + (es() ? 'mes' : 'mo') + '</div></div>' +
    '<div><div class="k">% ' + (es() ? 'pagado' : 'paid') + '</div><div class="n">' + paidPct + '%</div></div></div></div>';

  var cards = debts.map(function (d) { return debtCardHTML(d); }).join('');
  document.getElementById('root').innerHTML =
    '<div class="ft-section-head"><h3>' + (es() ? 'Deudas' : 'Debts') + '</h3></div>' + sum + cards;
  requestAnimationFrame(function () { var f = document.getElementById('dtSumFill'); if (f) f.style.width = paidPct + '%'; });
  document.querySelectorAll('[data-open]').forEach(function (el) { el.onclick = function () { openDetail(el.getAttribute('data-open')); }; });
  document.querySelectorAll('[data-abonar]').forEach(function (el) { el.onclick = function (e) { e.stopPropagation(); openAbonar(el.getAttribute('data-abonar')); }; });
  document.querySelectorAll('[data-editq]').forEach(function (el) { el.onclick = function (e) { e.stopPropagation(); var d = FT.debts().find(function (x) { return String(x.id) === el.getAttribute('data-editq'); }); openForm(d.type, d); }; });
  document.querySelectorAll('[data-delq]').forEach(function (el) { el.onclick = function (e) { e.stopPropagation(); deleteDebt(el.getAttribute('data-delq')); }; });
}

function debtCardHTML(d) {
  var c = cfg(d.type), i = info(d.type), L = es();
  var orig = Math.max(+d.original || 0, +d.balance || 0);
  var paidAmt = Math.max(0, orig - (+d.balance || 0));
  var paidPct = orig > 0 ? Math.min(100, Math.round(paidAmt / orig * 100)) : 0;
  var mk = FT.todayISO().slice(0, 7);
  var paidThisMonth = (d.abonos || []).filter(function (a) { return String(a.fecha || '').slice(0, 7) === mk; }).reduce(function (s, a) { return s + (+a.monto || 0); }, 0);
  var mPct = d.payment > 0 ? Math.min(100, Math.round(paidThisMonth / d.payment * 100)) : 0;
  var mDone = d.payment > 0 && paidThisMonth >= d.payment;
  var isSimpleM = d.type === 'hipoteca' && d.mortgageMode === 'simple';
  var am = isSimpleM ? { payoffPossible: true, months: d.term || 0, totalInterest: d.simpleTotalInterest } : FT.calcAmort(d.balance, d.payment, d.apr || 0, d.term || 0);

  return '<div class="dt-card" data-open="' + d.id + '">' +
    '<div class="top"><div class="ic" style="background:' + c.bg + '">' + c.ico + '</div>' +
      '<div><div class="nm">' + (d.name || i.name) + '</div><div class="mt">' + i.name + ' · ' + (isSimpleM ? (L ? 'Modo simple' : 'Simple mode') : 'APR ' + (d.apr || 0) + '%') + '</div></div>' +
      '<div class="bal"><div class="v" style="color:' + c.color + '">' + money(d.balance) + '</div><div class="k">' + (L ? 'saldo' : 'balance') + '</div></div>' +
      '<div class="qa"><span data-editq="' + d.id + '" title="Editar">✏️</span><span data-delq="' + d.id + '" title="Eliminar">🗑</span></div></div>' +
    '<div class="ft-track"><div class="ft-fill" style="width:' + paidPct + '%;background:' + c.color + '"></div></div>' +
    '<div class="dt-pctrow"><span>' + paidPct + '% ' + (L ? 'pagado' : 'paid') + '</span><span>' + (L ? 'Meses rest.' : 'Months left') + ': ' + (am.payoffPossible && am.months < 600 ? am.months : '—') + '</span></div>' +
    (d.payment > 0 ? '<div class="dt-thismonth"><div class="top2"><span>' + (L ? 'Este mes' : 'This month') + '</span><span style="color:' + (mDone ? 'var(--g-main)' : c.color) + '">' + (mDone ? '✅ ' + (L ? 'Cubierto' : 'Covered') : (L ? 'Faltan ' : '') + money(d.payment - paidThisMonth) + (L ? '' : ' left')) + '</span></div>' +
      '<div class="ft-track" style="margin-bottom:0"><div class="ft-fill" style="width:' + mPct + '%;background:' + (mDone ? 'var(--g-main)' : c.color) + '"></div></div></div>' : '') +
    '<div class="dt-stats3"><div class="s"><div class="v">' + money(d.payment) + '</div><div class="k">' + (L ? 'pago/mes' : 'payment/mo') + '</div></div>' +
      '<div class="s"><div class="v" style="color:var(--red)">' + (am.payoffPossible ? (am.totalInterest == null ? '—' : money(am.totalInterest)) : '∞') + '</div><div class="k">' + (L ? 'intereses' : 'interest') + '</div></div>' +
      '<div class="s"><div class="v">' + (am.payoffPossible && am.months < 600 ? am.months + 'm' : '—') + '</div><div class="k">' + (L ? 'meses rest.' : 'months left') + '</div></div></div>' +
    '<button class="ft-btn ft-btn-primary tap" data-abonar="' + d.id + '">💳 ' + (L ? 'Registrar abono' : 'Register payment') + '</button></div>';
}

/* ═══════════════ ALTA / EDICIÓN ═══════════════ */
var formSt;
function openTypePicker() {
  var L = es();
  var ov = FT.sheet({
    title: L ? '¿Qué tipo de deuda es?' : 'What type of debt?',
    html: '<div class="dt-typegrid">' + Object.keys(TYPE_CFG).map(function (k) {
      var c = TYPE_CFG[k], i = c[FT.lang] || c.es;
      return '<div class="tc" data-t="' + k + '"><div class="e">' + c.ico + '</div><div class="n">' + i.name + '</div><div class="s">' + i.sub + '</div></div>';
    }).join('') + '</div>'
  });
  ov.querySelectorAll('[data-t]').forEach(function (el) { el.onclick = function () { FT.closeTop(); openForm(el.getAttribute('data-t'), null); }; });
}
function openForm(type, debt) {
  formSt = { type: type, editing: debt, mortgageMode: debt ? (debt.mortgageMode || 'detallado') : 'detallado', hasInterest: debt ? (+debt.apr || 0) > 0 : cfg(type).hasInterest, kind: debt ? (debt.kind || cfg(type).kind) : cfg(type).kind };
  if (type === 'hipoteca' && formSt.mortgageMode === 'simple') formSt.hasInterest = false;
  var L = es();
  FT.modal({
    title: debt ? (L ? 'Editar deuda' : 'Edit debt') : (L ? 'Nueva deuda' : 'New debt'),
    html: formHTML(),
    saveLabel: L ? 'Guardar deuda' : 'Save debt',
    cancelLabel: L ? 'Cancelar' : 'Cancel',
    onOpen: wireForm,
    onSave: saveDebtForm
  });
}
function formHTML() {
  var s = formSt, c = cfg(s.type), i = info(s.type), L = es(), d = s.editing;
  var v = function (x) { return x == null ? '' : x; };
  var typeHdr = '<div class="dt-typehdr" style="background:' + c.bg + '"><span style="font-size:22px">' + c.ico + '</span><div><div class="n">' + i.name + '</div><div class="s">' + i.sub + '</div></div>' +
    (!d ? '<button type="button" id="dtChangeType" style="margin-left:auto;background:#fff;border:1.5px solid var(--hair);border-radius:8px;padding:5px 10px;font-size:11px;font-weight:700;cursor:pointer;font-family:var(--ui-font);color:var(--text3)">' + (L ? 'Cambiar' : 'Change') + '</button>' : '') + '</div>';

  var html = typeHdr +
    '<div class="ft-field"><label>' + (L ? 'Nombre / Descripción' : 'Name / Description') + '</label><input id="fName" value="' + v(d && d.name) + '" placeholder="' + (L ? 'ej. Hipoteca Chase' : 'e.g. Chase Mortgage') + '"></div>' +
    '<div class="ft-field"><label>' + (L ? 'Saldo actual ($)' : 'Current balance ($)') + '</label><input id="fBalance" type="number" min="0" step="0.01" value="' + v(d && d.balance) + '"></div>';

  if (c.hasOriginal) html += '<div class="ft-field"><label>' + (L ? 'Monto original del préstamo ($)' : 'Original loan amount ($)') + '</label><input id="fOriginal" type="number" min="0" step="0.01" value="' + v(d && d.original) + '"><div class="dt-hint">' + (L ? 'Para calcular cuánto has pagado' : 'To calculate how much you have paid') + '</div></div>';
  if (c.hasLimit) html += '<div class="ft-field"><label>' + (L ? 'Límite de crédito ($)' : 'Credit limit ($)') + '</label><input id="fLimit" type="number" min="0" value="' + v(d && d.limit) + '"></div>';

  if (s.type === 'hipoteca') {
    html += '<div class="ft-field"><label>' + (L ? 'Valor de la casa ($)' : 'House price ($)') + '</label><input id="fHousePrice" type="number" min="0" step="0.01" value="' + v(d && d.housePrice) + '"></div>' +
      '<div class="ft-field"><label>' + (L ? 'Enganche pagado ($, opcional)' : 'Down payment ($, optional)') + '</label><input id="fDownPayment" type="number" min="0" step="0.01" value="' + v(d && d.downPayment) + '"></div>' +
      '<div class="ft-field"><label>' + (L ? '¿Cómo quieres calcularlo?' : 'How to calculate it?') + '</label><div class="dt-seg" id="dtModeSeg">' +
        '<button type="button" data-m="simple" class="' + (s.mortgageMode === 'simple' ? 'on' : '') + '">🧮 ' + (L ? 'Simple' : 'Simple') + '</button>' +
        '<button type="button" data-m="detallado" class="' + (s.mortgageMode === 'detallado' ? 'on' : '') + '">🔍 ' + (L ? 'Detallado' : 'Detailed') + '</button></div>' +
        '<div class="dt-hint">' + (s.mortgageMode === 'simple' ? (L ? 'Solo necesitas tu pago mensual y el plazo' : "You just need your payment and term") : (L ? 'Calcula el pago real con tasa, impuestos y seguro' : 'Calculates the real payment with rate, taxes and insurance')) + '</div></div>';
  }

  if (s.mortgageMode !== 'simple' || s.type !== 'hipoteca') {
    html += '<div class="ft-field" id="dtIntBlock"><label>' + (L ? '¿Tiene interés?' : 'Has interest?') + '</label><div class="dt-seg red" id="dtIntSeg">' +
      '<button type="button" data-i="1" class="' + (s.hasInterest ? 'on' : '') + '">' + (L ? 'Sí' : 'Yes') + '</button>' +
      '<button type="button" data-i="0" class="' + (!s.hasInterest ? 'on' : '') + '">' + (L ? 'No (0%)' : 'No (0%)') + '</button></div></div>';
  }
  if (s.hasInterest) html += '<div class="ft-field" id="dtAprWrap"><label>APR (%)</label><input id="fAPR" type="number" min="0" step="0.01" placeholder="' + c.defaultAPR + '" value="' + v(d && d.apr) + '"><div class="dt-hint">' + (s.type === 'tarjeta' ? (L ? 'Típico: 20–29% · revisa tu estado de cuenta' : 'Typical: 20–29%') : (L ? 'Está en tu contrato o estado de cuenta' : "It's on your contract or statement")) + '</div></div>';

  if (s.type === 'hipoteca' && s.mortgageMode !== 'simple') {
    html += '<div class="ft-field"><label>' + (L ? 'Impuesto predial / Seguro / PMI (% anual) · HOA ($/mes)' : 'Property tax / Insurance / PMI (% yearly) · HOA ($/mo)') + '</label>' +
      '<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><input id="fTaxPct" type="number" step="0.01" placeholder="' + (L ? 'Predial %' : 'Tax %') + '" value="' + v(d && d.taxPct) + '">' +
      '<input id="fInsurancePct" type="number" step="0.01" placeholder="' + (L ? 'Seguro %' : 'Insurance %') + '" value="' + v(d && d.insurancePct) + '">' +
      '<input id="fPmiPct" type="number" step="0.01" placeholder="PMI %" value="' + v(d && d.pmiPct) + '">' +
      '<input id="fHoa" type="number" step="0.01" placeholder="HOA $" value="' + v(d && d.hoa) + '"></div><div class="dt-hint">' + (L ? 'Opcional — se suman al pago sugerido (PITI)' : 'Optional — added to the suggested payment (PITI)') + '</div></div>';
  }

  if (c.fixedTerm) html += '<div class="ft-field"><label>' + (L ? 'Plazo restante (meses)' : 'Remaining term (months)') + '</label><input id="fTerm" type="number" min="1" step="1" placeholder="' + (c.exampleTerm || '') + '" value="' + v(d && d.term) + '"></div>';
  else html += '<input id="fTerm" type="hidden" value="">';

  html += '<div class="ft-field"><label>' + (L ? 'Pago mensual actual ($)' : 'Current monthly payment ($)') + '</label><input id="fPayment" type="number" min="0" step="0.01" value="' + v(d && d.payment) + '">' +
    (s.type === 'tarjeta' ? '<div class="dt-hint">' + (L ? 'Pon cuánto pagas actualmente, no el mínimo' : "Enter what you actually pay, not the minimum") + '</div>' : '') + '</div>';

  if (s.type === 'tarjeta') html += '<div class="ft-field"><label>' + (L ? 'Pago mínimo ($)' : 'Minimum payment ($)') + '</label><input id="fMinPayment" type="number" min="0" step="0.01" value="' + v(d && d.minPayment) + '"></div>';
  else html += '<input id="fMinPayment" type="hidden" value="">';

  html += '<div class="ft-field"><label>' + (L ? '¿Cómo cuenta en tu 50/30/20?' : 'How does it count in your 50/30/20?') + '</label><div class="dt-seg" id="dtKindSeg">' +
    '<button type="button" data-k="needs" class="' + (s.kind === 'needs' ? 'on' : '') + '">🏠 ' + (L ? 'Necesidad' : 'Need') + '</button>' +

  d.paidMonths = d.paidMonths || {}; d.paidMonths[o.fecha.slice(0, 7)] = true;

  var abonoId = Date.now(), linkedTxId = null;
  if (o.tipo === 'nuevo') {
    var data = FT.data();
    linkedTxId = abonoId + 1;
    data.transactions.push({ id: linkedTxId, type: 'gasto', desc: (L ? 'Abono a ' : 'Payment to ') + d.name, amount: o.monto, date: o.fecha, cat: '💳 Deudas', note: o.nota, hogar: d.type === 'hipoteca', createdBy: FT.userName() });
    FT.saveData(data);
  }
  var apr = parseFloat(d.apr) || 0;
  var interesEste = apr > 0 ? +(oldBalance * (apr / 100 / 12)).toFixed(2) : 0;
  var capitalEste = +Math.max(0, o.monto - interesEste).toFixed(2);
  d.abonos = d.abonos || [];
  d.abonos.push({ id: abonoId, monto: o.monto, fecha: o.fecha, nota: o.nota, saldoAntes: oldBalance, saldoDespues: newBalance, tipo: o.tipo, createdBy: FT.userName(), txId: linkedTxId, interesPagado: interesEste, capitalPagado: capitalEste });
  FT.saveDebts(debts);

  // Si ya había un recurrente activo y este abono manual cae en/después de su próxima fecha, se avanza para no duplicar
  if (o.existente && o.tipo === 'nuevo' && o.existente.nextDate && o.fecha >= o.existente.nextDate) {
    FT.recurUpdate(o.existente.id, { nextDate: FT._advanceRecDate(o.existente.freq, o.fecha) });
  }
  if (o.rec) {
    var hogar = FT.hogar();
    var payerLabel = o.who === 'partner' ? (hogar.partnerName || (L ? 'Tu pareja' : 'Partner')) : (FT.userName() || (L ? 'Tú' : 'You'));
    var rec = FT.recurring();
    rec.push({ id: 'rec_' + Date.now(), kind: 'debt', debtId: d.id, desc: (L ? 'Abono a ' : 'Payment to ') + d.name, amount: o.monto, freq: o.freq, hogar: d.type === 'hipoteca', nextDate: FT._advanceRecDate(o.freq, o.fecha), active: true, createdBy: FT.userName(), payerLabel: payerLabel, payerRole: o.who });
    FT.set(FT.K.recurring, rec);
  }
  FT.toast((L ? '✅ Abono de ' + money(o.monto) + ' registrado · Nuevo saldo: ' + money(newBalance) : '✅ Payment of ' + money(o.monto) + ' registered · New balance: ' + money(newBalance)) + (o.rec ? (L ? ' · 🔄 recurrente activado' : ' · 🔄 recurring on') : ''), { ms: 4000 });
  if (document.getElementById('dtEdit')) openDetail(debtId); else render();
}

/* ═══════════════ DETALLE / EDICIÓN DE ABONO ═══════════════ */
function openAbonoDetail(debtId, abonoId) {
  var d = FT.debts().find(function (x) { return String(x.id) === String(debtId); });
  var a = (d.abonos || []).find(function (x) { return String(x.id) === String(abonoId); });
  if (!a) return;
  var L = es();
  FT.sheet({
    title: L ? 'Detalle del abono' : 'Payment detail',
    html: '<div style="text-align:center;margin-bottom:14px"><div style="font-family:var(--round-font);font-weight:900;font-size:24px;color:var(--g-main)">-' + money(a.monto, true) + '</div>' +
      (a.tipo === 'existente' ? '<span class="ft-pill" style="margin-top:6px;display:inline-block">📦 ' + (L ? 'Ya lo tenía' : 'Already had it') + '</span>' : '') + '</div>' +
      '<div class="ft-row"><span class="k">' + (L ? 'Fecha' : 'Date') + '</span><span class="v">' + FT.date(a.fecha) + '</span></div>' +
      '<div class="ft-row"><span class="k">' + (L ? 'Registrado por' : 'Recorded by') + '</span><span class="v">' + (a.createdBy || '—') + '</span></div>' +
      '<div class="ft-row"><span class="k">' + (L ? 'Saldo antes' : 'Balance before') + '</span><span class="v">' + money(a.saldoAntes, true) + '</span></div>' +
      '<div class="ft-row"><span class="k">' + (L ? 'Saldo después' : 'Balance after') + '</span><span class="v">' + money(a.saldoDespues, true) + '</span></div>' +
      '<div class="ft-row"><span class="k">' + (L ? 'De ese pago, capital' : 'Of that, principal') + '</span><span class="v" style="color:var(--g-main)">' + money(a.capitalPagado, true) + '</span></div>' +
      '<div class="ft-row"><span class="k">' + (L ? 'De ese pago, interés' : 'Of that, interest') + '</span><span class="v" style="color:var(--red)">' + money(a.interesPagado, true) + '</span></div>' +
      (a.nota ? '<div class="ft-row"><span class="k">' + (L ? 'Nota' : 'Note') + '</span><span class="v">' + a.nota + '</span></div>' : ''),
    actions: [
      { label: '🗑️ ' + (L ? 'Eliminar' : 'Delete'), onClick: function () {
          FT.confirm(L ? '¿Eliminar este abono? El saldo se revierte.' : "Delete this payment? The balance will be reverted.").then(function (ok) {
            if (!ok) return;
            deleteAbono(debtId, abonoId);
          });
        } }
    ]
  });
}
function deleteAbono(debtId, abonoId) {
  var debts = FT.debts(); var idx = debts.findIndex(function (x) { return String(x.id) === String(debtId); });
  if (idx < 0) return;
  var d = debts[idx];
  var aIdx = (d.abonos || []).findIndex(function (x) { return String(x.id) === String(abonoId); });
  if (aIdx < 0) return;
  var a = d.abonos[aIdx];
  d.abonos.splice(aIdx, 1);
  var original = d.original != null ? d.original : ((parseFloat(d.balance) || 0) + (parseFloat(a.monto) || 0));
  d.balance = Math.max(0, original - d.abonos.reduce(function (s, x) { return s + (parseFloat(x.monto) || 0); }, 0));
  FT.saveDebts(debts);
  if (a.txId) FT.saveData((function (dt) { dt.transactions = dt.transactions.filter(function (t) { return t.id !== a.txId; }); return dt; })(FT.data()));
  FT.toast(es() ? '🗑️ Abono eliminado' : '🗑️ Payment deleted');
  openDetail(debtId); // te quedas viendo la MISMA deuda, actualizada
}

/* ═══════════════ INIT ═══════════════ */
document.addEventListener('ft:ready', function () {
  var t = function () { return FT.lang === 'es' ? 'Deudas' : 'Debts'; };
  var sh = FT.shell({ active: '', title: t(), onPlus: openTypePicker });
  // Deep-link desde el Dashboard ("Registrar abono" en una deuda por vencer)
  var pending = FT.getRaw('ft_open_abonar');
  if (pending) { FT.del('ft_open_abonar'); render(); setTimeout(function () { openAbonar(pending === '__selector__' ? (FT.debts()[0] || {}).id : pending); }, 300); }
  else render();
  document.addEventListener('ft:datachanged', function () { if (!document.getElementById('dtBack')) render(); });
  document.addEventListener('ft:langchange', function () { sh.setTitle(t()); render(); });
});
</script>
