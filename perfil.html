<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>FinTrack Pro · Mi Perfil</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<script src="premium.js"></script>
<style>
:root{ --text:var(--ink); --off:var(--sunk); --border:var(--hair); --r:14px; --g-dim:rgba(26,122,74,.10); --amb-dim:rgba(224,149,46,.12); }
.profile-hero{background:linear-gradient(135deg,var(--g-dark) 0%,var(--g-main) 55%,#22A362 100%);border-radius:22px;padding:28px;color:white;margin-bottom:16px;position:relative;overflow:hidden;display:flex;align-items:center;gap:20px;}
.profile-hero::before{content:'';position:absolute;top:-60px;right:-60px;width:220px;height:220px;border-radius:50%;background:rgba(255,255,255,.07);}
.avatar-wrap{position:relative;z-index:1;flex-shrink:0;}
.avatar-big{width:86px;height:86px;border-radius:50%;background:rgba(255,255,255,.2);border:3px solid rgba(255,255,255,.4);display:grid;place-items:center;font-size:34px;font-weight:800;color:white;overflow:hidden;}
.avatar-edit{position:absolute;bottom:-2px;right:-2px;width:30px;height:30px;border-radius:50%;background:white;color:var(--g-main);display:grid;place-items:center;font-size:13px;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.2);border:none;}
.profile-info{position:relative;z-index:1;flex:1;min-width:0;}
.profile-name{font-size:22px;font-weight:800;letter-spacing:-.5px;}
.profile-email{font-size:12.5px;opacity:.7;margin-top:2px;}
.profile-since{font-size:11.5px;opacity:.55;margin-top:6px;}
.profile-tier{display:inline-flex;align-items:center;gap:5px;background:rgba(255,255,255,.18);border-radius:20px;padding:4px 12px;font-size:11px;font-weight:700;margin-top:9px;}
.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;}
.stat-card{background:var(--white);border:1px solid var(--border);border-radius:var(--r);padding:14px;box-shadow:0 1px 3px rgba(20,20,30,.035);text-align:center;}
.stat-ico{font-size:20px;margin-bottom:6px;}
.stat-val{font-size:19px;font-weight:800;letter-spacing:-.5px;}
.stat-lbl{font-size:10px;color:var(--text3);font-weight:600;margin-top:2px;}
.card{background:var(--white);border:1px solid var(--border);border-radius:var(--r);padding:18px;box-shadow:0 1px 3px rgba(20,20,30,.035);margin-bottom:14px;}
.card-hd{font-size:14px;font-weight:800;margin-bottom:14px;}
.achv-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.achv-card{border-radius:12px;padding:14px;text-align:center;border:1.5px solid var(--border);}
.achv-card.unlocked{background:linear-gradient(135deg,var(--g-light),rgba(34,163,98,.08));border-color:rgba(26,122,74,.25);}
.achv-card.locked{opacity:.45;filter:grayscale(.6);}
.achv-ico{font-size:28px;margin-bottom:6px;}
.achv-name{font-size:11px;font-weight:700;}
.achv-desc{font-size:9px;color:var(--text3);margin-top:2px;line-height:1.3;}
.score-ring-wrap{position:relative;width:130px;height:130px;margin:0 auto 12px;}
.score-val{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;}
.score-num{font-size:30px;font-weight:800;letter-spacing:-1px;}
.score-lbl{font-size:10px;color:var(--text3);font-weight:600;}
.score-desc{font-size:13px;font-weight:600;margin-top:2px;text-align:center;}
.score-tip{display:flex;gap:8px;align-items:flex-start;font-size:12px;color:var(--text2);margin-bottom:8px;line-height:1.45;}
.tl-item{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--border);}
.tl-item:last-child{border-bottom:none;padding-bottom:0;}
.tl-dot{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;font-size:15px;flex-shrink:0;}
.tl-title{font-size:13px;font-weight:600;}
.tl-date{font-size:11px;color:var(--text3);margin-top:1px;}
.avatar-options{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:6px;}
.avatar-opt{width:100%;aspect-ratio:1;border-radius:50%;display:grid;place-items:center;font-size:22px;cursor:pointer;border:2px solid transparent;background:var(--off);}
.avatar-opt.on{border-color:var(--g-main);background:var(--g-light);}
</style>
</head>
<body>
<div class="ft-app"><div class="ft-page" id="root"></div></div>
<script>
var AVATAR_KEY = 'ft_avatar';
var AVATAR_OPTIONS = ['😀', '😎', '🧑', '👩', '🧑‍💼', '🐱', '🐶', '🦊', '🌟', '🚀'];
var selectedAvatar = '';
var planSelectedPreset = null, planRecommendedId = null;

function es() { return FT.lang === 'es'; }
function go(url) { FT.go(url); }

var BUDGET_PRESETS = [
  { id: '50-30-20', needs: 50, wants: 30, savings: 20, es: '50/30/20 Clásico', en: '50/30/20 Classic', descEs: 'El más estudiado. Buen punto de partida si no sabes por dónde empezar.', descEn: "The most studied. Good starting point if you're not sure." },
  { id: '70-20-10', needs: 70, wants: 20, savings: 10, es: '70/20/10', en: '70/20/10', descEs: 'Más margen para lo esencial. Bueno si tus gastos fijos son altos o tu ciudad es cara.', descEn: 'More room for essentials. Good for high-cost areas or high fixed costs.' },
  { id: '60-20-20', needs: 60, wants: 20, savings: 20, es: '60/20/20', en: '60/20/20', descEs: 'Estructura balanceada. Bueno para ingresos duales o quien quiere orden sin sentirse encerrado.', descEn: 'Balanced structure. Good for dual incomes or those wanting order without feeling boxed in.' },
  { id: '80-20', needs: 80, wants: 0, savings: 20, es: '80/20 Simple', en: '80/20 Simple', descEs: 'Solo separas el 20% de ahorro; el resto lo gastas sin dividir por categoría.', descEn: 'Just set aside 20% for savings; spend the rest without splitting into categories.' }
];

/* ── ESTADÍSTICAS ── */
function computeStats() {
  var txs = FT.txs(), invs = FT.investments('');
  var u = FT.user();
  var created = u.createdAt ? new Date(u.createdAt) : new Date();
  var monthsActive = Math.max(1, Math.round((new Date() - created) / (1000 * 60 * 60 * 24 * 30)));
  var totalSaved = txs.filter(function (t) { return t.type === 'ahorro' || t.type === 'inversion'; }).reduce(function (s, t) { return s + (parseFloat(t.amount) || 0); }, 0);
  var totalInvested = invs.reduce(function (s, i) { return s + (parseFloat(i.amount) || 0); }, 0);
  var uniqueDays = new Set(txs.map(function (t) { return t.date; })).size;
  var totalTx = txs.length;
  var emergency = FT.emergencyBalance();
  var income = u.income || 0;
  var efGoal = income * 3;
  var efPct = efGoal > 0 ? Math.min(100, Math.round(emergency / efGoal * 100)) : 0;
  return { monthsActive: monthsActive, totalSaved: totalSaved, totalInvested: totalInvested, uniqueDays: uniqueDays, totalTx: totalTx, emergency: emergency, efPct: efPct, income: income };
}
function getAchievements(stats) {
  var L = es();
  return [
    { ico: '🎯', name: L ? 'Primer registro' : 'First entry', desc: L ? 'Registraste tu primer movimiento' : 'Recorded your first entry', unlocked: stats.totalTx >= 1 },
    { ico: '🔥', name: L ? 'Constancia' : 'Consistency', desc: L ? '10+ registros realizados' : '10+ entries recorded', unlocked: stats.totalTx >= 10 },
    { ico: '💰', name: L ? 'Ahorrador' : 'Saver', desc: L ? 'Ahorraste $500+' : 'Saved $500+', unlocked: stats.totalSaved >= 500 },
    { ico: '📈', name: L ? 'Inversionista' : 'Investor', desc: L ? 'Tu primera inversión' : 'Your first investment', unlocked: stats.totalInvested > 0 },
    { ico: '🛡️', name: L ? 'Protegido' : 'Protected', desc: L ? '1 mes de fondo emergencia' : '1 month emergency fund', unlocked: stats.efPct >= 33 },
    { ico: '🏆', name: L ? 'Blindado' : 'Armored', desc: L ? 'Meta de 3 meses lograda' : '3-month goal reached', unlocked: stats.efPct >= 100 },
    { ico: '📊', name: L ? 'Organizado' : 'Organized', desc: L ? '30+ registros realizados' : '30+ entries recorded', unlocked: stats.totalTx >= 30 },
    { ico: '⭐', name: L ? 'Veterano' : 'Veteran', desc: L ? '3+ meses usando la app' : '3+ months using the app', unlocked: stats.monthsActive >= 3 }
  ];
}
function computeHealthScore(stats) {
  var L = es(), score = 50;
  if (stats.efPct >= 100) score += 20; else if (stats.efPct >= 33) score += 10;
  if (stats.totalSaved > 0) score += 10;
  if (stats.totalInvested > 0) score += 10;
  if (stats.totalTx >= 10) score += 10;
  score = Math.min(100, score);
  var label, color;
  if (score >= 80) { label = L ? 'Excelente' : 'Excellent'; color = 'var(--g-main)'; }
  else if (score >= 60) { label = L ? 'Buena' : 'Good'; color = 'var(--blue)'; }
  else if (score >= 40) { label = L ? 'Regular' : 'Fair'; color = 'var(--amber)'; }
  else { label = L ? 'Necesita atención' : 'Needs attention'; color = 'var(--red)'; }
  return { score: score, label: label, color: color };
}

/* ── HOGAR (estado compacto — la gestión real vive en hogar.html) ── */
function buildHouseholdSection() {
  var L = es(), hogar = FT.hogar();
  if (hogar.connected) {
    return '<div style="display:flex;align-items:center;gap:12px;background:var(--g-light);border:1px solid rgba(26,122,74,.2);border-radius:14px;padding:14px 16px;margin-bottom:12px">' +
      '<div style="width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,var(--g-dark),var(--g-main));display:grid;place-items:center;color:white;font-size:16px;font-weight:800;flex-shrink:0">' + (hogar.partnerName || 'P').charAt(0).toUpperCase() + '</div>' +
      '<div style="flex:1;min-width:0"><div style="font-size:11px;color:var(--text3);font-weight:600">' + (L ? 'Conectado con' : 'Connected with') + '</div><div style="font-size:14px;font-weight:800">' + (hogar.partnerName || '—') + '</div></div>' +
      '<div style="font-size:10px;color:var(--g-main);font-weight:700">✓ ' + (L ? 'Activo' : 'Active') + '</div></div>' +
      '<button class="ft-btn ft-btn-primary tap" onclick="go(\'hogar.html\')" style="margin:0">' + (L ? 'Ver Hogar →' : 'View Household →') + '</button>';
  }
  if (hogar.pendingInvite) {
    return '<div style="text-align:center;padding:8px 0 4px">' +
      '<div style="font-size:13px;font-weight:700;margin-bottom:4px">' + (L ? 'Invitación pendiente' : 'Pending invitation') + '</div>' +
      '<div style="font-size:12px;color:var(--text3);margin-bottom:14px">' + (L ? 'Termina de compartir el código desde Hogar.' : 'Finish sharing the code from Household.') + '</div>' +
      '<div style="background:var(--off);border:1.5px dashed var(--border);border-radius:14px;padding:16px;margin-bottom:12px"><div style="font-size:24px;font-weight:800;letter-spacing:2px;color:var(--g-main)">' + (hogar.inviteCode || '—') + '</div></div>' +
      '<button class="ft-btn ft-btn-primary tap" onclick="go(\'hogar.html\')" style="margin:0">' + (L ? 'Ir a Hogar →' : 'Go to Household →') + '</button></div>';
  }
  return '<div style="text-align:center;padding:8px 0 4px">' +
    '<div style="font-size:36px;margin-bottom:10px">💑</div>' +
    '<div style="font-size:15px;font-weight:800;margin-bottom:6px">' + (L ? 'Lleva el control en pareja' : 'Manage finances as a couple') + '</div>' +
    '<div style="font-size:12px;color:var(--text3);line-height:1.5;margin-bottom:16px">' + (L ? 'Invita a tu pareja para ver la salud financiera combinada del hogar — cada quien mantiene sus datos privados hasta que decidan compartirlos.' : "Invite your partner to see your household's combined financial health — each of you keeps your data private until you decide to share it.") + '</div>' +
    '<button class="ft-btn ft-btn-primary tap" onclick="go(\'hogar.html\')" style="margin:0">' + (L ? '+ Ir a Hogar' : '+ Go to Household') + '</button></div>';
}

function buildRecentActivity() {
  var L = es();
  var recent = FT.txs().slice().sort(function (a, b) { return new Date(b.date) - new Date(a.date); }).slice(0, 5);
  if (!recent.length) return '<div class="ft-empty">' + (L ? 'Sin actividad reciente' : 'No recent activity') + '</div>';
  var icons = { gasto: '💸', ingreso: '💰', inversion: '📈', ahorro: '🛡️', suscripcion: '🔄', hipoteca: '🏠' };
  var pastels = { gasto: 'coral', ingreso: 'mint', inversion: 'sky', ahorro: 'peach', suscripcion: 'sky', hipoteca: 'coral' };
  return recent.map(function (t) {
    return '<div class="tl-item"><div class="tl-dot ft-tx-ico ' + (pastels[t.type] || 'peach') + '">' + (icons[t.type] || '💳') + '</div>' +
      '<div style="flex:1;min-width:0"><div class="tl-title">' + (t.desc || '—') + '</div><div class="tl-date">' + FT.date(t.date) + ' · ' + FT.money(t.amount, { cents: true }) + '</div></div></div>';
  }).join('');
}

/* ── PLAN DE PRESUPUESTO ── */
function getPlanBase() {
  var hogar = FT.hogar(), hogarConn = FT.hogarConnected();
  var persPct = hogarConn ? (100 - (parseFloat(hogar.payPctHogar) || 50) - (parseFloat(hogar.saveHogarPct) || 10)) : 100;
  var income = FT.user().income || 0;
  return hogarConn ? income * persPct / 100 : income;
}
function recomputePlanRecommendation() {
  var L = es(), base = getPlanBase();
  var fixed = parseFloat(document.getElementById('fixedExpensesInput').value) || 0;
  var box = document.getElementById('planRecommendation');
  if (fixed <= 0 || base <= 0) { box.style.display = 'none'; planRecommendedId = null; renderPlanPresets(); return; }
  var fixedPct = Math.min(100, fixed / base * 100);
  var rec = fixedPct > 65 ? BUDGET_PRESETS[1] : fixedPct > 50 ? BUDGET_PRESETS[2] : BUDGET_PRESETS[0];
  planRecommendedId = rec.id;
  box.style.display = 'block';
  box.innerHTML = '💡 ' + (L ? 'Tus gastos fijos son ~' + Math.round(fixedPct) + '% de tu base personal. Te recomendamos' : 'Your fixed costs are ~' + Math.round(fixedPct) + '% of your personal base. We recommend') + ' <b>' + (L ? rec.es : rec.en) + '</b>.';
  renderPlanPresets();
}
function renderPlanPresets() {
  var L = es(), cont = document.getElementById('planPresets'); if (!cont) return;
  var html = BUDGET_PRESETS.map(function (p) {
    var isRec = p.id === planRecommendedId, isSel = p.id === planSelectedPreset;
    return '<button onclick="choosePlanPreset(\'' + p.id + '\')" style="text-align:left;padding:10px;border-radius:10px;border:2px solid ' + (isSel ? 'var(--g-main)' : 'var(--border)') + ';background:' + (isSel ? 'var(--g-light)' : 'var(--off)') + ';cursor:pointer;font-family:inherit;position:relative">' +
      (isRec ? '<div style="position:absolute;top:-8px;right:8px;background:var(--g-main);color:white;font-size:8.5px;font-weight:800;padding:2px 6px;border-radius:20px">' + (L ? 'RECOMENDADO' : 'RECOMMENDED') + '</div>' : '') +
      '<div style="font-size:12.5px;font-weight:800;margin-bottom:2px">' + (L ? p.es : p.en) + '</div>' +
      '<div style="font-size:9.5px;color:var(--text3);margin-bottom:4px">' + p.needs + '/' + p.wants + '/' + p.savings + '</div>' +
      '<div style="font-size:9.5px;color:var(--text2);line-height:1.3">' + (L ? p.descEs : p.descEn) + '</div></button>';
  }).join('');
  html += '<button onclick="choosePlanPreset(\'custom\')" style="text-align:left;padding:10px;border-radius:10px;border:2px solid ' + (planSelectedPreset === 'custom' ? 'var(--g-main)' : 'var(--border)') + ';background:' + (planSelectedPreset === 'custom' ? 'var(--g-light)' : 'var(--off)') + ';cursor:pointer;font-family:inherit;grid-column:span 2">' +
    '<div style="font-size:12.5px;font-weight:800;margin-bottom:2px">✏️ ' + (L ? 'Personalizado' : 'Custom') + '</div><div style="font-size:9.5px;color:var(--text2)">' + (L ? 'Tú pones los números' : 'You set the numbers') + '</div></button>';
  cont.innerHTML = html;
  document.getElementById('planCustomWrap').style.display = planSelectedPreset === 'custom' ? '' : 'none';
}
function choosePlanPreset(id) {
  planSelectedPreset = id;
  if (id === 'custom') {
    var base = getPlanBase(), u = FT.user();
    document.getElementById('planNeedsPct').value = base > 0 ? Math.round((u.needs || base * 0.5) / base * 100) : 50;
    document.getElementById('planWantsPct').value = base > 0 ? Math.round((u.wants || base * 0.3) / base * 100) : 30;
    document.getElementById('planSavingsPct').value = base > 0 ? Math.round((u.savings || base * 0.2) / base * 100) : 20;
    updatePlanCustomPreview();
  }
  renderPlanPresets();
}
function updatePlanCustomPreview() {
  var L = es();
  var n = parseFloat(document.getElementById('planNeedsPct').value) || 0, w = parseFloat(document.getElementById('planWantsPct').value) || 0, s = parseFloat(document.getElementById('planSavingsPct').value) || 0;
  var total = n + w + s, warnEl = document.getElementById('planCustomWarning'), previewEl = document.getElementById('planCustomPreview'), base = getPlanBase();
  var warnings = [];
  if (total !== 100) warnings.push(L ? '⚠️ Suma ' + total + '%, no 100%. Ajusta antes de guardar.' : '⚠️ Adds up to ' + total + '%, not 100%. Adjust before saving.');
  if (s > 0 && s < 5) warnings.push(L ? '⚠️ Tu ahorro es muy bajo (<5%). Puedes seguir, pero considera subirlo si puedes.' : "⚠️ Your savings is very low (<5%). You can proceed, but consider raising it if possible.");
  if (warnings.length) { warnEl.style.display = 'block'; warnEl.innerHTML = warnings.join('<br>'); } else warnEl.style.display = 'none';
  previewEl.textContent = base > 0 ? (L ? 'Necesidades: ' + FT.money(base * n / 100) + ' · Gustos: ' + FT.money(base * w / 100) + ' · Ahorro: ' + FT.money(base * s / 100) : 'Needs: ' + FT.money(base * n / 100) + ' · Wants: ' + FT.money(base * w / 100) + ' · Savings: ' + FT.money(base * s / 100)) : '';
}
function savePlanChoice() {
  var L = es(), base = getPlanBase();
  if (base <= 0) { FT.toast(L ? '⚠️ Primero configura tu ingreso' : '⚠️ Set your income first'); return; }
  var n, w, s;
  if (planSelectedPreset === 'custom') {
    n = parseFloat(document.getElementById('planNeedsPct').value) || 0; w = parseFloat(document.getElementById('planWantsPct').value) || 0; s = parseFloat(document.getElementById('planSavingsPct').value) || 0;
    if (n + w + s !== 100) { FT.toast(L ? '⚠️ Los porcentajes deben sumar 100%' : '⚠️ Percentages must add up to 100%'); return; }
  } else {
    var preset = BUDGET_PRESETS.find(function (p) { return p.id === planSelectedPreset; });
    if (!preset) { FT.toast(L ? '⚠️ Elige una estrategia' : '⚠️ Choose a strategy'); return; }
    n = preset.needs; w = preset.wants; s = preset.savings;
  }
  var u = FT.user();
  u.needs = Math.round(base * n / 100); u.wants = Math.round(base * w / 100); u.savings = Math.round(base * s / 100);
  u.needsPct = n; u.wantsPct = w; u.savingsPct = s; u.budgetPlan = planSelectedPreset;
  FT.saveUser(u);
  FT.toast(L ? '✅ Plan guardado' : '✅ Plan saved');
  render();
}
function initPlanSection() {
  var L = es(), base = getPlanBase(), u = FT.user();
  planSelectedPreset = u.budgetPlan || null;
  var summaryEl = document.getElementById('planCurrentSummary');
  if (summaryEl) summaryEl.textContent = base > 0 ? FT.money(u.needs || 0) + ' / ' + FT.money(u.wants || 0) + ' / ' + FT.money(u.savings || 0) : (L ? 'Sin configurar' : 'Not set');
  renderPlanPresets();
}

/* ── INGRESO ── */
function toggleEditIncome() {
  var panel = document.getElementById('editIncomePanel'); if (!panel) return;
  var isOpen = panel.style.display !== 'none';
  panel.style.display = isOpen ? 'none' : 'block';
  if (!isOpen) { var inp = document.getElementById('incomeInput'); inp.value = FT.user().income || 0; inp.focus(); }
}
function saveIncome() {
  var L = es(), inp = document.getElementById('incomeInput');
  var newIncome = Math.max(0, parseInt(inp.value, 10) || 0);
  if (newIncome <= 0) { FT.toast(L ? '⚠️ Ingresa un monto válido' : '⚠️ Enter a valid amount'); return; }
  var u = FT.user();
  u.income = newIncome; u.needs = Math.round(newIncome * 0.50); u.wants = Math.round(newIncome * 0.30); u.savings = Math.round(newIncome * 0.20);
  FT.saveUser(u);
  FT.toast(L ? '✅ Ingreso actualizado' : '✅ Income updated');
  render();
}

/* ── % DE HOGAR ── */
function updateHogarPctPreview() {
  var L = es();
  var pay = parseFloat(document.getElementById('hogarPayPct').value) || 0, save = parseFloat(document.getElementById('hogarSavePct').value) || 0;
  var hogarTotal = pay + save, persTotal = 100 - hogarTotal, income = FT.user().income || 0;
  var warnEl = document.getElementById('hogarPctWarning'), warnings = [];
  if (hogarTotal >= 100) warnings.push(L ? '⚠️ No te dejaría nada personal. Baja el % de hogar.' : '⚠️ This would leave you nothing personal. Lower the household %.');
  if (persTotal > 0 && persTotal < 15) warnings.push(L ? '⚠️ Tu parte personal quedaría muy baja (<15%).' : '⚠️ Your personal share would be very low (<15%).');
  if (warnings.length) { warnEl.style.display = 'block'; warnEl.innerHTML = warnings.join('<br>'); } else warnEl.style.display = 'none';
  document.getElementById('hogarPctPreview').textContent = income > 0 ? (L ? 'De cada ' + FT.money(income) + ': ' + FT.money(income * hogarTotal / 100) + ' al hogar · ' + FT.money(income * persTotal / 100) + ' personal' : 'From each ' + FT.money(income) + ': ' + FT.money(income * hogarTotal / 100) + ' household · ' + FT.money(income * persTotal / 100) + ' personal') : '';
}
function saveHogarPct() {
  var L = es();
  var pay = parseFloat(document.getElementById('hogarPayPct').value) || 0, save = parseFloat(document.getElementById('hogarSavePct').value) || 0;
  if (pay + save >= 100) { FT.toast(L ? '⚠️ El total debe ser menor a 100%' : '⚠️ Total must be less than 100%'); return; }
  var hogar = FT.hogar();
  hogar.payPctHogar = pay; hogar.saveHogarPct = save;
  FT.saveHogar(hogar);
  FT.toast(L ? '✅ % de hogar guardado' : '✅ Household % saved');
  render();
}

/* ── FRECUENCIA DE PAGO ── */
function setPayFreq(freq) { var u = FT.user(); u.payFreq = freq; FT.saveUser(u); render(); }
function savePayDay(day) { var u = FT.user(); u.payDay = day; FT.saveUser(u); }
function savePayAuto(val) { var u = FT.user(); u.payAuto = val; FT.saveUser(u); FT.toast(val ? (es() ? '✅ Registro automático activado' : '✅ Auto-register on') : (es() ? 'Registro automático desactivado' : 'Auto-register off')); }

/* ── AVATAR ── */
function openAvatarModal() {
  var L = es();
  selectedAvatar = FT.getRaw(AVATAR_KEY, '');
  FT.modal({
    title: L ? 'Cambiar avatar' : 'Change avatar',
    html: '<div class="avatar-options" id="avatarOptions">' + AVATAR_OPTIONS.map(function (a) { return '<div class="avatar-opt ' + (a === selectedAvatar ? 'on' : '') + '" data-a="' + a + '">' + a + '</div>'; }).join('') + '</div>',
    saveLabel: L ? 'Guardar' : 'Save',
    onOpen: function (body) {
      body.querySelectorAll('.avatar-opt').forEach(function (el) {
        el.onclick = function () { selectedAvatar = el.getAttribute('data-a'); body.querySelectorAll('.avatar-opt').forEach(function (o) { o.classList.remove('on'); }); el.classList.add('on'); };
      });
    },
    onSave: function () {
      FT.setRaw(AVATAR_KEY, selectedAvatar);
      FT.toast(L ? '✅ Avatar actualizado' : '✅ Avatar updated');
      render();
    }
  });
}

/* ── RENDER ── */
function render() {
  var L = es();
  var isPrem = FT.isPremium();
  var stats = computeStats();
  var achievements = getAchievements(stats);
  var health = computeHealthScore(stats);
  var unlockedCount = achievements.filter(function (a) { return a.unlocked; }).length;
  var u = FT.user();
  var savedAvatar = FT.getRaw(AVATAR_KEY, '');
  var since = u.createdAt ? new Date(u.createdAt).toLocaleDateString(L ? 'es-MX' : 'en-US', { year: 'numeric', month: 'long' }) : '—';

  var freq = u.payFreq || 'weekly', payDay = u.payDay || 'thursday', payAuto = u.payAuto || false, inc = u.income || 0;
  var hogar = FT.hogar(), hogarConn = FT.hogarConnected();
  var payPct = hogarConn ? (parseFloat(hogar.payPctHogar) || 50) : 50, savPct = hogarConn ? (parseFloat(hogar.saveHogarPct) || 10) : 10;
  var totHogarPct = payPct + savPct, persPct = 100 - totHogarPct;
  var checks = freq === 'weekly' ? 4 : freq === 'biweekly' ? 2 : 1;
  var perCheck = inc * totHogarPct / 100 / checks, personal = inc * persPct / 100 / checks;
  var freqLabel = L ? { weekly: 'Semanal', biweekly: 'Quincenal', monthly: 'Mensual' }[freq] : { weekly: 'Weekly', biweekly: 'Bi-weekly', monthly: 'Monthly' }[freq];
  var dayOpts = freq === 'weekly'
    ? [{ v: 'monday', l: L ? 'Lunes' : 'Monday' }, { v: 'tuesday', l: L ? 'Martes' : 'Tuesday' }, { v: 'wednesday', l: L ? 'Miércoles' : 'Wednesday' }, { v: 'thursday', l: L ? 'Jueves' : 'Thursday' }, { v: 'friday', l: L ? 'Viernes' : 'Friday' }, { v: 'saturday', l: L ? 'Sábado' : 'Saturday' }]
    : freq === 'biweekly' ? [{ v: '1', l: '1' }, { v: '8', l: '8' }, { v: '15', l: '15' }, { v: '16', l: '16' }]
    : Array.from({ length: 28 }, function (_, i) { return { v: String(i + 1), l: String(i + 1) }; });

  var freqHtml = '<div style="background:var(--g-light);border-radius:12px;padding:14px">' +
    '<div style="font-size:11px;color:var(--g-dark);font-weight:700;margin-bottom:10px">📋 ' + (L ? 'Por cheque' : 'Per paycheck') + ' (' + freqLabel + ')</div>' +
    '<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px">' +
      '<div style="text-align:center;background:white;border-radius:8px;padding:10px"><div style="font-size:17px;font-weight:800;color:var(--red)">' + FT.money(perCheck) + '</div><div style="font-size:10px;color:var(--text3)">' + (L ? '→ Al hogar' : '→ To household') + ' (' + totHogarPct + '%)</div></div>' +
      '<div style="text-align:center;background:white;border-radius:8px;padding:10px"><div style="font-size:17px;font-weight:800;color:var(--blue)">' + FT.money(personal) + '</div><div style="font-size:10px;color:var(--text3)">' + (L ? '→ Personal' : '→ Personal') + ' (' + persPct + '%)</div></div>' +
    '</div>' +
    '<div style="margin-bottom:10px"><label style="font-size:11px;font-weight:700;color:var(--g-dark);display:block;margin-bottom:6px">' + (L ? 'Día de pago' : 'Pay day') + '</label>' +
    '<select id="payDaySel" onchange="savePayDay(this.value)" style="width:100%;padding:10px;border:1.5px solid var(--border);border-radius:8px;font-family:inherit;background:white">' + dayOpts.map(function (d) { return '<option value="' + d.v + '" ' + (String(payDay) === d.v ? 'selected' : '') + '>' + d.l + '</option>'; }).join('') + '</select></div>' +
    '<label style="display:flex;align-items:center;gap:10px;cursor:pointer;padding:10px;background:white;border-radius:8px"><input type="checkbox" id="payAutoCheck" ' + (payAuto ? 'checked' : '') + ' onchange="savePayAuto(this.checked)" style="width:18px;height:18px;cursor:pointer">' +
    '<div><div style="font-size:12px;font-weight:700;color:var(--g-dark)">' + (L ? 'Registro automático' : 'Auto-register') + '</div><div style="font-size:10px;color:var(--text3)">' + (L ? 'El app registra tu cheque en el día configurado' : 'App registers your paycheck on the configured day') + '</div></div></label></div>';

  var root = document.getElementById('root');
  root.innerHTML =
  '<div class="profile-hero">' +
    '<div class="avatar-wrap"><div class="avatar-big">' + (savedAvatar || (u.name || 'U').charAt(0).toUpperCase()) + '</div><button class="avatar-edit tap" onclick="openAvatarModal()">✏️</button></div>' +
    '<div class="profile-info"><div class="profile-name">' + (u.name || '') + '</div><div class="profile-email">' + (u.email || '') + '</div>' +
    '<div class="profile-since">📅 ' + (L ? 'Miembro desde' : 'Member since') + ' ' + since + '</div>' +
    '<div class="profile-tier">' + (isPrem ? '💎' : '⭐') + ' ' + (isPrem ? (L ? 'Plan Premium' : 'Premium Plan') : (L ? 'Plan Gratuito' : 'Free Plan')) + '</div></div>' +
  '</div>' +

  '<div class="stats-grid">' +
    '<div class="stat-card"><div class="stat-ico">💰</div><div class="stat-val" style="color:var(--g-main)">' + FT.money(stats.totalSaved) + '</div><div class="stat-lbl">' + (L ? 'Total ahorrado' : 'Total saved') + '</div></div>' +
    '<div class="stat-card"><div class="stat-ico">📅</div><div class="stat-val" style="color:var(--blue)">' + stats.monthsActive + '</div><div class="stat-lbl">' + (L ? 'Meses activo' : 'Months active') + '</div></div>' +
    '<div class="stat-card"><div class="stat-ico">📝</div><div class="stat-val" style="color:var(--purple)">' + stats.totalTx + '</div><div class="stat-lbl">' + (L ? 'Registros totales' : 'Total entries') + '</div></div>' +
    '<div class="stat-card"><div class="stat-ico">🔥</div><div class="stat-val" style="color:var(--amber)">' + stats.uniqueDays + '</div><div class="stat-lbl">' + (L ? 'Días con actividad' : 'Days with activity') + '</div></div>' +
  '</div>' +

  '<div class="card"><div class="card-hd">💰 ' + (L ? 'Mi ingreso mensual' : 'My monthly income') + '</div>' +
    '<div style="display:flex;align-items:center;gap:12px;margin-bottom:12px">' +
      '<div style="flex:1;background:var(--g-light);border-radius:12px;padding:14px;text-align:center"><div style="font-size:26px;font-weight:800;color:var(--g-main)">' + FT.money(u.income || 0) + '</div><div style="font-size:11px;color:var(--g-dark);margin-top:2px">' + (L ? 'por mes' : 'per month') + '</div></div>' +
      '<button class="ft-btn ft-btn-primary tap" style="width:auto;margin:0;padding:10px 14px" onclick="toggleEditIncome()">✏️ ' + (L ? 'Editar' : 'Edit') + '</button></div>' +
    '<div id="editIncomePanel" style="display:none">' +
      '<label style="font-size:11px;font-weight:700;color:var(--text3);display:block;margin-bottom:6px">' + (L ? 'NUEVO INGRESO MENSUAL ($)' : 'NEW MONTHLY INCOME ($)') + '</label>' +
      '<input type="number" id="incomeInput" value="' + (u.income || 0) + '" min="0" step="100" style="width:100%;padding:12px;border:2px solid var(--g-main);border-radius:10px;font-size:18px;font-weight:700;font-family:inherit;margin-bottom:10px;box-sizing:border-box;outline:none;text-align:center">' +
      '<button class="ft-btn ft-btn-primary tap" onclick="saveIncome()">' + (L ? '✅ Guardar ingreso' : '✅ Save income') + '</button>' +
      '<button class="ft-btn ft-btn-ghost tap" onclick="toggleEditIncome()">' + (L ? 'Cancelar' : 'Cancel') + '</button></div></div>' +

  '<div class="card">' +
    (hogarConn ? '<div style="margin-bottom:18px;padding-bottom:18px;border-bottom:1px solid var(--hair)">' +
      '<div class="card-hd" style="margin-bottom:6px">🏠 ' + (L ? '¿Cuánto va a la casa?' : 'How much goes to the household?') + '</div>' +
      '<div style="font-size:11.5px;color:var(--text3);margin-bottom:12px">' + (L ? 'De cada cheque de sueldo (no de ingresos extra). El resto es tu parte personal.' : 'From each paycheck (not extra income). The rest is your personal share.') + '</div>' +
      '<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:8px">' +
        '<div><label style="font-size:10px;font-weight:700;color:var(--text3);display:block;margin-bottom:4px">' + (L ? 'Necesidades del hogar %' : 'Household needs %') + '</label><input type="number" id="hogarPayPct" min="0" max="100" value="' + (hogar.payPctHogar || 50) + '" style="width:100%;padding:9px;border:1.5px solid var(--border);border-radius:8px;font-size:13px;font-family:inherit;text-align:center;box-sizing:border-box" oninput="updateHogarPctPreview()"></div>' +
        '<div><label style="font-size:10px;font-weight:700;color:var(--text3);display:block;margin-bottom:4px">' + (L ? 'Ahorro del hogar %' : 'Household savings %') + '</label><input type="number" id="hogarSavePct" min="0" max="100" value="' + (hogar.saveHogarPct || 10) + '" style="width:100%;padding:9px;border:1.5px solid var(--border);border-radius:8px;font-size:13px;font-family:inherit;text-align:center;box-sizing:border-box" oninput="updateHogarPctPreview()"></div></div>' +
      '<div id="hogarPctPreview" style="font-size:11.5px;color:var(--text2);margin-bottom:8px"></div>' +
      '<div id="hogarPctWarning" style="display:none;font-size:11.5px;color:var(--amber);background:var(--amb-dim);border-radius:8px;padding:8px 10px;margin-bottom:8px"></div>' +
      '<button class="ft-btn ft-btn-ghost tap" onclick="saveHogarPct()">' + (L ? 'Guardar % de hogar' : 'Save household %') + '</button></div>' : '') +

    '<div class="card-hd">🎯 ' + (L ? 'Tu plan de presupuesto' : 'Your budget plan') + '</div>' +
    '<div style="font-size:11.5px;color:var(--text3);margin-bottom:14px">' + (L ? 'Cómo se reparte tu parte personal (o tu ingreso completo si no tienes hogar conectado) entre necesidades, gustos y ahorro — se aplica automático cada cheque, "págate primero".' : 'How your personal share (or full income without a connected household) splits between needs, wants and savings — applied automatically per paycheck, "pay yourself first" style.') + '</div>' +
    '<div style="display:flex;justify-content:space-between;font-size:13px;font-weight:800;background:var(--off);border-radius:10px;padding:10px 14px;margin-bottom:14px"><span>' + (L ? 'Actual' : 'Current') + '</span><span id="planCurrentSummary">—</span></div>' +
    '<label style="font-size:11px;font-weight:700;color:var(--text3);display:block;margin-bottom:6px">' + (L ? 'GASTOS FIJOS APROX. AL MES ($, opcional)' : 'APPROX. FIXED EXPENSES PER MONTH ($, optional)') + '</label>' +
    '<div style="display:flex;gap:8px;margin-bottom:6px"><input type="number" id="fixedExpensesInput" placeholder="' + (L ? 'Renta, comida, servicios...' : 'Rent, food, utilities...') + '" min="0" step="50" style="flex:1;padding:11px;border:1.5px solid var(--border);border-radius:10px;font-size:14px;font-family:inherit;box-sizing:border-box">' +
    '<button class="ft-btn ft-btn-primary tap" style="width:auto;margin:0;padding:0 16px" onclick="recomputePlanRecommendation()">' + (L ? 'Calcular' : 'Calculate') + '</button></div>' +
    '<div id="planRecommendation" style="display:none;font-size:12px;background:var(--g-light);color:var(--g-dark);border-radius:10px;padding:10px 12px;margin-bottom:14px;line-height:1.5"></div>' +
    '<label style="font-size:11px;font-weight:700;color:var(--text3);display:block;margin-bottom:8px">' + (L ? 'ELIGE UNA ESTRATEGIA' : 'CHOOSE A STRATEGY') + '</label>' +
    '<div id="planPresets" style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px"></div>' +
    '<div id="planCustomWrap" style="display:none;margin-bottom:10px">' +
      '<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:8px">' +
        '<div><label style="font-size:10px;font-weight:700;color:var(--text3);display:block;margin-bottom:4px">' + (L ? 'Necesidades %' : 'Needs %') + '</label><input type="number" id="planNeedsPct" min="0" max="100" style="width:100%;padding:9px;border:1.5px solid var(--border);border-radius:8px;font-size:13px;font-family:inherit;text-align:center;box-sizing:border-box" oninput="updatePlanCustomPreview()"></div>' +
        '<div><label style="font-size:10px;font-weight:700;color:var(--text3);display:block;margin-bottom:4px">' + (L ? 'Gustos %' : 'Wants %') + '</label><input type="number" id="planWantsPct" min="0" max="100" style="width:100%;padding:9px;border:1.5px solid var(--border);border-radius:8px;font-size:13px;font-family:inherit;text-align:center;box-sizing:border-box" oninput="updatePlanCustomPreview()"></div>' +
        '<div><label style="font-size:10px;font-weight:700;color:var(--text3);display:block;margin-bottom:4px">' + (L ? 'Ahorro %' : 'Savings %') + '</label><input type="number" id="planSavingsPct" min="0" max="100" style="width:100%;padding:9px;border:1.5px solid var(--border);border-radius:8px;font-size:13px;font-family:inherit;text-align:center;box-sizing:border-box" oninput="updatePlanCustomPreview()"></div></div>' +
      '<div id="planCustomWarning" style="display:none;font-size:11.5px;color:var(--amber);background:var(--amb-dim);border-radius:8px;padding:8px 10px;margin-bottom:8px"></div>' +
      '<div id="planCustomPreview" style="font-size:12px;color:var(--text2);margin-bottom:10px"></div></div>' +
    '<button class="ft-btn ft-btn-primary tap" onclick="savePlanChoice()">✅ ' + (L ? 'Guardar plan' : 'Save plan') + '</button></div>' +

  '<div class="card"><div class="card-hd">🏆 ' + (L ? 'Logros' : 'Achievements') + ' <span style="font-size:12px;font-weight:500;color:var(--text3)">' + unlockedCount + ' ' + (L ? 'de' : 'of') + ' ' + achievements.length + ' ' + (L ? 'desbloqueados' : 'unlocked') + '</span></div>' +
    '<div class="achv-grid">' + achievements.map(function (a) { return '<div class="achv-card ' + (a.unlocked ? 'unlocked' : 'locked') + '"><div class="achv-ico">' + (a.unlocked ? a.ico : '🔒') + '</div><div class="achv-name">' + a.name + '</div><div class="achv-desc">' + a.desc + '</div></div>'; }).join('') + '</div></div>' +

  '<div class="card"><div class="card-hd">💚 ' + (L ? 'Salud financiera' : 'Financial health') + '</div>' +
    '<div style="text-align:center;padding:6px 0">' +
      '<div class="score-ring-wrap"><svg width="130" height="130" viewBox="0 0 140 140">' +
        '<circle cx="70" cy="70" r="60" fill="none" stroke="var(--off)" stroke-width="12"/>' +
        '<circle cx="70" cy="70" r="60" fill="none" stroke="' + health.color + '" stroke-width="12" stroke-dasharray="377" stroke-dashoffset="' + (377 - 377 * health.score / 100) + '" stroke-linecap="round" transform="rotate(-90 70 70)" style="transition:stroke-dashoffset 1.2s ease"/></svg>' +
        '<div class="score-val"><div class="score-num" style="color:' + health.color + '">' + health.score + '</div><div class="score-lbl">/ 100</div></div></div>' +
      '<div class="score-desc" style="color:' + health.color + '">' + health.label + '</div>' +
      '<div style="margin-top:14px;text-align:left">' +
        '<div class="score-tip">' + (stats.efPct < 100 ? '⚠️' : '✅') + ' ' + (stats.efPct < 100 ? (L ? 'Aumenta tu fondo de emergencia — solo tienes ' + stats.efPct + '% de tu meta de 3 meses.' : 'Boost your emergency fund — you only have ' + stats.efPct + '% of your 3-month goal.') : (L ? '¡Tu fondo de emergencia está saludable!' : 'Your emergency fund is healthy!')) + '</div>' +
        '<div class="score-tip">' + (stats.totalInvested > 0 ? '✅' : '💡') + ' ' + (stats.totalInvested > 0 ? (L ? 'Buen trabajo invirtiendo regularmente.' : 'Great job investing regularly.') : (L ? 'Aún no registras inversiones. Considera invertir parte de tus ahorros.' : "You haven't recorded investments yet. Consider investing part of your savings.")) + '</div>' +
        '<div class="score-tip">📝 ' + (L ? 'Sigue registrando tus gastos diariamente para mantener buenos hábitos.' : 'Keep recording your expenses daily to maintain good habits.') + '</div>' +
      '</div></div></div>' +

  '<div class="card"><div class="card-hd">🏠 ' + (L ? 'Hogar compartido' : 'Shared household') + '</div>' + buildHouseholdSection() + '</div>' +

  '<div class="card"><div class="card-hd">💵 ' + (L ? 'Frecuencia de pago' : 'Pay frequency') + '</div>' +
    '<div style="font-size:12px;color:var(--text3);margin-bottom:12px">' + (L ? 'Configura cuándo recibes tu sueldo para calcular cuánto depositar al hogar cada cheque.' : 'Configure your pay schedule to calculate how much to deposit per paycheck.') + '</div>' +
    '<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px">' + ['weekly', 'biweekly', 'monthly'].map(function (f) {
      var lbl = L ? { weekly: 'Semanal', biweekly: 'Quincenal', monthly: 'Mensual' }[f] : { weekly: 'Weekly', biweekly: 'Bi-weekly', monthly: 'Monthly' }[f];
      var sel = freq === f;
      return '<button class="tap" onclick="setPayFreq(\'' + f + '\')" style="padding:10px 6px;border-radius:10px;border:2px solid ' + (sel ? 'var(--g-main)' : 'var(--border)') + ';background:' + (sel ? 'var(--g-light)' : 'var(--off)') + ';color:' + (sel ? 'var(--g-dark)' : 'var(--text2)') + ';font-size:12px;font-weight:700;cursor:pointer;font-family:inherit">' + lbl + '</button>';
    }).join('') + '</div>' + freqHtml + '</div>' +

  '<div class="card"><div class="card-hd">🕐 ' + (L ? 'Actividad reciente' : 'Recent activity') + '</div>' + buildRecentActivity() + '</div>';

  initPlanSection();
}

document.addEventListener('ft:ready', function () {
  var t = function () { return FT.lang === 'es' ? 'Mi Perfil' : 'My Profile'; };
  var sh = FT.shell({ active: '', title: t() });
  document.addEventListener('ft:langchange', function () { sh.setTitle(t()); render(); });
  document.addEventListener('ft:datachanged', render);
  render();
});
</script>
</body>
</html>
